<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Application</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;
}

#application-frame{
    position:fixed;

    left:0;
    top:0;

    width:100vw;
    height:100vh;

    margin:0;
    padding:0;

    border:0;

    display:block;

    background:#000;
}

</style>

</head>

<body>

<iframe
    id="application-frame"
    title="Application"
></iframe>


<script>

(function(){

    const iframe=
        document.getElementById(
            "application-frame"
        );


    let currentAppId=null;


    /*
     * =========================================================
     * MAIN PAGE → application.html
     * =========================================================
     *
     * Receives:
     *
     * {
     *     type:"load-app",
     *     appId:"files",
     *     title:"Files",
     *     src:"files.html"
     * }
     *
     * OR:
     *
     * {
     *     type:"load-app",
     *     appId:"editor",
     *     title:"Editor",
     *     srcDoc:"<html>...</html>"
     * }
     */
    window.addEventListener(
        "message",
        function(event){

            /*
             * Only the window that opened
             * application.html may control it.
             */
            if(
                event.source!==
                window.opener
            ){
                return;
            }


            /*
             * Same-origin only.
             */
            if(
                event.origin!==
                window.location.origin
            ){
                return;
            }


            if(
                !event.data||
                typeof event.data!=="object"
            ){
                return;
            }


            const message=
                event.data;


            /*
             * =================================================
             * LOAD APP
             * =================================================
             */
            if(
                message.type===
                "load-app"
            ){

                currentAppId=
                    message.appId||
                    null;


                /*
                 * Change browser tab title.
                 */
                document.title=
                    message.title||
                    "Application";


                /*
                 * srcDoc takes priority when supplied.
                 */
                if(
                    typeof message.srcDoc===
                    "string"
                    &&
                    message.srcDoc.length>0
                ){

                    /*
                     * Clear normal src first.
                     */
                    iframe.removeAttribute(
                        "src"
                    );


                    /*
                     * Load inline HTML.
                     */
                    iframe.srcdoc=
                        message.srcDoc;


                }else if(
                    typeof message.src===
                    "string"
                    &&
                    message.src.length>0
                ){

                    /*
                     * Clear srcdoc first.
                     */
                    iframe.removeAttribute(
                        "srcdoc"
                    );


                    /*
                     * Load external HTML file.
                     */
                    iframe.src=
                        message.src;
                }


                /*
                 * Tell Main Page that the
                 * application host accepted it.
                 */
                notifyReady();


                return;
            }


            /*
             * =================================================
             * MAIN PAGE → APP
             * =================================================
             *
             * Main Page sends:
             *
             * {
             *     type:"main-to-application",
             *     appId:"files",
             *     message:{
             *         type:"open-file"
             *     }
             * }
             */
            if(
                message.type===
                "main-to-application"
            ){

                /*
                 * Ignore messages intended for
                 * a different application.
                 */
                if(
                    currentAppId&&
                    message.appId&&
                    message.appId!==
                    currentAppId
                ){
                    return;
                }


                sendToIframe(
                    message.message
                );


                return;
            }

        }
    );


    /*
     * =========================================================
     * APP → MAIN PAGE
     * =========================================================
     *
     * This is the important compatibility part.
     *
     * Your existing iframe app can continue doing:
     *
     * window.parent.postMessage(...)
     *
     * because application.html is its parent.
     */
    window.addEventListener(
        "message",
        function(event){

            /*
             * Make sure the message came
             * from our one iframe.
             */
            if(
                !iframe.contentWindow||
                event.source!==
                iframe.contentWindow
            ){
                return;
            }


            /*
             * Send it to the original
             * Main Page.
             */
            if(
                window.opener&&
                !window.opener.closed
            ){

                window.opener.postMessage(
                    {
                        type:
                            "application-to-main",

                        appId:
                            currentAppId,

                        message:
                            event.data
                    },

                    window.location.origin
                );
            }

        }
    );


    /*
     * =========================================================
     * SEND INTO THE APP
     * =========================================================
     */
    function sendToIframe(message){

        if(
            !iframe.contentWindow
        ){
            return;
        }


        iframe.contentWindow.postMessage(
            message,
            window.location.origin
        );
    }


    /*
     * =========================================================
     * READY
     * =========================================================
     */
    function notifyReady(){

        if(
            !window.opener||
            window.opener.closed
        ){
            return;
        }


        window.opener.postMessage(
            {
                type:
                    "application-ready",

                appId:
                    currentAppId
            },

            window.location.origin
        );
    }


    /*
     * Notify Main Page when the actual
     * application iframe finishes loading.
     */
    iframe.addEventListener(
        "load",
        function(){

            notifyReady();
        }
    );

})();

</script>

</body>

</html>
