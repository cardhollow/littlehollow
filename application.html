<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Application</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;
}

#application-frame{

    position:fixed;

    left:0;
    top:0;

    width:100vw;
    height:100vh;

    border:0;

    margin:0;
    padding:0;

    display:block;

    background:#000;
}

</style>

</head>

<body>

<iframe
    id="application-frame"
    title="Application"
></iframe>


<script>

(function(){

    const iframe=
        document.getElementById(
            "application-frame"
        );


    let currentAppId=null;


    /*
     * =========================================================
     * MAIN PAGE → APPLICATION.HTML
     * =========================================================
     */
    window.addEventListener(
        "message",
        function(event){

            /*
             * Only the Main Page that opened this tab
             * may control it.
             */
            if(
                event.source!==
                window.opener
            ){
                return;
            }


            /*
             * Same origin
             */
            if(
                event.origin!==
                window.location.origin
            ){
                return;
            }


            if(
                !event.data||
                typeof event.data!=="object"
            ){
                return;
            }


            const message=
                event.data;


            /*
             * =================================================
             * LOAD APP
             * =================================================
             */
            if(
                message.type===
                "load-app"
            ){

                currentAppId=
                    message.appId||
                    null;


                /*
                 * Browser tab title
                 */
                document.title=
                    message.title||
                    "Application";


                /*
                 * srcDoc
                 */
                if(
                    typeof message.srcDoc===
                    "string"&&
                    message.srcDoc.length>0
                ){

                    iframe.removeAttribute(
                        "src"
                    );

                    iframe.srcdoc=
                        message.srcDoc;

                }


                /*
                 * Normal src
                 */
                else if(
                    typeof message.src===
                    "string"&&
                    message.src.length>0
                ){

                    iframe.removeAttribute(
                        "srcdoc"
                    );

                    iframe.src=
                        message.src;
                }


                notifyReady();

                return;
            }


            /*
             * =================================================
             * MAIN PAGE → APP
             * =================================================
             */
            if(
                message.type===
                "main-to-application"
            ){

                if(
                    currentAppId&&
                    message.appId&&
                    message.appId!==currentAppId
                ){
                    return;
                }


                if(iframe.contentWindow){

                    iframe.contentWindow.postMessage(
                        message.message,
                        event.origin
                    );
                }


                return;
            }

        }
    );


    /*
     * =========================================================
     * APP → MAIN PAGE
     * =========================================================
     *
     * Existing applications can keep using:
     *
     * window.parent.postMessage(...)
     *
     * because THIS iframe's parent is application.html.
     */
    window.addEventListener(
        "message",
        function(event){

            /*
             * Only messages from our one iframe.
             */
            if(
                !iframe.contentWindow||
                event.source!==
                iframe.contentWindow
            ){
                return;
            }


            /*
             * Forward to original Main Page.
             */
            if(
                window.opener&&
                !window.opener.closed
            ){

                window.opener.postMessage(
                    {
                        type:
                            "application-to-main",

                        appId:
                            currentAppId,

                        message:
                            event.data
                    },

                    window.location.origin
                );
            }

        }
    );


    /*
     * =========================================================
     * READY
     * =========================================================
     */
    function notifyReady(){

        if(
            !window.opener||
            window.opener.closed
        ){
            return;
        }


        window.opener.postMessage(
            {
                type:
                    "application-ready",

                appId:
                    currentAppId
            },

            window.location.origin
        );
    }


    /*
     * Tell Main Page again when the actual app iframe
     * finishes loading.
     */
    iframe.addEventListener(
        "load",
        function(){

            notifyReady();
        }
    );

})();

</script>

</body>

</html>
