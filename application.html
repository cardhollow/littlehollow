<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>Application</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#application-frame{
    position:fixed;

    left:0;
    top:0;

    width:100vw;
    height:100vh;

    border:0;
    margin:0;
    padding:0;

    display:block;

    background:#000;
}

</style>

</head>

<body>

<!--
    The actual application.

    application.html itself is the bridge.
    The loaded HTML application remains untouched.
-->
<iframe
    id="application-frame"
    title="Application"
></iframe>


<script>

(function(){

    const iframe=
        document.getElementById(
            "application-frame"
        );

    let currentAppId=null;


    /*
     * =========================================================
     * MAIN PAGE → application.html
     * =========================================================
     *
     * Main page sends:
     *
     * {
     *     type:"load-app",
     *     appId:"files",
     *     title:"Files",
     *     src:"files.html"
     * }
     *
     * OR:
     *
     * {
     *     type:"load-app",
     *     appId:"editor",
     *     srcDoc:"<html>...</html>"
     * }
     */
    window.addEventListener(
        "message",
        function(event){

            /*
             * Only accept messages from the page that
             * opened this application.html.
             */
            if(event.source!==window.opener){
                return;
            }

            /*
             * For this setup, the main page and
             * application.html should have the same origin.
             */
            if(event.origin!==window.location.origin){
                return;
            }

            if(
                !event.data||
                typeof event.data!=="object"
            ){
                return;
            }

            const message=event.data;


            /*
             * LOAD APPLICATION
             */
            if(message.type==="load-app"){

                currentAppId=
                    message.appId||
                    null;

                /*
                 * Set browser tab title.
                 */
                document.title=
                    message.title||
                    "Application";


                /*
                 * srcDoc has priority if supplied.
                 */
                if(
                    typeof message.srcDoc==="string"&&
                    message.srcDoc.length>0
                ){

                    iframe.removeAttribute("src");

                    iframe.srcdoc=
                        message.srcDoc;

                }else if(
                    typeof message.src==="string"&&
                    message.src.length>0
                ){

                    iframe.removeAttribute("srcdoc");

                    iframe.src=
                        message.src;

                }

                /*
                 * Tell Main Page that the application
                 * host has accepted the app.
                 */
                notifyReady();

                return;
            }


            /*
             * MAIN PAGE → APP
             *
             * Forward the application message directly
             * into the iframe.
             */
            if(message.type==="main-to-application"){

                if(
                    currentAppId&&
                    message.appId&&
                    message.appId!==currentAppId
                ){
                    return;
                }

                sendToIframe(
                    message.message
                );

                return;
            }

        }
    );


    /*
     * =========================================================
     * APP → MAIN PAGE
     * =========================================================
     *
     * Existing app code can continue doing:
     *
     * window.parent.postMessage(...)
     *
     * because application.html is the iframe's parent.
     */
    window.addEventListener(
        "message",
        function(event){

            /*
             * The source MUST be our iframe.
             */
            if(
                !iframe.contentWindow||
                event.source!==iframe.contentWindow
            ){
                return;
            }

            /*
             * Forward the exact app message
             * to the original Main Page.
             */
            if(
                window.opener&&
                !window.opener.closed
            ){

                window.opener.postMessage(
                    {
                        type:"application-to-main",

                        appId:currentAppId,

                        message:event.data
                    },

                    window.location.origin
                );
            }

        }
    );


    /*
     * Send message into the actual HTML application.
     */
    function sendToIframe(message){

        if(!iframe.contentWindow){
            return;
        }

        iframe.contentWindow.postMessage(
            message,
            window.location.origin
        );
    }


    /*
     * Tell Main Page that application.html
     * is alive and ready.
     */
    function notifyReady(){

        if(
            !window.opener||
            window.opener.closed
        ){
            return;
        }

        window.opener.postMessage(
            {
                type:"application-ready",
                appId:currentAppId
            },

            window.location.origin
        );
    }


    /*
     * The iframe can reload or navigate.
     * Notify the shell again when it loads.
     */
    iframe.addEventListener(
        "load",
        function(){

            notifyReady();
        }
    );

})();

</script>

</body>
</html>
