<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Application</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;
}

#application-frame{

    position:fixed;

    left:0;
    top:0;

    width:100vw;
    height:100vh;

    border:0;

    margin:0;
    padding:0;

    display:block;

    background:#000;
}

</style>

</head>

<body>

<iframe
    id="application-frame"
    title="Application"
></iframe>


<script>

(function(){

    const iframe=
        document.getElementById(
            "application-frame"
        );


    let currentAppId=null;


    /*
     * =========================================================
     * MAIN PAGE → APPLICATION.HTML
     * =========================================================
     */
    window.addEventListener(
        "message",
        function(event){

            /*
             * Only the Main Page that opened this tab.
             */
            if(
                event.source!==
                window.opener
            ){
                return;
            }


            /*
             * Same origin.
             */
            if(
                event.origin!==
                window.location.origin
            ){
                return;
            }


            if(
                !event.data||
                typeof event.data!=="object"
            ){
                return;
            }


            const message=
                event.data;


            /*
             * =================================================
             * LOAD APPLICATION
             * =================================================
             */
            if(
                message.type===
                "load-app"
            ){

                currentAppId=
                    message.appId||
                    null;


                document.title=
                    message.title||
                    "Application";


                /*
                 * srcDoc
                 */
                if(
                    typeof message.srcDoc===
                    "string"&&
                    message.srcDoc.length>0
                ){

                    iframe.removeAttribute(
                        "src"
                    );

                    iframe.srcdoc=
                        message.srcDoc;
                }


                /*
                 * src
                 */
                else if(
                    typeof message.src===
                    "string"&&
                    message.src.length>0
                ){

                    iframe.removeAttribute(
                        "srcdoc"
                    );

                    iframe.src=
                        message.src;
                }


                /*
                 * Tell Main Page that the wrapper
                 * is listening.
                 */
                notifyReady();


                return;
            }


            /*
             * =================================================
             * MAIN PAGE → APP
             * =================================================
             */
            if(
                message.type===
                "main-to-application"
            ){

                /*
                 * Ignore messages for another app.
                 */
                if(
                    currentAppId&&
                    message.appId&&
                    message.appId!==currentAppId
                ){
                    return;
                }


                if(
                    iframe.contentWindow
                ){

                    /*
                     * Forward EXACTLY the inner
                     * application message.
                     */
                    iframe.contentWindow.postMessage(
                        message.message,
                        event.origin
                    );
                }


                return;
            }

        }
    );


    /*
     * =========================================================
     * APP → MAIN PAGE
     * =========================================================
     *
     * Existing app code remains unchanged.
     *
     * Example:
     *
     * window.parent.postMessage(
     *     data,
     *     "*"
     * );
     *
     * The iframe's parent is application.html,
     * so application.html receives it here.
     */
    window.addEventListener(
        "message",
        function(event){

            /*
             * IMPORTANT:
             *
             * Only accept messages from the actual
             * application iframe.
             */
            if(
                !iframe.contentWindow||
                event.source!==
                iframe.contentWindow
            ){
                return;
            }


            /*
             * Forward the original application message
             * to the original Main Page.
             */
            if(
                window.opener&&
                !window.opener.closed
            ){

                window.opener.postMessage(
                    {
                        type:
                            "application-to-main",

                        appId:
                            currentAppId,

                        message:
                            event.data
                    },

                    window.location.origin
                );
            }

        }
    );


    /*
     * =========================================================
     * WRAPPER READY
     * =========================================================
     */
    function notifyReady(){

        if(
            !window.opener||
            window.opener.closed
        ){
            return;
        }


        window.opener.postMessage(
            {
                type:
                    "application-ready",

                appId:
                    currentAppId
            },

            window.location.origin
        );
    }


    /*
     * Notify Main Page when the actual app finishes loading.
     */
    iframe.addEventListener(
        "load",
        function(){

            notifyReady();
        }
    );


})();

</script>

</body>

</html>
