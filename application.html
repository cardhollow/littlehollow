<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Application</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#application-frame{

    position:fixed;

    left:0;
    top:0;

    width:100vw;
    height:100vh;

    border:0;

    margin:0;
    padding:0;

    display:block;

    background:#000;
}

</style>

</head>

<body>

<iframe
    id="application-frame"
    title="Application"
></iframe>


<script>

(function(){

    const iframe=
        document.getElementById(
            "application-frame"
        );


    let currentAppId=null;


    /*
     * =========================================================
     * TELL MAIN PAGE THAT THE HOST IS READY
     * =========================================================
     *
     * This happens immediately when application.html loads.
     *
     * We DO NOT need an appId yet.
     *
     * Main Page identifies this tab using event.source.
     */
    function notifyHostReady(){

        if(
            !window.opener||
            window.opener.closed
        ){

            return;
        }


        window.opener.postMessage(
            {
                type:
                    "application-host-ready"
            },

            window.location.origin
        );
    }


    /*
     * Tell the Main Page immediately.
     */
    notifyHostReady();


    /*
     * =========================================================
     * MAIN PAGE → APPLICATION.HTML
     * =========================================================
     */
    window.addEventListener(
        "message",
        function(event){

            /*
             * Only the original Main Page.
             */
            if(
                event.source!==
                window.opener
            ){

                return;
            }


            /*
             * Same origin.
             */
            if(
                event.origin!==
                window.location.origin
            ){

                return;
            }


            if(
                !event.data||
                typeof event.data!=="object"
            ){

                return;
            }


            const message=
                event.data;


            /*
             * =================================================
             * LOAD APPLICATION
             * =================================================
             */
            if(
                message.type===
                "load-app"
            ){

                currentAppId=
                    message.appId||
                    null;


                /*
                 * Browser tab title.
                 */
                document.title=
                    message.title||
                    "Application";


                /*
                 * Inline HTML.
                 */
                if(
                    typeof message.srcDoc===
                    "string"&&
                    message.srcDoc.length>0
                ){

                    iframe.removeAttribute(
                        "src"
                    );


                    iframe.srcdoc=
                        message.srcDoc;

                }


                /*
                 * External HTML.
                 */
                else if(
                    typeof message.src===
                    "string"&&
                    message.src.length>0
                ){

                    iframe.removeAttribute(
                        "srcdoc"
                    );


                    iframe.src=
                        message.src;
                }


                /*
                 * Tell Main Page the selected
                 * application has been accepted.
                 */
                notifyApplicationReady();


                return;
            }


            /*
             * =================================================
             * MAIN PAGE → APP
             * =================================================
             */
            if(
                message.type===
                "main-to-application"
            ){

                /*
                 * Ignore messages belonging to another app.
                 */
                if(
                    currentAppId&&
                    message.appId&&
                    message.appId!==currentAppId
                ){

                    return;
                }


                if(
                    iframe.contentWindow
                ){

                    /*
                     * Preserve the application's
                     * original message data.
                     */
                    iframe.contentWindow.postMessage(
                        message.message,
                        event.origin
                    );
                }


                return;
            }

        }
    );


    /*
     * =========================================================
     * APP → MAIN PAGE
     * =========================================================
     *
     * Existing app code can remain:
     *
     * window.parent.postMessage(...)
     *
     * The parent is this application.html page.
     */
    window.addEventListener(
        "message",
        function(event){

            /*
             * Only our one iframe.
             */
            if(
                !iframe.contentWindow||
                event.source!==
                iframe.contentWindow
            ){

                return;
            }


            /*
             * Forward to the original Main Page.
             */
            if(
                window.opener&&
                !window.opener.closed
            ){

                window.opener.postMessage(
                    {
                        type:
                            "application-to-main",

                        appId:
                            currentAppId,

                        message:
                            event.data
                    },

                    window.location.origin
                );
            }

        }
    );


    /*
     * =========================================================
     * APPLICATION READY
     * =========================================================
     */
    function notifyApplicationReady(){

        if(
            !window.opener||
            window.opener.closed
        ){

            return;
        }


        window.opener.postMessage(
            {
                type:
                    "application-ready",

                appId:
                    currentAppId
            },

            window.location.origin
        );
    }


    /*
     * Notify when the actual application iframe
     * finishes loading.
     */
    iframe.addEventListener(
        "load",
        function(){

            notifyApplicationReady();
        }
    );

})();

</script>

</body>

</html>
