<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Image Viewer</title>
<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:monospace;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    color:#00FFFF;
}

body{
    overflow:hidden;
}

.wrap{
    display:flex;
    flex-direction:column;
    width:100%;
    height:100%;
}

.bar{
    flex:0 0 auto;
    display:flex;
    gap:6px;
    padding:8px;
    border-bottom:1px solid #00FFFF;
}

.bar input{
    flex:1;
    min-width:0;
    background:#001010;
    border:1px solid #00FFFF;
    color:#00FFFF;
    padding:6px 8px;
    outline:none;
    font:11px monospace;
}

.bar button{
    border:1px solid #00FFFF;
    background:transparent;
    color:#00FFFF;
    padding:6px 10px;
    cursor:pointer;
    font:11px monospace;
}

.bar button:active{
    background:#00FFFF;
    color:#000;
}

.stage{
    flex:1;
    min-height:0;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:auto;
    position:relative;
    padding:8px;
}

.stage img{
    display:block;
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    object-fit:contain;
    user-select:none;
    -webkit-user-drag:none;
}

.empty{
    opacity:.55;
    font-size:12px;
    text-align:center;
    white-space:pre-wrap;
    padding:20px;
}

.error{
    color:#ff6666;
    font-size:11px;
    text-align:center;
    white-space:pre-wrap;
    padding:20px;
    max-width:100%;
    overflow:auto;
}
</style>
</head>

<body>

<div class="wrap">

<div class="bar">
<input
    id="url"
    type="text"
    placeholder="Image URL or chxd:/ path..."
    autocomplete="off"
    spellcheck="false"
>
<button id="loadBtn">LOAD</button>
</div>

<div class="stage" id="stage">
<div class="empty">No image loaded.</div>
</div>

</div>

<script>
"use strict";

const stage=document.getElementById("stage");
const urlInput=document.getElementById("url");

let currentObjectURL=null;
let currentFile=null;
let currentHandle=null;

const params=new URLSearchParams(
    location.search
);

const initialPath=params.get("src");

function parentObject(name){
    try{
        if(
            window.parent &&
            window.parent!==window &&
            window.parent[name]
        ){
            return window.parent[name];
        }
    }catch(_){}

    try{
        if(window[name]){
            return window[name];
        }
    }catch(_){}

    return null;
}

function getFS(){
    return parentObject("FS");
}

function cleanupObjectURL(){
    if(currentObjectURL){
        try{
            URL.revokeObjectURL(
                currentObjectURL
            );
        }catch(_){}
    }

    currentObjectURL=null;
    currentFile=null;
    currentHandle=null;
}

function loading(){
    cleanupObjectURL();

    stage.innerHTML=
        '<div class="empty">Loading image...</div>';
}

function errorMessage(message){
    cleanupObjectURL();

    stage.innerHTML="";

    const box=
        document.createElement("div");

    box.className="error";
    box.textContent=
        String(
            message ||
            "Failed to load image."
        );

    stage.appendChild(box);
}

function isVirtualPath(value){
    const s=String(value||"");

    return (
        /^chxd:\//i.test(s) ||
        /^local:\//i.test(s) ||
        /^session:\//i.test(s) ||
        /^indexdb:\//i.test(s) ||
        /^puter:\//i.test(s)
    );
}

function isURL(value){
    const s=String(value||"");

    return (
        /^https?:\/\//i.test(s) ||
        /^blob:/i.test(s) ||
        /^data:/i.test(s) ||
        /^file:/i.test(s)
    );
}

function extension(path){
    const clean=
        String(path||"")
        .split("?")[0]
        .split("#")[0];

    const dot=
        clean.lastIndexOf(".");

    if(dot<0){
        return "";
    }

    return clean
        .slice(dot+1)
        .toLowerCase();
}

function mimeFromExtension(path){
    switch(extension(path)){
        case "png":
            return "image/png";

        case "jpg":
        case "jpeg":
        case "jpe":
            return "image/jpeg";

        case "gif":
            return "image/gif";

        case "webp":
            return "image/webp";

        case "bmp":
            return "image/bmp";

        case "svg":
        case "svgz":
            return "image/svg+xml";

        case "ico":
            return "image/x-icon";

        case "avif":
            return "image/avif";

        case "tif":
        case "tiff":
            return "image/tiff";

        case "heic":
            return "image/heic";

        case "heif":
            return "image/heif";

        default:
            return "application/octet-stream";
    }
}

function isImageMime(type){
    return /^image\//i.test(
        String(type||"")
    );
}

function bytesFrom(value){
    if(value instanceof ArrayBuffer){
        return new Uint8Array(value);
    }

    if(
        value &&
        typeof value==="object" &&
        value.buffer instanceof ArrayBuffer
    ){
        return new Uint8Array(
            value.buffer,
            value.byteOffset||0,
            value.byteLength
        );
    }

    return null;
}

function detectMime(bytes,path){
    if(!bytes||bytes.length<2){
        return mimeFromExtension(path);
    }

    if(
        bytes.length>=8 &&
        bytes[0]===137 &&
        bytes[1]===80 &&
        bytes[2]===78 &&
        bytes[3]===71 &&
        bytes[4]===13 &&
        bytes[5]===10 &&
        bytes[6]===26 &&
        bytes[7]===10
    ){
        return "image/png";
    }

    if(
        bytes.length>=3 &&
        bytes[0]===255 &&
        bytes[1]===216 &&
        bytes[2]===255
    ){
        return "image/jpeg";
    }

    if(
        bytes.length>=6 &&
        bytes[0]===71 &&
        bytes[1]===73 &&
        bytes[2]===70
    ){
        return "image/gif";
    }

    if(
        bytes.length>=12 &&
        bytes[0]===82 &&
        bytes[1]===73 &&
        bytes[2]===70 &&
        bytes[3]===70 &&
        bytes[8]===87 &&
        bytes[9]===69 &&
        bytes[10]===66 &&
        bytes[11]===80
    ){
        return "image/webp";
    }

    if(
        bytes.length>=2 &&
        bytes[0]===66 &&
        bytes[1]===77
    ){
        return "image/bmp";
    }

    return mimeFromExtension(path);
}

function blobURL(blob){
    if(
        !blob ||
        !(blob instanceof Blob)
    ){
        throw new Error(
            "Invalid Blob."
        );
    }

    currentFile=blob;

    currentObjectURL=
        URL.createObjectURL(blob);

    return currentObjectURL;
}

function bytesURL(value,path){
    const bytes=
        bytesFrom(value);

    if(!bytes){
        throw new Error(
            "Invalid binary image data."
        );
    }

    const blob=
        new Blob(
            [bytes],
            {
                type:
                    detectMime(
                        bytes,
                        path
                    )
            }
        );

    return blobURL(blob);
}

function isBase64(value){
    if(typeof value!=="string"){
        return false;
    }

    const s=
        value
        .trim()
        .replace(/\s/g,"");

    if(s.length<32){
        return false;
    }

    return /^[A-Za-z0-9+/]+={0,2}$/.test(s);
}

function base64URL(value,path){
    const clean=
        String(value||"")
        .trim()
        .replace(/\s/g,"");

    let mime=
        mimeFromExtension(path);

    if(
        clean.startsWith("iVBORw0KGgo")
    ){
        mime="image/png";
    }else if(
        clean.startsWith("/9j/")
    ){
        mime="image/jpeg";
    }else if(
        clean.startsWith("R0lGODlh") ||
        clean.startsWith("R0lGODdh")
    ){
        mime="image/gif";
    }else if(
        clean.startsWith("UklGR")
    ){
        mime="image/webp";
    }else if(
        clean.startsWith("Qk")
    ){
        mime="image/bmp";
    }

    const binary=
        atob(clean);

    const bytes=
        new Uint8Array(
            binary.length
        );

    for(
        let i=0;
        i<binary.length;
        i++
    ){
        bytes[i]=
            binary.charCodeAt(i);
    }

    return blobURL(
        new Blob(
            [bytes],
            {type:mime}
        )
    );
}

function stringImageSource(value,path){
    const s=
        String(value||"").trim();

    if(!s){
        throw new Error(
            "Empty image source."
        );
    }

    if(/^data:/i.test(s)){
        return s;
    }

    if(
        /^https?:\/\//i.test(s) ||
        /^blob:/i.test(s) ||
        /^file:/i.test(s)
    ){
        return s;
    }

    if(
        /^<svg[\s>]/i.test(s) ||
        /^<\?xml/i.test(s)
    ){
        return blobURL(
            new Blob(
                [s],
                {type:"image/svg+xml"}
            )
        );
    }

    if(isBase64(s)){
        return base64URL(
            s,
            path
        );
    }

    throw new Error(
        "Unsupported string image source: "+
        s.slice(0,300)
    );
}

async function resolveValue(value,path,depth){
    depth=
        Number(depth)||0;

    if(depth>10){
        throw new Error(
            "Image source resolution exceeded the limit."
        );
    }

    if(value==null){
        throw new Error(
            "Filesystem returned no image data."
        );
    }

    if(
        typeof File!=="undefined" &&
        value instanceof File
    ){
        currentFile=value;
        return blobURL(value);
    }

    if(value instanceof Blob){
        return blobURL(value);
    }

    if(value instanceof ArrayBuffer){
        return bytesURL(
            value,
            path
        );
    }

    if(
        value &&
        typeof value==="object" &&
        value.buffer instanceof ArrayBuffer
    ){
        return bytesURL(
            value,
            path
        );
    }

    if(
        value &&
        typeof value==="object" &&
        typeof value.getFile==="function"
    ){
        currentHandle=value;

        const file=
            await value.getFile();

        if(!file){
            throw new Error(
                "FSA handle returned no File."
            );
        }

        return resolveValue(
            file,
            path,
            depth+1
        );
    }

    if(typeof value==="string"){

        const s=
            value.trim();

        /*
         * IMPORTANT:
         *
         * Some Little Hollow FS implementations
         * return another virtual filesystem path
         * from FS.read().
         *
         * Example:
         *
         * chxd:/device/MyDocuments/Favorites Space/1753677807835.jpg
         *
         * That is NOT image text.
         * It is another path that must be resolved.
         */
        if(
            isVirtualPath(s)&&
            s!==String(path||"")
        ){
            return readVirtualFile(
                s,
                depth+1
            );
        }

        return stringImageSource(
            s,
            path
        );
    }

    if(typeof value==="object"){

        const directKeys=[
            "file",
            "blob",
            "content",
            "data",
            "buffer",
            "bytes",
            "arrayBuffer",
            "handle",
            "fileHandle",
            "url",
            "src",
            "href"
        ];

        for(
            const key of directKeys
        ){

            if(!(key in value)){
                continue;
            }

            let child;

            try{
                child=value[key];

                if(
                    typeof child==="function"
                ){
                    child=
                        await child.call(value);
                }

            }catch(_){
                continue;
            }

            if(child==null){
                continue;
            }

            try{
                return await resolveValue(
                    child,
                    path,
                    depth+1
                );
            }catch(_){}
        }
    }

    throw new Error(
        "Unsupported image source type: "+
        Object.prototype.toString.call(value)
    );
}

async function findDeviceHandle(path,fs){
    if(
        !fs ||
        typeof fs.getDeviceMounts!=="function"
    ){
        return null;
    }

    const prefix=
        "chxd:/device/";

    const source=
        String(path||"");

    if(
        !source
        .toLowerCase()
        .startsWith(
            prefix.toLowerCase()
        )
    ){
        return null;
    }

    const relative=
        source.slice(
            prefix.length
        );

    const parts=
        relative
        .split("/")
        .filter(Boolean);

    if(parts.length<2){
        return null;
    }

    const mountName=
        parts.shift();

    const mounts=
        await fs.getDeviceMounts();

    if(!Array.isArray(mounts)){
        return null;
    }

    const mount=
        mounts.find(
            m=>
                m &&
                String(m.name)===
                String(mountName)
        );

    if(!mount){
        return null;
    }

    let handle=
        mount.handle ||
        mount.directoryHandle ||
        mount.rootHandle;

    if(!handle){
        return null;
    }

    if(
        typeof handle.queryPermission==="function"
    ){
        let permission=
            await handle.queryPermission({
                mode:"read"
            });

        if(
            permission!=="granted" &&
            typeof handle.requestPermission==="function"
        ){
            permission=
                await handle.requestPermission({
                    mode:"read"
                });
        }

        if(permission!=="granted"){
            throw new Error(
                "File System Access permission was denied for '"+mountName+"'."
            );
        }
    }

    for(const part of parts){

        if(
            !handle ||
            typeof handle.getDirectoryHandle!=="function" ||
            typeof handle.getFileHandle!=="function"
        ){
            throw new Error(
                "Invalid File System Access directory handle."
            );
        }

        const isLast=
            part===parts[parts.length-1];

        if(isLast){
            try{
                return await handle.getFileHandle(
                    part
                );
            }catch(_){
                try{
                    return await handle.getDirectoryHandle(
                        part
                    );
                }catch(__){
                    throw new Error(
                        "Could not locate '"+part+"' in the File System Access folder."
                    );
                }
            }
        }

        handle=
            await handle.getDirectoryHandle(
                part
            );
    }

    return null;
}

async function readVirtualFile(path,depth){
    depth=
        Number(depth)||0;

    if(depth>10){
        throw new Error(
            "Filesystem path resolution exceeded the limit."
        );
    }

    const fs=getFS();

    if(!fs){
        throw new Error(
            "Little Hollow filesystem bridge is unavailable."
        );
    }

    let normalized=
        String(path);

    try{
        if(
            typeof fs.normalize==="function"
        ){
            normalized=
                fs.normalize(
                    normalized
                );
        }
    }catch(_){}

    /*
     * FIRST:
     * Directly use FSA for DEVICE paths.
     *
     * This allows images to work even if the
     * filesystem abstraction doesn't convert the
     * FSA File into a data URI.
     */
    try{

        const handle=
            await findDeviceHandle(
                normalized,
                fs
            );

        if(handle){

            if(
                typeof handle.getFile==="function"
            ){

                currentHandle=handle;

                const file=
                    await handle.getFile();

                if(file){
                    return blobURL(file);
                }
            }
        }

    }catch(err){

        /*
         * Don't immediately stop.
         * The normal FS bridge may still know how
         * to resolve the file.
         */
        console.warn(
            "[Image Viewer] Direct FSA resolution failed:",
            err
        );
    }

    /*
     * SECOND:
     * Use Little Hollow's FS.read().
     */
    if(
        typeof fs.read==="function"
    ){

        const result=
            await fs.read(
                normalized
            );

        if(
            result &&
            typeof result==="object" &&
            "ok" in result &&
            !result.ok
        ){
            throw new Error(
                result.error ||
                result.summary ||
                "Could not read image."
            );
        }

        const returnedValue=
            result &&
            typeof result==="object" &&
            "content" in result
                ?result.content
                :result;

        /*
         * This also handles the case where
         * FS.read(path) returns another path.
         */
        return resolveValue(
            returnedValue,
            normalized,
            depth+1
        );
    }

    /*
     * THIRD:
     * Try direct FSA one more time if an FS
     * implementation doesn't provide read().
     */
    try{

        const handle=
            await findDeviceHandle(
                normalized,
                fs
            );

        if(
            handle &&
            typeof handle.getFile==="function"
        ){
            const file=
                await handle.getFile();

            return blobURL(file);
        }

    }catch(_){}

    throw new Error(
        "Could not resolve filesystem image:\n"+
        normalized
    );
}

async function resolveSource(src){
    const s=
        String(src||"").trim();

    if(!s){
        throw new Error(
            "No image source specified."
        );
    }

    if(isVirtualPath(s)){
        return readVirtualFile(
            s,
            0
        );
    }

    if(isURL(s)){
        return s;
    }

    throw new Error(
        "Unsupported image path:\n"+
        s
    );
}

function displayImage(source){
    return new Promise(
        (resolve,reject)=>{

            const img=
                document.createElement("img");

            img.draggable=false;

            img.onload=()=>{
                stage.innerHTML="";
                stage.appendChild(img);
                resolve(img);
            };

            img.onerror=()=>{
                reject(
                    new Error(
                        "Browser could not decode this image."
                    )
                );
            };

            img.src=source;
        }
    );
}

async function show(src){
    src=
        String(src||"").trim();

    if(!src){
        errorMessage(
            "No image path specified."
        );
        return;
    }

    loading();

    try{

        const source=
            await resolveSource(src);

        console.log(
            "[Image Viewer] Resolved:",
            src,
            "=>",
            source
        );

        await displayImage(
            source
        );

    }catch(err){

        console.error(
            "[Image Viewer] Load failed:",
            err
        );

        errorMessage(
            "Failed to load image.\n\n"+
            (
                err &&
                err.message
                    ?err.message
                    :String(err)
            )
        );
    }
}

document
    .getElementById("loadBtn")
    .addEventListener(
        "click",
        ()=>{
            const src=
                urlInput.value.trim();

            if(src){
                show(src);
            }
        }
    );

urlInput.addEventListener(
    "keydown",
    e=>{
        if(e.key!=="Enter"){
            return;
        }

        const src=
            urlInput.value.trim();

        if(src){
            show(src);
        }
    }
);

if(initialPath){

    urlInput.value=
        initialPath;

    show(initialPath);
}
</script>

</body>
</html>
