<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Image Viewer</title>
<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:monospace;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    color:#00FFFF;
}

body{
    overflow:hidden;
}

.wrap{
    display:flex;
    flex-direction:column;
    width:100%;
    height:100%;
}

.bar{
    flex:0 0 auto;
    display:flex;
    gap:6px;
    padding:8px;
    border-bottom:1px solid #00FFFF;
}

.bar input{
    flex:1;
    min-width:0;
    background:#001010;
    border:1px solid #00FFFF;
    color:#00FFFF;
    padding:6px 8px;
    outline:none;
    font:11px monospace;
}

.bar button{
    border:1px solid #00FFFF;
    background:transparent;
    color:#00FFFF;
    padding:6px 10px;
    cursor:pointer;
    font:11px monospace;
}

.bar button:active{
    background:#00FFFF;
    color:#000;
}

.stage{
    flex:1;
    min-height:0;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:auto;
    position:relative;
    padding:8px;
}

.stage img{
    display:block;
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    object-fit:contain;
    user-select:none;
    -webkit-user-drag:none;
}

.empty{
    opacity:.55;
    font-size:12px;
    text-align:center;
    white-space:pre-wrap;
    padding:20px;
}

.error{
    color:#ff6666;
    font-size:11px;
    text-align:center;
    white-space:pre-wrap;
    padding:20px;
    max-width:100%;
    overflow:auto;
}
</style>
</head>

<body>

<div class="wrap">

    <div class="bar">
        <input
            id="url"
            type="text"
            placeholder="Image URL or chxd:/ path..."
            autocomplete="off"
            spellcheck="false"
        >
        <button id="loadBtn">LOAD</button>
    </div>

    <div class="stage" id="stage">
        <div class="empty">No image loaded.</div>
    </div>

</div>

<script>
"use strict";

const stage=document.getElementById("stage");
const urlInput=document.getElementById("url");

let currentObjectURL=null;
let currentFile=null;
let currentHandle=null;

const params=new URLSearchParams(location.search);
const initialPath=params.get("src");

function getParentObject(name){
    try{
        if(
            window.parent &&
            window.parent!==window &&
            window.parent[name]
        ){
            return window.parent[name];
        }
    }catch(_){}

    try{
        if(window[name]){
            return window[name];
        }
    }catch(_){}

    return null;
}

function getFS(){
    return getParentObject("FS");
}

function getTools(){
    return getParentObject("Tools");
}

function cleanupObjectURL(){
    if(currentObjectURL){
        try{
            URL.revokeObjectURL(currentObjectURL);
        }catch(_){}
        currentObjectURL=null;
    }

    currentFile=null;
    currentHandle=null;
}

function loading(){
    cleanupObjectURL();

    stage.innerHTML=
        '<div class="empty">Loading image...</div>';
}

function errorMessage(message){
    cleanupObjectURL();

    stage.innerHTML="";

    const box=document.createElement("div");

    box.className="error";
    box.textContent=
        String(
            message ||
            "Failed to load image."
        );

    stage.appendChild(box);
}

function extension(path){
    const clean=String(path||"")
        .split("?")[0]
        .split("#")[0];

    const dot=clean.lastIndexOf(".");

    if(dot<0)return "";

    return clean
        .slice(dot+1)
        .toLowerCase();
}

function mimeFromExtension(path){
    switch(extension(path)){
        case "png":
            return "image/png";

        case "jpg":
        case "jpeg":
        case "jpe":
            return "image/jpeg";

        case "gif":
            return "image/gif";

        case "webp":
            return "image/webp";

        case "bmp":
            return "image/bmp";

        case "svg":
        case "svgz":
            return "image/svg+xml";

        case "ico":
            return "image/x-icon";

        case "avif":
            return "image/avif";

        case "tif":
        case "tiff":
            return "image/tiff";

        case "heic":
            return "image/heic";

        case "heif":
            return "image/heif";

        default:
            return "application/octet-stream";
    }
}

function isImageMime(type){
    return /^image\//i.test(
        String(type||"")
    );
}

function isVirtualPath(value){
    const s=String(value||"");

    return (
        /^chxd:\//i.test(s) ||
        /^local:\//i.test(s) ||
        /^session:\//i.test(s) ||
        /^indexdb:\//i.test(s) ||
        /^puter:\//i.test(s)
    );
}

function isURL(value){
    const s=String(value||"");

    return (
        /^https?:\/\//i.test(s) ||
        /^blob:/i.test(s) ||
        /^data:/i.test(s) ||
        /^file:/i.test(s)
    );
}

function isProbablyBase64(value){
    if(typeof value!=="string"){
        return false;
    }

    const s=value
        .trim()
        .replace(/\s/g,"");

    if(s.length<32){
        return false;
    }

    return /^[A-Za-z0-9+/]+={0,2}$/.test(s);
}

function detectBase64Mime(value,path){
    const s=String(value||"")
        .trim()
        .replace(/\s/g,"");

    if(s.startsWith("iVBORw0KGgo")){
        return "image/png";
    }

    if(s.startsWith("/9j/")){
        return "image/jpeg";
    }

    if(
        s.startsWith("R0lGODlh") ||
        s.startsWith("R0lGODdh")
    ){
        return "image/gif";
    }

    if(s.startsWith("UklGR")){
        return "image/webp";
    }

    if(s.startsWith("Qk")){
        return "image/bmp";
    }

    const guessed=mimeFromExtension(path);

    if(guessed!=="application/octet-stream"){
        return guessed;
    }

    return "application/octet-stream";
}

function bytesFromArrayBuffer(value){
    if(value instanceof ArrayBuffer){
        return new Uint8Array(value);
    }

    if(
        value &&
        typeof value==="object" &&
        value.buffer instanceof ArrayBuffer
    ){
        return new Uint8Array(
            value.buffer,
            value.byteOffset||0,
            value.byteLength
        );
    }

    return null;
}

function detectBytesMime(bytes,path){
    if(!bytes||bytes.length<2){
        return mimeFromExtension(path);
    }

    if(
        bytes.length>=8 &&
        bytes[0]===137 &&
        bytes[1]===80 &&
        bytes[2]===78 &&
        bytes[3]===71 &&
        bytes[4]===13 &&
        bytes[5]===10 &&
        bytes[6]===26 &&
        bytes[7]===10
    ){
        return "image/png";
    }

    if(
        bytes.length>=3 &&
        bytes[0]===255 &&
        bytes[1]===216 &&
        bytes[2]===255
    ){
        return "image/jpeg";
    }

    if(
        bytes.length>=6 &&
        bytes[0]===71 &&
        bytes[1]===73 &&
        bytes[2]===70
    ){
        return "image/gif";
    }

    if(
        bytes.length>=12 &&
        bytes[0]===82 &&
        bytes[1]===73 &&
        bytes[2]===70 &&
        bytes[3]===70 &&
        bytes[8]===87 &&
        bytes[9]===69 &&
        bytes[10]===66 &&
        bytes[11]===80
    ){
        return "image/webp";
    }

    if(
        bytes.length>=2 &&
        bytes[0]===66 &&
        bytes[1]===77
    ){
        return "image/bmp";
    }

    if(
        bytes.length>=4 &&
        bytes[0]===60
    ){
        try{
            const text=
                new TextDecoder()
                .decode(
                    bytes.slice(
                        0,
                        Math.min(
                            bytes.length,
                            512
                        )
                    )
                )
                .trim();

            if(/^<svg[\s>]/i.test(text)){
                return "image/svg+xml";
            }

            if(/^<\?xml/i.test(text)&&/<svg[\s>]/i.test(text)){
                return "image/svg+xml";
            }
        }catch(_){}
    }

    return mimeFromExtension(path);
}

function arrayBufferToBlob(value,path){
    const bytes=bytesFromArrayBuffer(value);

    if(!bytes){
        throw new Error(
            "Invalid binary image data."
        );
    }

    const mime=
        detectBytesMime(
            bytes,
            path
        );

    return new Blob(
        [bytes],
        {type:mime}
    );
}

function blobToObjectURL(blob){
    if(!blob){
        throw new Error(
            "No image Blob was provided."
        );
    }

    let finalBlob=blob;

    if(!isImageMime(blob.type)){
        try{
            finalBlob=new Blob(
                [blob],
                {
                    type:
                        mimeFromExtension(
                            urlInput.value
                        )
                }
            );
        }catch(_){}
    }

    currentFile=finalBlob;

    currentObjectURL=
        URL.createObjectURL(
            finalBlob
        );

    return currentObjectURL;
}

function stringToImageSource(value,path){
    const s=String(value||"").trim();

    if(!s){
        throw new Error(
            "The filesystem returned empty image data."
        );
    }

    if(/^data:/i.test(s)){
        return s;
    }

    if(isURL(s)){
        return s;
    }

    if(
        /^<svg[\s>]/i.test(s) ||
        /^<\?xml/i.test(s)
    ){
        const blob=new Blob(
            [s],
            {type:"image/svg+xml"}
        );

        return blobToObjectURL(blob);
    }

    if(isProbablyBase64(s)){
        const mime=
            detectBase64Mime(
                s,
                path
            );

        const binary=
            atob(
                s.replace(/\s/g,"")
            );

        const bytes=
            new Uint8Array(
                binary.length
            );

        for(
            let i=0;
            i<binary.length;
            i++
        ){
            bytes[i]=
                binary.charCodeAt(i);
        }

        return blobToObjectURL(
            new Blob(
                [bytes],
                {type:mime}
            )
        );
    }

    throw new Error(
        "Unsupported string image source."
    );
}

async function handleToBlob(handle){
    if(
        !handle ||
        typeof handle.getFile!=="function"
    ){
        return null;
    }

    const file=
        await handle.getFile();

    if(!file){
        throw new Error(
            "File System Access returned no File."
        );
    }

    currentHandle=handle;
    currentFile=file;

    return file;
}

async function resolveObjectToSource(value,path,depth=0){
    if(depth>6){
        throw new Error(
            "Image source resolution exceeded the maximum depth."
        );
    }

    if(value==null){
        throw new Error(
            "Filesystem returned no image data."
        );
    }

    if(value instanceof Blob){
        return blobToObjectURL(value);
    }

    if(
        typeof File!=="undefined" &&
        value instanceof File
    ){
        return blobToObjectURL(value);
    }

    if(
        typeof FileSystemFileHandle!=="undefined" &&
        value instanceof FileSystemFileHandle
    ){
        const file=
            await handleToBlob(value);

        return blobToObjectURL(file);
    }

    if(
        typeof value==="object" &&
        typeof value.getFile==="function"
    ){
        const file=
            await handleToBlob(value);

        return blobToObjectURL(file);
    }

    if(value instanceof ArrayBuffer){
        return blobToObjectURL(
            arrayBufferToBlob(
                value,
                path
            )
        );
    }

    const typedBytes=
        bytesFromArrayBuffer(value);

    if(typedBytes){
        return blobToObjectURL(
            new Blob(
                [typedBytes],
                {
                    type:
                        detectBytesMime(
                            typedBytes,
                            path
                        )
                }
            )
        );
    }

    if(typeof value==="string"){
        return stringToImageSource(
            value,
            path
        );
    }

    if(typeof value==="object"){

        const candidates=[
            "file",
            "blob",
            "data",
            "content",
            "arrayBuffer",
            "buffer",
            "bytes",
            "handle",
            "fileHandle",
            "source",
            "url",
            "src",
            "href"
        ];

        for(const key of candidates){

            if(!(key in value)){
                continue;
            }

            let candidate;

            try{
                candidate=value[key];

                if(
                    typeof candidate==="function"
                ){
                    candidate=
                        await candidate.call(value);
                }

            }catch(_){
                continue;
            }

            if(candidate==null){
                continue;
            }

            try{
                return await resolveObjectToSource(
                    candidate,
                    path,
                    depth+1
                );
            }catch(_){}
        }
    }

    throw new Error(
        "Unsupported image source type: "+
        Object.prototype.toString.call(value)
    );
}

async function tryReadUsingFSReader(fs,path){
    if(
        !fs ||
        typeof fs.read!=="function"
    ){
        return null;
    }

    const result=
        await fs.read(path);

    if(
        result &&
        typeof result==="object" &&
        "ok" in result &&
        !result.ok
    ){
        throw new Error(
            result.error ||
            result.summary ||
            ("Could not read file: "+path)
        );
    }

    return resolveObjectToSource(
        result &&
        typeof result==="object" &&
        "content" in result
            ?result.content
            :result,
        path
    );
}

async function tryResolveFromDeviceMounts(fs,path){
    if(
        !fs ||
        typeof fs.getDeviceMounts!=="function"
    ){
        return null;
    }

    const prefix="chxd:/device/";

    if(
        !String(path)
            .toLowerCase()
            .startsWith(prefix)
    ){
        return null;
    }

    const relative=
        String(path).slice(
            prefix.length
        );

    const parts=
        relative
            .split("/")
            .filter(Boolean);

    if(parts.length<2){
        return null;
    }

    const mountName=parts.shift();
    const fileParts=parts;

    const mounts=
        await fs.getDeviceMounts();

    if(!Array.isArray(mounts)){
        return null;
    }

    const mount=
        mounts.find(
            m=>
                m &&
                String(m.name)===String(mountName)
        );

    if(!mount){
        return null;
    }

    const handle=
        mount.handle ||
        mount.directoryHandle ||
        mount.rootHandle;

    if(!handle){
        return null;
    }

    if(
        typeof handle.queryPermission==="function"
    ){
        let permission=
            await handle.queryPermission({
                mode:"read"
            });

        if(
            permission!=="granted" &&
            typeof handle.requestPermission==="function"
        ){
            permission=
                await handle.requestPermission({
                    mode:"read"
                });
        }

        if(permission!=="granted"){
            throw new Error(
                "File System Access permission is required for '"+mountName+"'."
            );
        }
    }

    let currentHandle=handle;

    for(const part of fileParts){

        if(
            !currentHandle ||
            typeof currentHandle.getFileHandle!=="function"
        ){
            throw new Error(
                "The File System Access directory cannot be traversed."
            );
        }

        currentHandle=
            await currentHandle.getFileHandle(
                part
            );
    }

    const file=
        await handleToBlob(
            currentHandle
        );

    return blobToObjectURL(
        file
    );
}

async function readVirtualFile(path){
    const fs=getFS();

    if(!fs){
        throw new Error(
            "Little Hollow filesystem bridge is unavailable.\n"+
            "parent.FS could not be found."
        );
    }

    let normalized=path;

    try{
        if(typeof fs.normalize==="function"){
            normalized=
                fs.normalize(path);
        }
    }catch(_){}

    let firstError=null;

    try{
        const source=
            await tryReadUsingFSReader(
                fs,
                normalized
            );

        if(source){
            return source;
        }

    }catch(err){
        firstError=err;
    }

    try{
        const source=
            await tryResolveFromDeviceMounts(
                fs,
                normalized
            );

        if(source){
            return source;
        }

    }catch(err){
        if(
            !firstError
        ){
            firstError=err;
        }
    }

    throw firstError ||
        new Error(
            "Could not read image: "+
            normalized
        );
}

async function loadSource(source){
    const value=
        String(source||"").trim();

    if(!value){
        throw new Error(
            "No image source specified."
        );
    }

    if(isVirtualPath(value)){
        return readVirtualFile(value);
    }

    if(isURL(value)){
        return value;
    }

    return value;
}

function createImage(source){
    return new Promise(
        (resolve,reject)=>{

            const img=
                document.createElement("img");

            img.draggable=false;

            img.onload=()=>{
                stage.innerHTML="";
                stage.appendChild(img);
                resolve(img);
            };

            img.onerror=()=>{
                reject(
                    new Error(
                        "The browser could not decode the image."
                    )
                );
            };

            img.src=source;
        }
    );
}

async function show(src){
    src=String(src||"").trim();

    if(!src){
        errorMessage(
            "No image path specified."
        );
        return;
    }

    loading();

    try{

        const source=
            await loadSource(src);

        await createImage(source);

    }catch(err){

        console.error(
            "[Image Viewer] Failed to load:",
            err
        );

        errorMessage(
            "Failed to load image.\n\n"+
            (
                err &&
                err.message
                    ?err.message
                    :String(err)
            )
        );
    }
}

document
    .getElementById("loadBtn")
    .addEventListener(
        "click",
        ()=>{
            const src=
                urlInput.value.trim();

            if(src){
                show(src);
            }
        }
    );

urlInput.addEventListener(
    "keydown",
    e=>{
        if(e.key!=="Enter"){
            return;
        }

        const src=
            urlInput.value.trim();

        if(src){
            show(src);
        }
    }
);

if(initialPath){

    urlInput.value=initialPath;

    show(initialPath);
}
</script>

</body>
</html>
