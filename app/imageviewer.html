<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Viewer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:monospace;}
html,body{width:100%;height:100%;background:#000;color:#00FFFF;}
.wrap{display:flex;flex-direction:column;height:100%;}
.bar{flex:0 0 auto;display:flex;padding:8px;border-bottom:1px solid #00FFFF;gap:6px;}
.bar input{flex:1;background:#001010;border:1px solid #00FFFF;color:#00FFFF;padding:6px;font-family:monospace;}
.bar button{border:1px solid #00FFFF;background:transparent;color:#00FFFF;padding:6px 10px;cursor:pointer;}
.stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;}
img{max-width:100%;max-height:100%;}
.empty{opacity:0.5;font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
    <div class="bar">
        <input id="url" type="text" placeholder="Image URL...">
        <button id="loadBtn">LOAD</button>
    </div>
    <div class="stage" id="stage"><div class="empty">No image loaded.</div></div>
</div>
<script>
const stage=document.getElementById("stage");
const urlInput=document.getElementById("url");

function show(src){
    stage.innerHTML="";
    const img=document.createElement("img");
    img.src=src;
    img.onerror=()=>{ stage.innerHTML="<div class=\"empty\">Failed to load image.</div>"; };
    stage.appendChild(img);
}

document.getElementById("loadBtn").addEventListener("click",()=>{
    if(urlInput.value.trim()) show(urlInput.value.trim());
});

const params=new URLSearchParams(location.search);
const initial=params.get("src");
if(initial){ urlInput.value=initial; show(initial); }
</script>
</body>
</html>
