<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>File Manager</title>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:monospace}html,body{width:100%;height:100%;background:#000d0d;color:#00FFFF}.wrap{display:flex;flex-direction:column;height:100%}.bar{display:flex;gap:5px;padding:6px;border-bottom:1px solid #00FFFF;flex-wrap:wrap}.bar button,.bar input{border:1px solid #00FFFF;background:transparent;color:#00FFFF;padding:6px 8px;font-family:monospace;font-size:10px}.bar input{flex:1 1 150px}.bar button:active,.row button:active{background:#00FFFF;color:#000}.tabs{display:flex;border-bottom:1px solid #00FFFF}.tabs button{flex:1;border:0;border-right:1px solid #00FFFF;background:transparent;color:#00FFFF;padding:7px 3px;cursor:pointer;font:11px monospace}.tabs button.active{background:rgba(0,255,255,.15)}.pathbar{display:flex;gap:5px;align-items:center;padding:4px 8px;border-bottom:1px solid rgba(0,255,255,.2);font-size:10px}.pathbar button{border:1px solid #00FFFF;background:transparent;color:#00FFFF;font:10px monospace;padding:3px 6px}.pathtext{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.65}.list{flex:1;overflow:auto}.row{display:flex;align-items:center;gap:5px;padding:7px 8px;border-bottom:1px solid rgba(0,255,255,.22);font-size:11px}.name{flex:1;min-width:0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.name.editing{overflow:visible}.renameInput{width:100%;border:1px solid #00FFFF;background:#000;color:#00FFFF;font:11px monospace;padding:2px}.row button{border:1px solid #00FFFF;background:transparent;color:#00FFFF;font:10px monospace;padding:3px 5px;cursor:pointer}.row input{accent-color:#00FFFF}.folder{font-weight:bold}.empty{padding:16px;opacity:.6;font-size:12px}.hint{padding:4px 8px;font-size:10px;opacity:.55;border-bottom:1px solid rgba(0,255,255,.2)}.error{color:#ff7070;white-space:pre-wrap}</style>
</head><body><div class="wrap"><div class="bar"><input id="pathBox" placeholder="path or wildcard"><button id="refresh">REFRESH</button><button id="up">UP</button><button id="import">IMPORT</button><button id="newFolder">NEW FOLDER</button><button id="newText">NEW TEXT</button><button id="zip">ZIP SELECTED</button><button id="unzip">UNZIP FILES</button><button id="selectAll">SELECT ALL</button></div><div class="tabs" id="tabs"></div><div class="pathbar"><button id="root">ROOT</button><div class="pathtext" id="pathText"></div></div><div class="hint" id="hint">Tap a folder to open it. Tap a file to open it. Double-click a name to rename it. ZIP/ARCHIVE files can be unzipped.</div><div class="hint error" id="error" style="display:none"></div><div class="list" id="list"></div><input id="fileInput" type="file" multiple hidden><input id="folderInput" type="file" webkitdirectory directory multiple hidden></div>
<script>
const zones=[{key:"local",label:"LOCAL",prefix:"chxd:/local/"},{key:"session",label:"SESSION",prefix:"chxd:/session/"},{key:"indexdb",label:"INDEXDB",prefix:"chxd:/indexdb/"},{key:"puter",label:"PUTER",prefix:"puter:/"},{key:"system",label:"SYSTEM",prefix:"chxd:/system/"}];
let current="local",selected=new Set(),dirs={local:"",session:"",indexdb:"",puter:"",system:""};
const params=new URLSearchParams(location.search),selectMode=params.get("select")==="1";
const tabs=document.getElementById("tabs"),list=document.getElementById("list"),box=document.getElementById("pathBox"),hint=document.getElementById("hint"),errorBox=document.getElementById("error"),pathText=document.getElementById("pathText"),fileInput=document.getElementById("fileInput"),folderInput=document.getElementById("folderInput");
function showError(s){errorBox.textContent=String(s||"Unknown error");errorBox.style.display="block";clearTimeout(showError.t);showError.t=setTimeout(()=>errorBox.style.display="none",4500)}
function norm(p){return String(p||"").replace(/\\/g,"/").replace(/\/+/g,"/")}
function join(a,b){a=norm(a).replace(/\/+$/,"");b=norm(b).replace(/^\/+/,"");return a?(b?a+"/"+b:a):b}
function base(p){return norm(p).split("/").pop()||""}
function ext(p){return(base(p).split("?")[0].split(".").pop()||"").toLowerCase()}
function rel(p,prefix){p=norm(p);prefix=norm(prefix);return p.startsWith(prefix)?p.slice(prefix.length):p}
function dirPath(){const z=zones.find(x=>x.key===current);return join(z.prefix,dirs[current])}
function displayPath(){const z=zones.find(x=>x.key===current);pathText.textContent=dirs[current]?join(z.prefix,dirs[current]):z.prefix}
function selectedPaths(){return[...selected]}
function isArchive(p){return["zip","7z","rar","tar","gz","tgz"].includes(ext(p))}
if(selectMode)hint.textContent="SELECT MODE: choose a file to return it to the calling app. Multiple files can be selected for OneCompiler.";
zones.forEach(z=>{const b=document.createElement("button");b.textContent=z.label;b.dataset.k=z.key;if(z.key===current)b.classList.add("active");b.onclick=()=>{current=z.key;[...tabs.children].forEach(x=>x.classList.toggle("active",x.dataset.k===current));refresh()};tabs.appendChild(b)});
async function openPath(p){if(selectMode){parent.postMessage({type:"LH_FILE_SELECTED",path:p},"*");return}if(isArchive(p)){const a=confirm("This is an archive file.\n\nOK = UNZIP\nCancel = DOWNLOAD");if(a){return unzipArchive(p)}await downloadBinary(p);return}try{const r=await parent.Tools.execute("open_file",{path:p});if(r&&!r.ok)showError(r.summary||r.error||"Could not open file.")}catch(err){showError(err.message||err)}}
async function edit(p){try{const r=await parent.Tools.execute("open_notepad",{path:p});if(r&&!r.ok)showError(r.summary||r.error||"Could not open Notepad.")}catch(err){showError(err.message||err)}}
async function code(){const paths=selectedPaths();if(!paths.length)return;const files=[];for(const p of paths){try{const r=await parent.FS.read(p);if(r.ok)files.push({name:base(p),content:r.content})}catch(e){}}if(!files.length)return;parent.Apps.openOneCompiler({language:ext(files[0].name)==="py"?"python":"javascript",files,run:false})}
function downloadData(data,name){const a=document.createElement("a");a.href=data;a.download=name;document.body.appendChild(a);a.click();a.remove()}
async function downloadBinary(p){try{const r=await parent.FS.read(p);if(!r.ok){showError(r.error);return false}if(!/^data:/i.test(r.content)){showError("This archive does not contain downloadable binary data.");return false}downloadData(r.content,base(p));return true}catch(err){showError(err.message||err);return false}}
async function makeDir(path){try{if(typeof parent.FS.mkdir==="function")return await parent.FS.mkdir(path)}catch(e){}try{if(typeof parent.FS.createFolder==="function")return await parent.FS.createFolder(path)}catch(e){}try{if(typeof parent.FS.makeDir==="function")return await parent.FS.makeDir(path)}catch(e){}try{const r=await parent.FS.write(join(path,".folder"),"",true);if(r&&r.ok){try{await parent.FS.remove(join(path,".folder"))}catch(e){}return{ok:true}}}catch(e){}return{ok:false,error:"This filesystem does not provide folder creation."}}
async function renamePath(oldPath,newPath){try{if(typeof parent.FS.rename==="function")return await parent.FS.rename(oldPath,newPath)}catch(e){}try{if(typeof parent.FS.move==="function")return await parent.FS.move(oldPath,newPath)}catch(e){}for(const tool of ["rename_file","rename","move_file"]){try{const r=await parent.Tools.execute(tool,{path:oldPath,old_path:oldPath,new_path:newPath,newPath:newPath});if(r&&r.ok)return r}catch(e){}}return{ok:false,error:"This filesystem does not provide rename support."}}
async function renameItem(path){const oldName=base(path),newName=prompt("Rename:",oldName);if(newName===null)return;const n=newName.trim();if(!n||n===oldName||n.includes("/")||n.includes("\\")||n==="."||n===".."){if(n!==oldName&&n)showError("Invalid name.");return}const np=join(path.slice(0,path.length-oldName.length),n),r=await renamePath(path,np);if(!r||r.ok===false){showError(r&&r.error||r&&r.summary||"Could not rename item.");return}if(selected.has(path)){selected.delete(path);selected.add(np)}refresh()}
function buildEntries(all,z){const folder=norm(dirs[current]).replace(/^\/+|\/+$/g,""),out=new Map();for(const raw of all){const p=norm(raw);if(!p.startsWith(z.prefix))continue;let r=rel(p,z.prefix).replace(/^\/+/,"");if(folder){if(r===folder||!r.startsWith(folder+"/"))continue;r=r.slice(folder.length+1)}if(!r)continue;const i=r.indexOf("/");if(i<0)out.set(r,{type:"file",path:p});else{const n=r.slice(0,i),fp=join(join(z.prefix,folder),n);out.set(n,{type:"folder",path:fp})}}return[...out.values()].sort((a,b)=>a.type!==b.type?(a.type==="folder"?-1:1):base(a.path).localeCompare(base(b.path),undefined,{numeric:true,sensitivity:"base"}))}
async function refresh(){const z=zones.find(x=>x.key===current);list.innerHTML="";displayPath();if(z.key==="puter"&&typeof parent.FS.puterReady==="function"&&!parent.FS.puterReady()){list.innerHTML='<div class="empty">Puter filesystem unavailable. Puter:/ is enabled only when Puter actually provides filesystem support.</div>';return}let all=[];try{all=await parent.FS.list(z.prefix)}catch(e){showError(e.message||e);return}const entries=buildEntries(Array.isArray(all)?all:[],z);if(!entries.length){list.innerHTML='<div class="empty">No files or folders.</div>';return}entries.forEach(o=>{const row=document.createElement("div");row.className="row";const cb=document.createElement("input");cb.type="checkbox";cb.disabled=o.type==="folder";cb.checked=o.type==="file"&&selected.has(o.path);cb.onchange=()=>cb.checked?selected.add(o.path):selected.delete(o.path);const name=document.createElement("div");name.className="name"+(o.type==="folder"?" folder":"");name.textContent=o.type==="folder"?"[+] "+base(o.path)+"/":base(o.path);name.title=o.path;let clickTimer=null;name.onclick=()=>{clearTimeout(clickTimer);clickTimer=setTimeout(()=>{if(o.type==="folder"){dirs[current]=rel(o.path,z.prefix).replace(/^\/+|\/+$/g,"");refresh()}else openPath(o.path)},220)};name.ondblclick=()=>{clearTimeout(clickTimer);renameItem(o.path)};row.append(cb,name);if(o.type==="folder"){const op=document.createElement("button");op.textContent="OPEN";op.onclick=()=>{dirs[current]=rel(o.path,z.prefix).replace(/^\/+|\/+$/g,"");refresh()};row.append(op);if(z.key!=="system"){const del=document.createElement("button");del.textContent="DEL";del.onclick=async()=>{const r=await parent.FS.remove(o.path);if(r&&r.ok===false)showError(r.error||r.summary);else refresh()};row.append(del)}}else{const e=ext(o.path);if(isArchive(o.path)){const uz=document.createElement("button");uz.textContent="UNZIP";uz.onclick=()=>unzipArchive(o.path);row.append(uz);const dl=document.createElement("button");dl.textContent="DL";dl.onclick=()=>downloadBinary(o.path);row.append(dl)}if(z.key!=="system"){const ed=document.createElement("button");ed.textContent="EDIT";ed.onclick=()=>edit(o.path);row.append(ed);if(["js","ts","py","java","c","cpp","cs","php","html","css","json","xml","kt","kts","glsl"].includes(e)){const c=document.createElement("button");c.textContent="CODE";c.onclick=()=>{selected=new Set([o.path]);code()};row.append(c)}const del=document.createElement("button");del.textContent="DEL";del.onclick=async()=>{const r=await parent.FS.remove(o.path);if(r&&r.ok===false)showError(r.error||r.summary);else{selected.delete(o.path);refresh()}};row.append(del)}}list.appendChild(row)})}
async function unzipArchive(p){const z=zones.find(x=>x.key===current),defaultOut=join(dirPath(),base(p).replace(/\.(zip|7z|rar|tar|gz|tgz)$/i,"")),out=prompt("Extract archive to:",defaultOut);if(!out)return;for(const tool of ["unzip_files","unzip","extract_archive","extract_files"]){try{const r=await parent.Tools.execute(tool,{archive_path:p,input_path:p,file:p,output_path:out,destination:out,destination_path:out});if(r&&r.ok){showError("Archive extracted successfully.");refresh();return}}catch(e){}}showError("Could not unzip this archive. No compatible unzip tool is available.")}
async function importFiles(files,isFolder){if(!files||!files.length)return;const z=zones.find(x=>x.key===current),root=dirPath();let count=0;for(const f of files){try{let relPath=isFolder?(f.webkitRelativePath||f.name):f.name;relPath=norm(relPath).replace(/^\/+/,"");if(isFolder){const parts=relPath.split("/");parts.pop();let d=root;for(const part of parts){if(!part)continue;d=join(d,part);await makeDir(d)}}const target=join(root,relPath);const data=await new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=()=>reject(rd.error);rd.readAsDataURL(f)});const r=await parent.FS.write(target,data,true);if(r&&r.ok!==false)count++}catch(e){console.error(e)}}showError("Imported "+count+" file(s).");fileInput.value="";folderInput.value="";refresh()}
document.getElementById("import").onclick=()=>{const choice=prompt("IMPORT\n\nType F for Folder\nType FILE for File(s)");if(choice===null)return;if(choice.trim().toLowerCase()==="f"||choice.trim().toLowerCase()==="folder")folderInput.click();else if(choice.trim().toLowerCase()==="file"||choice.trim().toLowerCase()==="files")fileInput.click();else showError("Choose FOLDER or FILE.");};
fileInput.onchange=()=>importFiles([...fileInput.files],false);
folderInput.onchange=()=>importFiles([...folderInput.files],true);
document.getElementById("root").onclick=()=>{dirs[current]="";refresh()};
document.getElementById("up").onclick=()=>{const a=norm(dirs[current]).split("/").filter(Boolean);a.pop();dirs[current]=a.join("/");refresh()};
document.getElementById("refresh").onclick=refresh;
document.getElementById("selectAll").onclick=async()=>{const z=zones.find(x=>x.key===current);const all=await parent.FS.list(z.prefix),folder=norm(dirs[current]).replace(/^\/+|\/+$/g,"");all.forEach(p=>{let r=rel(norm(p),z.prefix);if(folder){if(!r.startsWith(folder+"/"))return;r=r.slice(folder.length+1)}if(r&&!r.includes("/"))selected.add(p)});refresh()};
document.getElementById("newFolder").onclick=async()=>{let n=prompt("New folder name:","folder1");if(n===null)return;n=n.trim();if(!n||n==="."||n===".."||/[<>:"\\|?*\/]/.test(n)){showError("Invalid folder name.");return}const p=join(dirPath(),n),r=await makeDir(p);if(!r||r.ok===false)showError(r&&r.error||"Could not create folder.");refresh()};
document.getElementById("newText").onclick=async()=>{let n=prompt("New text file name:","new.txt");if(n===null)return;n=n.trim();if(!n||n.includes("/")||n.includes("\\")){showError("Invalid file name.");return}const p=join(dirPath(),n);try{const r=await parent.FS.write(p,"",true);if(!r.ok)showError(r.error);else{refresh();edit(p)}}catch(e){showError(e.message||e)}};
document.getElementById("zip").onclick=async()=>{const fs=selectedPaths();if(!fs.length){showError("Select files first.");return}const out=prompt("ZIP output path:",join(dirPath(),"archive.zip"));if(!out)return;try{const r=await parent.Tools.execute("zip_files",{files:fs,output_path:out});if(!r.ok)showError(r.summary||r.error);else{selected.clear();refresh()}}catch(e){showError(e.message||e)}};
document.getElementById("unzip").onclick=async()=>{const fs=selectedPaths().filter(isArchive);if(!fs.length){showError("Select one or more archive files first.");return}for(const p of fs)await unzipArchive(p);selected.clear();refresh()};
box.onchange=()=>{const v=box.value.trim();if(v)parent.Tools.execute("find_files",{pattern:v}).then(r=>showError(r.files&&r.files.length?r.files.join("\n"):r.summary||r.error)).catch(e=>showError(e.message||e))};
refresh();
</script></body></html>
