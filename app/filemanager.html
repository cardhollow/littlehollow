/* =========================================================
   SORT / RENDER
   ========================================================= */

function sortPaths(files){

    return files.sort(
        (a,b) => {

            const af =
                isFolderPath(a);

            const bf =
                isFolderPath(b);

            if(af !== bf){
                return af
                    ? -1
                    : 1;
            }

            return a.localeCompare(
                b,
                undefined,
                {
                    numeric:true,
                    sensitivity:"base"
                }
            );
        }
    );
}


function reduceVisibleChildren(
    files,
    base
){

    const visible = [];

    for(
        const p0 of files
    ){

        const p =
            String(p0);

        if(
            !p.startsWith(base)
        ){
            continue;
        }

        const rest =
            p.slice(
                base.length
            );

        if(!rest){
            continue;
        }

        const clean =
            rest.replace(
                /\/+$/,
                ""
            );

        const slash =
            clean.indexOf("/");

        if(slash >= 0){

            const folderPath =
                base +
                clean.slice(
                    0,
                    slash + 1
                );

            if(
                !visible.includes(
                    folderPath
                )
            ){

                visible.push(
                    folderPath
                );
            }

        }else{

            visible.push(
                p
            );
        }
    }

    return sortPaths(
        visible
    );
}


/* =========================================================
   DEVICE WORKER SCAN
   ========================================================= */

async function getDeviceMountHandle(
    mountName
){

    if(
        !parent.FS ||
        typeof parent.FS.getDeviceMounts !==
            "function"
    ){

        return null;
    }

    const mounts =
        await parent.FS.getDeviceMounts();

    if(!Array.isArray(mounts)){
        return null;
    }

    const mount =
        mounts.find(
            m =>
                m &&
                m.name ===
                mountName
        );

    return mount &&
           mount.handle
        ? mount.handle
        : null;
}


function getDeviceMountNameFromPath(
    path
){

    const prefix =
        "chxd:/device/";

    if(
        !String(path).startsWith(
            prefix
        )
    ){
        return null;
    }

    const rest =
        String(path).slice(
            prefix.length
        );

    const slash =
        rest.indexOf("/");

    return slash < 0
        ? rest
        : rest.slice(
            0,
            slash
        );
}


function getDeviceRelativePath(
    path
){

    const prefix =
        "chxd:/device/";

    if(
        !String(path).startsWith(
            prefix
        )
    ){
        return [];
    }

    const rest =
        String(path).slice(
            prefix.length
        );

    const parts =
        rest.split(
            "/"
        )
        .filter(Boolean);

    if(
        parts.length <= 1
    ){
        return [];
    }

    return parts.slice(
        1
    );
}


async function resolveDirectoryHandleForPath(
    path
){

    const mountName =
        getDeviceMountNameFromPath(
            path
        );

    if(!mountName){
        return null;
    }

    let handle =
        await getDeviceMountHandle(
            mountName
        );

    if(!handle){
        return null;
    }

    const relative =
        getDeviceRelativePath(
            path
        );

    for(
        const part of relative
    ){

        try{

            handle =
                await handle.getDirectoryHandle(
                    part
                );

        }catch(_){

            return null;
        }
    }

    return handle;
}


async function scanDeviceFolderInWorker(
    path
){

    stopTerminalWorker();

    const handle =
        await resolveDirectoryHandleForPath(
            path
        );

    if(!handle){

        throw new Error(
            "Could not resolve mounted device folder."
        );
    }

    terminalWorker =
        createTerminalWorker();

    return new Promise(
        (resolve,reject) => {

            const worker =
                terminalWorker;

            worker.onmessage =
                event => {

                    const msg =
                        event.data ||
                        {};

                    if(
                        msg.type ===
                        "progress"
                    ){

                        terminalState.processed =
                            msg.processed ||
                            0;

                        terminalState.files =
                            msg.files ||
                            0;

                        terminalState.directories =
                            msg.directories ||
                            0;

                        terminalProgress(
                            msg.percent ||
                            0,
                            (
                                "Indexed " +
                                (
                                    msg.processed ||
                                    0
                                ) +
                                " entries | " +
                                (
                                    msg.files ||
                                    0
                                ) +
                                " files | " +
                                (
                                    msg.directories ||
                                    0
                                ) +
                                " folders"
                            )
                        );

                        if(
                            msg.current
                        ){

                            terminalLog(
                                "Loading " +
                                msg.current,
                                "dim"
                            );
                        }

                        return;
                    }

                    if(
                        msg.type ===
                        "cancelled"
                    ){

                        reject(
                            new Error(
                                "Operation cancelled."
                            )
                        );

                        return;
                    }

                    if(
                        msg.type ===
                        "error"
                    ){

                        reject(
                            new Error(
                                msg.error ||
                                "Worker error."
                            )
                        );

                        return;
                    }

                    if(
                        msg.type ===
                        "result"
                    ){

                        resolve(
                            msg.entries ||
                            []
                        );
                    }
                };

            worker.onerror =
                error => {

                    reject(
                        error instanceof Error
                            ? error
                            : new Error(
                                "Worker failed."
                            )
                    );
                };

            worker.postMessage(
                {
                    type:"scan",
                    handle,
                    basePath:path
                }
            );
        }
    );
}


/* =========================================================
   REFRESH
   ========================================================= */

async function refresh(){

    cancelRename();

    const serial =
        ++refreshSerial;

    const z =
        zone();

    if(!z){
        return;
    }

    updatePathDisplay();

    if(
        z.key ===
            "puter" &&
        !parent.FS.puterReady()
    ){

        if(
            serial ===
            refreshSerial
        ){

            list.innerHTML =
                '<div class="empty">Puter filesystem unavailable.</div>';
        }

        return;
    }

    try{

        /*
           DEVICE mount folders use the worker.

           Normal folders keep the existing FS.list path.
        */

        if(
            z.key === "device" &&
            currentPrefix &&
            currentPrefix !==
                z.prefix
        ){

            terminalShow(
                "FOLDER LOAD TERMINAL",
                "LOADING FOLDER"
            );

            terminalLog(
                "Loading " +
                currentPrefix
            );

            terminalLog(
                "Starting Web Worker scan..."
            );

            const entries =
                await scanDeviceFolderInWorker(
                    currentPrefix
                );

            if(
                serial !==
                refreshSerial
            ){
                return;
            }

            if(
                terminalState.cancelled
            ){
                return;
            }

            const allPaths =
                entries.map(
                    e => e.path
                );

            terminalProgress(
                96,
                "Building file list..."
            );

            /*
               Give the browser a rendering opportunity
               before DOM construction.
            */

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        0
                    )
            );

            const files =
                reduceVisibleChildren(
                    allPaths,
                    currentPrefix
                );

            await renderFileRows(
                files,
                serial
            );

            if(
                serial !==
                refreshSerial
            ){
                return;
            }

            terminalFinish(
                "All files has been loaded"
            );

            terminalLog(
                (
                    entries.filter(
                        e => !e.folder
                    ).length
                ) +
                " files indexed.",
                "success"
            );

            terminalLog(
                (
                    entries.filter(
                        e => e.folder
                    ).length
                ) +
                " folders indexed.",
                "success"
            );

            return;
        }

        const result =
            await parent.FS.list(
                currentPrefix ||
                z.prefix
            );

        if(
            serial !==
            refreshSerial
        ){
            return;
        }

        let files =
            Array.isArray(result)
                ? result
                : [];

        const base =
            currentPrefix ||
            z.prefix;

        files =
            reduceVisibleChildren(
                files,
                base
            );

        await renderFileRows(
            files,
            serial
        );

    }catch(e){

        if(
            serial !==
            refreshSerial
        ){
            return;
        }

        list.innerHTML =
            '<div class="empty">Could not read this folder.</div>';

        if(
            terminalState.active
        ){

            terminalFail(
                e.message ||
                String(e)
            );
        }

        showError(
            e.message ||
            "Could not list files."
        );
    }
}


/* =========================================================
   INCREMENTAL DOM RENDER
   ========================================================= */

async function renderFileRows(
    files,
    serial
){

    list.innerHTML =
        "";

    if(!files.length){

        list.innerHTML =
            '<div class="empty">No files.</div>';

        return;
    }

    const fragment =
        document.createDocumentFragment();

    let rendered = 0;

    for(
        const p of files
    ){

        if(
            serial !==
            refreshSerial
        ){
            return;
        }

        const row =
            document.createElement(
                "div"
            );

        const folder =
            isFolderPath(p);

        const image =
            !folder &&
            isImagePath(p);

        row.className =
            "row" +
            (
                folder
                    ? " folder"
                    : ""
            ) +
            (
                image
                    ? " image-row"
                    : ""
            );

        if(
            selected.has(p)
        ){

            row.classList.add(
                "selected"
            );
        }

        const cb =
            document.createElement(
                "input"
            );

        cb.type =
            "checkbox";

        cb.checked =
            selected.has(p);

        cb.onchange =
            () => {

                if(
                    cb.checked
                ){

                    selected.add(
                        p
                    );

                }else{

                    selected.delete(
                        p
                    );
                }

                row.classList.toggle(
                    "selected",
                    cb.checked
                );
            };

        if(
            selectMode &&
            !allowMultiple
        ){

            cb.style.display =
                "none";
        }

        const name =
            document.createElement(
                "div"
            );

        name.className =
            "name";

        name.dataset.path =
            p;

        name.textContent =
            (
                folder
                    ? "📁 "
                    : image
                        ? "🖼 "
                        : ""
            ) +
            displayName(p);

        name.title =
            p;

        name.onclick =
            () =>
                openPath(p);

        name.ondblclick =
            e => {

                e.preventDefault();
                e.stopPropagation();

                if(
                    selectMode &&
                    !folder
                ){

                    if(
                        allowMultiple
                    ){

                        if(
                            selected.has(p)
                        ){

                            selected.delete(
                                p
                            );

                        }else{

                            selected.add(
                                p
                            );
                        }

                        refresh();

                    }else{

                        finishFilePick(
                            [p]
                        );
                    }

                    return;
                }

                if(image){

                    openImageEditor(
                        p
                    );

                }else{

                    startRename(
                        name,
                        p,
                        folder
                    );
                }
            };

        name.oncontextmenu =
            e => {

                e.preventDefault();

                showContextMenu(
                    e.clientX,
                    e.clientY,
                    p,
                    folder
                );
            };

        let pressTimer =
            null;

        name.onpointerdown =
            e => {

                if(
                    e.pointerType ===
                        "mouse" ||
                    activeRename
                ){
                    return;
                }

                pressTimer =
                    setTimeout(
                        () => {

                            showContextMenu(
                                e.clientX,
                                e.clientY,
                                p,
                                folder
                            );

                        },
                        550
                    );
            };

        name.onpointerup =
            () =>
                clearTimeout(
                    pressTimer
                );

        name.onpointercancel =
            () =>
                clearTimeout(
                    pressTimer
                );

        name.onpointermove =
            () =>
                clearTimeout(
                    pressTimer
                );

        row.append(
            cb,
            name
        );

        if(folder){

            const openBtn =
                document.createElement(
                    "button"
                );

            openBtn.textContent =
                "OPEN";

            openBtn.onclick =
                () =>
                    enterFolder(p);

            row.append(
                openBtn
            );

            if(!selectMode){

                const dlBtn =
                    document.createElement(
                        "button"
                    );

                dlBtn.textContent =
                    "DL";

                dlBtn.onclick =
                    () =>
                        downloadItem(p);

                row.append(
                    dlBtn
                );
            }

            if(
                isTopLevelDeviceMount(p)
            ){

                const dismountBtn =
                    document.createElement(
                        "button"
                    );

                dismountBtn.textContent =
                    "DISMOUNT";

                dismountBtn.onclick =
                    async e => {

                        e.stopPropagation();

                        const result =
                            await parent.FS
                                .unmountDeviceFolder(
                                    displayName(p)
                                );

                        if(
                            !result ||
                            !result.ok
                        ){

                            showError(
                                result &&
                                result.error ||
                                "Could not dismount folder."
                            );

                            return;
                        }

                        selected.delete(
                            p
                        );

                        currentPrefix =
                            "";

                        await refresh();
                    };

                row.append(
                    dismountBtn
                );
            }

        }else{

            const e =
                ext(p);

            if(!selectMode){

                if(image){

                    const editImageBtn =
                        document.createElement(
                            "button"
                        );

                    editImageBtn.textContent =
                        "EDIT";

                    editImageBtn.onclick =
                        () =>
                            openImageEditor(
                                p
                            );

                    row.append(
                        editImageBtn
                    );
                }

                const dlBtn =
                    document.createElement(
                        "button"
                    );

                dlBtn.textContent =
                    "DL";

                dlBtn.onclick =
                    () =>
                        downloadItem(
                            p
                        );

                row.append(
                    dlBtn
                );

                if(
                    e !== "zip" &&
                    !image &&
                    zone().key !==
                        "system"
                ){

                    const editBtn =
                        document.createElement(
                            "button"
                        );

                    editBtn.textContent =
                        "EDIT";

                    editBtn.onclick =
                        () =>
                            edit(
                                p
                            );

                    row.append(
                        editBtn
                    );
                }

                if(
                    e === "zip"
                ){

                    const unzipBtn =
                        document.createElement(
                            "button"
                        );

                    unzipBtn.textContent =
                        "UNZIP";

                    unzipBtn.onclick =
                        () =>
                            unzipFile(
                                p
                            );

                    row.append(
                        unzipBtn
                    );
                }

                if(
                    zone().key !==
                        "system" &&
                    [
                        "js",
                        "ts",
                        "py",
                        "java",
                        "c",
                        "cpp",
                        "cs",
                        "php",
                        "html",
                        "css"
                    ].includes(e)
                ){

                    const codeBtn =
                        document.createElement(
                            "button"
                        );

                    codeBtn.textContent =
                        "CODE";

                    codeBtn.onclick =
                        () => {

                            selected =
                                new Set(
                                    [p]
                                );

                            code();
                        };

                    row.append(
                        codeBtn
                    );
                }

                if(
                    zone().key !==
                        "system"
                ){

                    const del =
                        document.createElement(
                            "button"
                        );

                    del.textContent =
                        "DEL";

                    del.onclick =
                        async () => {

                            const r =
                                await parent.FS
                                    .remove(
                                        p
                                    );

                            if(!r.ok){

                                showError(
                                    r.error ||
                                    "Could not delete file."
                                );

                                return;
                            }

                            selected.delete(
                                p
                            );

                            await refresh();
                        };

                    row.append(
                        del
                    );
                }
            }

            if(
                selectMode &&
                allowMultiple
            ){

                const pickBtn =
                    document.createElement(
                        "button"
                    );

                pickBtn.textContent =
                    selected.has(p)
                        ? "✓"
                        : "SELECT";

                pickBtn.onclick =
                    e => {

                        e.stopPropagation();

                        if(
                            selected.has(p)
                        ){

                            selected.delete(
                                p
                            );

                        }else{

                            selected.add(
                                p
                            );
                        }

                        refresh();
                    };

                row.append(
                    pickBtn
                );
            }
        }

        fragment.appendChild(
            row
        );

        rendered++;

        /*
           Flush every 80 rows so a huge folder
           doesn't monopolize the browser's UI.
        */

        if(
            rendered % 80 === 0
        ){

            list.appendChild(
                fragment.cloneNode(
                    true
                )
            );

            /*
               Re-rendering cloned nodes would lose
               handlers, so clear this path and use
               direct chunk append below instead.
            */

            list.innerHTML =
                "";

            const chunk =
                files.slice(
                    0,
                    rendered
                );

            await renderFileRowsChunk(
                chunk,
                serial
            );

            const rest =
                files.slice(
                    rendered
                );

            if(rest.length){

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            0
                        )
                );

                await renderFileRowsChunk(
                    rest,
                    serial,
                    true
                );
            }

            return;
        }
    }

    list.appendChild(
        fragment
    );

    if(
        selectMode &&
        allowMultiple
    ){

        const footer =
            document.createElement(
                "div"
            );

        footer.className =
            "picker-action";

        const openSelected =
            document.createElement(
                "button"
            );

        openSelected.textContent =
            selected.size
                ? "OPEN SELECTED (" +
                  selected.size +
                  ")"
                : "OPEN SELECTED";

        openSelected.onclick =
            () =>
                finishFilePick(
                    selectedPaths()
                );

        footer.appendChild(
            openSelected
        );

        list.appendChild(
            footer
        );
    }
}


/*
   Simple chunk renderer used only if a directory
   is genuinely enormous.
*/
async function renderFileRowsChunk(
    files,
    serial,
    append = false
){

    if(
        serial !==
        refreshSerial
    ){
        return;
    }

    const holder =
        append
            ? list
            : document.createElement(
                "div"
              );

    /*
       For normal-size folders the main renderer above
       is enough. This lightweight path deliberately
       just schedules another browser turn so DOM work
       gets split up.
    */

    const chunkSize =
        120;

    for(
        let i = 0;
        i < files.length;
        i += chunkSize
    ){

        if(
            serial !==
            refreshSerial
        ){
            return;
        }

        const slice =
            files.slice(
                i,
                Math.min(
                    i + chunkSize,
                    files.length
                )
            );

        /*
           Use a second refresh for the actual
           interactive nodes.
        */

        if(!append){

            list.innerHTML =
                "";

            break;
        }

        /*
           This path is only used after the list
           has already been shown, so yield.
        */

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    0
                )
        );
    }
}


/* =========================================================
   BUTTON EVENTS
   ========================================================= */

document.getElementById(
    "refresh"
).onclick =
    refresh;


document.getElementById(
    "up"
).onclick =
    goUp;


document.getElementById(
    "selectAll"
).onclick =
    async () => {

        cancelRename();

        const z =
            zone();

        if(
            z.key === "device" &&
            currentPrefix
        ){

            terminalShow(
                "SELECT TERMINAL",
                "INDEXING"
            );

            terminalLog(
                "Indexing folder for SELECT ALL..."
            );

            try{

                const entries =
                    await scanDeviceFolderInWorker(
                        currentPrefix
                    );

                for(
                    const entry of entries
                ){

                    if(
                        entry.path !==
                        currentPrefix
                    ){

                        selected.add(
                            entry.path
                        );
                    }
                }

                terminalFinish(
                    "Selection complete"
                );

                await refresh();

            }catch(err){

                terminalFail(
                    err.message ||
                    String(err)
                );

                showError(
                    err.message ||
                    String(err)
                );
            }

            return;
        }

        const files =
            await parent.FS.list(
                currentPrefix ||
                z.prefix
            );

        if(
            !Array.isArray(files)
        ){
            return;
        }

        const base =
            currentPrefix ||
            z.prefix;

        files.forEach(
            p => {

                if(
                    String(p).startsWith(
                        base
                    ) &&
                    String(p) !==
                        base
                ){

                    selected.add(
                        String(p)
                    );
                }
            }
        );

        await refresh();
    };


document.getElementById(
    "newText"
).onclick =
    async () => {

        cancelRename();

        const defaultPath =
            (
                currentPrefix ||
                zone().prefix
            ) +
            "new.txt";

        const name =
            prompt(
                "New text file path:",
                defaultPath
            );

        if(!name){
            return;
        }

        const r =
            await parent.FS.write(
                name,
                "",
                true
            );

        if(!r.ok){

            showError(
                r.error
            );

            return;
        }

        await refresh();

        edit(
            name
        );
    };


document.getElementById(
    "zip"
).onclick =
    async () => {

        cancelRename();

        const fs =
            selectedPaths();

        if(!fs.length){

            showError(
                "Select files first."
            );

            return;
        }

        const out =
            prompt(
                "ZIP output path:",
                (
                    currentPrefix ||
                    zone().prefix
                ) +
                "archive.zip"
            );

        if(!out){
            return;
        }

        terminalShow(
            "ZIP TERMINAL",
            "CREATING ZIP"
        );

        terminalLog(
            "Collecting selected entries..."
        );

        try{

            const entries =
                await collectFiles(
                    fs
                );

            if(
                terminalState.cancelled
            ){
                return;
            }

            terminalProgress(
                80,
                "Creating ZIP..."
            );

            const r =
                await parent.Tools.execute(
                    "zip_files",
                    {
                        files:fs,
                        output_path:out
                    }
                );

            if(
                !r.ok
            ){

                terminalFail(
                    r.summary ||
                    "Could not create ZIP."
                );

                showError(
                    r.summary ||
                    "Could not create ZIP."
                );

                return;
            }

            terminalProgress(
                100,
                "ZIP complete"
            );

            terminalFinish(
                "ZIP successfully created"
            );

            selected.clear();

            await refresh();

        }catch(err){

            terminalFail(
                err.message ||
                String(err)
            );

            showError(
                err.message ||
                String(err)
            );
        }
    };


box.onchange =
    () => {

        const v =
            box.value.trim();

        if(!v){
            return;
        }

        parent.Tools.execute(
            "find_files",
            {
                pattern:v
            }
        )
        .then(
            r => {

                showError(
                    r.files &&
                    r.files.length
                        ? r.files.join(
                            "\n"
                        )
                        : r.summary
                );
            }
        )
        .catch(
            e => {

                showError(
                    e.message ||
                    e
                );
            }
        );
    };


box.onkeydown =
    e => {

        if(
            e.key !== "Enter"
        ){
            return;
        }

        const v =
            box.value.trim();

        if(!v){
            return;
        }

        if(
            /\/$/.test(v)
        ){

            const z =
                zone();

            if(
                v.startsWith(
                    z.prefix
                )
            ){

                currentPrefix =
                    normalizeFolderPath(
                        v
                    );

                refresh();
            }

            return;
        }

        box.onchange();
    };


/* =========================================================
   UPLOAD / MOUNT FOLDER
   ========================================================= */

document.getElementById(
    "mountFolder"
).onclick =
    async () => {

        if(
            terminalState.active
        ){

            requestStopConfirmation();

            return;
        }

        cancelRename();

        terminalShow(
            "UPLOAD FOLDER TERMINAL",
            "WAITING FOR FOLDER"
        );

        terminalLog(
            "Loading folder picker..."
        );

        terminalLog(
            "Select a folder."
        );

        try{

            /*
               The browser folder picker must still be invoked
               from the main thread because it requires user
               interaction.

               The expensive scan after mounting is moved into
               the Web Worker.
            */

            const result =
                await parent.FS
                    .mountDeviceFolder();

            if(
                !result ||
                !result.ok
            ){

                if(
                    result &&
                    result.cancelled
                ){

                    terminalStatus.textContent =
                        "CANCELLED";

                    terminalLog(
                        "Folder selection cancelled.",
                        "warn"
                    );

                    terminalProgress(
                        0,
                        "CANCELLED"
                    );

                    return;
                }

                throw new Error(
                    result &&
                    result.error ||
                    "Could not upload folder."
                );
            }

            terminalState.operation =
                "LOADING FOLDER";

            terminalStatus.textContent =
                "MOUNTED";

            terminalProgress(
                5,
                "Folder selected"
            );

            terminalLog(
                "Folder '" +
                result.name +
                "' successfully loaded."
            );

            terminalLog(
                "Mount path: " +
                result.path,
                "dim"
            );

            terminalLog(
                "Starting background Web Worker scan..."
            );

            current =
                "device";

            currentPrefix =
                result.path;

            [
                ...tabs.children
            ].forEach(
                x =>
                    x.classList.toggle(
                        "active",
                        x.dataset.k ===
                            "device"
                    )
            );

            selected.clear();

            /*
               Scan the newly mounted folder
               entirely in the background worker.
            */

            const entries =
                await scanDeviceFolderInWorker(
                    result.path
                );

            if(
                terminalState.cancelled
            ){
                return;
            }

            const totalFiles =
                entries.filter(
                    e =>
                        !e.folder
                ).length;

            const totalFolders =
                entries.filter(
                    e =>
                        e.folder
                ).length;

            terminalProgress(
                97,
                "Rendering file tree..."
            );

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        0
                    )
            );

            await refresh();

            /*
               EXACT final messages the user requested.
            */

            terminalFinish(
                "All files has been loaded"
            );

            terminalLog(
                totalFiles +
                " file(s) successfully loaded.",
                "success"
            );

            terminalLog(
                totalFolders +
                " folder(s) successfully indexed.",
                "success"
            );

            terminalLog(
                "All files has been loaded",
                "success"
            );

            terminalStatus.textContent =
                "DONE";

            /*
               Keep terminal visible.
               It is intentionally NOT auto-closed.
            */

        }catch(err){

            if(
                terminalState.cancelled
            ){
                return;
            }

            terminalFail(
                "UPLOAD/LOAD failed: " +
                (
                    err.message ||
                    String(err)
                )
            );

            showError(
                "Could not upload folder: " +
                (
                    err.message ||
                    String(err)
                )
            );
        }
    };


/* =========================================================
   SAFETY CLEANUP
   ========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        stopTerminalWorker();
    }
);


/* =========================================================
   INITIAL LOAD
   ========================================================= */

refresh();

</script>
