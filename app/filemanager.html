<!DOCTYPE html>    
<html lang="en"><head><meta charset="UTF-8"><title>File Manager</title>    
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:monospace}html,body{width:100%;height:100%;background:#000d0d;color:#00FFFF}.wrap{display:flex;flex-direction:column;height:100%}.bar{display:flex;gap:5px;padding:6px;border-bottom:1px solid #00FFFF;flex-wrap:wrap}.bar button,.bar input{border:1px solid #00FFFF;background:transparent;color:#00FFFF;padding:6px 8px;font-family:monospace;font-size:10px}.bar input{flex:1 1 150px}.bar button:active,.row button:active{background:#00FFFF;color:#000}.tabs{display:flex;border-bottom:1px solid #00FFFF}.tabs button{flex:1;border:0;border-right:1px solid #00FFFF;background:transparent;color:#00FFFF;padding:7px 3px;cursor:pointer;font:11px monospace}.tabs button.active{background:rgba(0,255,255,.15)}.list{flex:1;overflow:auto}.row{display:flex;align-items:center;gap:5px;padding:7px 8px;border-bottom:1px solid rgba(0,255,255,.22);font-size:11px}.name{flex:1;min-width:0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.name em{opacity:.5;font-style:normal}.row button{border:1px solid #00FFFF;background:transparent;color:#00FFFF;font:10px monospace;padding:3px 5px;cursor:pointer}.row input{accent-color:#00FFFF}.empty{padding:16px;opacity:.6;font-size:12px}.hint{padding:4px 8px;font-size:10px;opacity:.55;border-bottom:1px solid rgba(0,255,255,.2)}</style>    
</head><body><div class="wrap"><div class="bar"><input id="pathBox" placeholder="path or wildcard"><button id="refresh">REFRESH</button><button id="newText">NEW TEXT</button><button id="zip">ZIP SELECTED</button><button id="selectAll">SELECT ALL</button></div><div class="tabs" id="tabs"></div><div class="hint" id="hint">Tap a file to open it. EDIT opens Notepad. CODE opens OneCompiler.</div><div class="hint" id="error" style="display:none"></div><div class="list" id="list"></div></div>    
<script>    
const zones=[{key:"local",label:"LOCAL",prefix:"chxd:/local/"},{key:"session",label:"SESSION",prefix:"chxd:/session/"},{key:"indexdb",label:"INDEXDB",prefix:"chxd:/indexdb/"},{key:"puter",label:"PUTER",prefix:"puter:/"},{key:"system",label:"SYSTEM",prefix:"chxd:/system/"}];    
let current="local",selected=new Set();const params=new URLSearchParams(location.search),selectMode=params.get("select")==="1";    
const tabs=document.getElementById("tabs"),list=document.getElementById("list"),box=document.getElementById("pathBox"),hint=document.getElementById("hint"),errorBox=document.getElementById("error");    
function showError(s){errorBox.textContent=String(s||"Unknown error");errorBox.style.display="block";setTimeout(()=>{errorBox.style.display="none"},4500)}    
if(selectMode)hint.textContent="SELECT MODE: choose a file to return it to the calling app. Multiple files can be selected for OneCompiler.";    
zones.forEach(z=>{const b=document.createElement("button");b.textContent=z.label;b.dataset.k=z.key;if(z.key===current)b.classList.add("active");b.onclick=()=>{current=z.key;[...tabs.children].forEach(x=>x.classList.toggle("active",x.dataset.k===current));refresh()};tabs.appendChild(b)});    
function ext(p){return(p.split("?")[0].split(".").pop()||"").toLowerCase()}    
function selectedPaths(){return [...selected]}    
async function openPath(p){    
 if(selectMode){parent.postMessage({type:"LH_FILE_SELECTED",path:p},"*");return}    
 const e=ext(p); if(e==="zip"){await downloadBinary(p);return}    
 try{const r=await parent.Tools.execute("open_file",{path:p});if(r&&!r.ok)showError(r.summary||r.error||"Could not open file.")}catch(err){showError(err.message||err)}    
}    
async function edit(p){try{const r=await parent.Tools.execute("open_notepad",{path:p});if(r&&!r.ok)showError(r.summary||r.error||"Could not open Notepad.")}catch(err){showError(err.message||err)}}    
async function code(){const paths=selectedPaths();if(!paths.length){return}const files=[];for(const p of paths){const r=await parent.FS.read(p);if(r.ok)files.push({name:p.split("/").pop(),content:r.content})}if(!files.length)return;parent.Apps.openOneCompiler({language:ext(files[0].name)==="py"?"python":"javascript",files,run:false})}    
function downloadData(data,name){const a=document.createElement("a");a.href=data;a.download=name;a.click()}    
async function downloadBinary(p){const r=await parent.FS.read(p);if(!r.ok){showError(r.error);return false}if(!/^data:/i.test(r.content)){showError("This ZIP does not contain downloadable binary data.");return false}downloadData(r.content,p.split("/").pop());return true}    
async function refresh(){const z=zones.find(x=>x.key===current),files=await parent.FS.list(z.prefix);list.innerHTML="";if(z.key==="puter"&&!parent.FS.puterReady()){list.innerHTML='<div class="empty">Puter filesystem unavailable. Puter:/ is enabled only when Puter actually provides filesystem support.</div>';return}if(!files.length){list.innerHTML='<div class="empty">No files.</div>';return}files.sort();files.forEach(p=>{const row=document.createElement("div");row.className="row";const cb=document.createElement("input");cb.type="checkbox";cb.checked=selected.has(p);cb.onchange=()=>cb.checked?selected.add(p):selected.delete(p);const name=document.createElement("div");name.className="name";name.textContent=p.replace(z.prefix,"");name.title=p;name.onclick=()=>openPath(p);row.append(cb,name);const e=ext(p);if(e==="zip") {const dl=document.createElement("button");dl.textContent="DL";dl.onclick=()=>downloadBinary(p);row.append(dl)}else if(z.key!=="system"){const editBtn=document.createElement("button");editBtn.textContent="EDIT";editBtn.onclick=()=>edit(p);row.append(editBtn);if(["js","ts","py","java","c","cpp","cs","php","html","css"].includes(e)){const codeBtn=document.createElement("button");codeBtn.textContent="CODE";codeBtn.onclick=()=>{selected=new Set([p]);code()};row.append(codeBtn)}const del=document.createElement("button");del.textContent="DEL";del.onclick=async()=>{await parent.FS.remove(p);selected.delete(p);refresh()};row.append(del)}list.appendChild(row)})}    
document.getElementById("refresh").onclick=refresh;    
document.getElementById("selectAll").onclick=async()=>{const z=zones.find(x=>x.key===current);const files=await parent.FS.list(z.prefix);files.forEach(p=>selected.add(p));refresh()};    
document.getElementById("newText").onclick=async()=>{const name=prompt("New text file path:","chxd:/local/new.txt");if(!name)return;const r=await parent.FS.write(name,"",true);if(!r.ok)showError(r.error);refresh();if(r.ok)edit(name)};    
document.getElementById("zip").onclick=async()=>{const fs=selectedPaths();if(!fs.length){showError("Select files first.");return}const out=prompt("ZIP output path:","chxd:/local/archive.zip");if(!out)return;const r=await parent.Tools.execute("zip_files",{files:fs,output_path:out});if(!r.ok)showError(r.summary);selected.clear();refresh()};    
box.onchange=()=>{const v=box.value.trim();if(v){parent.Tools.execute("find_files",{pattern:v}).then(r=>{showError(r.files&&r.files.length?r.files.join("\n"):r.summary)}).catch(e=>showError(e.message||e))}};    
refresh();    
</script></body></html>
