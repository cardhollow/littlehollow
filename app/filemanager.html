<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>File Manager</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:monospace;
}

html,body{
width:100%;
height:100%;
background:#000d0d;
color:#00FFFF;
}

body{
overflow:hidden;
}

.wrap{
display:flex;
flex-direction:column;
height:100%;
}

.bar{
display:flex;
gap:5px;
padding:6px;
border-bottom:1px solid #00FFFF;
flex-wrap:wrap;
}

.bar button,
.bar input{
border:1px solid #00FFFF;
background:transparent;
color:#00FFFF;
padding:6px 8px;
font:10px monospace;
}

.bar input{
flex:1 1 150px;
}

.bar button:active,
.row button:active,
.ctx button:active{
background:#00FFFF;
color:#000;
}

.tabs{
display:flex;
border-bottom:1px solid #00FFFF;
overflow-x:auto;
}

.tabs button{
flex:0 0 auto;
border:0;
border-right:1px solid #00FFFF;
background:transparent;
color:#00FFFF;
padding:7px 10px;
cursor:pointer;
font:11px monospace;
}

.tabs button.active{
background:rgba(0,255,255,.15);
}

.pathbar{
display:flex;
padding:5px 6px;
border-bottom:1px solid rgba(0,255,255,.25);
}

.current-path{
flex:1;
min-width:0;
overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;
font-size:10px;
opacity:.8;
}

.hint{
padding:4px 8px;
font-size:10px;
opacity:.55;
border-bottom:1px solid rgba(0,255,255,.2);
}

#error{
color:#ff6666;
white-space:pre-wrap;
}

.list{
flex:1;
overflow:auto;
-webkit-overflow-scrolling:touch;
}

.row{
display:flex;
align-items:center;
gap:5px;
padding:7px 8px;
border-bottom:1px solid rgba(0,255,255,.22);
font-size:11px;
}

.row.folder{
background:rgba(0,255,255,.035);
}

.row.selected{
background:rgba(0,255,255,.1);
}

.name{
flex:1;
min-width:0;
cursor:pointer;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.row.folder .name{
font-weight:bold;
}

.rename-input{
flex:1;
min-width:0;
width:100%;
border:1px solid #00FFFF;
outline:none;
background:#001919;
color:#00FFFF;
padding:3px 5px;
font:11px monospace;
}

.row button{
border:1px solid #00FFFF;
background:transparent;
color:#00FFFF;
font:10px monospace;
padding:3px 5px;
cursor:pointer;
}

.row input{
accent-color:#00FFFF;
}

.empty{
padding:16px;
opacity:.6;
font-size:12px;
}

.ctx{
position:fixed;
z-index:999999;
min-width:150px;
max-width:240px;
border:1px solid #00FFFF;
background:#000d0d;
box-shadow:0 0 0 1px rgba(0,255,255,.15);
padding:4px;
display:none;
}

.ctx button{
display:block;
width:100%;
text-align:left;
border:0;
border-bottom:1px solid rgba(0,255,255,.2);
background:transparent;
color:#00FFFF;
padding:7px 8px;
font:10px monospace;
}

.ctx button:last-child{
border-bottom:0;
}

.ctx .danger{
color:#ff6666;
}

.ctx .zip-action{
color:#66FFFF;
}

.ctx .edit-action{
color:#7fffff;
font-weight:bold;
}

.image-row{
border-left:2px solid rgba(0,255,255,.35);
}

.picker-action{
border-top:1px solid #00FFFF;
padding:8px;
}

.picker-action button{
width:100%;
border:1px solid #00FFFF;
background:transparent;
color:#00FFFF;
padding:8px;
font:11px monospace;
}

.picker-action button:active{
background:#00FFFF;
color:#000;
}

/* =========================================================
   TERMINAL
   ========================================================= */

#lh-terminal{
position:fixed;
inset:0;
z-index:2000000;
display:none;
background:rgba(0,0,0,.84);
align-items:center;
justify-content:center;
padding:10px;
}

#lh-terminal-window{
width:min(760px,96vw);
height:min(600px,92vh);
display:flex;
flex-direction:column;
border:1px solid #00FFFF;
background:#000808;
box-shadow:
0 0 0 1px rgba(0,255,255,.15),
0 0 25px rgba(0,255,255,.08);
}

.lh-terminal-titlebar{
height:32px;
min-height:32px;
display:flex;
align-items:center;
padding:0 9px;
border-bottom:1px solid #00FFFF;
background:#001414;
font-size:11px;
font-weight:bold;
letter-spacing:.4px;
}

.lh-terminal-status{
margin-left:auto;
opacity:.7;
font-size:10px;
}

#lh-terminal-output{
flex:1;
overflow:auto;
padding:10px;
font-size:11px;
line-height:1.45;
white-space:pre-wrap;
word-break:break-word;
-webkit-overflow-scrolling:touch;
}

.lh-terminal-line{
display:block;
margin-bottom:3px;
}

.lh-terminal-line.dim{
opacity:.62;
}

.lh-terminal-line.success{
color:#00FFFF;
}

.lh-terminal-line.warn{
color:#ffff66;
}

.lh-terminal-line.error{
color:#ff6666;
}

.lh-terminal-progress{
padding:8px 10px;
border-top:1px solid rgba(0,255,255,.28);
font-size:10px;
background:#000b0b;
}

.lh-progress-track{
height:10px;
margin-top:5px;
border:1px solid #00FFFF;
background:#000404;
overflow:hidden;
}

#lh-progress-fill{
height:100%;
width:0%;
background:#00FFFF;
transition:width .08s linear;
}

#lh-progress-text{
margin-top:5px;
white-space:pre-wrap;
}

.lh-terminal-footer{
height:30px;
min-height:30px;
display:flex;
align-items:center;
padding:0 10px;
border-top:1px solid rgba(0,255,255,.25);
font-size:9px;
opacity:.62;
}

#lh-confirm-terminal{
position:fixed;
z-index:2100000;
display:none;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:min(510px,92vw);
border:1px solid #00FFFF;
background:#000909;
box-shadow:
0 0 0 1px rgba(0,255,255,.12),
0 0 40px rgba(0,255,255,.1);
}

.lh-confirm-title{
padding:9px;
border-bottom:1px solid #00FFFF;
font-weight:bold;
font-size:11px;
background:#001414;
}

.lh-confirm-body{
padding:14px;
font-size:11px;
line-height:1.5;
white-space:pre-wrap;
}

.lh-confirm-actions{
display:flex;
gap:6px;
padding:9px;
border-top:1px solid rgba(0,255,255,.25);
}

.lh-confirm-actions button{
flex:1;
border:1px solid #00FFFF;
background:transparent;
color:#00FFFF;
font:11px monospace;
padding:8px;
}

.lh-confirm-actions button:active{
background:#00FFFF;
color:#000;
}

.lh-confirm-actions .stop{
color:#ff6666;
border-color:#ff6666;
}

body.lh-terminal-active .wrap{
filter:brightness(.75);
}
</style>
</head>

<body>

<div class="wrap">

<div class="bar">
<input id="pathBox" placeholder="path or wildcard">
<button id="refresh">REFRESH</button>
<button id="up">UP</button>
<button id="newText">NEW TEXT</button>
<button id="mountFolder">UPLOAD FOLDER</button>
<button id="zip">ZIP SELECTED</button>
<button id="selectAll">SELECT ALL</button>
</div>

<div class="tabs" id="tabs"></div>

<div class="pathbar">
<div class="current-path" id="currentPath"></div>
</div>

<div class="hint" id="hint">
Tap a file to open it. Tap a folder to enter it. Double-tap a name to rename.
Long-press/right-click for more actions.
</div>

<div class="hint" id="error" style="display:none"></div>

<div class="list" id="list"></div>

</div>

<div class="ctx" id="contextMenu"></div>


<!-- =========================================================
     NON-CLOSABLE TERMINAL
     ========================================================= -->

<div id="lh-terminal">
<div id="lh-terminal-window">

<div class="lh-terminal-titlebar">
FILE OPERATION TERMINAL
<div class="lh-terminal-status" id="lh-terminal-status">
IDLE
</div>
</div>

<div id="lh-terminal-output"></div>

<div class="lh-terminal-progress">

<div id="lh-progress-label">
PROGRESS
</div>

<div class="lh-progress-track">
<div id="lh-progress-fill"></div>
</div>

<div id="lh-progress-text">
0%
</div>

</div>

<div class="lh-terminal-footer">
CTRL+C = REQUEST STOP
</div>

</div>
</div>


<!-- =========================================================
     CTRL+C CONFIRMATION TERMINAL
     ========================================================= -->

<div id="lh-confirm-terminal">

<div class="lh-confirm-title">
LITTLE HOLLOW // TERMINAL CONTROL
</div>

<div class="lh-confirm-body" id="lh-confirm-body">
A file operation is currently running.

Stop the current operation?
</div>

<div class="lh-confirm-actions">

<button id="lh-confirm-stop" class="stop">
[Y] STOP OPERATION
</button>

<button id="lh-confirm-continue">
[N] CONTINUE
</button>

</div>

</div>


<script>
"use strict";

/* =========================================================
   TERMINAL WORKER
   ========================================================= */

const TERMINAL_WORKER_SOURCE = `
"use strict";

let cancelled = false;

function sleep(ms){
    return new Promise(resolve => setTimeout(resolve,ms));
}

function send(type,data){
    self.postMessage(
        Object.assign(
            {
                type
            },
            data || {}
        )
    );
}

function pathJoin(base,name){
    return String(base).replace(/\\/+$/,"") + "/" + name;
}

async function scanDirectory(handle,basePath){

    const entries = [];
    const queue = [
        {
            handle: handle,
            path: String(basePath || "").replace(/\\/+$/,"") + "/"
        }
    ];

    let processed = 0;
    let directories = 0;
    let files = 0;

    while(queue.length){

        if(cancelled){
            send("cancelled");
            return;
        }

        const job = queue.shift();

        try{

            for await(const item of job.handle.values()){

                if(cancelled){
                    send("cancelled");
                    return;
                }

                const child = pathJoin(
                    job.path,
                    item.name
                );

                if(item.kind === "directory"){

                    entries.push({
                        path: child + "/",
                        folder: true,
                        name: item.name
                    });

                    queue.push({
                        handle: item,
                        path: child + "/"
                    });

                    directories++;

                }else{

                    entries.push({
                        path: child,
                        folder: false,
                        name: item.name
                    });

                    files++;
                }

                processed++;

                if(
                    processed % 16 === 0 ||
                    queue.length === 0
                ){

                    /*
                       This percentage is intentionally an
                       indexing/loading percentage rather than
                       a fake "bytes copied" percentage.

                       It rises to 95 while work is discovered,
                       then becomes 100 only when scanning finishes.
                    */

                    const estimate =
                        Math.min(
                            95,
                            Math.max(
                                1,
                                Math.floor(
                                    processed /
                                    (
                                        processed +
                                        queue.length * 12 +
                                        1
                                    ) *
                                    95
                                )
                            )
                        );

                    send(
                        "progress",
                        {
                            percent: estimate,
                            processed,
                            directories,
                            files,
                            queue: queue.length,
                            current: child
                        }
                    );

                    await sleep(0);
                }
            }

        }catch(error){

            send(
                "error",
                {
                    error:
                        error &&
                        error.message
                            ? error.message
                            : String(error)
                }
            );

            return;
        }
    }

    send(
        "result",
        {
            entries,
            processed,
            directories,
            files
        }
    );
}

async function processDirectoryRequest(message){

    cancelled = false;

    if(!message.handle){
        send(
            "error",
            {
                error:
                    "No FileSystemDirectoryHandle was provided."
            }
        );
        return;
    }

    await scanDirectory(
        message.handle,
        message.basePath
    );
}

async function processListRequest(message){

    cancelled = false;

    const dir = message.handle;

    if(!dir){
        send(
            "error",
            {
                error:
                    "No directory handle."
            }
        );
        return;
    }

    const result = [];

    try{

        for await(const item of dir.values()){

            if(cancelled){
                send("cancelled");
                return;
            }

            result.push({
                name:item.name,
                kind:item.kind
            });

            if(result.length % 32 === 0){

                send(
                    "list-progress",
                    {
                        count:result.length
                    }
                );

                await sleep(0);
            }
        }

        send(
            "list-result",
            {
                entries:result
            }
        );

    }catch(error){

        send(
            "error",
            {
                error:
                    error &&
                    error.message
                        ? error.message
                        : String(error)
            }
        );
    }
}

self.onmessage = event => {

    const message = event.data || {};

    if(message.type === "cancel"){
        cancelled = true;
        return;
    }

    if(message.type === "scan"){
        processDirectoryRequest(message);
        return;
    }

    if(message.type === "list"){
        processListRequest(message);
        return;
    }
};
`;

let terminalWorker = null;

function createTerminalWorker(){

    const blob =
        new Blob(
            [TERMINAL_WORKER_SOURCE],
            {
                type:"application/javascript"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const worker =
        new Worker(url);

    worker._lhURL = url;

    worker.addEventListener(
        "error",
        error => {
            console.error(
                "Little Hollow terminal worker error:",
                error
            );
        }
    );

    return worker;
}


/* =========================================================
   TERMINAL MANAGER
   ========================================================= */

const terminalState = {
    active:false,
    title:"",
    operation:"",
    percent:0,
    processed:0,
    files:0,
    directories:0,
    cancelled:false
};

const terminal =
    document.getElementById("lh-terminal");

const terminalWindow =
    document.getElementById("lh-terminal-window");

const terminalOutput =
    document.getElementById("lh-terminal-output");

const terminalStatus =
    document.getElementById("lh-terminal-status");

const progressFill =
    document.getElementById("lh-progress-fill");

const progressText =
    document.getElementById("lh-progress-text");

const progressLabel =
    document.getElementById("lh-progress-label");

const confirmTerminal =
    document.getElementById("lh-confirm-terminal");

const confirmBody =
    document.getElementById("lh-confirm-body");

const confirmStop =
    document.getElementById("lh-confirm-stop");

const confirmContinue =
    document.getElementById("lh-confirm-continue");


function terminalShow(
    title="FILE OPERATION",
    operation=""
){

    terminalState.active = true;
    terminalState.title = title;
    terminalState.operation = operation;
    terminalState.percent = 0;
    terminalState.processed = 0;
    terminalState.files = 0;
    terminalState.directories = 0;
    terminalState.cancelled = false;

    terminal.style.display = "flex";

    document.body.classList.add(
        "lh-terminal-active"
    );

    terminalWindow.querySelector(
        ".lh-terminal-titlebar"
    ).firstChild.textContent =
        title + " ";

    terminalStatus.textContent =
        operation || "RUNNING";

    terminalOutput.innerHTML = "";

    terminalProgress(
        0,
        "Starting..."
    );
}


function terminalLog(
    message,
    type=""
){

    const line =
        document.createElement("div");

    line.className =
        "lh-terminal-line" +
        (type ? " " + type : "");

    line.textContent =
        String(message);

    terminalOutput.appendChild(line);

    terminalOutput.scrollTop =
        terminalOutput.scrollHeight;
}


function terminalProgress(
    percent,
    message=""
){

    const value =
        Math.max(
            0,
            Math.min(
                100,
                Number(percent) || 0
            )
        );

    terminalState.percent =
        value;

    progressFill.style.width =
        value + "%";

    progressText.textContent =
        Math.floor(value) +
        "% " +
        (
            message
                ? message
                : ""
        );
}


function terminalFinish(
    message="All files has been loaded"
){

    terminalState.percent = 100;

    terminalProgress(
        100,
        message
    );

    terminalStatus.textContent =
        "SUCCESS";

    terminalLog(
        message,
        "success"
    );
}


function terminalFail(
    message
){

    terminalStatus.textContent =
        "ERROR";

    terminalLog(
        message,
        "error"
    );
}


function terminalClose(){

    terminalState.active = false;

    document.body.classList.remove(
        "lh-terminal-active"
    );

    terminal.style.display =
        "none";
}


function stopTerminalWorker(){

    if(!terminalWorker){
        return;
    }

    try{
        terminalWorker.postMessage({
            type:"cancel"
        });
    }catch(_){}

    try{
        terminalWorker.terminate();
    }catch(_){}

    try{
        URL.revokeObjectURL(
            terminalWorker._lhURL
        );
    }catch(_){}

    terminalWorker = null;
}


/* =========================================================
   CTRL+C CONFIRMATION
   ========================================================= */

let confirmationOpen = false;

function requestStopConfirmation(){

    if(
        !terminalState.active ||
        confirmationOpen
    ){
        return;
    }

    confirmationOpen = true;

    confirmBody.textContent =
        "CURRENT OPERATION:\n" +
        (
            terminalState.operation ||
            "FILE OPERATION"
        ) +
        "\n\n" +
        "Progress: " +
        Math.floor(
            terminalState.percent
        ) +
        "%\n\n" +
        "Stop the current operation?\n" +
        "The current browser folder mount will remain,\n" +
        "but the background scan/index operation will stop.";

    confirmTerminal.style.display =
        "block";

    confirmStop.focus();
}


function closeStopConfirmation(){

    confirmationOpen = false;

    confirmTerminal.style.display =
        "none";
}


function performConfirmedStop(){

    closeStopConfirmation();

    if(!terminalState.active){
        return;
    }

    terminalState.cancelled = true;

    terminalStatus.textContent =
        "STOPPING";

    terminalLog(
        "Ctrl+C received.",
        "warn"
    );

    terminalLog(
        "Stopping background worker...",
        "warn"
    );

    stopTerminalWorker();

    terminalStatus.textContent =
        "CANCELLED";

    terminalLog(
        "Operation stopped by user.",
        "warn"
    );

    terminalProgress(
        terminalState.percent,
        "CANCELLED"
    );

    /*
       Keep the terminal open instead of closing it.
       The user explicitly requested a non-closable terminal.
    */
}


confirmStop.onclick =
    performConfirmedStop;

confirmContinue.onclick =
    closeStopConfirmation;


document.addEventListener(
    "keydown",
    event => {

        if(
            event.ctrlKey &&
            event.key.toLowerCase() === "c"
        ){

            if(
                terminalState.active
            ){

                event.preventDefault();
                event.stopPropagation();

                requestStopConfirmation();
            }
        }

    },
    true
);


/* Prevent the terminal itself from being closed by
   pointer/touch outside events. */
terminal.addEventListener(
    "pointerdown",
    event => {
        event.stopPropagation();
    },
    true
);

terminalWindow.addEventListener(
    "pointerdown",
    event => {
        event.stopPropagation();
    },
    true
);


/* =========================================================
   FILE MANAGER
   ========================================================= */

const zones = [
    {
        key:"local",
        label:"LOCAL",
        prefix:"chxd:/local/"
    },
    {
        key:"session",
        label:"SESSION",
        prefix:"chxd:/session/"
    },
    {
        key:"indexdb",
        label:"INDEXDB",
        prefix:"chxd:/indexdb/"
    },
    {
        key:"puter",
        label:"PUTER",
        prefix:"puter:/"
    },
    {
        key:"device",
        label:"DEVICE",
        prefix:"chxd:/device/"
    },
    {
        key:"system",
        label:"SYSTEM",
        prefix:"chxd:/system/"
    }
];

let current = "local";
let currentPrefix = "";
let selected = new Set();
let contextPath = null;
let contextIsFolder = false;
let activeRename = null;
let renameSaving = false;
let renameRequest = 0;
let refreshSerial = 0;

const params =
    new URLSearchParams(
        location.search
    );

const selectMode =
    params.get("select") === "1";

const allowMultiple =
    params.get("multiple") === "1" ||
    params.get("allowMultiple") === "1";

const tabs =
    document.getElementById("tabs");

const list =
    document.getElementById("list");

const box =
    document.getElementById("pathBox");

const hint =
    document.getElementById("hint");

const errorBox =
    document.getElementById("error");

const currentPathBox =
    document.getElementById("currentPath");

const contextMenu =
    document.getElementById("contextMenu");


function showError(s){

    errorBox.textContent =
        String(
            s || "Unknown error"
        );

    errorBox.style.display =
        "block";

    clearTimeout(
        showError.timer
    );

    showError.timer =
        setTimeout(
            () => {
                errorBox.style.display =
                    "none";
            },
            4500
        );
}


if(selectMode){

    hint.textContent =
        allowMultiple
            ? "FILE PICKER: select files, then tap OPEN SELECTED."
            : "FILE PICKER: tap a file to return it to the application.";

    document.getElementById(
        "mountFolder"
    ).style.display = "none";

    document.getElementById(
        "newText"
    ).style.display = "none";

    document.getElementById(
        "zip"
    ).style.display = "none";

    document.getElementById(
        "selectAll"
    ).style.display =
        allowMultiple
            ? ""
            : "none";
}


zones.forEach(
    z => {

        const b =
            document.createElement(
                "button"
            );

        b.textContent =
            z.label;

        b.dataset.k =
            z.key;

        if(z.key === current){
            b.classList.add(
                "active"
            );
        }

        b.onclick =
            () => {

                cancelRename();

                current =
                    z.key;

                currentPrefix =
                    "";

                selected.clear();

                [
                    ...tabs.children
                ].forEach(
                    x =>
                        x.classList.toggle(
                            "active",
                            x.dataset.k === current
                        )
                );

                refresh();
            };

        tabs.appendChild(b);
    }
);


function zone(){
    return zones.find(
        x => x.key === current
    );
}


function ext(p){

    return String(
        p || ""
    )
    .split("?")[0]
    .split("#")[0]
    .split(".")
    .pop()
    .toLowerCase();
}


function isImagePath(path){

    return [
        "png",
        "jpg",
        "jpeg",
        "jpe",
        "webp",
        "gif",
        "bmp",
        "svg",
        "avif",
        "ico",
        "tif",
        "tiff"
    ].includes(
        ext(path)
    );
}


function selectedPaths(){
    return [...selected];
}


function normalizeFolderPath(p){

    p = String(p || "");

    return p.endsWith("/")
        ? p
        : p + "/";
}


function isFolderPath(p){
    return String(p || "").endsWith("/");
}


function displayName(p){

    const clean =
        String(p || "")
            .replace(/\/+$/,"");

    const i =
        clean.lastIndexOf("/");

    return i >= 0
        ? clean.slice(i + 1)
        : clean;
}


function parentFolder(p){

    const clean =
        String(p || "")
            .replace(/\/+$/,"");

    const i =
        clean.lastIndexOf("/");

    return i < 0
        ? ""
        : clean.slice(
            0,
            i + 1
        );
}


function isTopLevelDeviceMount(p){

    const clean =
        String(p || "")
            .replace(/\/+$/,"");

    const prefix =
        "chxd:/device/";

    if(
        !clean.startsWith(prefix)
    ){
        return false;
    }

    const relative =
        clean.slice(
            prefix.length
        );

    return (
        relative.length > 0 &&
        !relative.includes("/")
    );
}

function getOwnWindow(){

    try{

        const frame =
            window.frameElement;

        if(!frame){
            return null;
        }

        const el =
            frame.closest(
                ".cyan-window"
            );

        if(
            !el ||
            !parent.WM ||
            typeof parent.WM.list !==
                "function"
        ){
            return null;
        }

        return parent.WM.list().find(
            w => w.el === el
        ) || null;

    }catch(_){

        return null;
    }
}


function getTargetApplicationWindow(){

    try{

        const own =
            getOwnWindow();

        const windows =
            parent.WM &&
            typeof parent.WM.list ===
                "function"
                ? parent.WM.list()
                : [];

        const candidates =
            windows.filter(
                w => {

                    if(
                        !w ||
                        w.closed ||
                        w === own ||
                        !w.el
                    ){
                        return false;
                    }

                    const iframe =
                        w.el.querySelector(
                            "iframe"
                        );

                    if(!iframe){
                        return false;
                    }

                    const src =
                        String(
                            iframe.src || ""
                        ).toLowerCase();

                    return !src.includes(
                        "filemanager.html"
                    );
                }
            );

        candidates.sort(
            (a,b) => {

                const za =
                    parseInt(
                        a.el.style.zIndex ||
                        "0"
                    ) || 0;

                const zb =
                    parseInt(
                        b.el.style.zIndex ||
                        "0"
                    ) || 0;

                return zb - za;
            }
        );

        return candidates[0] || null;

    }catch(_){

        return null;
    }
}


function sendToTargetApp(paths){

    const clean =
        paths.filter(
            p => !isFolderPath(p)
        );

    if(!clean.length){

        showError(
            "Select a file first."
        );

        return false;
    }

    const target =
        getTargetApplicationWindow();

    if(
        target &&
        target.el
    ){

        const iframe =
            target.el.querySelector(
                "iframe"
            );

        if(
            iframe &&
            iframe.contentWindow
        ){

            try{

                iframe.contentWindow.postMessage(
                    {
                        type:"LH_FILE_SELECTED",
                        path:clean[0],
                        paths:clean
                    },
                    "*"
                );

                return true;

            }catch(err){

                console.error(err);
            }
        }
    }

    try{

        parent.postMessage(
            {
                type:"LH_FILE_SELECTED",
                path:clean[0],
                paths:clean
            },
            "*"
        );

    }catch(_){}

    return false;
}


function closePicker(){

    const own =
        getOwnWindow();

    if(
        own &&
        parent.WM &&
        typeof parent.WM.closeWindow ===
            "function"
    ){

        parent.WM.closeWindow(
            own
        );

        return;
    }

    try{

        if(window.frameElement){
            window.frameElement.style.display =
                "none";
        }

    }catch(_){}
}


function finishFilePick(paths){

    if(
        sendToTargetApp(
            paths
        )
    ){

        closePicker();
    }
}


async function openImageEditor(path){

    try{

        const r =
            await parent.FS.read(
                path
            );

        if(
            !r ||
            !r.ok
        ){
            throw new Error(
                r &&
                r.error
                    ? r.error
                    : "Could not read image."
            );
        }

        const result =
            await parent.Apps.openApp(
                "imageeditor",
                {
                    path,
                    title:"IMAGE EDITOR",
                    width:700,
                    height:560,
                    allowMultiple:false
                }
            );

        if(
            !result ||
            !result.ok ||
            !result.win
        ){

            throw new Error(
                result &&
                (
                    result.error ||
                    result.summary
                ) ||
                "Could not open Image Editor."
            );
        }

        const win =
            result.win;

        const payload =
            {
                type:"LH_RECEIVE_IMAGE",
                data:r.content,
                path,
                name:displayName(path),
                filename:displayName(path)
            };

        function getIframe(){

            return (
                win &&
                win.el
            )
            ? win.el.querySelector(
                "iframe"
            )
            : null;
        }

        let sent = false;

        function send(){

            const iframe =
                getIframe();

            if(
                !iframe ||
                !iframe.contentWindow
            ){
                return false;
            }

            try{

                iframe.contentWindow.postMessage(
                    payload,
                    "*"
                );

                sent = true;

                return true;

            }catch(_){

                return false;
            }
        }

        const existing =
            getIframe();

        if(existing){

            existing.addEventListener(
                "load",
                send,
                {
                    once:true
                }
            );

            send();
        }

        let tries = 0;

        const timer =
            setInterval(
                () => {

                    tries++;

                    const iframe =
                        getIframe();

                    if(
                        iframe &&
                        !iframe.dataset.lhEditorHooked
                    ){

                        iframe.dataset.lhEditorHooked =
                            "1";

                        iframe.addEventListener(
                            "load",
                            send
                        );
                    }

                    send();

                    if(
                        sent ||
                        tries >= 30
                    ){

                        clearInterval(
                            timer
                        );
                    }

                },
                100
            );

    }catch(err){

        showError(
            "EDIT IMAGE failed: " +
            (
                err.message ||
                String(err)
            )
        );
    }
}

    const target =
        [
            ...document.querySelectorAll(
                ".name"

            n =>
                n.dataset.path ===
                path

function startRename(
    element,
    oldPath,
    folder
){

    cancelRename();

    const oldName =
        displayName(oldPath);

    const input =
        document.createElement(
            "input"
        );

    input.className =
        "rename-input";

    input.value =
        oldName;

    input.autocomplete =
        "off";

    input.spellcheck =
        false;

    const oldContent =
        element.textContent;

    activeRename = {
        element,
        input,
        oldPath,
        oldName,
        oldContent,
        folder
    };

    element.innerHTML =
        "";

    element.appendChild(
        input
    );

    input.focus();

    if(!folder){

        const dot =
            oldName.lastIndexOf(".");

        if(dot > 0){

            try{

                input.setSelectionRange(
                    0,
                    dot
                );

            }catch(_){

                input.select();
            }

        }else{

            input.select();
        }

    }else{

        input.select();
    }

    input.addEventListener(
        "keydown",
        e => {

            if(e.key === "Enter"){

                e.preventDefault();

                finishRename();

            }else if(
                e.key === "Escape"
            ){

                e.preventDefault();

                cancelRename();
            }
        }
    );

    input.addEventListener(
        "click",
        e => e.stopPropagation()
    );

    input.addEventListener(
        "pointerdown",
        e => e.stopPropagation()
    );
}


function buildNewPath(
    oldPath,
    newName,
    folder
){

    const cleanName =
        String(
            newName || ""
        )
        .trim()
        .replace(
            /[\/\\]/g,
            ""
        )
        .trim();

    if(!cleanName){
        return null;
    }

    return (
        parentFolder(
            oldPath
        ) +
        cleanName +
        (
            folder
                ? "/"
                : ""
        )
    );
}


async function renameUsingFS(
    oldPath,
    newPath
){

    if(
        parent.FS &&
        typeof parent.FS.rename ===
            "function"
    ){

        const r =
            await parent.FS.rename(
                oldPath,
                newPath
            );

        if(
            !r ||
            !r.ok
        ){

            throw new Error(
                r &&
                (
                    r.error ||
                    r.summary
                ) ||
                "Could not rename."
            );
        }

        return;
    }

    if(oldPath.endsWith("/")){

        const files =
            await parent.FS.list(
                oldPath
            );

        if(!Array.isArray(files)){

            throw new Error(
                "Could not read folder."
            );
        }

        const descendants =
            files.filter(
                p =>
                    String(p).startsWith(
                        oldPath
                    ) &&
                    String(p) !== oldPath
            );

        for(
            const source of descendants
        ){

            if(
                String(source).endsWith("/")
            ){
                continue;
            }

            const r =
                await parent.FS.read(
                    source
                );

            if(!r.ok){

                throw new Error(
                    r.error ||
                    (
                        "Could not read " +
                        source
                    )
                );
            }

            const relative =
                String(
                    source
                ).slice(
                    oldPath.length
                );

            const w =
                await parent.FS.write(
                    normalizeFolderPath(
                        newPath
                    ) +
                    relative,
                    r.content,
                    true
                );

            if(!w.ok){

                throw new Error(
                    w.error ||
                    (
                        "Could not create " +
                        newPath
                    )
                );
            }
        }

        for(
            let i =
                descendants.length - 1;
            i >= 0;
            i--
        ){

            if(
                String(
                    descendants[i]
                ).endsWith("/")
            ){
                continue;
            }

            const r =
                await parent.FS.remove(
                    descendants[i]
                );

            if(!r.ok){

                throw new Error(
                    r.error ||
                    (
                        "Could not remove " +
                        descendants[i]
                    )
                );
            }
        }

        return;
    }

    const r =
        await parent.FS.read(
            oldPath
        );

    if(!r.ok){

        throw new Error(
            r.error ||
            (
                "Could not read " +
                oldPath
            )
        );
    }

    const w =
        await parent.FS.write(
            newPath,
            r.content,
            true
        );

    if(!w.ok){

        throw new Error(
            r.error ||
            (
                "Could not create " +
                newPath
            )
        );
    }

    const d =
        await parent.FS.remove(
            oldPath
        );

    if(!d.ok){

        throw new Error(
            d.error ||
            (
                "Could not remove " +
                oldPath
            )
        );
    }
}


async function finishRename(){

    if(
        !activeRename ||
        renameSaving
    ){
        return;
    }

    const currentRename =
        activeRename;

    const input =
        currentRename.input;

    if(
        !input ||
        !input.isConnected
    ){

        activeRename =
            null;

        return;
    }

    const newName =
        input.value.trim();

    if(!newName){

        cancelRename();

        showError(
            "Name cannot be empty."
        );

        return;
    }

    const newPath =
        buildNewPath(
            currentRename.oldPath,
            newName,
            currentRename.folder
        );

    if(!newPath){

        cancelRename();

        showError(
            "Invalid name."
        );

        return;
    }

    if(
        newPath ===
        currentRename.oldPath
    ){

        restoreRename();

        return;
    }

    const request =
        ++renameRequest;

    renameSaving = true;

    try{

        await renameUsingFS(
            currentRename.oldPath,
            newPath
        );

        if(
            request !==
            renameRequest
        ){
            return;
        }

        selected.delete(
            currentRename.oldPath
        );

        selected.delete(
            newPath
        );

        activeRename =
            null;

        renameSaving =
            false;

        await refresh();

    }catch(err){

        if(
            request !==
            renameRequest
        ){
            return;
        }

        renameSaving =
            false;

        showError(
            err.message ||
            String(err)
        );

        if(input.isConnected){
            input.focus();
        }
    }
}


function restoreRename(){

    if(!activeRename){
        return;
    }

    activeRename.element.textContent =
        activeRename.oldContent;

    activeRename =
        null;

    renameSaving =
        false;
}


function cancelRename(){

    renameRequest++;

    restoreRename();
}

async function openPath(p){

    if(
        isFolderPath(p)
    ){

        enterFolder(p);

        return;
    }

    if(selectMode){

        if(allowMultiple){

            if(
                selected.has(p)
            ){

                selected.delete(p);

            }else{

                selected.add(p);
            }

            await refresh();

        }else{

            finishFilePick(
                [p]
            );
        }

        return;
    }

    if(
        ext(p) === "zip"
    ){

        await downloadBinary(
            p
        );

        return;
    }

    try{

        const e =
            ext(p);

        let result;

        if([
            "png",
            "jpg",
            "jpeg",
            "gif",
            "webp",
            "bmp",
            "svg",
            "avif",
            "ico",
            "tif",
            "tiff"
        ].includes(e)){

            result =
                await parent.Apps.openApp(
                    "imageViewer",
                    {
                        src:p,
                        allowMultiple:true
                    }
                );

        }else if([
            "mp4",
            "webm",
            "mov",
            "m4v"
        ].includes(e)){

            result =
                await parent.Apps.openApp(
                    "videoPlayer",
                    {
                        src:p,
                        allowMultiple:true
                    }
                );

        }else if([
            "mp3",
            "wav",
            "ogg",
            "m4a",
            "flac"
        ].includes(e)){

            result =
                await parent.Apps.openApp(
                    "audioPlayer",
                    {
                        src:p,
                        allowMultiple:true
                    }
                );

        }else{

            result =
                await parent.Apps.openApp(
                    "Notepad",
                    {
                        path:p,
                        allowMultiple:true
                    }
                );
        }

        if(
            !result ||
            !result.ok
        ){

            showError(
                result &&
                (
                    result.error ||
                    result.summary
                ) ||
                "Could not open file."
            );
        }

    }catch(err){

        showError(
            err.message ||
            String(err)
        );
    }
}


function enterFolder(path){

    cancelRename();

    currentPrefix =
        normalizeFolderPath(
            path
        );

    closeContextMenu();

    refresh();
}


function goUp(){

    cancelRename();

    const z =
        zone();

    if(!currentPrefix){
        return;
    }

    const root =
        z.prefix.replace(
            /\/+$/,
            ""
        );

    let p =
        currentPrefix.replace(
            /\/+$/,
            ""
        );

    if(p === root){

        currentPrefix =
            "";

        refresh();

        return;
    }

    const i =
        p.lastIndexOf("/");

    currentPrefix =
        i <= root.length
            ? ""
            : p.slice(
                0,
                i + 1
            );

    refresh();
}


async function edit(p){

    if(isImagePath(p)){

        await openImageEditor(
            p
        );

        return;
    }

    try{

        const result =
            await parent.Apps.openApp(
                "Notepad",
                {
                    path:p,
                    allowMultiple:true
                }
            );

        if(
            !result ||
            !result.ok
        ){

            showError(
                result &&
                (
                    result.error ||
                    result.summary
                ) ||
                "Could not open Notepad."
            );
        }

    }catch(err){

        showError(
            err.message ||
            String(err)
        );
    }
}


async function code(){

    const paths =
        selectedPaths();

    if(!paths.length){
        return;
    }

    const files = [];

    for(
        const p of paths
    ){

        if(
            isFolderPath(p)
        ){
            continue;
        }

        const r =
            await parent.FS.read(
                p
            );

        if(r.ok){

            files.push(
                {
                    name:
                        p.split(
                            "/"
                        ).pop(),
                    content:
                        r.content
                }
            );
        }
    }

    if(!files.length){
        return;
    }

    parent.Apps.openOneCompiler(
        {
            language:
                ext(
                    files[0].name
                ) === "py"
                    ? "python"
                    : "javascript",
            files,
            run:false
        }
    );
}

}


async function downloadBinary(p){

    const r =
        await parent.FS.read(
            p
        );

    if(!r.ok){

        showError(
            r.error
        );

        return false;
    }

    if(
        !/^data:/i.test(
            r.content
        )
    ){

        showError(
            "This file does not contain downloadable binary data."
        );

        return false;
    }

    downloadData(
        r.content,
        p.split("/").pop()
    );

    return true;
}


function dataURLToBytes(
    data
){

    const comma =
        String(
            data
        ).indexOf(",");

    if(comma < 0){

        throw new Error(
            "Invalid data URL."
        );
    }

    const header =
        String(data).slice(
            0,
            comma
        );

    const body =
        String(data).slice(
            comma + 1
        );

    if(
        /;base64/i.test(
            header
        )
    ){

        const binary =
            atob(body);

        const bytes =
            new Uint8Array(
                binary.length
            );

        for(
            let i = 0;
            i < binary.length;
            i++
        ){

            bytes[i] =
                binary.charCodeAt(i);
        }

        return bytes;
    }

    return new TextEncoder()
        .encode(
            decodeURIComponent(
                body
            )
        );
}


function readU16(
    bytes,
    p
){

    return (
        bytes[p] |
        bytes[p + 1] << 8
    ) >>> 0;
}


function readU32(
    bytes,
    p
){

    return (
        bytes[p] |
        bytes[p + 1] << 8 |
        bytes[p + 2] << 16 |
        bytes[p + 3] << 24
    ) >>> 0;
}


function findEOCD(bytes){

    const min =
        Math.max(
            0,
            bytes.length - 65557
        );

    for(
        let p =
            bytes.length - 22;
        p >= min;
        p--
    ){

        if(
            readU32(
                bytes,
                p
            ) ===
            0x06054b50
        ){
            return p;
        }
    }

    return -1;
}


function safeZipPath(name){

    name =
        String(name || "")
            .replace(
                /\\/g,
                "/"
            )
            .replace(
                /^\/+/,
                ""
            );

    const result = [];

    for(
        const part
        of name.split("/")
    ){

        if(
            part &&
            part !== "." &&
            part !== ".."
        ){

            result.push(
                part
            );
        }
    }

    return result.join("/");
}


async function unzipFile(zipPath){

    const defaultFolder =
        zipPath.replace(
            /\.zip$/i,
            ""
        ) + "/";

    const output =
        prompt(
            "UNZIP destination folder:",
            defaultFolder
        );

    if(!output){
        return;
    }

    let outputFolder =
        String(
            output
        ).trim();

    if(
        !outputFolder.endsWith("/")
    ){

        outputFolder += "/";
    }

    terminalShow(
        "UNZIP TERMINAL",
        "UNZIPPING"
    );

    terminalLog(
        "Loading " +
        zipPath
    );

    try{

        const r =
            await parent.FS.read(
                zipPath
            );

        if(!r.ok){

            throw new Error(
                r.error ||
                "Could not read ZIP."
            );
        }

        if(
            !/^data:/i.test(
                r.content
            )
        ){

            throw new Error(
                "ZIP does not contain binary data."
            );
        }

        const bytes =
            dataURLToBytes(
                r.content
            );

        const eocd =
            findEOCD(
                bytes
            );

        if(eocd < 0){

            throw new Error(
                "Invalid ZIP archive."
            );
        }

        const entries =
            readU16(
                bytes,
                eocd + 10
            );

        const centralOffset =
            readU32(
                bytes,
                eocd + 16
            );

        let pos =
            centralOffset;

        let extracted = 0;

        for(
            let n = 0;
            n < entries;
            n++
        ){

            if(
                terminalState.cancelled
            ){
                throw new Error(
                    "UNZIP cancelled."
                );
            }

            if(
                readU32(
                    bytes,
                    pos
                ) !==
                0x02014b50
            ){

                throw new Error(
                    "Invalid ZIP central directory."
                );
            }

            const method =
                readU16(
                    bytes,
                    pos + 10
                );

            const compressedSize =
                readU32(
                    bytes,
                    pos + 20
                );

            const nameLength =
                readU16(
                    bytes,
                    pos + 28
                );

            const extraLength =
                readU16(
                    bytes,
                    pos + 30
                );

            const commentLength =
                readU16(
                    bytes,
                    pos + 32
                );

            const localOffset =
                readU32(
                    bytes,
                    pos + 42
                );

            const filename =
                new TextDecoder().decode(
                    bytes.slice(
                        pos + 46,
                        pos + 46 +
                        nameLength
                    )
                );

            const safeName =
                safeZipPath(
                    filename
                );

            if(
                safeName &&
                !filename.endsWith("/")
            ){

                if(
                    readU32(
                        bytes,
                        localOffset
                    ) !==
                    0x04034b50
                ){

                    throw new Error(
                        "Invalid ZIP local header."
                    );
                }

                const localNameLength =
                    readU16(
                        bytes,
                        localOffset + 26
                    );

                const localExtraLength =
                    readU16(
                        bytes,
                        localOffset + 28
                    );

                const dataStart =
                    localOffset +
                    30 +
                    localNameLength +
                    localExtraLength;

                const compressed =
                    bytes.slice(
                        dataStart,
                        dataStart +
                        compressedSize
                    );

                let fileBytes;

                if(method === 0){

                    fileBytes =
                        compressed;

                }else if(
                    method === 8
                ){

                    if(
                        typeof DecompressionStream !==
                        "function"
                    ){

                        throw new Error(
                            "This browser cannot decompress DEFLATE ZIP files."
                        );
                    }

                    const stream =
                        new Blob(
                            [compressed]
                        )
                        .stream()
                        .pipeThrough(
                            new DecompressionStream(
                                "deflate-raw"
                            )
                        );

                    fileBytes =
                        new Uint8Array(
                            await new Response(
                                stream
                            ).arrayBuffer()
                        );

                }else{

                    throw new Error(
                        "Unsupported ZIP compression method " +
                        method +
                        " for " +
                        filename +
                        "."
                    );
                }

                let binary = "";

                for(
                    let i = 0;
                    i < fileBytes.length;
                    i += 0x8000
                ){

                    binary +=
                        String.fromCharCode(
                            ...fileBytes.subarray(
                                i,
                                Math.min(
                                    i + 0x8000,
                                    fileBytes.length
                                )
                            )
                        );
                }

                const dataURL =
                    "data:application/octet-stream;base64," +
                    btoa(binary);

                const dest =
                    outputFolder +
                    safeName;

                const w =
                    await parent.FS.write(
                        dest,
                        dataURL,
                        true
                    );

                if(!w.ok){

                    throw new Error(
                        "Could not extract " +
                        filename +
                        ": " +
                        (
                            w.error ||
                            "write failed"
                        )
                    );
                }

                extracted++;

                const percent =
                    entries
                        ? (
                            extracted /
                            entries
                        ) *
                        100
                        : 100;

                terminalProgress(
                    percent,
                    "Extracted " +
                    extracted +
                    "/" +
                    entries
                );

                terminalLog(
                    "Extracted " +
                    filename
                );
            }

            pos +=
                46 +
                nameLength +
                extraLength +
                commentLength;
        }

        terminalFinish(
            "UNZIP complete"
        );

        terminalLog(
            "Extracted " +
            extracted +
            " file(s) to " +
            outputFolder,
            "success"
        );

        await refresh();

    }catch(err){

        terminalFail(
            "UNZIP failed: " +
            (
                err.message ||
                String(err)
            )
        );

        showError(
            "UNZIP failed: " +
            (
                err.message ||
                String(err)
            )
        );
    }
}


function utf8(s){

    return new TextEncoder()
        .encode(
            String(s)
        );
}


function u16(n){

    return [
        n & 255,
        (n >>> 8) & 255
    ];
}


function u32(n){

    return [
        n & 255,
        (n >>> 8) & 255,
        (n >>> 16) & 255,
        (n >>> 24) & 255
    ];
}


function crc32(bytes){

    let c =
        0xffffffff;

    for(
        const b of bytes
    ){

        c ^= b;

        for(
            let i = 0;
            i < 8;
            i++
        ){

            c =
                (c >>> 1) ^
                (
                    (c & 1)
                        ? 0xedb88320
                        : 0
                );
        }
    }

    return (
        c ^
        0xffffffff
    ) >>> 0;
}


function makeZip(entries){

    const local = [];
    const central = [];

    let offset = 0;

    for(
        const entry of entries
    ){

        const name =
            utf8(
                entry.name
                    .replace(
                        /^\/+/,
                        ""
                    )
            );

        const data =
            entry.data;

        const crc =
            crc32(
                data
            );

        const header =
            new Uint8Array(
                [
                    ...u32(0x04034b50),
                    ...u16(20),
                    ...u16(0),
                    ...u16(0),
                    ...u16(0),
                    ...u16(0),
                    ...u32(crc),
                    ...u32(data.length),
                    ...u32(data.length),
                    ...u16(name.length),
                    ...u16(0),
                    ...name,
                    ...data
                ]
            );

        local.push(
            header
        );

        central.push(
            new Uint8Array(
                [
                    ...u32(0x02014b50),
                    ...u16(20),
                    ...u16(20),
                    ...u16(0),
                    ...u16(0),
                    ...u16(0),
                    ...u16(0),
                    ...u32(crc),
                    ...u32(data.length),
                    ...u32(data.length),
                    ...u16(name.length),
                    ...u16(0),
                    ...u16(0),
                    ...u16(0),
                    ...u16(0),
                    ...u32(0),
                    ...u32(offset),
                    ...name
                ]
            )
        );

        offset +=
            header.length;
    }

    const cdOffset =
        offset;

    const cdSize =
        central.reduce(
            (a,b) =>
                a + b.length,
            0
        );

    const eocd =
        new Uint8Array(
            [
                ...u32(0x06054b50),
                ...u16(0),
                ...u16(0),
                ...u16(central.length),
                ...u16(central.length),
                ...u32(cdSize),
                ...u32(cdOffset),
                ...u16(0)
            ]
        );

    return new Blob(
        [
            ...local,
            ...central,
            eocd
        ],
        {
            type:
                "application/zip"
        }
    );
}


function blobDataURL(blob){

    return new Promise(
        (resolve,reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () =>
                    resolve(
                        reader.result
                    );

            reader.onerror =
                () =>
                    reject(
                        reader.error
                    );

            reader.readAsDataURL(
                blob
            );
        }
    );
}


async function collectFiles(paths){

    const entries = [];

    for(
        const p0 of paths
    ){

        const p =
            String(p0);

        if(
            isFolderPath(p)
        ){

            const base =
                normalizeFolderPath(
                    p
                );

            const files =
                await parent.FS.list(
                    base
                );

            if(
                !Array.isArray(files)
            ){
                continue;
            }

            for(
                const item0
                of files
            ){

                const item =
                    String(item0);

                if(
                    !item.startsWith(base) ||
                    item.endsWith("/")
                ){
                    continue;
                }

                const r =
                    await parent.FS.read(
                        item
                    );

                if(!r.ok){
                    continue;
                }

                const bytes =
                    /^data:/i.test(
                        r.content
                    )
                        ? dataURLToBytes(
                            r.content
                        )
                        : utf8(
                            r.content
                        );

                entries.push(
                    {
                        name:
                            displayName(p) +
                            "/" +
                            item.slice(
                                base.length
                            ),
                        data:bytes
                    }
                );
            }

        }else{

            const r =
                await parent.FS.read(
                    p
                );

            if(!r.ok){
                continue;
            }

            const bytes =
                /^data:/i.test(
                    r.content
                )
                    ? dataURLToBytes(
                        r.content
                    )
                    : utf8(
                        r.content
                    );

            entries.push(
                {
                    name:
                        displayName(p),
                    data:bytes
                }
            );
        }
    }

    return entries;
}


async function downloadItem(path){

    terminalShow(
        "DOWNLOAD TERMINAL",
        "DOWNLOADING"
    );

    try{

        if(
            isFolderPath(path)
        ){

            terminalLog(
                "Loading folder contents..."
            );

            const entries =
                await collectFiles(
                    [path]
                );

            if(
                terminalState.cancelled
            ){
                return;
            }

            terminalProgress(
                70,
                "Creating ZIP..."
            );

            const blob =
                makeZip(
                    entries
                );

            terminalProgress(
                90,
                "Preparing download..."
            );

            downloadData(
                await blobDataURL(
                    blob
                ),
                displayName(path) +
                ".zip"
            );

            terminalFinish(
                "Folder download complete"
            );

            return;
        }

        if(
            ext(path) ===
            "zip"
        ){

            await downloadBinary(
                path
            );

            terminalFinish(
                "Download complete"
            );

            return;
        }

        const r =
            await parent.FS.read(
                path
            );

        if(!r.ok){

            throw new Error(
                r.error ||
                "Could not read file."
            );
        }

        if(
            /^data:/i.test(
                r.content
            )
        ){

            downloadData(
                r.content,
                displayName(path)
            );

        }else{

            const blob =
                new Blob(
                    [String(r.content)],
                    {
                        type:
                            "application/octet-stream"
                    }
                );

            downloadData(
                await blobDataURL(
                    blob
                ),
                displayName(path)
            );
        }

        terminalFinish(
            "Download complete"
        );

    }catch(err){

        terminalFail(
            "Download failed: " +
            (
                err.message ||
                String(err)
            )
        );

        showError(
            "Download failed: " +
            (
                err.message ||
                String(err)
            )
        );
    }
}
