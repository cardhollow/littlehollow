<body>
<div class="wrap">
<div class="bar">
    <input id="pathBox" placeholder="path or search">
    <button id="refresh">REFRESH</button>
    <button id="up">UP</button>
    <button id="uploadFiles">UPLOAD FILES</button>
    <button id="newText">NEW TEXT</button>
    <button id="copySelected">COPY</button>
    <button id="moveSelected">MOVE</button>
    <button id="downloadSelectedBtn">DOWNLOAD</button>
    <button id="deleteSelected" class="danger">DELETE</button>
    <button id="mountFolder">MOUNT FOLDER</button>
    <button id="zip">ZIP SELECTED</button>
    <button id="selectAll">SELECT ALL</button>
    <input
        id="fileInput"
        class="hidden-input"
        type="file"
        multiple
    >
</div>
<div class="tabs" id="tabs"></div>
<div class="pathbar">
    <div class="current-path" id="currentPath"></div>
</div>
<div class="mount-status" id="mountStatus"></div>
<div class="hint" id="hint">
    Tap a file to open it. Tap a folder to enter it. Double-tap a name to rename. Long-press/right-click for more actions.
</div>
<div class="hint" id="error" style="display:none"></div>
<div class="list" id="list"></div>
</div>
<div class="ctx" id="contextMenu"></div>
<div class="overlay" id="operationOverlay">
    <div class="modal">
        <div class="modal-title" id="operationTitle">FILE OPERATION</div>
        <div class="modal-subtitle" id="operationSubtitle"></div>
        <div class="progress-wrap">
            <div class="progress-label" id="operationLabel">Starting...</div>
            <div class="progress-track">
                <div class="progress-fill" id="operationFill"></div>
            </div>
            <div class="progress-stats" id="operationStats">
                0 / 0
            </div>
        </div>
        <div class="operation-log" id="operationLog"></div>
        <div class="modal-actions" style="margin-top:12px">
            <button
                id="operationCancel"
                class="danger"
            >
                CANCEL OPERATION
            </button>
            <button
                id="operationClose"
                style="display:none"
            >
                CLOSE
            </button>
        </div>
    </div>
</div>
<div class="overlay" id="conflictOverlay">
    <div class="modal">
        <div class="modal-title">
            OVERWRITE FILES?
        </div>
        <div class="modal-subtitle" id="conflictSubtitle">
            The destination already contains this item.
        </div>
        <div class="modal-path" id="conflictPath"></div>
        <label class="modal-check">
            <input
                id="conflictApplyAll"
                type="checkbox"
            >
            Apply to All
        </label>
        <div class="modal-actions">
            <button
                id="conflictOverwrite"
                class="primary"
            >
                OVERWRITE
            </button>
            <button
                id="conflictRename"
                class="warn"
            >
                RENAME
            </button>
            <button
                id="conflictSkip"
            >
                SKIP
            </button>
            <button
                id="conflictCancel"
                class="danger"
            >
                CANCEL
            </button>
        </div>
    </div>
</div>
<div class="overlay" id="deleteOverlay">
    <div class="modal">
        <div class="modal-title">
            DELETE?
        </div>
        <div class="modal-subtitle" id="deleteSubtitle">
            This cannot be undone.
        </div>
        <div class="modal-path" id="deletePath"></div>
        <label class="modal-check">
            <input
                id="deleteApplyAll"
                type="checkbox"
            >
            Apply to All
        </label>
        <div class="modal-actions">
            <button
                id="deleteConfirm"
                class="danger"
            >
                DELETE
            </button>
            <button
                id="deleteCancel"
            >
                CANCEL
            </button>
        </div>
    </div>
</div>
<div class="overlay" id="destinationOverlay">
    <div class="modal">
        <div class="modal-title" id="destinationTitle">
            DESTINATION
        </div>
        <div class="modal-subtitle" id="destinationSubtitle"></div>
        <input
            id="destinationInput"
            class="destination-box"
            spellcheck="false"
            autocomplete="off"
        >
        <div class="modal-actions">
            <button
                id="destinationConfirm"
                class="primary"
            >
                START
            </button>
            <button
                id="destinationCancel"
            >
                CANCEL
            </button>
        </div>
    </div>
</div>
<script>
"use strict";let uploadJob=null;let uploadTerminal=null;let confirmTerminal=null;let terminalCloseGuardTimer=null;let uploadUiTimer=null;const folderCache=new Map();const folderLoading=new Map();const permissionCache=new Map();const deviceMountCache=new Map();const preloading=new Set();let refreshSerial=0;let contextPath=null;let contextIsFolder=false;let current="local";let currentPrefix="";let selected=new Set();let activeRename=null;let renameSaving=false;let renameRequest=0;let searchMode=false;let searchQuery="";let searchResults=[];let pathDisplayOverride="";let operationState=null;let conflictResolver=null;let deleteResolver=null;let destinationResolver=null;const params=new URLSearchParams(location.search);const selectMode=params.get("select")==="1";const allowMultiple=params.get("multiple")==="1"||params.get("allowMultiple")==="1";const initialPath=params.get("path")||"";const tabs=document.getElementById("tabs");const list=document.getElementById("list");const box=document.getElementById("pathBox");const hint=document.getElementById("hint");const errorBox=document.getElementById("error");const currentPathBox=document.getElementById("currentPath");const contextMenu=document.getElementById("contextMenu");const mountStatus=document.getElementById("mountStatus");const operationOverlay=document.getElementById("operationOverlay");const operationTitle=document.getElementById("operationTitle");const operationSubtitle=document.getElementById("operationSubtitle");const operationLabel=document.getElementById("operationLabel");const operationFill=document.getElementById("operationFill");const operationStats=document.getElementById("operationStats");const operationLog=document.getElementById("operationLog");const operationCancel=document.getElementById("operationCancel");const operationClose=document.getElementById("operationClose");const conflictOverlay=document.getElementById("conflictOverlay");const conflictPath=document.getElementById("conflictPath");const conflictSubtitle=document.getElementById("conflictSubtitle");const conflictApplyAll=document.getElementById("conflictApplyAll");const conflictOverwrite=document.getElementById("conflictOverwrite");const conflictRename=document.getElementById("conflictRename");const conflictSkip=document.getElementById("conflictSkip");const conflictCancel=document.getElementById("conflictCancel");const deleteOverlay=document.getElementById("deleteOverlay");const deleteSubtitle=document.getElementById("deleteSubtitle");const deletePath=document.getElementById("deletePath");const deleteApplyAll=document.getElementById("deleteApplyAll");const deleteConfirm=document.getElementById("deleteConfirm");const deleteCancel=document.getElementById("deleteCancel");deleteOverlay.addEventListener("pointerdown",e=>e.stopPropagation());deleteOverlay.addEventListener("click",e=>e.stopPropagation());const destinationOverlay=document.getElementById("destinationOverlay");const destinationTitle=document.getElementById("destinationTitle");const destinationSubtitle=document.getElementById("destinationSubtitle");const destinationInput=document.getElementById("destinationInput");const destinationConfirm=document.getElementById("destinationConfirm");const destinationCancel=document.getElementById("destinationCancel");const fileInput=document.getElementById("fileInput");const zones=[{key:"local",label:"LOCAL",prefix:"chxd:/local/"},{key:"session",label:"SESSION",prefix:"chxd:/session/"},{key:"indexdb",label:"INDEXDB",prefix:"chxd:/indexdb/"},{key:"repository",label:"REPOSITORY",prefix:"chxd:/repository/"},{key:"puter",label:"PUTER",prefix:"puter:/"},{key:"device",label:"DEVICE",prefix:"chxd:/device/"},{key:"system",label:"SYSTEM",prefix:"chxd:/system/"}];function showError(s){errorBox.textContent=String(s||"Unknown error");errorBox.style.display="block";clearTimeout(showError.timer);showError.timer=setTimeout(()=>errorBox.style.display="none",5000);}function showMountStatus(text,show=true){mountStatus.textContent=String(text||"");mountStatus.classList.toggle("show",!!show);}function escHtml(value){return String(value==null?"":value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function zone(){
    return zones.find(
        x=>x.key===current
    );
}
function zoneFromPath(path){
    const p=
        String(path||"");
    return zones.find(
        z=>
            p.indexOf(
                z.prefix
            )===0
    )||null;
}
function ext(p){
    return String(p||"")
        .split("?")[0]
        .split("#")[0]
        .split(".")
        .pop()
        .toLowerCase();
}
function isImagePath(path){
    return [
        "png",
        "jpg",
        "jpeg",
        "jpe",
        "webp",
        "gif",
        "bmp",
        "svg",
        "avif",
        "ico",
        "tif",
        "tiff",
        "heic",
        "heif"
    ].includes(
        ext(path)
    );
}
function isVideoPath(path){
    return [
        "webm",
        "mp4",
        "m4v",
        "mov",
        "ogv",
        "ogg",
        "mkv",
        "avi",
        "wmv",
        "flv",
        "3gp",
        "3g2",
        "ts",
        "m2ts",
        "mpg",
        "mpeg"
    ].includes(
        ext(path)
    );
}
function isAudioPath(path){
    return [
        "mp3",
        "wav",
        "wave",
        "ogg",
        "oga",
        "opus",
        "webm",
        "weba",
        "flac",
        "m4a",
        "aac",
        "3gp",
        "amr"
    ].includes(
        ext(path)
    );
}
function isDocumentPath(path){
    return [
        "pdf",
        "epub",
        "mobi",
        "azw",
        "azw3",
        "doc",
        "docx",
        "odt",
        "rtf",
        "xls",
        "xlsx",
        "ods",
        "ppt",
        "pptx",
        "odp",
        "csv",
        "cbz",
        "cbr"
    ].includes(
        ext(path)
    );
}
function normalizeFolderPath(p){
    p=
        String(p||"");
    return p.endsWith("/")
        ?p
        :p+"/";
}
function isFolderPath(p){
    return String(p||"").endsWith("/");
}
function displayName(p){
    const clean=
        String(p||"")
            .replace(/\/+$/g,"");
    const i=
        clean.lastIndexOf("/");
    return i>=0
        ?clean.slice(i+1)
        :clean;
}
function parentFolder(p){
    const clean=
        String(p||"")
            .replace(/\/+$/g,"");
    const i=
        clean.lastIndexOf("/");
    return i<0
        ?""
        :clean.slice(0,i+1);
}
function isTopLevelDeviceMount(p){
    const clean=
        String(p||"")
            .replace(/\/+$/g,"");
    const prefix=
        "chxd:/device/";
    if(!clean.startsWith(prefix)){
        return false;
    }
    const relative=
        clean.slice(prefix.length);
    return(
        relative.length>0&&
        !relative.includes("/")
    );
}
function breadcrumbRootForPath(
    path
){
    const z=
        zoneFromPath(path);
    if(z){
        return z.prefix;
    }
    const s=
        String(path||"");
    const match=
        s.match(
            /^([a-zA-Z][\w-]*:)/
        );
    if(match){
        return match[1]+"/";
    }
    return "";
}
function createBreadcrumb(
    text,
    onclick,
    title
){
    const button=
        document.createElement(
            "button"
        );
    button.className=
        "path-segment";
    button.type=
        "button";
    button.textContent=
        String(text);
    if(title){
        button.title=
            title;
    }
    button.onclick=
        e=>{
            e.preventDefault();
            e.stopPropagation();
            onclick();
        };
    return button;
}
function createBreadcrumbSeparator(){
    const span=
        document.createElement(
            "span"
        );
    span.className=
        "path-separator";
    span.textContent=
        "/";
    return span;
}
function renderPathBreadcrumbs(
    path
){
    currentPathBox.innerHTML="";
    if(
        searchMode&&
        String(path||"")===
        "chxd:SearchResults"
    ){
        const button=
            createBreadcrumb(
                "chxd:SearchResults",
                ()=>{
                    performSearch(
                        searchQuery
                    );
                },
                "Show search results again"
            );
        currentPathBox.appendChild(
            button
        );
        return;
    }
    const value=
        String(path||"");
    if(!value){
        return;
    }
    const match=
        value.match(
            /^([a-zA-Z][\w-]*:)(\/?)(.*)$/
        );
    if(!match){
        const button=
            createBreadcrumb(
                value,
                ()=>openPath(value),
                value
            );
        currentPathBox.appendChild(
            button
        );
        return;
    }
    const scheme=
        match[1];
    const hasSlash=
        match[2]==="/";
    const rest=
        match[3];
    const trailingSlash=
        value.endsWith("/");
    const segments=
        rest
            .split("/")
            .filter(Boolean);
    const root=
        breadcrumbRootForPath(
            value
        );
    const schemeButton=
        createBreadcrumb(
            scheme,
            ()=>{
                const target=
                    root||(
                        scheme+
                        "/"
                    );
                openPath(
                    target
                );
            },
            root||value
        );
    currentPathBox.appendChild(
        schemeButton
    );
    if(hasSlash){
        currentPathBox.appendChild(
            createBreadcrumbSeparator()
        );
    }
    let cumulative=
        scheme+
        (hasSlash?"/":"");
    for(
        let i=0;
        i<segments.length;
        i++
    ){
        const segment=
            segments[i];
        const last=
            i===
            segments.length-1;
        const isFile=
            last&&
            !trailingSlash;
        cumulative+=
            segment;
        const target=
            isFile
                ?cumulative
                :normalizeFolderPath(
                    cumulative
                );
        currentPathBox.appendChild(
            createBreadcrumb(
                segment,
                ()=>openPath(target),
                target
            )
        );
        if(!last){
            currentPathBox.appendChild(
                createBreadcrumbSeparator()
            );
            cumulative+="/";
        }else if(trailingSlash){
            cumulative+="/";
        }
    }
}
function updatePathDisplay(){
    const path=
        searchMode
            ?(
                pathDisplayOverride||
                "chxd:SearchResults"
            )
            :(
                pathDisplayOverride||
                (
                    ()=>{
                        const z=
                            zone();
                        return z
                            ?(
                                currentPrefix||
                                z.prefix
                            )
                            :"";
                    }
                )()
            );
    renderPathBreadcrumbs(
        path
    );
}
function setSearchDisplay(
    path
){
    pathDisplayOverride=
        String(path||"");
    updatePathDisplay();
}
function clearPathDisplayOverride(){
    pathDisplayOverride="";
}
function closeContextMenu(){
    contextMenu.style.display=
        "none";
    contextPath=null;
    contextIsFolder=false;
}
function addContextButton(
    label,
    fn,
    className=""
){
    const b=
        document.createElement(
            "button"
        );
    b.textContent=
        label;
    if(className){
        b.className=
            className;
    }
    b.onclick=
        e=>{
            e.preventDefault();
            e.stopPropagation();
            closeContextMenu();
            fn();
        };
    contextMenu.appendChild(
        b
    );
}
function getOwnWindow(){
    try{
        const frame=
            window.frameElement;
        if(
            !frame||
            !parent.WM||
            typeof parent.WM.list!=="function"
        ){
            return null;
        }
        const el=
            frame.closest(
                ".cyan-window"
            );
        if(!el){
            return null;
        }
        return parent.WM.list().find(
            w=>w.el===el
        )||null;
    }catch(_){
        return null;
    }
}
function getTargetApplicationWindow(){
    try{
        const own=
            getOwnWindow();
        const windows=
            parent.WM&&
            typeof parent.WM.list==="function"
                ?parent.WM.list()
                :[];
        const candidates=
            windows.filter(
                w=>{
                    if(
                        !w||
                        w.closed||
                        w===own||
                        !w.el
                    ){
                        return false;
                    }
                    const iframe=
                        w.el.querySelector(
                            "iframe"
                        );
                    if(!iframe){
                        return false;
                    }
                    const src=
                        String(
                            iframe.src||""
                        ).toLowerCase();
                    return !src.includes(
                        "filemanager.html"
                    );
                }
            );
        candidates.sort(
            (a,b)=>{
                const za=
                    parseInt(
                        a.el.style.zIndex||"0"
                    )||0;
                const zb=
                    parseInt(
                        b.el.style.zIndex||"0"
                    )||0;
                return zb-za;
            }
        );
        return candidates[0]||null;
    }catch(_){
        return null;
    }
}
function sendToTargetApp(
    paths
){
    const clean=
        paths.filter(
            p=>!isFolderPath(p)
        );
    if(!clean.length){
        showError(
            "Select a file first."
        );
        return false;
    }
    const target=
        getTargetApplicationWindow();
    if(target&&target.el){
        const iframe=
            target.el.querySelector(
                "iframe"
            );
        if(
            iframe&&
            iframe.contentWindow
        ){
            try{
                iframe.contentWindow.postMessage(
                    {
                        type:"LH_FILE_SELECTED",
                        path:clean[0],
                        paths:clean
                    },
                    "*"
                );
                return true;
            }catch(err){
                console.error(err);
            }
        }
    }
    try{
        parent.postMessage(
            {
                type:"LH_FILE_SELECTED",
                path:clean[0],
                paths:clean
            },
            "*"
        );
    }catch(_){}
    return false;
}
function closePicker(){
    const own=
        getOwnWindow();
    if(
        own&&
        parent.WM&&
        typeof parent.WM.closeWindow==="function"
    ){
        parent.WM.closeWindow(
            own
        );
        return;
    }
    try{
        if(window.frameElement){
            window.frameElement.style.display=
                "none";
        }
    }catch(_){}
}
function finishFilePick(
    paths
){
    if(
        sendToTargetApp(
            paths
        )
    ){
        closePicker();
    }
}
async function openImageEditor(
    path
){
    try{
        const r=
            await parent.FS.read(
                path
            );
        if(
            !r||
            !r.ok
        ){
            throw new Error(
                r&&r.error
                    ?r.error
                    :"Could not read image."
            );
        }
        const result=
            await parent.Apps.openApp(
                "imageeditor",
                {
                    path,
                    title:"IMAGE EDITOR",
                    width:700,
                    height:560,
                    allowMultiple:false
                }
            );
        if(
            !result||
            !result.ok||
            !result.win
        ){
            throw new Error(
                result&&
                (
                    result.error||
                    result.summary
                )||
                "Could not open Image Editor."
            );
        }
        const win=
            result.win;
        const payload={
            type:"LH_RECEIVE_IMAGE",
            data:r.content,
            path,
            name:displayName(path),
            filename:displayName(path)
        };
        function getIframe(){
            return win&&win.el
                ?win.el.querySelector(
                    "iframe"
                )
                :null;
        }
        let sent=false;
        function send(){
            const iframe=
                getIframe();
            if(
                !iframe||
                !iframe.contentWindow
            ){
                return false;
            }
            try{
                iframe.contentWindow.postMessage(
                    payload,
                    "*"
                );
                sent=true;
                return true;
            }catch(_){
                return false;
            }
        }
        const existing=
            getIframe();
        if(existing){
            existing.addEventListener(
                "load",
                send,
                {once:true}
            );
            send();
        }
        const timer=
            setInterval(
                ()=>{
                    const iframe=
                        getIframe();
                    if(
                        iframe&&
                        !iframe.dataset.lhEditorHooked
                    ){
                        iframe.dataset.lhEditorHooked=
                            "1";
                        iframe.addEventListener(
                            "load",
                            send
                        );
                    }
                    send();
                    if(sent){
                        clearInterval(
                            timer
                        );
                    }
                },
                100
            );
        setTimeout(
            ()=>clearInterval(timer),
            5000
        );
    }catch(err){
        showError(
            "EDIT IMAGE failed:"+
            (err.message||String(err))
        );
    }
}
function openAppNameForPath(

            "webm"

                await parent.Apps.openApp(
                    appName,

            await parent.Apps.openApp(
                appName||"Notepad",

function actionSelection(
    clickedPath=null
){
    if(
        clickedPath&&
        selected.size>1&&
        selected.has(clickedPath)
    ){
        return collapseSelection(
            selectedPaths()
        );
    }
    if(selected.size>0&&!clickedPath){
        return collapseSelection(
            selectedPaths()
        );
    }
    return clickedPath
        ?[clickedPath]
        :[];
}
function collapseSelection(
    paths
){
    const sorted=
        [...new Set(
            paths.map(
                p=>String(p)
            )
        )]
            .sort(
                (a,b)=>{
                    if(a.length!==b.length){
                        return a.length-b.length;
                    }
                    return a.localeCompare(b);
                }
            );
    const result=[];
    for(
        const p of sorted
    ){
        const alreadyCovered=
            result.some(
                parent=>{
                    if(!isFolderPath(parent)){
                        return false;
                    }
                    return(
                        p.startsWith(
                            normalizeFolderPath(parent)
                        )&&
                        p!==parent
                    );
                }
            );
        if(!alreadyCovered){
            result.push(p);
        }
    }
    return result;
}

function startRename(

    folder
){

        displayName(oldPath);

        document.createElement(
            "input"
        );
    input.className=
        "rename-input";
    input.value=
        oldName;

        "off";

        false;

        element.textContent;

        element,
        input,
        oldPath,
        oldName,
        oldContent,
        folder
    };
    element.innerHTML="";
    element.appendChild(
        input
    );

        const dot=
            oldName.lastIndexOf(".");
        if(dot>0){
            try{
                input.setSelectionRange(
                    0,
                    dot
                );

                input.select();

        "keydown",

                finishRename();

                e.key==="Escape"

                e.preventDefault();
                cancelRename();
            }
        }
    );

        "click",
        e=>e.stopPropagation()
    );

        "pointerdown",
        e=>e.stopPropagation()
    );

function buildNewPath(
    oldPath,
    newName,
    folder
){
    const cleanName=
        String(
            newName||""
        )
            .trim()
            .replace(
                /[\/\\]/g,
                ""
            )
            .trim();
    if(!cleanName){
        return null;
    }
    const parent=
        parentFolder(oldPath);
    return (
        parent+
        cleanName+
        (folder?"/":"")
    );
}
async function renameUsingFS(
    oldPath,
    newPath
){

        parent.FS&&
        typeof parent.FS.rename==="function"
    ){
        const r=
            await parent.FS.rename(
                oldPath,
                newPath
            );
        if(
            !r||
            !r.ok
        ){
            throw new Error(
                r&&(
                    r.error||
                    r.summary
                )||
                "Could not rename."
            );
        }
        return;
    }
    await copyTreeWithOperation(
        oldPath,
        newPath,
        "rename"
    );
    await removePathTree(
        oldPath
    );
}
async function finishRename(){
    if(
        !activeRename||
        renameSaving
    ){
        return;
    }
    const currentRename=
        activeRename;
    const input=
        currentRename.input;
    if(
        !input||
        !input.isConnected
    ){
        activeRename=null;
        return;
    }
    const newName=
        input.value.trim();
    if(!newName){
        cancelRename();
        showError(
            "Name cannot be empty."
        );
        return;
    }
    const newPath=
        buildNewPath(
            currentRename.oldPath,
            newName,
            currentRename.folder
        );
    if(!newPath){
        cancelRename();
        showError(
            "Invalid name."
        );
        return;
    }
    if(
        newPath===
        currentRename.oldPath
    ){
        restoreRename();
        return;
    }
    const request=
        ++renameRequest;
    renameSaving=
        true;
    try{
        await renameUsingFS(
            currentRename.oldPath,
            newPath,
            currentRename.folder
        );
        if(
            request!==
            renameRequest
        ){
            return;
        }
        selected.delete(
            currentRename.oldPath
        );
        selected.delete(
            newPath
        );
        activeRename=null;
        renameSaving=false;
        clearFolderCachesForPrefix(
            currentRename.oldPath
        );
        if(searchMode){
            await performSearch(
                searchQuery
            );
        }else{
            await refresh(true);
        }
    }catch(err){
        if(
            request!==
            renameRequest
        ){
            return;
        }
        renameSaving=false;
        showError(
            err.message||
            String(err)
        );
        if(input.isConnected){
            input.focus();
        }
    }
}
function restoreRename(){
    if(!activeRename){
        return;
    }
    activeRename.element.textContent=
        activeRename.oldContent;
    activeRename=null;
    renameSaving=false;
}
function cancelRename(){
    renameRequest++;

}

function wildcardRegex(
    query
){
    const source=
        String(query||"")
            .replace(
                /[.+^${}()|[\]\\]/g,
                "\\$&"
            )
            .replace(
                /\*/g,
                ".*"
            )
            .replace(
                /\?/g,
                "."
            );
    return new RegExp(
        source,
        "i"
    );
}
async function performSearch(
    query
){
    cancelRename();
    query=
        String(query||"").trim();
    if(!query){
        return;
    }
    closeContextMenu();
    searchMode=true;
    searchQuery=query;
    pathDisplayOverride=
        "chxd:SearchResults";
    selected.clear();
    hint.textContent=
        "Search results for:"+
        query+
        "—click a file to snap to its path.";
    updatePathDisplay();
    list.innerHTML=
        '<div class="empty">Searching...</div>';
    try{
        const all=
            await parent.FS.list();
        const regex=
            wildcardRegex(
                query
            );
        searchResults=
            (
                Array.isArray(all)
                    ?all
                    :[]
            )
                .map(
                    x=>String(x)
                )
                .filter(
                    p=>
                        regex.test(p)||
                        regex.test(
                            displayName(p)
                        )
                );
        sortPaths(
            searchResults
        );
        const seen=
            new Set();
        searchResults=
            searchResults.filter(
                p=>{
                    if(seen.has(p)){
                        return false;
                    }
                    seen.add(p);
                    return true;
                }
            );
        renderFiles(
            searchResults
        );
    }catch(err){
        searchResults=[];
        list.innerHTML=
            '<div class="empty">Search failed.</div>';
        showError(
            err.message||
            String(err)
        );
    }
}
async function navigateOrSearch(
    value
){
    const v=
        String(
            value||""
        ).trim();
    if(!v){
        return;
    }
    if(
        v.toLowerCase()===
        "chxd:searchresults"
    ){
        return performSearch(
            searchQuery
        );
    }
    const z=
        zoneFromPath(v);
    if(z){
        try{
            const normalized=
                parent.FS&&
                typeof parent.FS.normalize==="function"
                    ?parent.FS.normalize(v)
                    :v;
            if(
                isFolderPath(normalized)||
                normalized===
                    z.prefix.replace(
                        /\/+$/,
                        ""
                    )
            ){
                clearSearch();
                current=
                    z.key;
                currentPrefix=
                    normalized===
                        z.prefix.replace(
                            /\/+$/,
                            ""
                        )
                        ?""
                        :normalizeFolderPath(
                            normalized
                        );
                clearPathDisplayOverride();
                [...tabs.children].forEach(
                    x=>
                        x.classList.toggle(
                            "active",
                            x.dataset.k===
                                current
                        )
                );
                updatePathDisplay();
                await refresh(false);
                return;
            }
            const exists=
                await parent.FS.exists(
                    normalized
                );
            if(exists){
                clearSearch();
                current=
                    z.key;
                currentPrefix=
                    parentFolder(
                        normalized
                    );
                clearPathDisplayOverride();
                [...tabs.children].forEach(
                    x=>
                        x.classList.toggle(
                            "active",
                            x.dataset.k===
                                current
                        )
                );
                await openPath(
                    normalized
                );
                return;
            }
        }catch(_){}
    }
    await performSearch(
        v
    );
}
