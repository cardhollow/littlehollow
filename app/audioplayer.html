<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audio Player</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:monospace;}
html,body{width:100%;height:100%;background:#000d0d;color:#00FFFF;}
.wrap{display:flex;flex-direction:column;height:100%;padding:10px;gap:10px;}
.bar{display:flex;gap:6px;}
.bar input{flex:1;background:#001010;border:1px solid #00FFFF;color:#00FFFF;padding:6px;font-family:monospace;}
.bar button{border:1px solid #00FFFF;background:transparent;color:#00FFFF;padding:6px 10px;cursor:pointer;}
audio{width:100%;}
.empty{opacity:0.5;font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
    <div class="bar">
        <input id="url" type="text" placeholder="Audio URL...">
        <button id="loadBtn">LOAD</button>
    </div>
    <div id="stage"><div class="empty">No audio loaded.</div></div>
</div>
<script>
const stage=document.getElementById("stage");
const urlInput=document.getElementById("url");

function show(src){
    stage.innerHTML="";
    const a=document.createElement("audio");
    a.src=src;
    a.controls=true;
    a.autoplay=true;
    stage.appendChild(a);
}

document.getElementById("loadBtn").addEventListener("click",()=>{
    if(urlInput.value.trim()) show(urlInput.value.trim());
});

const params=new URLSearchParams(location.search);
const initial=params.get("src");
if(initial){ urlInput.value=initial; show(initial); }
</script>
</body>
</html>
