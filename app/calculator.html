<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calculator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:monospace}
html,body{width:100%;height:100%;background:#000d0d;color:#00FFFF}
.calc{display:flex;flex-direction:column;height:100%;padding:10px;gap:8px}
.equation-label{font-size:10px;opacity:.6;letter-spacing:1px}
.equation{border:1px solid #00FFFF;padding:8px;min-height:34px;overflow-x:auto;white-space:nowrap}
.answer-label{font-size:10px;opacity:.6;letter-spacing:1px}
.display{border:1px solid #00FFFF;padding:10px;font-size:26px;text-align:right;min-height:44px;overflow-x:auto;white-space:nowrap}
.keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
button{border:1px solid #00FFFF;background:transparent;color:#00FFFF;font-family:monospace;font-size:16px;cursor:pointer}
button:active{background:#00FFFF;color:#000}
button.op{color:#000;background:#00FFFF}
button.op:active{background:transparent;color:#00FFFF}
</style>
</head>
<body>
<div class="calc">
    <div class="equation-label">EQUATION</div>
    <div class="equation" id="equation">0</div>
    <div class="answer-label">ANSWER</div>
    <div class="display" id="display">0</div>
    <div class="keys">
        <button data-k="C">C</button><button data-k="(">(</button><button data-k=")">)</button><button data-k="/" class="op">÷</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="*" class="op">×</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="-" class="op">−</button>
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="+" class="op">+</button>
        <button data-k="0">0</button><button data-k=".">.</button><button data-k="back">⌫</button><button data-k="=" class="op">=</button>
    </div>
</div>
<script>
const display=document.getElementById("display");
const equationEl=document.getElementById("equation");
let expr="";
let originalExpr="";
function render(){ display.textContent=expr||"0"; equationEl.textContent=originalExpr||expr||"0"; }
function safeEval(str){
    if(!/^[0-9+\-*/().\s]*$/.test(str)) throw new Error("bad expr");
    return Function('"use strict";return ('+str+')')();
}
function calculate(str){
    const clean=String(str||"").trim();
    if(!clean) return;
    originalExpr=clean;
    expr=clean;
    try{ expr=String(safeEval(clean)); }
    catch(e){ expr="ERROR"; }
    render();
}
document.querySelectorAll("button[data-k]").forEach(btn=>{
    btn.addEventListener("click",()=>{
        const k=btn.dataset.k;
        if(k==="C"){expr="";originalExpr="";}
        else if(k==="back"){expr=expr.slice(0,-1)}
        else if(k==="="){originalExpr=expr;try{expr=String(safeEval(expr))}catch(e){expr="ERROR"}}
        else{if(expr==="ERROR")expr="";expr+=k}
        render();
    });
});
document.addEventListener("keydown",e=>{
    if(/[0-9+\-*/.()]/.test(e.key)){if(expr==="ERROR")expr="";expr+=e.key;originalExpr=expr;render()}
    else if(e.key==="Enter")document.querySelector('[data-k="="]').click();
    else if(e.key==="Backspace")expr=expr.slice(0,-1),render();
    else if(e.key==="Escape")expr="",originalExpr="",render();
});
const params=new URLSearchParams(location.search);
const injected=params.get("equation");
if(injected) calculate(injected);
render();
</script>
</body>
</html>
