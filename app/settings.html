<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Little Hollow — Settings</title>
<style>
:root{
color-scheme:dark;
--bg:#071216;
--panel:#0b1a20;
--panel2:#0e232a;
--panel3:#102b33;
--line:#1c6670;
--line2:rgba(28,102,112,.4);
--text:#d9ffff;
--muted:#78a9ad;
--accent:#31f4ff;
--good:#63ffb1;
--danger:#ff708c;
--shadow:rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{
margin:0;
width:100%;
min-height:100%;
}
body{
min-height:100vh;
background:
radial-gradient(circle at 10% 0%,rgba(49,244,255,.08),transparent 32%),
radial-gradient(circle at 95% 100%,rgba(99,255,177,.05),transparent 35%),
var(--bg);
color:var(--text);
font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
button{
font:inherit;
}
.shell{
width:min(760px,100%);
margin:0 auto;
padding:20px;
}
.topbar{
padding:18px 20px;
margin-bottom:16px;
background:rgba(11,26,32,.9);
border:1px solid var(--line);
box-shadow:0 14px 36px var(--shadow);
}
.brand-title{
font-size:18px;
font-weight:700;
letter-spacing:.08em;
text-transform:uppercase;
}
.brand-subtitle{
margin-top:6px;
font-size:10px;
color:var(--muted);
line-height:1.5;
}
.settings{
display:grid;
gap:16px;
}
.group{
background:rgba(11,26,32,.86);
border:1px solid var(--line);
padding:16px;
}
.group-title{
margin:0 0 14px;
font-size:12px;
letter-spacing:.08em;
text-transform:uppercase;
color:var(--accent);
}
.items{
display:grid;
gap:9px;
}
.setting{
display:grid;
grid-template-columns:minmax(0,1fr) auto;
gap:16px;
align-items:center;
width:100%;
padding:14px;
border:1px solid var(--line2);
background:rgba(14,35,42,.7);
color:var(--text);
text-align:left;
cursor:pointer;
}
.setting:hover{
border-color:var(--accent);
background:rgba(49,244,255,.035);
}
.setting:active{
transform:translateY(1px);
}
.setting-title{
font-size:12px;
color:var(--text);
}
.setting-desc{
margin-top:5px;
font-size:10px;
line-height:1.55;
color:var(--muted);
}
.setting-arrow{
font-size:15px;
color:var(--accent);
}
.status{
min-height:18px;
margin-top:12px;
font-size:10px;
color:var(--muted);
line-height:1.5;
}
.status.bad{
color:var(--danger);
}
.hidden{
display:none!important;
}
@media(max-width:600px){
.shell{
padding:12px;
}
.topbar{
padding:14px;
}
.setting{
grid-template-columns:minmax(0,1fr) auto;
gap:10px;
padding:12px;
}
}
</style>
</head>
<body>
<main class="shell">
<header class="topbar">
<div class="brand-title">Little Hollow / Settings</div>
<div class="brand-subtitle">User, AI, and system configuration</div>
</header>

<div class="settings" id="settingsRoot"></div>

<div class="status" id="status"></div>
</main>

<script>
const SETTINGS_DATA=[
{
group:"User",
items:[
{
title:"User Control",
description:"Manage your Little Hollow account, login, logout, and account information.",
app:"usercontrol"
}
]
},
{
group:"AI",
items:[
{
title:"AI Manager",
description:"Configure AI providers, models, local runtimes, agent settings, and live mode.",
app:"aimanager"
}
]
}
];

const $=id=>document.getElementById(id);

const settingsRoot=$("settingsRoot");
const status=$("status");

function getAppHost(){
try{
if(
window.parent &&
window.parent!==window &&
window.parent.Apps &&
typeof window.parent.Apps.openApp==="function"
){
return window.parent;
}
}catch(_){}
return window;
}

function setStatus(text,bad=false){
status.textContent=text||"";
status.className="status"+(bad?" bad":"");
}

function renderSettings(){
settingsRoot.innerHTML="";

for(const group of SETTINGS_DATA){

const groupEl=document.createElement("section");
groupEl.className="group";

const title=document.createElement("h2");
title.className="group-title";
title.textContent=group.group;

const items=document.createElement("div");
items.className="items";

for(const item of group.items){

const button=document.createElement("button");
button.type="button";
button.className="setting";

const text=document.createElement("div");

const itemTitle=document.createElement("div");
itemTitle.className="setting-title";
itemTitle.textContent=item.title;

const itemDesc=document.createElement("div");
itemDesc.className="setting-desc";
itemDesc.textContent=item.description;

text.appendChild(itemTitle);
text.appendChild(itemDesc);

const arrow=document.createElement("div");
arrow.className="setting-arrow";
arrow.textContent="›";

button.appendChild(text);
button.appendChild(arrow);

button.addEventListener("click",()=>openSetting(item));

items.appendChild(button);
}

groupEl.appendChild(title);
groupEl.appendChild(items);

settingsRoot.appendChild(groupEl);
}
}

async function openSetting(item){

setStatus("Opening "+item.title+"...");

try{

const host=getAppHost();

if(
!host.Apps ||
typeof host.Apps.openApp!=="function"
){
throw new Error("Little Hollow application system is unavailable.");
}

const result=await host.Apps.openApp(
item.app,
{
title:item.windowTitle||item.title,
width:item.width,
height:item.height
}
);

if(!result||result.ok===false){
throw new Error(
result?.error||
"Unable to open "+item.title+"."
);
}

setStatus("");

}catch(error){

setStatus(
error?.message||
"Unable to open "+item.title+".",
true
);
}
}

renderSettings();
</script>
</body>
</html>
