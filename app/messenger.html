<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messenger</title>
<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:monospace;
}

html,body{
    width:100%;
    height:100%;
    background:#000d0d;
    color:#00FFFF;
}

.msg-app{
    display:flex;
    flex-direction:column;
    height:100%;
}

.msg-log{
    flex:1 1 auto;
    overflow-y:auto;
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.msg-row{
    max-width:86%;
    padding:8px 10px;
    border:1px solid #00FFFF;
    font-size:13px;
    line-height:1.4;
    word-break:break-word;
}

.msg-row.user{
    align-self:flex-end;
    background:rgba(0,255,255,0.14);
}

.msg-row.ai{
    align-self:flex-start;
    background:rgba(0,255,255,0.04);
}

.msg-row.sys{
    align-self:center;
    opacity:.55;
    font-size:10px;
    border-style:dashed;
    max-width:96%;
}

.msg-row.debug{
    border-style:dotted;
    background:rgba(255,255,0,.035);
}

.msg-row.ai .message-markdown{
    white-space:normal;
}

.msg-row.ai .message-markdown p{
    margin:0 0 8px;
}

.msg-row.ai .message-markdown p:last-child{
    margin-bottom:0;
}

.msg-row.ai .message-markdown h1,
.msg-row.ai .message-markdown h2,
.msg-row.ai .message-markdown h3,
.msg-row.ai .message-markdown h4,
.msg-row.ai .message-markdown h5,
.msg-row.ai .message-markdown h6{
    margin:10px 0 6px;
}

.msg-row.ai .message-markdown ul,
.msg-row.ai .message-markdown ol{
    margin:6px 0 8px 20px;
}

.msg-row.ai .message-markdown blockquote{
    margin:8px 0;
    padding-left:10px;
    border-left:2px solid #00FFFF;
    opacity:.85;
}

.msg-row.ai .message-markdown pre{
    overflow:auto;
    padding:8px;
    margin:8px 0;
    border:1px solid rgba(0,255,255,.45);
    background:#001515;
}

.msg-row.ai .message-markdown code{
    font-family:monospace;
}

.msg-row.ai .message-markdown :not(pre) > code{
    padding:1px 4px;
    background:rgba(0,255,255,.08);
}

.msg-row.ai .message-markdown table{
    border-collapse:collapse;
    width:100%;
    margin:8px 0;
}

.msg-row.ai .message-markdown th,
.msg-row.ai .message-markdown td{
    border:1px solid rgba(0,255,255,.45);
    padding:5px 7px;
    vertical-align:top;
}

.msg-row.ai .message-markdown img{
    max-width:100%;
    height:auto;
}

.msg-row.ai .message-markdown a{
    color:#00FFFF;
}

.msg-row.ai .message-markdown hr{
    border:none;
    border-top:1px solid rgba(0,255,255,.5);
    margin:10px 0;
}

.msg-row.ai .message-markdown input[type="checkbox"]{
    accent-color:#00FFFF;
}

.msg-status{
    flex:0 0 auto;
    min-height:18px;
    padding:3px 12px;
    font-size:10px;
    border-top:1px solid rgba(0,255,255,.35);
    opacity:.65;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.msg-status.debug{
    color:#FFFF00;
    border-top-color:rgba(255,255,0,.45);
}

.msg-inputbar{
    flex:0 0 auto;
    display:flex;
    border-top:1px solid #00FFFF;
}

.msg-inputbar input{
    flex:1 1 auto;
    border:none;
    background:transparent;
    padding:10px;
    color:#00FFFF;
    font-family:monospace;
    font-size:13px;
    outline:none;
}

.msg-inputbar button{
    flex:0 0 auto;
    border:none;
    border-left:1px solid #00FFFF;
    background:transparent;
    color:#00FFFF;
    padding:0 16px;
    cursor:pointer;
    font-family:monospace;
}

.msg-inputbar button:active{
    background:#00FFFF;
    color:#000;
}

.msg-inputbar button:disabled{
    opacity:.45;
    cursor:wait;
}

.msg-log::-webkit-scrollbar{
    width:8px;
}

.msg-log::-webkit-scrollbar-thumb{
    background:#00FFFF;
}
</style>
</head>
<body>

<div class="msg-app">
    <div class="msg-log" id="log"></div>
    <div class="msg-status" id="status">ONLINE</div>
    <div class="msg-inputbar">
        <input
            id="input"
            type="text"
            placeholder="Message Little Hollow..."
            autocomplete="off"
            spellcheck="false"
        >
        <button id="sendBtn">SEND</button>
    </div>
</div>

<script type="module">
import * as MarkdownModule from "../js/markdown.js";

const log=document.getElementById("log");
const input=document.getElementById("input");
const sendBtn=document.getElementById("sendBtn");
const status=document.getElementById("status");

let busy=false;
let streamText="";
let activePending=null;
let debugMode=false;

const debugOnHash="3dd2d6ca32529ed36595723bd9e75e8e2336940f900b5c0e676785588352c69a";
const debugOffHash="f36d9a83b5e38fd59c495206f1eb15f52681455b1766647a9f5d2877d43e0611";

function getParent(){
    try{
        if(window.parent&&window.parent!==window)return window.parent;
    }catch(_){}
    return window;
}

const parentWindow=getParent();

function setStatus(text,isDebug=false){
    status.textContent=text||"";
    status.classList.toggle("debug",!!isDebug);
}

function addRow(text,cls){
    const row=document.createElement("div");
    row.className="msg-row "+cls;
    row.textContent=text;
    log.appendChild(row);
    log.scrollTop=log.scrollHeight;
    return row;
}

function addMarkdownRow(markdown,cls="ai"){
    const row=document.createElement("div");
    row.className="msg-row "+cls;

    const content=document.createElement("div");
    content.className="message-markdown";

    renderInto(content,markdown);

    row.appendChild(content);
    log.appendChild(row);
    log.scrollTop=log.scrollHeight;

    return row;
}

function renderInto(element,markdown){
    const source=String(markdown??"");

    try{
        let renderer=null;

        if(typeof MarkdownModule.renderMarkdown==="function"){
            renderer=MarkdownModule.renderMarkdown;
        }else if(typeof MarkdownModule.parseMarkdown==="function"){
            renderer=MarkdownModule.parseMarkdown;
        }else if(typeof MarkdownModule.markdownToHtml==="function"){
            renderer=MarkdownModule.markdownToHtml;
        }

        if(!renderer){
            element.textContent=source;
            return;
        }

        const html=renderer(source);

        if(html&&typeof html.then==="function"){
            element.textContent=source;
            html.then(result=>{
                if(typeof result==="string"){
                    element.innerHTML=result;
                }
            }).catch(()=>{
                element.textContent=source;
            });
            return;
        }

        element.innerHTML=typeof html==="string"?html:source;
    }catch(err){
        element.textContent=source;
        console.error("Markdown render error:",err);
    }
}

function updatePendingMarkdown(markdown){
    if(!activePending)return;

    renderInto(
        activePending.querySelector(".message-markdown"),
        markdown
    );

    log.scrollTop=log.scrollHeight;
}

function normalizeVisibleMessage(result){
    if(!result)return "";

    if(typeof result==="string")return result;
    if(typeof result.visibleMessage==="string")return result.visibleMessage;
    if(typeof result.message==="string")return result.message;
    if(typeof result.text==="string")return result.text;
    if(typeof result.content==="string")return result.content;

    return "";
}

function normalizeLog(result){
    if(!result||!Array.isArray(result.log))return [];
    return result.log.map(x=>String(x));
}

function handleAIStream(event){
    if(!busy||!activePending)return;

    const detail=event?.detail||{};

    if(detail.provider&&typeof detail.provider!=="string"){
        return;
    }

    if(typeof detail.token!=="string"||!detail.token){
        return;
    }

    streamText+=detail.token;
    updatePendingMarkdown(streamText);
}

try{
    parentWindow.addEventListener(
        "littlehollow:ai-stream",
        handleAIStream
    );
}catch(_){}

async function sha256(value){
    const data=new TextEncoder().encode(value);
    const digest=await crypto.subtle.digest("SHA-256",data);
    return Array.from(new Uint8Array(digest))
        .map(x=>x.toString(16).padStart(2,"0"))
        .join("");
}

async function matchesCommand(value,hash){
    try{
        return (await sha256(value.trim().toLowerCase()))===hash;
    }catch(_){
        return false;
    }
}

async function sendResponseToLittleHollowAPI(text,meta={}){
    const ai=parentWindow?.LittleHollowAI;

    if(!ai){
        throw new Error("LittleHollowAI response API is unavailable");
    }

    const candidates=[
        "handleResponse",
        "postResponse",
        "processResponse",
        "ingestResponse"
    ];

    for(const name of candidates){
        if(typeof ai[name]!=="function")continue;

        return await ai[name](text,{
            source:meta.source||"messenger",
            debug:!!meta.debug,
            provider:meta.provider||null,
            model:meta.model||null
        });
    }

    if(typeof ai.receive==="function"){
        return await ai.receive(text,meta);
    }

    throw new Error("LittleHollowAI has no response-processing API");
}

async function processDebugMessage(text){
    const row=addMarkdownRow(text,"ai debug");

    try{
        const result=await sendResponseToLittleHollowAPI(
            text,
            {
                source:"messenger-debug",
                debug:true
            }
        );

        const logs=normalizeLog(result);

        if(logs.length){
            addRow(logs.join(" | "),"sys");
        }

        const visible=normalizeVisibleMessage(result);

        if(visible&&visible!==text){
            renderInto(
                row.querySelector(".message-markdown"),
                visible
            );
        }
    }catch(err){
        addRow(
            "Debug response API error: "+(err?.message||err),
            "sys"
        );
    }
}

async function sendToAI(text){
    const ai=parentWindow?.LittleHollowAI;

    if(!ai||typeof ai.send!=="function"){
        throw new Error(
            "parent.LittleHollowAI.send is not available"
        );
    }

    return await ai.send(text);
}

async function send(){
    const text=input.value.trim();

    if(!text)return;

    if(await matchesCommand(text,debugOnHash)){
        input.value="";

        if(busy){
            addRow(
                "Cannot change debug mode while a request is running.",
                "sys"
            );
            return;
        }

        debugMode=true;

        addRow(text,"user");
        addRow(
            "DEBUG MODE ON — AI sending blocked.",
            "sys"
        );

        setStatus(
            "DEBUG MODE — AI SEND BLOCKED",
            true
        );

        input.focus();
        return;
    }

    if(await matchesCommand(text,debugOffHash)){
        input.value="";

        if(busy){
            addRow(
                "Cannot change debug mode while a request is running.",
                "sys"
            );
            return;
        }

        addRow(text,"user");

        debugMode=false;

        addRow(
            "DEBUG MODE OFF — normal AI sending restored.",
            "sys"
        );

        setStatus("ONLINE",false);

        input.focus();
        return;
    }

    if(debugMode){
        input.value="";

        addRow(text,"user");

        setStatus(
            "DEBUG MODE — processing simulated AI response",
            true
        );

        busy=true;
        sendBtn.disabled=true;

        try{
            await processDebugMessage(text);
        }finally{
            busy=false;
            sendBtn.disabled=false;

            setStatus(
                "DEBUG MODE — AI SEND BLOCKED",
                true
            );

            input.focus();
        }

        return;
    }

    if(busy)return;

    input.value="";
    addRow(text,"user");

    busy=true;
    streamText="";
    sendBtn.disabled=true;

    const pending=document.createElement("div");
    pending.className="msg-row ai";

    const pendingContent=document.createElement("div");
    pendingContent.className="message-markdown";
    pendingContent.textContent="...";

    pending.appendChild(pendingContent);
    log.appendChild(pending);

    activePending=pending;

    setStatus("AI THINKING...",false);

    try{
        const result=await sendToAI(text);
        const visible=normalizeVisibleMessage(result);

        if(visible){
            updatePendingMarkdown(visible);
        }else if(streamText){
            updatePendingMarkdown(streamText);
        }else{
            updatePendingMarkdown(
                "[Little Hollow returned an empty response]"
            );
        }

        const logs=normalizeLog(result);

        if(logs.length){
            addRow(logs.join(" | "),"sys");
        }
    }catch(err){
        updatePendingMarkdown(
            "Error talking to Little Hollow: "+(err?.message||err)
        );
    }finally{
        activePending=null;
        busy=false;
        sendBtn.disabled=false;

        setStatus(
            debugMode
                ?"DEBUG MODE — AI SEND BLOCKED"
                :"ONLINE",
            debugMode
        );

        input.focus();
    }
}

sendBtn.addEventListener("click",send);

input.addEventListener("keydown",event=>{
    if(event.key==="Enter"){
        event.preventDefault();
        send();
    }
});

addRow(
    "Little Hollow is online. Say hello!",
    "sys"
);

setStatus("ONLINE",false);
input.focus();
</script>

</body>
</html>
