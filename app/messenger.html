<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messenger</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:monospace;
}

html,
body{
    width:100%;
    height:100%;
    background:#000d0d;
    color:#00FFFF;
}

.msg-app{
    display:flex;
    flex-direction:column;
    height:100%;
}

.msg-log{
    flex:1 1 auto;
    overflow-y:auto;
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.msg-row{
    max-width:86%;
    padding:8px 10px;
    border:1px solid #00FFFF;
    font-size:13px;
    line-height:1.4;
    word-break:break-word;
}

.msg-row.user{
    align-self:flex-end;
    background:rgba(0,255,255,0.14);
    white-space:pre-wrap;
}

.msg-row.ai{
    align-self:flex-start;
    background:rgba(0,255,255,0.04);
}

.msg-row.sys{
    align-self:center;
    opacity:.55;
    font-size:10px;
    border-style:dashed;
    max-width:96%;
    white-space:pre-wrap;
}

.msg-row.debug{
    border-style:dotted;
    background:rgba(255,255,0,.035);
}

.message-markdown{
    white-space:normal;
}

.message-markdown p{
    margin:0 0 8px;
}

.message-markdown p:last-child{
    margin-bottom:0;
}

.message-markdown h1,
.message-markdown h2,
.message-markdown h3,
.message-markdown h4,
.message-markdown h5,
.message-markdown h6{
    margin:10px 0 6px;
}

.message-markdown ul,
.message-markdown ol{
    margin:6px 0 8px 20px;
}

.message-markdown blockquote{
    margin:8px 0;
    padding-left:10px;
    border-left:2px solid #00FFFF;
    opacity:.85;
}

.message-markdown pre{
    overflow:auto;
    padding:8px;
    margin:8px 0;
    border:1px solid rgba(0,255,255,.45);
    background:#001515;
}

.message-markdown code{
    font-family:monospace;
}

.message-markdown :not(pre)>code{
    padding:1px 4px;
    background:rgba(0,255,255,.08);
}

.message-markdown table{
    border-collapse:collapse;
    width:100%;
    margin:8px 0;
}

.message-markdown th,
.message-markdown td{
    border:1px solid rgba(0,255,255,.45);
    padding:5px 7px;
    vertical-align:top;
}

.message-markdown img{
    max-width:100%;
    height:auto;
    display:block;
}

.message-markdown a{
    color:#00FFFF;
}

.message-markdown hr{
    border:none;
    border-top:1px solid rgba(0,255,255,.5);
    margin:10px 0;
}

.message-markdown input[type="checkbox"]{
    accent-color:#00FFFF;
}

.reference-button{
    display:inline-flex;
    align-items:center;
    gap:5px;
    border:1px solid rgba(0,255,255,.65);
    background:rgba(0,255,255,.08);
    color:#00FFFF;
    padding:1px 5px;
    margin:0 1px;
    cursor:pointer;
    font-family:monospace;
    font-size:inherit;
    line-height:1.3;
    text-decoration:none;
    vertical-align:baseline;
    user-select:none;
}

.reference-button:hover{
    background:rgba(0,255,255,.18);
}

.reference-button:active{
    background:#00FFFF;
    color:#000;
}

.file-reference::before{
    content:"📄";
    font-size:.9em;
}

.download-reference::before{
    content:"⬇";
    font-size:.9em;
}

.app-reference::before{
    content:"▣";
    font-size:.9em;
}

.msg-status{
    flex:0 0 auto;
    min-height:18px;
    padding:3px 12px;
    font-size:10px;
    border-top:1px solid rgba(0,255,255,.35);
    opacity:.65;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.msg-status.debug{
    color:#FFFF00;
    border-top-color:rgba(255,255,0,.45);
}

.msg-inputbar{
    flex:0 0 auto;
    display:flex;
    border-top:1px solid #00FFFF;
}

.msg-inputbar input{
    flex:1 1 auto;
    border:none;
    background:transparent;
    padding:10px;
    color:#00FFFF;
    font-family:monospace;
    font-size:13px;
    outline:none;
}

.msg-inputbar button{
    flex:0 0 auto;
    border:none;
    border-left:1px solid #00FFFF;
    background:transparent;
    color:#00FFFF;
    padding:0 16px;
    cursor:pointer;
    font-family:monospace;
}

.msg-inputbar button:active{
    background:#00FFFF;
    color:#000;
}

.msg-inputbar button:disabled{
    opacity:.45;
    cursor:wait;
}

.msg-log::-webkit-scrollbar{
    width:8px;
}

.msg-log::-webkit-scrollbar-thumb{
    background:#00FFFF;
}
</style>
</head>

<body>

<div class="msg-app">

    <div class="msg-log" id="log"></div>

    <div class="msg-status" id="status">
        ONLINE
    </div>

    <div class="msg-inputbar">

        <input
            id="input"
            type="text"
            placeholder="Message Little Hollow..."
            autocomplete="off"
            spellcheck="false"
        >

        <button id="sendBtn">
            SEND
        </button>

    </div>

</div>

<script type="module">

import "../js/markdown.js";

const log =
    document.getElementById("log");

const input =
    document.getElementById("input");

const sendBtn =
    document.getElementById("sendBtn");

const status =
    document.getElementById("status");

const mark =
    globalThis.marked;

let busy = false;
let streamText = "";
let activePending = null;
let debugMode = false;

const debugOnHash =
    "3dd2d6ca32529ed36595723bd9e75e8e2336940f900b5c0e676785588352c69a";

const debugOffHash =
    "f36d9a83b5e38fd59c495206f1eb15f52681455b1766647a9f5d2877d43e0611";

const parentWindow =
    window.parent &&
    window.parent !== window
        ? window.parent
        : window;

const FILE_REFERENCE_REGEX =
    /\[file:([^\]]+)\]/g;

const DOWNLOAD_REFERENCE_REGEX =
    /\[download:([^\]]+)\]/g;

const APP_REFERENCE_REGEX =
    /\[app:([^\]]+)\]/g;

const activeImageObjectURLs =
    new Set();

function getParentObject(
    name
){

    try{

        if(
            window.parent &&
            window.parent !== window &&
            window.parent[name]
        ){

            return window.parent[name];
        }

    }catch(_){}

    try{

        if(
            window[name]
        ){

            return window[name];
        }

    }catch(_){}

    return null;
}

function getFS(){

    return getParentObject(
        "FS"
    );
}

function extension(
    path
){

    const clean =
        String(
            path || ""
        )
        .split("?")[0]
        .split("#")[0];

    const dot =
        clean.lastIndexOf(".");

    if(
        dot < 0
    ){

        return "";
    }

    return clean
        .slice(
            dot + 1
        )
        .toLowerCase();
}

function mimeFromExtension(
    path
){

    switch(
        extension(path)
    ){

        case "png":
            return "image/png";

        case "jpg":
        case "jpeg":
        case "jpe":
            return "image/jpeg";

        case "gif":
            return "image/gif";

        case "webp":
            return "image/webp";

        case "bmp":
            return "image/bmp";

        case "svg":
        case "svgz":
            return "image/svg+xml";

        case "ico":
            return "image/x-icon";

        case "avif":
            return "image/avif";

        case "tif":
        case "tiff":
            return "image/tiff";

        case "heic":
            return "image/heic";

        case "heif":
            return "image/heif";

        default:
            return "application/octet-stream";
    }
}

function isVirtualPath(
    value
){

    const s =
        String(
            value || ""
        );

    return (
        /^chxd:\//i.test(s) ||
        /^local:\//i.test(s) ||
        /^session:\//i.test(s) ||
        /^indexdb:\//i.test(s) ||
        /^puter:\//i.test(s)
    );
}

function isURL(
    value
){

    const s =
        String(
            value || ""
        );

    return (
        /^https?:\/\//i.test(s) ||
        /^blob:/i.test(s) ||
        /^data:/i.test(s) ||
        /^file:/i.test(s)
    );
}

function bytesFrom(
    value
){

    if(
        value instanceof ArrayBuffer
    ){

        return new Uint8Array(
            value
        );
    }

    if(
        value &&
        typeof value === "object" &&
        value.buffer instanceof ArrayBuffer
    ){

        return new Uint8Array(
            value.buffer,
            value.byteOffset || 0,
            value.byteLength
        );
    }

    return null;
}

function detectMime(
    bytes,
    path
){

    if(
        !bytes ||
        bytes.length < 2
    ){

        return mimeFromExtension(
            path
        );
    }

    if(
        bytes.length >= 8 &&
        bytes[0] === 137 &&
        bytes[1] === 80 &&
        bytes[2] === 78 &&
        bytes[3] === 71 &&
        bytes[4] === 13 &&
        bytes[5] === 10 &&
        bytes[6] === 26 &&
        bytes[7] === 10
    ){

        return "image/png";
    }

    if(
        bytes.length >= 3 &&
        bytes[0] === 255 &&
        bytes[1] === 216 &&
        bytes[2] === 255
    ){

        return "image/jpeg";
    }

    if(
        bytes.length >= 6 &&
        bytes[0] === 71 &&
        bytes[1] === 73 &&
        bytes[2] === 70
    ){

        return "image/gif";
    }

    if(
        bytes.length >= 12 &&
        bytes[0] === 82 &&
        bytes[1] === 73 &&
        bytes[2] === 70 &&
        bytes[3] === 70 &&
        bytes[8] === 87 &&
        bytes[9] === 69 &&
        bytes[10] === 66 &&
        bytes[11] === 80
    ){

        return "image/webp";
    }

    if(
        bytes.length >= 2 &&
        bytes[0] === 66 &&
        bytes[1] === 77
    ){

        return "image/bmp";
    }

    if(
        bytes.length >= 4 &&
        bytes[0] === 0x00 &&
        bytes[1] === 0x00 &&
        bytes[2] === 0x01 &&
        bytes[3] === 0x00
    ){

        return "image/x-icon";
    }

    return mimeFromExtension(
        path
    );
}

function binaryStringToBytes(
    value
){

    const s =
        String(
            value
        );

    const bytes =
        new Uint8Array(
            s.length
        );

    for(
        let i = 0;
        i < s.length;
        i++
    ){

        bytes[i] =
            s.charCodeAt(i) & 255;
    }

    return bytes;
}

function looksLikeBinaryString(
    value
){

    if(
        typeof value !== "string"
    ){

        return false;
    }

    const s =
        value;

    if(
        !s.length
    ){

        return false;
    }

    let binaryCount =
        0;

    const sampleLength =
        Math.min(
            s.length,
            4096
        );

    for(
        let i = 0;
        i < sampleLength;
        i++
    ){

        const code =
            s.charCodeAt(i);

        if(
            code === 0 ||
            code === 1 ||
            code === 2 ||
            code === 3 ||
            code === 4 ||
            code === 5 ||
            code === 6 ||
            code === 7 ||
            code === 8 ||
            code === 14 ||
            code === 15 ||
            (
                code >= 16 &&
                code <= 31
            ) ||
            code === 127
        ){

            binaryCount++;
        }
    }

    return (
        binaryCount > 0 ||
        (
            s.length >= 4 &&
            s.charCodeAt(0) === 0xFF &&
            s.charCodeAt(1) === 0xD8
        )
    );
}

function rememberImageObjectURL(
    url
){

    if(
        url
    ){

        activeImageObjectURLs.add(
            url
        );
    }

    return url;
}

function binaryStringToURL(
    value,
    path
){

    const bytes =
        binaryStringToBytes(
            value
        );

    const mime =
        detectMime(
            bytes,
            path
        );

    const blob =
        new Blob(
            [bytes],
            {
                type:mime
            }
        );

    return rememberImageObjectURL(
        URL.createObjectURL(
            blob
        )
    );
}

function base64ToURL(
    value,
    path
){

    const clean =
        String(
            value || ""
        )
        .trim()
        .replace(
            /\s/g,
            ""
        );

    let mime =
        mimeFromExtension(
            path
        );

    if(
        clean.startsWith(
            "iVBORw0KGgo"
        )
    ){

        mime =
            "image/png";

    }else if(
        clean.startsWith(
            "/9j/"
        )
    ){

        mime =
            "image/jpeg";

    }else if(
        clean.startsWith(
            "R0lGODlh"
        ) ||
        clean.startsWith(
            "R0lGODdh"
        )
    ){

        mime =
            "image/gif";

    }else if(
        clean.startsWith(
            "UklGR"
        )
    ){

        mime =
            "image/webp";

    }else if(
        clean.startsWith(
            "Qk"
        )
    ){

        mime =
            "image/bmp";
    }

    const binary =
        atob(
            clean
        );

    const bytes =
        new Uint8Array(
            binary.length
        );

    for(
        let i = 0;
        i < binary.length;
        i++
    ){

        bytes[i] =
            binary.charCodeAt(i);
    }

    const blob =
        new Blob(
            [bytes],
            {
                type:mime
            }
        );

    return rememberImageObjectURL(
        URL.createObjectURL(
            blob
        )
    );
}

function isProbablyBase64(
    value
){

    if(
        typeof value !== "string"
    ){

        return false;
    }

    const s =
        value
        .trim()
        .replace(
            /\s/g,
            ""
        );

    if(
        s.length < 32
    ){

        return false;
    }

    return /^[A-Za-z0-9+/]+={0,2}$/.test(
        s
    );
}

function blobToURL(
    blob
){

    if(
        !blob
    ){

        throw new Error(
            "Empty Blob."
        );
    }

    return rememberImageObjectURL(
        URL.createObjectURL(
            blob
        )
    );
}

function bytesToURL(
    value,
    path
){

    const bytes =
        bytesFrom(
            value
        );

    if(
        !bytes
    ){

        throw new Error(
            "Invalid binary image data."
        );
    }

    const mime =
        detectMime(
            bytes,
            path
        );

    const blob =
        new Blob(
            [bytes],
            {
                type:mime
            }
        );

    return blobToURL(
        blob
    );
}

function stringToSource(
    value,
    path
){

    const s =
        String(
            value || ""
        );

    if(
        /^data:/i.test(
            s
        )
    ){

        return s;
    }

    if(
        /^https?:\/\//i.test(
            s
        ) ||
        /^blob:/i.test(
            s
        ) ||
        /^file:/i.test(
            s
        )
    ){

        return s;
    }

    if(
        isVirtualPath(
            s
        )
    ){

        return readVirtualFile(
            s,
            0
        );
    }

    if(
        /^<svg[\s>]/i.test(
            s
        ) ||
        /^<\?xml/i.test(
            s
        )
    ){

        const blob =
            new Blob(
                [s],
                {
                    type:
                        "image/svg+xml"
                }
            );

        return rememberImageObjectURL(
            URL.createObjectURL(
                blob
            )
        );
    }

    if(
        looksLikeBinaryString(
            s
        )
    ){

        return binaryStringToURL(
            s,
            path
        );
    }

    if(
        isProbablyBase64(
            s
        )
    ){

        return base64ToURL(
            s,
            path
        );
    }

    throw new Error(
        "Unsupported string image source."
    );
}

async function resolveValue(
    value,
    path,
    depth
){

    depth =
        Number(
            depth
        ) || 0;

    if(
        depth > 12
    ){

        throw new Error(
            "Image source resolution exceeded the limit."
        );
    }

    if(
        value == null
    ){

        throw new Error(
            "Filesystem returned no image data."
        );
    }

    if(
        typeof File !== "undefined" &&
        value instanceof File
    ){

        return blobToURL(
            value
        );
    }

    if(
        value instanceof Blob
    ){

        return blobToURL(
            value
        );
    }

    if(
        value instanceof ArrayBuffer
    ){

        return bytesToURL(
            value,
            path
        );
    }

    const bytes =
        bytesFrom(
            value
        );

    if(
        bytes
    ){

        return bytesToURL(
            bytes,
            path
        );
    }

    if(
        value &&
        typeof value === "object" &&
        typeof value.getFile ===
        "function"
    ){

        const file =
            await value.getFile();

        return resolveValue(
            file,
            path,
            depth + 1
        );
    }

    if(
        typeof value === "string"
    ){

        return stringToSource(
            value,
            path
        );
    }

    if(
        typeof value === "object"
    ){

        const keys = [
            "file",
            "blob",
            "content",
            "data",
            "bytes",
            "arrayBuffer",
            "buffer",
            "handle",
            "fileHandle",
            "source",
            "url",
            "src",
            "href"
        ];

        for(
            const key of keys
        ){

            if(
                !(key in value)
            ){

                continue;
            }

            let child;

            try{

                child =
                    value[key];

                if(
                    typeof child ===
                    "function"
                ){

                    child =
                        await child.call(
                            value
                        );
                }

            }catch(_){

                continue;
            }

            if(
                child == null
            ){

                continue;
            }

            try{

                return await resolveValue(
                    child,
                    path,
                    depth + 1
                );

            }catch(_){}
        }
    }

    throw new Error(
        "Unsupported image source type: " +
        Object.prototype.toString.call(
            value
        )
    );
}

async function getDeviceHandle(
    path,
    fs
){

    if(
        !fs ||
        typeof fs.getDeviceMounts !==
        "function"
    ){

        return null;
    }

    const prefix =
        "chxd:/device/";

    if(
        !String(
            path
        )
        .toLowerCase()
        .startsWith(
            prefix.toLowerCase()
        )
    ){

        return null;
    }

    const relative =
        String(
            path
        )
        .slice(
            prefix.length
        );

    const parts =
        relative
        .split("/")
        .filter(
            Boolean
        );

    if(
        parts.length < 2
    ){

        return null;
    }

    const mountName =
        parts.shift();

    const mounts =
        await fs.getDeviceMounts();

    if(
        !Array.isArray(
            mounts
        )
    ){

        return null;
    }

    const mount =
        mounts.find(
            m =>
                m &&
                String(
                    m.name
                ) ===
                String(
                    mountName
                )
        );

    if(
        !mount
    ){

        return null;
    }

    let handle =
        mount.handle ||
        mount.directoryHandle ||
        mount.rootHandle;

    if(
        !handle
    ){

        return null;
    }

    if(
        typeof handle.queryPermission ===
        "function"
    ){

        let permission =
            await handle.queryPermission(
                {
                    mode:"read"
                }
            );

        if(
            permission !==
            "granted" &&
            typeof handle.requestPermission ===
            "function"
        ){

            permission =
                await handle.requestPermission(
                    {
                        mode:"read"
                    }
                );
        }

        if(
            permission !==
            "granted"
        ){

            throw new Error(
                "File System Access permission denied for '" +
                mountName +
                "'."
            );
        }
    }

    for(
        let i = 0;
        i < parts.length;
        i++
    ){

        const part =
            parts[i];

        const last =
            i ===
            parts.length - 1;

        if(
            last
        ){

            try{

                return await handle.getFileHandle(
                    part
                );

            }catch(_){

                try{

                    return await handle.getDirectoryHandle(
                        part
                    );

                }catch(__){

                    throw new Error(
                        "Could not find '" +
                        part +
                        "' in the mounted folder."
                    );
                }
            }
        }

        if(
            typeof handle.getDirectoryHandle !==
            "function"
        ){

            return null;
        }

        handle =
            await handle.getDirectoryHandle(
                part
            );
    }

    return null;
}

async function readVirtualFile(
    path,
    depth
){

    depth =
        Number(
            depth
        ) || 0;

    if(
        depth > 12
    ){

        throw new Error(
            "Filesystem path resolution exceeded the limit."
        );
    }

    const fs =
        getFS();

    if(
        !fs
    ){

        throw new Error(
            "Little Hollow filesystem bridge is unavailable."
        );
    }

    let normalized =
        String(
            path
        );

    try{

        if(
            typeof fs.normalize ===
            "function"
        ){

            normalized =
                fs.normalize(
                    normalized
                );
        }

    }catch(_){}

    try{

        const handle =
            await getDeviceHandle(
                normalized,
                fs
            );

        if(
            handle &&
            typeof handle.getFile ===
            "function"
        ){

            const file =
                await handle.getFile();

            return blobToURL(
                file
            );
        }

    }catch(err){

        console.warn(
            "[Messenger] Direct FSA image read failed:",
            err
        );
    }

    if(
        typeof fs.read ===
        "function"
    ){

        const result =
            await fs.read(
                normalized
            );

        if(
            result &&
            typeof result ===
            "object" &&
            "ok" in result &&
            !result.ok
        ){

            throw new Error(
                result.error ||
                result.summary ||
                "Could not read image."
            );
        }

        let content =
            result &&
            typeof result ===
            "object" &&
            "content" in result
                ? result.content
                : result;

        if(
            typeof content ===
            "string" &&
            content !== normalized &&
            isVirtualPath(
                content.trim()
            )
        ){

            return readVirtualFile(
                content.trim(),
                depth + 1
            );
        }

        return resolveValue(
            content,
            normalized,
            depth + 1
        );
    }

    throw new Error(
        "Could not read filesystem image:\n" +
        normalized
    );
}

async function resolveMarkdownImage(
    img
){

    if(
        !img
    ){

        return;
    }

    const source =
        String(
            img.getAttribute(
                "src"
            ) ||
            ""
        ).trim();

    if(
        !source
    ){

        return;
    }

    if(
        !isVirtualPath(
            source
        )
    ){

        return;
    }

    if(
        img.dataset.virtualImageLoading ===
        "1"
    ){

        return;
    }

    img.dataset.virtualImageLoading =
        "1";

    try{

        const resolved =
            await readVirtualFile(
                source,
                0
            );

        if(
            resolved
        ){

            img.dataset.virtualImagePath =
                source;

            img.src =
                resolved;
        }

    }catch(err){

        console.error(
            "[Messenger] Virtual image load failed:",
            source,
            err
        );

    }finally{

        delete img.dataset.virtualImageLoading;
    }
}

function getReferencePathName(
    path
){

    const cleanPath =
        String(
            path ?? ""
        ).trim();

    if(
        !cleanPath
    ){

        return "download";
    }

    const withoutQuery =
        cleanPath
        .split("?")[0]
        .split("#")[0];

    const parts =
        withoutQuery.split("/");

    const last =
        parts[
            parts.length - 1
        ];

    return last ||
        "download";
}

function getMimeType(
    path
){

    const name =
        getReferencePathName(
            path
        )
        .toLowerCase();

    const extensionValue =
        name.includes(".")
            ? name.slice(
                name.lastIndexOf(".")
            )
            : "";

    const types = {
        ".txt":"text/plain",
        ".md":"text/markdown",
        ".html":"text/html",
        ".htm":"text/html",
        ".css":"text/css",
        ".js":"text/javascript",
        ".json":"application/json",
        ".xml":"application/xml",
        ".csv":"text/csv",
        ".svg":"image/svg+xml",
        ".png":"image/png",
        ".jpg":"image/jpeg",
        ".jpeg":"image/jpeg",
        ".gif":"image/gif",
        ".webp":"image/webp",
        ".bmp":"image/bmp",
        ".wav":"audio/wav",
        ".mp3":"audio/mpeg",
        ".ogg":"audio/ogg",
        ".m4a":"audio/mp4",
        ".aac":"audio/aac",
        ".flac":"audio/flac",
        ".mp4":"video/mp4",
        ".webm":"video/webm",
        ".mov":"video/quicktime",
        ".pdf":"application/pdf",
        ".zip":"application/zip",
        ".mid":"audio/midi",
        ".midi":"audio/midi",
        ".pkp":"text/plain"
    };

    return (
        types[
            extensionValue
        ] ||
        "application/octet-stream"
    );
}

async function downloadReference(
    path
){

    const cleanPath =
        String(
            path ?? ""
        ).trim();

    if(
        !cleanPath
    ){

        return;
    }

    try{

        if(
            /^https?:\/\//i.test(
                cleanPath
            )
        ){

            triggerBrowserDownload(
                cleanPath,
                getReferencePathName(
                    cleanPath
                )
            );

            return;
        }

        if(
            !parentWindow.FS ||
            typeof parentWindow.FS.read !==
            "function"
        ){

            throw new Error(
                "Little Hollow filesystem API is unavailable."
            );
        }

        const result =
            await parentWindow.FS.read(
                cleanPath
            );

        if(
            !result ||
            result.ok === false
        ){

            throw new Error(
                result?.error ||
                "Could not read file."
            );
        }

        const filename =
            getReferencePathName(
                cleanPath
            );

        let blob =
            null;

        if(
            result.blob instanceof Blob
        ){

            blob =
                result.blob;

        }else if(
            result.arrayBuffer instanceof
            ArrayBuffer
        ){

            blob =
                new Blob(
                    [
                        result.arrayBuffer
                    ],
                    {
                        type:
                            result.mimeType ||
                            result.type ||
                            getMimeType(
                                cleanPath
                            )
                    }
                );

        }else if(
            result.bytes instanceof
            Uint8Array
        ){

            blob =
                new Blob(
                    [
                        result.bytes
                    ],
                    {
                        type:
                            result.mimeType ||
                            result.type ||
                            getMimeType(
                                cleanPath
                            )
                    }
                );

        }else if(
            result.content != null
        ){

            blob =
                new Blob(
                    [
                        String(
                            result.content
                        )
                    ],
                    {
                        type:
                            result.mimeType ||
                            result.type ||
                            getMimeType(
                                cleanPath
                            )
                    }
                );

        }else{

            throw new Error(
                "Filesystem returned no downloadable content."
            );
        }

        const objectURL =
            URL.createObjectURL(
                blob
            );

        try{

            triggerBrowserDownload(
                objectURL,
                filename
            );

        }finally{

            setTimeout(
                ()=>{
                    try{

                        URL.revokeObjectURL(
                            objectURL
                        );

                    }catch(_){}
                },
                1000
            );
        }

    }catch(err){

        console.error(
            "Could not download:",
            err
        );

        addRow(
            "Could not download " +
            cleanPath +
            ": " +
            (err?.message || err),
            "sys"
        );
    }
}

function replaceReferencesInElement(
    element
){

    if(
        !element
    ){

        return;
    }

    const walker =
        document.createTreeWalker(
            element,
            NodeFilter.SHOW_TEXT
        );

    const nodes = [];

    let current;

    while(
        (current =
            walker.nextNode())
    ){

        const parent =
            current.parentElement;

        if(
            !parent
        ){

            continue;
        }

        if(
            parent.closest("pre") ||
            parent.closest("code") ||
            parent.closest("a") ||
            parent.closest(".reference-button")
        ){

            continue;
        }

        const text =
            current.nodeValue ||
            "";

        if(
            /\[(?:file|download|app):[^\]]+\]/
                .test(
                    text
                )
        ){

            nodes.push(
                current
            );
        }
    }

    for(
        const node of nodes
    ){

        const text =
            node.nodeValue ||
            "";

        FILE_REFERENCE_REGEX.lastIndex =
            0;

        DOWNLOAD_REFERENCE_REGEX.lastIndex =
            0;

        APP_REFERENCE_REGEX.lastIndex =
            0;

        const matches = [];

        let match;

        while(
            (
                match =
                    FILE_REFERENCE_REGEX.exec(
                        text
                    )
            )
        ){

            matches.push({
                index:
                    match.index,

                length:
                    match[0].length,

                type:
                    "file",

                value:
                    String(
                        match[1] || ""
                    ).trim()
            });
        }

        while(
            (
                match =
                    DOWNLOAD_REFERENCE_REGEX.exec(
                        text
                    )
            )
        ){

            matches.push({
                index:
                    match.index,

                length:
                    match[0].length,

                type:
                    "download",

                value:
                    String(
                        match[1] || ""
                    ).trim()
            });
        }

        while(
            (
                match =
                    APP_REFERENCE_REGEX.exec(
                        text
                    )
            )
        ){

            matches.push({
                index:
                    match.index,

                length:
                    match[0].length,

                type:
                    "app",

                value:
                    String(
                        match[1] || ""
                    ).trim()
            });
        }

        matches.sort(
            (a,b)=>
                a.index -
                b.index
        );

        if(
            !matches.length
        ){

            continue;
        }

        const fragment =
            document.createDocumentFragment();

        let lastIndex =
            0;

        for(
            const item of matches
        ){

            if(
                item.index <
                lastIndex
            ){

                continue;
            }

            if(
                item.index >
                lastIndex
            ){

                fragment.appendChild(
                    document.createTextNode(
                        text.slice(
                            lastIndex,
                            item.index
                        )
                    )
                );
            }

            if(
                item.value
            ){

                if(
                    item.type ===
                    "file"
                ){

                    fragment.appendChild(
                        createFileReference(
                            item.value
                        )
                    );

                }else if(
                    item.type ===
                    "download"
                ){

                    fragment.appendChild(
                        createDownloadReference(
                            item.value
                        )
                    );

                }else if(
                    item.type ===
                    "app"
                ){

                    fragment.appendChild(
                        createAppReference(
                            item.value
                        )
                    );
                }

            }else{

                fragment.appendChild(
                    document.createTextNode(
                        text.slice(
                            item.index,
                            item.index +
                            item.length
                        )
                    )
                );
            }

            lastIndex =
                item.index +
                item.length;
        }

        if(
            lastIndex <
            text.length
        ){

            fragment.appendChild(
                document.createTextNode(
                    text.slice(
                        lastIndex
                    )
                )
            );
        }

        node.parentNode.replaceChild(
            fragment,
            node
        );
    }
}

function normalizeVisibleMessage(
    result
){

    if(
        !result
    ){

        return "";
    }

    if(
        typeof result ===
        "string"
    ){

        return result;
    }

    if(
        typeof result.visibleMessage ===
        "string"
    ){

        return result.visibleMessage;
    }

    if(
        typeof result.message ===
        "string"
    ){

        return result.message;
    }

    if(
        typeof result.text ===
        "string"
    ){

        return result.text;
    }

    if(
        typeof result.content ===
        "string"
    ){

        return result.content;
    }

    if(
        Array.isArray(
            result.parts
        )
    ){

        return result.parts.map(
            part => {

                if(
                    typeof part ===
                    "string"
                ){

                    return part;
                }

                if(
                    typeof part?.text ===
                    "string"
                ){

                    return part.text;
                }

                return "";
            }
        ).join("");
    }

    return "";
}

function normalizeLog(
    result
){

    if(
        !result
    ){

        return [];
    }

    if(
        Array.isArray(
            result.log
        )
    ){

        return result.log.map(
            x =>
                String(
                    x
                )
        );
    }

    return [];
}

    streamText +=
        detail.token;

    updatePending(
        streamText
    );
}

async function sha256(
    value
){

    const data =
        new TextEncoder().encode(
            value
        );

    const digest =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    return Array.from(
        new Uint8Array(
            digest
        )
    )
    .map(
        value =>
            value
                .toString(16)
                .padStart(
                    2,
                    "0"
                )
    )
    .join("");
}

async function matchesHash(
    value,
    hash
){

    try{

        return await sha256(
            value
                .trim()
                .toLowerCase()
        ) === hash;

    }catch(_){

        return false;
    }
}

async function sendResponseToLittleHollowAPI(
    text,
    meta = {}
){

    const ai =
        parentWindow?.LittleHollowAI;

    if(
        !ai
    ){

        throw new Error(
            "LittleHollowAI response API is unavailable"
        );
    }

    const methods = [
        "handleResponse",
        "postResponse",
        "processResponse",
        "ingestResponse",
        "receive"
    ];

    for(
        const method of methods
    ){

        if(
            typeof ai[method] !==
            "function"
        ){

            continue;
        }

        return await ai[method](
            text,
            {
                source:
                    meta.source ||
                    "messenger",

                debug:
                    !!meta.debug,

                provider:
                    meta.provider ||
                    null,

                model:
                    meta.model ||
                    null
            }
        );
    }

    throw new Error(
        "LittleHollowAI has no response-processing API"
    );
}

        );
    }
}

async function send(){

    const text =
        input.value.trim();

    if(
        !text ||
        busy
    ){

        return;
    }

    if(
        await matchesHash(
            text,
            debugOnHash
        )
    ){

        input.value =
            "";

        debugMode =
            true;

        addRow(
            text,
            "user"
        );

        addRow(
            "DEBUG MODE ON — AI sending blocked.",
            "sys"
        );

        setStatus(
            "DEBUG MODE — AI SEND BLOCKED",
            true
        );

        input.focus();

        return;
    }

    if(
        await matchesHash(
            text,
            debugOffHash
        )
    ){

        input.value =
            "";

        addRow(
            text,
            "user"
        );

        debugMode =
            false;

        addRow(
            "DEBUG MODE OFF — normal AI sending restored.",
            "sys"
        );

        setStatus(
            "ONLINE",
            false
        );

        input.focus();

        return;
    }

    if(
        debugMode
    ){

        input.value =
            "";

        addRow(
            text,
            "user"
        );

        busy =
            true;

        sendBtn.disabled =
            true;

        setStatus(
            "DEBUG MODE — processing simulated AI response",
            true
        );

        try{

            await processDebugMessage(
                text
            );

        }finally{

            busy =
                false;

            sendBtn.disabled =
                false;

            setStatus(
                "DEBUG MODE — AI SEND BLOCKED",
                true
            );

            input.focus();
        }

        return;
    }

    input.value =
        "";

    addRow(
        text,
        "user"
    );

    busy =
        true;

    streamText =
        "";

    sendBtn.disabled =
        true;

    const pending =
        document.createElement(
            "div"
        );

    pending.className =
        "msg-row ai";

    const content =
        document.createElement(
            "div"
        );

    content.className =
        "message-markdown";

    content.textContent =
        "...";

    pending.appendChild(
        content
    );

    log.appendChild(
        pending
    );

    activePending =
        pending;

    setStatus(
        "AI THINKING...",
        false
    );

    try{

        const result =
            await sendToAI(
                text
            );

        const visible =
            normalizeVisibleMessage(
                result
            );

        if(
            visible
        ){

            updatePending(
                visible
            );

        }else if(
            streamText
        ){

            updatePending(
                streamText
            );

        }else{

            updatePending(
                "[Little Hollow returned an empty response]"
            );
        }

        const logs =
            normalizeLog(
                result
            );

        if(
            logs.length
        ){

            addRow(
                logs.join(
                    " | "
                ),
                "sys"
            );
        }

    }catch(err){

        updatePending(
            "Error talking to Little Hollow: " +
            (
                err?.message ||
                err
            )
        );

    }finally{

        activePending =
            null;

        busy =
            false;

        sendBtn.disabled =
            false;

        setStatus(
            debugMode
                ? "DEBUG MODE — AI SEND BLOCKED"
                : "ONLINE",
            debugMode
        );

        input.focus();
    }
}

sendBtn.addEventListener(
    "click",
    send
);

input.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            send();
        }
    }
);

window.addEventListener(
    "beforeunload",
    cleanupImageObjectURLs
);

addRow(
    "Little Hollow is online. Say hello!",
    "sys"
);

if(
    !mark ||
    typeof mark.parse !==
    "function"
){

    addRow(
        "Markdown parser unavailable.",
        "sys"
    );
}

setStatus(
    "ONLINE",
    false
);

input.focus();

</script>

</body>
</html>
