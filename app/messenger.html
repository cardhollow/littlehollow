<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messenger</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:monospace;
}

html,
body{
    width:100%;
    height:100%;
    background:#000d0d;
    color:#00FFFF;
}

.msg-app{
    display:flex;
    flex-direction:column;
    height:100%;
}

.msg-log{
    flex:1 1 auto;
    overflow-y:auto;
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.msg-row{
    max-width:86%;
    padding:8px 10px;
    border:1px solid #00FFFF;
    font-size:13px;
    line-height:1.4;
    word-break:break-word;
}

.msg-row.user{
    align-self:flex-end;
    background:rgba(0,255,255,0.14);
    white-space:pre-wrap;
}

.msg-row.ai{
    align-self:flex-start;
    background:rgba(0,255,255,0.04);
}

.msg-row.sys{
    align-self:center;
    opacity:.55;
    font-size:10px;
    border-style:dashed;
    max-width:96%;
    white-space:pre-wrap;
}

.msg-row.debug{
    border-style:dotted;
    background:rgba(255,255,0,.035);
}

.message-markdown{
    white-space:normal;
}

.message-markdown p{
    margin:0 0 8px;
}

.message-markdown p:last-child{
    margin-bottom:0;
}

.message-markdown h1,
.message-markdown h2,
.message-markdown h3,
.message-markdown h4,
.message-markdown h5,
.message-markdown h6{
    margin:10px 0 6px;
}

.message-markdown ul,
.message-markdown ol{
    margin:6px 0 8px 20px;
}

.message-markdown blockquote{
    margin:8px 0;
    padding-left:10px;
    border-left:2px solid #00FFFF;
    opacity:.85;
}

.message-markdown pre{
    overflow:auto;
    padding:8px;
    margin:8px 0;
    border:1px solid rgba(0,255,255,.45);
    background:#001515;
}

.message-markdown code{
    font-family:monospace;
}

.message-markdown :not(pre)>code{
    padding:1px 4px;
    background:rgba(0,255,255,.08);
}

.message-markdown table{
    border-collapse:collapse;
    width:100%;
    margin:8px 0;
}

.message-markdown th,
.message-markdown td{
    border:1px solid rgba(0,255,255,.45);
    padding:5px 7px;
    vertical-align:top;
}

.message-markdown img{
    max-width:100%;
    height:auto;
}

.message-markdown a{
    color:#00FFFF;
}

.message-markdown hr{
    border:none;
    border-top:1px solid rgba(0,255,255,.5);
    margin:10px 0;
}

.message-markdown input[type="checkbox"]{
    accent-color:#00FFFF;
}

.reference-button{
    display:inline-flex;
    align-items:center;
    gap:5px;
    border:1px solid rgba(0,255,255,.65);
    background:rgba(0,255,255,.08);
    color:#00FFFF;
    padding:1px 5px;
    margin:0 1px;
    cursor:pointer;
    font-family:monospace;
    font-size:inherit;
    line-height:1.3;
    text-decoration:none;
    vertical-align:baseline;
    user-select:none;
}

.reference-button:hover{
    background:rgba(0,255,255,.18);
}

.reference-button:active{
    background:#00FFFF;
    color:#000;
}

.file-reference::before{
    content:"📄";
    font-size:.9em;
}

.download-reference::before{
    content:"⬇";
    font-size:.9em;
}

.app-reference::before{
    content:"▣";
    font-size:.9em;
}

.msg-status{
    flex:0 0 auto;
    min-height:18px;
    padding:3px 12px;
    font-size:10px;
    border-top:1px solid rgba(0,255,255,.35);
    opacity:.65;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.msg-status.debug{
    color:#FFFF00;
    border-top-color:rgba(255,255,0,.45);
}

.msg-inputbar{
    flex:0 0 auto;
    display:flex;
    border-top:1px solid #00FFFF;
}

.msg-inputbar input{
    flex:1 1 auto;
    border:none;
    background:transparent;
    padding:10px;
    color:#00FFFF;
    font-family:monospace;
    font-size:13px;
    outline:none;
}

.msg-inputbar button{
    flex:0 0 auto;
    border:none;
    border-left:1px solid #00FFFF;
    background:transparent;
    color:#00FFFF;
    padding:0 16px;
    cursor:pointer;
    font-family:monospace;
}

.msg-inputbar button:active{
    background:#00FFFF;
    color:#000;
}

.msg-inputbar button:disabled{
    opacity:.45;
    cursor:wait;
}

.msg-log::-webkit-scrollbar{
    width:8px;
}

.msg-log::-webkit-scrollbar-thumb{
    background:#00FFFF;

</head>

<body>

<div class="msg-app">

    <div class="msg-log" id="log"></div>

    <div class="msg-status" id="status">
        ONLINE
    </div>

    <div class="msg-inputbar">

        <input
            id="input"
            type="text"
            placeholder="Message Little Hollow..."
            autocomplete="off"
            spellcheck="false"
        >

        <button id="sendBtn">
            SEND
        </button>

    </div>

</div>

<script type="module">

import "../js/markdown.js";

const log =
    document.getElementById("log");

const input =
    document.getElementById("input");

const sendBtn =
    document.getElementById("sendBtn");

const status =
    document.getElementById("status");

const mark =
    globalThis.marked;

let busy = false;
let streamText = "";
let activePending = null;
let debugMode = false;

const debugOnHash =
    "3dd2d6ca32529ed36595723bd9e75e8e2336940f900b5c0e676785588352c69a";

const debugOffHash =
    "f36d9a83b5e38fd59c495206f1eb15f52681455b1766647a9f5d2877d43e0611";

const parentWindow =
    window.parent &&
    window.parent !== window
        ? window.parent
        : window;

const FILE_REFERENCE_REGEX =
    /\[file:([^\]]+)\]/g;

const DOWNLOAD_REFERENCE_REGEX =
    /\[download:([^\]]+)\]/g;

const APP_REFERENCE_REGEX =
    /\[app:([^\]]+)\]/g;

function getReferencePathName(path){
    const cleanPath =
        String(path ?? "").trim();

    if(!cleanPath){
        return "download";
    }

    const withoutQuery =
        cleanPath
            .split("?")[0]
            .split("#")[0];

    const parts =
        withoutQuery.split("/");

    const last =
        parts[parts.length - 1];

    return last || "download";
}

function getMimeType(path){
    const name =
        getReferencePathName(path)
            .toLowerCase();

    const extension =
        name.includes(".")
            ? name.slice(name.lastIndexOf("."))
            : "";

    const types = {
        ".txt":"text/plain",
        ".md":"text/markdown",
        ".html":"text/html",
        ".htm":"text/html",
        ".css":"text/css",
        ".js":"text/javascript",
        ".json":"application/json",
        ".xml":"application/xml",
        ".csv":"text/csv",
        ".svg":"image/svg+xml",
        ".png":"image/png",
        ".jpg":"image/jpeg",
        ".jpeg":"image/jpeg",
        ".gif":"image/gif",
        ".webp":"image/webp",
        ".bmp":"image/bmp",
        ".wav":"audio/wav",
        ".mp3":"audio/mpeg",
        ".ogg":"audio/ogg",
        ".m4a":"audio/mp4",
        ".aac":"audio/aac",
        ".flac":"audio/flac",
        ".mp4":"video/mp4",
        ".webm":"video/webm",
        ".mov":"video/quicktime",
        ".pdf":"application/pdf",
        ".zip":"application/zip",
        ".mid":"audio/midi",
        ".midi":"audio/midi",
        ".pkp":"text/plain"
    };

    return (
        types[extension] ||
        "application/octet-stream"
    );
}

async function openFileReference(path){

    const cleanPath =
        String(path ?? "").trim();

    if(!cleanPath){
        return;
    }

    try{

        if(
            parentWindow.Apps &&
            typeof parentWindow.Apps.openApp === "function"
        ){

            const result =
                await parentWindow.Apps.openApp(
                    "filemanager",
                    {
                        path:cleanPath,
                        allowMultiple:true
                    }
                );

            if(
                result &&
                result.ok === false
            ){

                console.error(
                    "File Manager error:",
                    result.error ||
                    result.summary
                );

                addRow(
                    "Could not open File Manager: " +
                    (
                        result.error ||
                        result.summary ||
                        "Unknown error."
                    ),
                    "sys"
                );

            }

            return;
        }

        throw new Error(
            "Little Hollow Apps API is unavailable."
        );

    }catch(err){

        console.error(
            "Could not open File Manager:",
            err
        );

        addRow(
            "Could not open File Manager: " +
            (err?.message || err),
            "sys"
        );
    }
}

async function openAppReference(name){

    const cleanName =
        String(name ?? "").trim();

    if(!cleanName){
        return;
    }

    try{

        if(
            parentWindow.Apps &&
            typeof parentWindow.Apps.openApp === "function"
        ){

            const result =
                await parentWindow.Apps.openApp(
                    cleanName,
                    {
                        allowMultiple:false
                    }
                );

            if(
                result &&
                result.ok === false
            ){

                console.error(
                    "Application error:",
                    result.error ||
                    result.summary
                );

                addRow(
                    "Could not open application: " +
                    (
                        result.error ||
                        result.summary ||
                        cleanName
                    ),
                    "sys"
                );

            }

            return;
        }

        throw new Error(
            "Little Hollow Apps API is unavailable."
        );

    }catch(err){

        console.error(
            "Could not open application:",
            err
        );

        addRow(
            "Could not open application: " +
            (err?.message || err),
            "sys"
        );
    }
}

function triggerBrowserDownload(
    url,
    filename
){

    const anchor =
        document.createElement("a");

    anchor.href =
        url;

    anchor.download =
        filename ||
        "download";

    anchor.target =
        "_blank";

    anchor.rel =
        "noopener noreferrer";

    document.body.appendChild(
        anchor
    );

    anchor.click();

    anchor.remove();
}

async function downloadReference(path){

    const cleanPath =
        String(path ?? "").trim();

    if(!cleanPath){
        return;
    }

    try{

        if(
            /^https?:\/\//i.test(
                cleanPath
            )
        ){

            triggerBrowserDownload(
                cleanPath,
                getReferencePathName(
                    cleanPath
                )
            );

            return;
        }

        if(
            !parentWindow.FS ||
            typeof parentWindow.FS.read !== "function"
        ){
            throw new Error(
                "Little Hollow filesystem API is unavailable."
            );
        }

        const result =
            await parentWindow.FS.read(
                cleanPath
            );

        if(
            !result ||
            result.ok === false
        ){
            throw new Error(
                result?.error ||
                "Could not read file."
            );
        }

        const filename =
            getReferencePathName(
                cleanPath
            );

        let blob = null;

        if(
            result.blob instanceof Blob
        ){

            blob =
                result.blob;

        }else if(
            result.arrayBuffer instanceof ArrayBuffer
        ){

            blob =
                new Blob(
                    [result.arrayBuffer],
                    {
                        type:
                            result.mimeType ||
                            result.type ||
                            getMimeType(cleanPath)
                    }
                );

        }else if(
            result.bytes instanceof Uint8Array
        ){

            blob =
                new Blob(
                    [result.bytes],
                    {
                        type:
                            result.mimeType ||
                            result.type ||
                            getMimeType(cleanPath)
                    }
                );

        }else if(
            result.content != null
        ){

            blob =
                new Blob(
                    [
                        String(
                            result.content
                        )
                    ],
                    {
                        type:
                            result.mimeType ||
                            result.type ||
                            getMimeType(cleanPath)
                    }
                );

        }else{

            throw new Error(
                "Filesystem returned no downloadable content."
            );

        }

        const objectURL =
            URL.createObjectURL(
                blob
            );

        try{

            triggerBrowserDownload(
                objectURL,
                filename
            );

        }finally{

            setTimeout(
                ()=>{
                    try{
                        URL.revokeObjectURL(
                            objectURL
                        );
                    }catch(_){}
                },
                1000
            );

        }

    }catch(err){

        console.error(
            "Could not download:",
            err
        );

        addRow(
            "Could not download " +
            cleanPath +
            ": " +
            (err?.message || err),
            "sys"
        );
    }
}

function createFileReference(path){

    const button =
        document.createElement("button");

    button.type = "button";

    button.className =
        "reference-button file-reference";

    button.textContent =
        path;

    button.dataset.filePath =
        path;

    button.title =
        "Open in File Manager: " +
        path;

    button.addEventListener(
        "click",
        event => {

            event.preventDefault();
            event.stopPropagation();

            openFileReference(path);
        }
    );

    return button;
}

function createDownloadReference(path){

    const button =
        document.createElement("button");

    button.type = "button";

    button.className =
        "reference-button download-reference";

    button.textContent =
        path;

    button.dataset.downloadPath =
        path;

    button.title =
        "Download: " +
        path;

    button.addEventListener(
        "click",
        event => {

            event.preventDefault();
            event.stopPropagation();

            downloadReference(path);
        }
    );

    return button;
}

function createAppReference(name){

    const button =
        document.createElement("button");

    button.type = "button";

    button.className =
        "reference-button app-reference";

    button.textContent =
        name;

    button.dataset.appName =
        name;

    button.title =
        "Open application: " +
        name;

    button.addEventListener(
        "click",
        event => {

            event.preventDefault();
            event.stopPropagation();

            openAppReference(name);
        }
    );

    return button;
}

function replaceReferencesInElement(
    element
){

    if(!element){
        return;
    }

    const walker =
        document.createTreeWalker(
            element,
            NodeFilter.SHOW_TEXT
        );

    const nodes = [];

    let current;

    while(
        (current = walker.nextNode())
    ){

        const parent =
            current.parentElement;

        if(!parent){
            continue;
        }

        if(
            parent.closest("pre") ||
            parent.closest("code") ||
            parent.closest("a") ||
            parent.closest(".reference-button")
        ){
            continue;
        }

        const text =
            current.nodeValue || "";

        if(
            /\[(?:file|download|app):[^\]]+\]/
                .test(text)
        ){

            nodes.push(
                current
            );

        }
    }

    for(
        const node of nodes
    ){

        const text =
            node.nodeValue || "";

        FILE_REFERENCE_REGEX.lastIndex = 0;
        DOWNLOAD_REFERENCE_REGEX.lastIndex = 0;
        APP_REFERENCE_REGEX.lastIndex = 0;

        const matches = [];

        let match;

        while(
            (match =
                FILE_REFERENCE_REGEX.exec(text))
        ){

            matches.push({
                index:match.index,
                length:match[0].length,
                type:"file",
                value:String(
                    match[1] || ""
                ).trim()
            });
        }

        while(
            (match =
                DOWNLOAD_REFERENCE_REGEX.exec(text))
        ){

            matches.push({
                index:match.index,
                length:match[0].length,
                type:"download",
                value:String(
                    match[1] || ""
                ).trim()
            });
        }

        while(
            (match =
                APP_REFERENCE_REGEX.exec(text))
        ){

            matches.push({
                index:match.index,
                length:match[0].length,
                type:"app",
                value:String(
                    match[1] || ""
                ).trim()
            });
        }

        matches.sort(
            (a,b)=>
                a.index - b.index
        );

        if(!matches.length){
            continue;
        }

        const fragment =
            document.createDocumentFragment();

        let lastIndex = 0;

        for(
            const item of matches
        ){

            if(
                item.index < lastIndex
            ){
                continue;
            }

            if(
                item.index > lastIndex
            ){

                fragment.appendChild(
                    document.createTextNode(
                        text.slice(
                            lastIndex,
                            item.index
                        )
                    )
                );
            }

            if(item.value){

                if(
                    item.type === "file"
                ){

                    fragment.appendChild(
                        createFileReference(
                            item.value
                        )
                    );

                }else if(
                    item.type === "download"
                ){

                    fragment.appendChild(
                        createDownloadReference(
                            item.value
                        )
                    );

                }else if(
                    item.type === "app"
                ){

                    fragment.appendChild(
                        createAppReference(
                            item.value
                        )
                    );

                }

            }else{

                fragment.appendChild(
                    document.createTextNode(
                        text.slice(
                            item.index,
                            item.index +
                            item.length
                        )
                    )
                );

            }

            lastIndex =
                item.index +
                item.length;
        }

        if(
            lastIndex < text.length
        ){

            fragment.appendChild(
                document.createTextNode(
                    text.slice(
                        lastIndex
                    )
                )
            );
        }

        node.parentNode.replaceChild(
            fragment,
            node
        );
    }
}

function parseFileReferences(element){

    replaceReferencesInElement(
        element
    );
}

function setStatus(
    text,
    isDebug = false
){

    status.textContent =
        text || "";

    status.classList.toggle(
        "debug",
        !!isDebug
    );
}

function addRow(
    text,
    cls
){

    const row =
        document.createElement("div");

    row.className =
        "msg-row " + cls;

    row.textContent =
        String(text ?? "");

    log.appendChild(row);

    log.scrollTop =
        log.scrollHeight;

    return row;
}

function renderMarkdown(
    element,
    text
){

    const source =
        String(text ?? "");

    if(
        !mark ||
        typeof mark.parse !== "function"
    ){

        element.textContent =
            source;

        parseFileReferences(
            element
        );

        return;
    }

    try{

        element.innerHTML =
            mark.parse(
                source,
                {
                    gfm: true,
                    breaks: true
                }
            );

        parseFileReferences(
            element
        );

    }catch(err){

        element.textContent =
            source;

        parseFileReferences(
            element
        );

        console.error(
            "Markdown parse error:",
            err
        );
    }
}

function addMarkdownRow(
    text,
    cls = "ai"
){

    const row =
        document.createElement("div");

    row.className =
        "msg-row " + cls;

    const content =
        document.createElement("div");

    content.className =
        "message-markdown";

    renderMarkdown(
        content,
        text
    );

    row.appendChild(
        content
    );

    log.appendChild(
        row
    );

    log.scrollTop =
        log.scrollHeight;

    return row;
}

function updatePending(
    text
){

    if(!activePending){
        return;
    }

    const content =
        activePending.querySelector(
            ".message-markdown"
        );

    if(content){

        renderMarkdown(
            content,
            text
        );
    }

    log.scrollTop =
        log.scrollHeight;
}

function normalizeVisibleMessage(
    result
){

    if(!result){
        return "";
    }

    if(
        typeof result === "string"
    ){

        return result;
    }

    if(
        typeof result.visibleMessage ===
        "string"
    ){

        return result.visibleMessage;
    }

    if(
        typeof result.message ===
        "string"
    ){

        return result.message;
    }

    if(
        typeof result.text ===
        "string"
    ){

        return result.text;
    }

    if(
        typeof result.content ===
        "string"
    ){

        return result.content;
    }

    if(
        Array.isArray(result.parts)
    ){

        return result.parts.map(
            part => {

                if(
                    typeof part === "string"
                ){

                    return part;
                }

                if(
                    typeof part?.text ===
                    "string"
                ){

                    return part.text;
                }

                return "";
            }
        ).join("");
    }

    return "";
}

function normalizeLog(
    result
){

    if(!result){
        return [];
    }

    if(
        Array.isArray(result.log)
    ){

        return result.log.map(
            x => String(x)
        );
    }

    return [];
}

function handleAIStream(
    event
){

    if(
        !busy ||
        !activePending
    ){

        return;
    }

    const detail =
        event?.detail || {};

    if(
        typeof detail.token !==
        "string"
    ){

        return;
    }

    streamText +=
        detail.token;

    updatePending(
        streamText
    );
}

try{

    parentWindow.addEventListener(
        "littlehollow:ai-stream",
        handleAIStream
    );

}catch(_){}

async function sha256(
    value
){

    const data =
        new TextEncoder().encode(
            value
        );

    const digest =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    return Array.from(
        new Uint8Array(digest)
    )
    .map(
        value =>
            value
                .toString(16)
                .padStart(2,"0")
    )
    .join("");
}

async function matchesHash(
    value,
    hash
){

    try{

        return await sha256(
            value
                .trim()
                .toLowerCase()
        ) === hash;

    }catch(_){

        return false;
    }
}

async function sendResponseToLittleHollowAPI(
    text,
    meta = {}
){

    const ai =
        parentWindow?.LittleHollowAI;

    if(!ai){

        throw new Error(
            "LittleHollowAI response API is unavailable"
        );
    }

    const methods = [
        "handleResponse",
        "postResponse",
        "processResponse",
        "ingestResponse",
        "receive"
    ];

    for(
        const method of methods
    ){

        if(
            typeof ai[method] !==
            "function"
        ){

            continue;
        }

        return await ai[method](
            text,
            {
                source:
                    meta.source ||
                    "messenger",

                debug:
                    !!meta.debug,

                provider:
                    meta.provider ||
                    null,

                model:
                    meta.model ||
                    null
            }
        );
    }

    throw new Error(
        "LittleHollowAI has no response-processing API"
    );
}

async function processDebugMessage(
    text
){

    const row =
        addMarkdownRow(
            text,
            "ai debug"
        );

    try{

        const result =
            await sendResponseToLittleHollowAPI(
                text,
                {
                    source:
                        "messenger-debug",

                    debug:true
                }
            );

        const visible =
            normalizeVisibleMessage(
                result
            );

        if(
            visible &&
            visible !== text
        ){

            renderMarkdown(
                row.querySelector(
                    ".message-markdown"
                ),
                visible
            );
        }

        const logs =
            normalizeLog(
                result
            );

        if(logs.length){

            addRow(
                logs.join(" | "),
                "sys"
            );
        }

    }catch(err){

        addRow(
            "Debug response API error: " +
            (err?.message || err),
            "sys"
        );
    }
}

async function sendToAI(
    text
){

    const ai =
        parentWindow?.LittleHollowAI;

    if(
        !ai ||
        typeof ai.send !== "function"
    ){

        throw new Error(
            "parent.LittleHollowAI.send is not available"
        );
    }

    return await ai.send(
        text
    );
}

async function send(){

    const text =
        input.value.trim();

    if(
        !text ||
        busy
    ){

        return;
    }

    if(
        await matchesHash(
            text,
            debugOnHash
        )
    ){

        input.value = "";

        debugMode = true;

        addRow(
            text,
            "user"
        );

        addRow(
            "DEBUG MODE ON — AI sending blocked.",
            "sys"
        );

        setStatus(
            "DEBUG MODE — AI SEND BLOCKED",
            true
        );

        input.focus();

        return;
    }

    if(
        await matchesHash(
            text,
            debugOffHash
        )
    ){

        input.value = "";

        addRow(
            text,
            "user"
        );

        debugMode = false;

        addRow(
            "DEBUG MODE OFF — normal AI sending restored.",
            "sys"
        );

        setStatus(
            "ONLINE",
            false
        );

        input.focus();

        return;
    }

    if(debugMode){

        input.value = "";

        addRow(
            text,
            "user"
        );

        busy = true;
        sendBtn.disabled = true;

        setStatus(
            "DEBUG MODE — processing simulated AI response",
            true
        );

        try{

            await processDebugMessage(
                text
            );

        }finally{

            busy = false;

            sendBtn.disabled = false;

            setStatus(
                "DEBUG MODE — AI SEND BLOCKED",
                true
            );

            input.focus();
        }

        return;
    }

    input.value = "";

    addRow(
        text,
        "user"
    );

    busy = true;

    streamText = "";

    sendBtn.disabled = true;

    const pending =
        document.createElement("div");

    pending.className =
        "msg-row ai";

    const content =
        document.createElement("div");

    content.className =
        "message-markdown";

    content.textContent =
        "...";

    pending.appendChild(
        content
    );

    log.appendChild(
        pending
    );

    activePending =
        pending;

    setStatus(
        "AI THINKING...",
        false
    );

    try{

        const result =
            await sendToAI(
                text
            );

        const visible =
            normalizeVisibleMessage(
                result
            );

        if(visible){

            updatePending(
                visible
            );

        }else if(streamText){

            updatePending(
                streamText
            );

        }else{

            updatePending(
                "[Little Hollow returned an empty response]"
            );
        }

        const logs =
            normalizeLog(
                result
            );

        if(logs.length){

            addRow(
                logs.join(" | "),
                "sys"
            );
        }

    }catch(err){

        updatePending(
            "Error talking to Little Hollow: " +
            (err?.message || err)
        );

    }finally{

        activePending = null;

        busy = false;

        sendBtn.disabled = false;

        setStatus(
            debugMode
                ? "DEBUG MODE — AI SEND BLOCKED"
                : "ONLINE",
            debugMode
        );

        input.focus();
    }
}

sendBtn.addEventListener(
    "click",
    send
);

input.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            event.preventDefault();

            send();
        }
    }
);

addRow(
    "Little Hollow is online. Say hello!",
    "sys"
);

if(
    !mark ||
    typeof mark.parse !== "function"
){

    addRow(
        "Markdown parser unavailable.",
        "sys"
    );
}

setStatus(
    "ONLINE",
    false
);

input.focus();

</script>

</body>
