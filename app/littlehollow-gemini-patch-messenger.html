<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Messenger</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:monospace;}
html,body{width:100%;height:100%;background:#000d0d;color:#00FFFF;}
.msg-app{display:flex;flex-direction:column;height:100%;}
.msg-log{flex:1 1 auto;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;}
.msg-row{max-width:86%;padding:8px 10px;border:1px solid #00FFFF;font-size:13px;line-height:1.4;white-space:pre-wrap;word-break:break-word;}
.msg-row.user{align-self:flex-end;background:rgba(0,255,255,0.14);}
.msg-row.ai{align-self:flex-start;background:rgba(0,255,255,0.04);}
.msg-row.sys{align-self:center;opacity:0.55;font-size:10px;border-style:dashed;max-width:96%;}
.msg-inputbar{flex:0 0 auto;display:flex;border-top:1px solid #00FFFF;}
.msg-inputbar input{flex:1 1 auto;border:none;background:transparent;padding:10px;color:#00FFFF;font-family:monospace;font-size:13px;outline:none;}
.msg-inputbar button{flex:0 0 auto;border:none;border-left:1px solid #00FFFF;background:transparent;color:#00FFFF;padding:0 16px;cursor:pointer;font-family:monospace;}
.msg-inputbar button:active{background:#00FFFF;color:#000;}
.msg-inputbar button:disabled{opacity:.45;cursor:wait;}
.msg-log::-webkit-scrollbar{width:8px;}
.msg-log::-webkit-scrollbar-thumb{background:#00FFFF;}
</style>
</head>
<body>

<div class="msg-app">
    <div class="msg-log" id="log"></div>
    <div class="msg-inputbar">
        <input id="input" type="text" placeholder="Message Little Hollow..." autocomplete="off">
        <button id="sendBtn">SEND</button>
    </div>
</div>

<script>
const log=document.getElementById("log");
const input=document.getElementById("input");
const sendBtn=document.getElementById("sendBtn");

function addRow(text,cls){
    const row=document.createElement("div");
    row.className="msg-row "+cls;
    row.textContent=text;
    log.appendChild(row);
    log.scrollTop=log.scrollHeight;
    return row;
}

let busy=false;
let streamText="";
let activePending=null;

function handleAIStream(event){
    if(!busy || !activePending) return;
    const detail=event?.detail||{};
    if(detail.provider && detail.provider !== "gemini") return;
    if(typeof detail.token !== "string" || !detail.token) return;
    streamText += detail.token;
    activePending.textContent=streamText;
    log.scrollTop=log.scrollHeight;
}

// ai.js dispatches this event from the parent Little Hollow window.
try{ parent.addEventListener("littlehollow:ai-stream",handleAIStream); }catch(_){ }

async function send(){
    const text=input.value.trim();
    if(!text||busy) return;

    input.value="";
    addRow(text,"user");

    busy=true;
    streamText="";
    sendBtn.disabled=true;
    const pending=addRow("...", "ai");
    activePending=pending;

    try{
        const result=await parent.LittleHollowAI.send(text);
        const visible=typeof result?.visibleMessage === "string" ? result.visibleMessage : "";
        if(visible){
            pending.textContent=visible;
        }else if(streamText){
            pending.textContent=streamText;
        }else{
            pending.textContent="[Little Hollow returned an empty response]";
        }
        if(result?.log&&result.log.length){
            addRow(result.log.join(" | "),"sys");
        }
    }catch(err){
        pending.textContent="Error talking to Little Hollow: "+(err&&err.message?err.message:err);
    }finally{
        activePending=null;
        busy=false;
        sendBtn.disabled=false;
        input.focus();
    }
}

sendBtn.addEventListener("click",send);
input.addEventListener("keydown",e=>{
    if(e.key==="Enter") send();
});

addRow("Little Hollow is online. Say hello!","sys");
input.focus();
</script>
</body>
</html>
