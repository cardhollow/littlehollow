<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Custom App Browser</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:monospace}
html,body{width:100%;height:100%;background:#000d0d;color:#00FFFF}
.wrap{display:flex;flex-direction:column;height:100%;overflow:hidden}
.toolbar{display:flex;gap:6px;padding:8px;border-bottom:1px solid #00FFFF;flex-wrap:wrap;align-items:center}
.toolbar input{flex:1;min-width:250px;background:#001010;border:1px solid #00FFFF;color:#00FFFF;padding:6px;font-family:monospace;font-size:11px}
.toolbar button{border:1px solid #00FFFF;background:transparent;color:#00FFFF;padding:6px 9px;cursor:pointer;font-family:monospace;font-size:11px}
.toolbar button:active{background:#00FFFF;color:#000}
.size-controls{display:flex;gap:6px;align-items:center;font-size:10px}
.size-controls input{width:60px;background:#001010;border:1px solid #00FFFF;color:#00FFFF;padding:4px;font-family:monospace;font-size:10px}
.viewer{flex:1;overflow:hidden;background:#0a0a0a;border-top:1px solid #00FFFF;position:relative}
iframe{width:100%;height:100%;border:none;background:#000d0d}
.empty-state{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;opacity:0.5;text-align:center;padding:20px}
.empty-state div{margin:5px 0}
.error{background:#330000;border:1px solid #ff0000;color:#ff0000;padding:10px;margin:10px;border-radius:3px;font-size:11px}
.history{display:flex;gap:4px;flex-wrap:wrap;font-size:9px;padding:4px;border-left:1px solid #00FFFF;max-width:200px}
.history-item{background:#001010;border:1px solid #00FFFF;padding:2px 4px;cursor:pointer}
.history-item:hover{background:#00FFFF;color:#000}
.status{padding:5px 10px;border-top:1px solid #00FFFF;font-size:11px;opacity:.75}
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <input id="urlInput" type="text" placeholder="Enter URL (https://example.com)" value="">
    <button id="openBtn">OPEN</button>
    <button id="clearBtn">CLEAR</button>
    <div class="size-controls">
      <label for="widthInput" style="font-size:10px">W:</label>
      <input id="widthInput" type="number" value="100" min="50" max="100">%
      <label for="heightInput" style="font-size:10px">H:</label>
      <input id="heightInput" type="number" value="100" min="50" max="100">%
    </div>
    <div class="history" id="historyContainer"></div>
  </div>
  <div class="viewer" id="viewer">
    <div class="empty-state">
      <div>CUSTOM APP BROWSER</div>
      <div style="font-size:9px;margin-top:10px">Enter a URL above and click OPEN</div>
      <div style="font-size:9px;opacity:0.5;margin-top:10px">Examples:</div>
      <div style="font-size:8px;opacity:0.5">https://tetris.com</div>
      <div style="font-size:8px;opacity:0.5">https://itch.io</div>
      <div style="font-size:8px;opacity:0.5">https://codepen.io</div>
    </div>
  </div>
  <div class="status" id="status">Ready.</div>
</div>

<script>
const urlInput = document.getElementById("urlInput");
const openBtn = document.getElementById("openBtn");
const clearBtn = document.getElementById("clearBtn");
const viewer = document.getElementById("viewer");
const status = document.getElementById("status");
const widthInput = document.getElementById("widthInput");
const heightInput = document.getElementById("heightInput");
const historyContainer = document.getElementById("historyContainer");

let history = JSON.parse(localStorage.getItem("customapp_history") || "[]").slice(0, 5);

function updateStatus(msg) {
  status.textContent = msg;
}

function saveHistory() {
  localStorage.setItem("customapp_history", JSON.stringify(history.slice(0, 10)));
  renderHistory();
}

function renderHistory() {
  historyContainer.innerHTML = history
    .map((url, i) => `<div class="history-item" data-idx="${i}" title="${url}">${url.slice(0, 20)}...</div>`)
    .join("");
  
  historyContainer.querySelectorAll(".history-item").forEach(el => {
    el.addEventListener("click", () => {
      urlInput.value = history[parseInt(el.dataset.idx)];
      open();
    });
  });
}

function isValidUrl(str) {
  try {
    const url = new URL(str.startsWith("http") ? str : "https://" + str);
    return url.href;
  } catch (e) {
    return null;
  }
}

function open() {
  let url = urlInput.value.trim();
  
  if (!url) {
    updateStatus("Please enter a URL.");
    return;
  }

  const validUrl = isValidUrl(url);
  if (!validUrl) {
    viewer.innerHTML = `<div class="error">Invalid URL: "${url}"</div>`;
    updateStatus("Invalid URL.");
    return;
  }

  // Add to history
  if (!history.includes(validUrl)) {
    history.unshift(validUrl);
    saveHistory();
  }

  const w = Math.max(50, Math.min(100, parseInt(widthInput.value) || 100));
  const h = Math.max(50, Math.min(100, parseInt(heightInput.value) || 100));

  const sandboxAttrs = 'allow-scripts allow-same-origin allow-popups allow-forms allow-pointer-lock allow-top-navigation-by-user-activation';
  
  viewer.innerHTML = `<iframe src="${validUrl}" sandbox="${sandboxAttrs}" style="width:${w}%;height:${h}%;margin:auto;display:block;"></iframe>`;
  
  updateStatus(`Loaded: ${validUrl}`);
}

function clear() {
  viewer.innerHTML = `
    <div class="empty-state">
      <div>CUSTOM APP BROWSER</div>
      <div style="font-size:9px;margin-top:10px">Enter a URL above and click OPEN</div>
    </div>
  `;
  urlInput.value = "";
  updateStatus("Ready.");
  urlInput.focus();
}

openBtn.addEventListener("click", open);
clearBtn.addEventListener("click", clear);
urlInput.addEventListener("keypress", e => {
  if (e.key === "Enter") open();
});

// Load URL from query params if provided
const params = new URLSearchParams(location.search);
if (params.get("url")) {
  urlInput.value = params.get("url");
  setTimeout(open, 100);
}

renderHistory();
urlInput.focus();
</script>
</body>
</html>
