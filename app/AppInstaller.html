<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>App Installer</title>
<style>
*{box-sizing:border-box;font-family:monospace}
html,body{margin:0;width:100%;height:100%;background:#000;color:#00ffff}
body{padding:12px;overflow:auto}
input{width:100%;height:34px;margin-bottom:8px;background:#000;border:1px solid #00ffff;color:#fff;padding:6px}
.row{display:flex;gap:8px}
.row input{flex:1}
button{height:34px;background:#001919;color:#00ffff;border:1px solid #00ffff;padding:0 12px}
.preview{margin-top:10px;border:1px solid #00ffff;height:260px}
.preview iframe{width:100%;height:100%;border:0;background:#fff}
#status{margin-top:10px;font-size:11px}
</style>
</head>
<body>

<input id="pkg" placeholder="Package Name">

<div class="row">
<input id="name" placeholder="App Name (Optional)">
<input id="icon" placeholder="App Icon">
</div>

<div class="row">
<input id="url" placeholder="URL">
<button id="load">LOAD</button>
</div>

<div class="preview">
<iframe id="preview"></iframe>
</div>

<button id="install" style="margin-top:10px;width:100%">
INSTALL
</button>

<div id="status"></div>

<script>
const CIA_PATH="chxd:/local/Custom Installed Application/CIA.json";

const pkg=document.getElementById("pkg");
const name=document.getElementById("name");
const icon=document.getElementById("icon");
const url=document.getElementById("url");
const preview=document.getElementById("preview");
const status=document.getElementById("status");

async function readCIA(){
    try{
        const r=await parent.FS.read(CIA_PATH);

        if(!r||!r.ok)
            return [];

        const data=JSON.parse(r.content);

        return Array.isArray(data)?data:[];
    }catch(e){
        return [];
    }
}

async function writeCIA(data){
    return await parent.FS.write(
        CIA_PATH,
        JSON.stringify(data,null,4),
        true
    );
}

document.getElementById("load").onclick=()=>{
    const u=url.value.trim();

    if(!u){
        status.textContent="Enter a URL.";
        return;
    }

    preview.src=u;
    status.textContent="Preview loaded.";
};

document.getElementById("install").onclick=async()=>{
    const p=pkg.value.trim();
    const n=name.value.trim();
    const i=icon.value.trim();
    const u=url.value.trim();

    if(!p){
        status.textContent="Package Name is required.";
        return;
    }

    if(!u){
        status.textContent="URL is required.";
        return;
    }

    status.textContent="Installing...";

    const data=await readCIA();

    const app={
        pkg:p,
        name:n,
        src:u,
        appIcon:i
    };

    const index=data.findIndex(
        x=>x.pkg===p
    );

    if(index>=0)
        data[index]=app;
    else
        data.push(app);

    const result=await writeCIA(data);

    if(!result||!result.ok){
        status.textContent=
            "Install failed: "+
            (
                result&&result.error
                    ?result.error
                    :"Could not write CIA.json"
            );
        return;
    }

    status.textContent="Successfully Installed";

    parent.postMessage({
        type:"LH_INSTALLED_APP",
        app:app
    },"*");
};
</script>

</body>
</html>
