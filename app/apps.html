<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Apps</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:monospace;}
html,body{width:100%;height:100%;color:#00FFFF;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:14px;padding:16px;}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center;font-size:11px;}
.tile .icon{width:52px;height:52px;border:1px solid #00FFFF;display:flex;align-items:center;justify-content:center;font-size:22px;}
.tile:active .icon{background:#00FFFF;color:#000;}
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script>
const apps=[
    {name:"File Manager",icon:"🗂"},
    {name:"App Installer",icon:"📦"},
    {name:"Clock",icon:"🕒"},
    {name:"Calculator",icon:"🧮"},
    {name:"Notepad",icon:"📝"},
    {name:"Paint",icon:"🎨"},
    {name:"ImageEditor",icon:"🖼️"},
    
    {name:"tictactoe",label:"Tic Tac Toe",icon:"⭕"},
    {name:"snake",label:"Snake",icon:"🐍"},

    {name:"2048",label:"2048",icon:"🔢"},
    {name:"minesweeper",label:"Minesweeper",icon:"💣"},
    {name:"sudoku",label:"Sudoku",icon:"🔢"},
    {name:"SOS",icon:"🆘"},
    {name:"tetris",label:"Tetris",icon:"🧱"},
    {name:"wordle",label:"Wordle",icon:"🔤"},
    
    {name:"doom",label:"Doom",icon:"☢️"},
    {name:"Pacman",label:"Pac-man",icon:"⍩⃝"},

    {name:"GBA",label:"GBA",icon:"⍩⃝"},
    
    {name:"GameFinder",icon:"🎮"},
    {name:"Browser",label:"Browser",icon:"🌐"},
    {name:"Messenger",icon:"💬"},
    {name:"Settings",icon:"set"},
];

const grid=document.getElementById("grid");

apps.forEach(a=>{
    const tile=document.createElement("div");

    tile.className="tile";
    tile.innerHTML=
        `<div class="icon">${a.icon}</div>
         <div>${a.label||a.name}</div>`;

    tile.onclick=()=>{
        parent.Apps.openApp(a.name);
    };

    grid.appendChild(tile);
});

try{
    const installed=JSON.parse(
        localStorage.getItem(
            "Custom Installed Application/CIA.json"
        )||"[]"
    );

    installed.forEach(app=>{
        const tile=document.createElement("div");

        tile.className="tile";

        tile.innerHTML=
            `<div class="icon">${app.appIcon||"📦"}</div>
             <div>${app.name||app.pkg}</div>`;

        tile.onclick=()=>{
            parent.Apps.openApp(app.pkg);
        };

        grid.appendChild(tile);
    });
}catch(e){}
</script>
</body>
</html>
