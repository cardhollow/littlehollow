<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Apps</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:monospace}
html,body{width:100%;height:100%;color:#00FFFF}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:14px;padding:16px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center;font-size:11px}
.tile .icon{width:52px;height:52px;border:1px solid #00FFFF;display:flex;align-items:center;justify-content:center;font-size:22px}
.tile:active .icon{background:#00FFFF;color:#000}
</style>
</head>
<body>

<div class="grid" id="grid"></div>

<script>
const CIA_PATH="chxd:/local/Custom Installed Application/CIA.json";

const apps=[
    {name:"File Manager",icon:"🗂"},
    {name:"AppInstaller",label:"App Installer",icon:"📦"},
    {name:"Clock",icon:"🕒"},
    {name:"Calculator",icon:"🧮"},
    {name:"Notepad",icon:"📝"},
    {name:"Paint",icon:"🎨"},
    {name:"ImageEditor",icon:"🖼️"},

    {name:"tictactoe",label:"Tic Tac Toe",icon:"⭕"},
    {name:"snake",label:"Snake",icon:"🐍"},

    {name:"2048",label:"2048",icon:"🔢"},
    {name:"minesweeper",label:"Minesweeper",icon:"💣"},
    {name:"sudoku",label:"Sudoku",icon:"🔢"},
    {name:"SOS",icon:"🆘"},
    {name:"tetris",label:"Tetris",icon:"🧱"},
    {name:"wordle",label:"Wordle",icon:"🔤"},

    {name:"doom",label:"Doom",icon:"☢️"},
    {name:"Pacman",label:"Pac-man",icon:"⍩⃝"},
    {name:"GBA",label:"GBA",icon:"⍩⃝"},

    {name:"GameFinder",icon:"🎮"},
    {name:"Browser",label:"Browser",icon:"🌐"},
    {name:"Messenger",icon:"💬"},
    {name:"Settings",icon:"set"}
];

const grid=document.getElementById("grid");

function addTile(key,label,icon){
    const tile=document.createElement("div");

    tile.className="tile";

    tile.innerHTML=
        `<div class="icon">${icon}</div>
         <div>${label}</div>`;

    tile.onclick=()=>{
        parent.Apps.openApp(key);
    };

    grid.appendChild(tile);
}

function renderBuiltInApps(){
    apps.forEach(app=>{
        addTile(
            app.name,
            app.label||app.name,
            app.icon
        );
    });
}

async function renderInstalledApps(){
    try{
        if(
            !parent.FS ||
            typeof parent.FS.read!=="function"
        ){
            return;
        }

        const result=
            await parent.FS.read(CIA_PATH);

        if(
            !result ||
            !result.ok ||
            !result.content
        ){
            return;
        }

        const installed=
            JSON.parse(result.content);

        if(!Array.isArray(installed)){
            return;
        }

        installed.forEach(app=>{
            if(!app||!app.pkg||!app.src){
                return;
            }

            addTile(
                app.pkg,
                app.name||app.pkg,
                app.appIcon||"📦"
            );
        });
    }catch(e){}
}

renderBuiltInApps();
renderInstalledApps();
</script>

</body>
</html>
