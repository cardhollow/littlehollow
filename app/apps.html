<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apps</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:monospace}
html,body{width:100%;height:100%;color:#00FFFF;background:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:14px;padding:16px;overflow:auto;height:100%}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center;font-size:11px;min-width:0}
.tile .icon{width:52px;height:52px;border:1px solid #00FFFF;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden}
.tile .label{max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile:active .icon{background:#00FFFF;color:#000}
.empty{grid-column:1/-1;padding:20px;text-align:center;opacity:.55;font-size:11px}
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script>
(function(){
    "use strict";

    const grid=document.getElementById("grid");

    function addTile(key,label,icon,meta){
        const tile=document.createElement("div");
        tile.className="tile";

        const iconEl=document.createElement("div");
        iconEl.className="icon";
        iconEl.textContent=icon||"📦";

        const labelEl=document.createElement("div");
        labelEl.className="label";
        labelEl.textContent=label||key||"APP";

        tile.appendChild(iconEl);
        tile.appendChild(labelEl);

        tile.title=(label||key||"APP")+
            (meta&&meta.source==="installed"?" — installed":"");

        tile.onclick=async()=>{
            const result=await parent.Apps.openApp(key);
            if(!result||!result.ok){
                console.warn("[Apps] Could not open",key,result);
            }
        };

        grid.appendChild(tile);
    }

    function render(){
        grid.innerHTML="";

        const apps=
            parent.Apps&&
            typeof parent.Apps.getRegisteredAppsSync==="function"
                ?parent.Apps.getRegisteredAppsSync()
                :[];

        if(!apps.length){
            grid.innerHTML='<div class="empty">NO REGISTERED APPLICATIONS</div>';
            return;
        }

        for(const app of apps){
            addTile(
                app.package||app.pkg||app.registry_key||app.name,
                app.title||app.name,
                app.appIcon||(app.source==="installed"?"📦":"▣"),
                app
            );
        }
    }

    render();

    /* Refresh immediately after App Installer changes CIA.json. */
    window.addEventListener("message",e=>{
        if(e.data&&e.data.type==="LH_APPS_CHANGED")
            render();
    });

    window.addEventListener("storage",e=>{
        if(e.key&&e.key.indexOf("LH::chxd:/local/Custom Installed Application/CIA.json")===0)
            render();
    });

    window.addEventListener("lh:apps-changed",render);
})();
</script>
</body>
</html>
