<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Little Hollow Piano</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:monospace;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#00ffff;
}

body{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:10px;
}

button,
select,
input{
    font:inherit;
    color:#00ffff;
    background:#000;
    border:1px solid #00ffff;
}

button{
    height:34px;
    padding:0 10px;
    cursor:pointer;
}

button:active,
button.active{
    background:#00ffff;
    color:#000;
}

select{
    height:34px;
    padding:0 7px;
}

.top{
    flex:0 0 auto;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:6px;
}

.volume{
    height:34px;
    display:flex;
    align-items:center;
    gap:5px;
    border:1px solid #004d4d;
    padding:0 7px;
    font-size:10px;
}

.volume input{
    width:100px;
    border:0;
    accent-color:#00ffff;
}

.info{
    flex:0 0 auto;
    min-height:30px;
    border:1px solid #005555;
    padding:6px 8px;
    font-size:10px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.pianoArea{
    flex:1 1 auto;
    min-height:0;
    overflow:auto;
    border:1px solid #00ffff;
    background:#000;
    padding:12px;
    touch-action:none;
}

.piano{
    position:relative;
    height:100%;
    min-height:260px;
    width:max-content;
    min-width:100%;
    display:flex;
    align-items:stretch;
    justify-content:center;
    user-select:none;
}

.whiteKeys{
    display:flex;
    height:100%;
    min-height:240px;
    gap:2px;
}

.whiteKey{
    position:relative;
    flex:0 0 64px;
    height:100%;
    min-height:240px;
    background:#001818;
    border:1px solid #008888;
    border-top:3px solid #00ffff;
    border-radius:0 0 7px 7px;
    color:#00ffff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    padding-bottom:13px;
    cursor:pointer;
    box-shadow:
        inset 0 -5px 0 #000,
        inset 0 0 0 1px #002e2e;
    z-index:1;
}

.whiteKey::after{
    content:"";
    position:absolute;
    left:7px;
    right:7px;
    bottom:7px;
    height:2px;
    background:#003f3f;
}

.whiteKey.pressed{
    background:#00ffff;
    color:#000;
    border-color:#00ffff;
    transform:translateY(3px);
    box-shadow:
        0 0 13px #00ffff,
        inset 0 -4px 0 #008888;
}

.whiteKey .note{
    font-size:11px;
    font-weight:bold;
}

.whiteKey .computer{
    margin-top:5px;
    font-size:10px;
    opacity:.7;
}

.whiteKey.pressed .computer{
    opacity:1;
}

.blackKeys{
    position:absolute;
    left:0;
    top:0;
    height:72%;
    min-height:165px;
    pointer-events:none;
    z-index:5;
}

.blackKey{
    position:absolute;
    top:0;
    width:39px;
    height:100%;
    min-height:165px;
    background:#001010;
    border:1px solid #00ffff;
    border-top:4px solid #00ffff;
    border-radius:0 0 6px 6px;
    color:#00ffff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    padding-bottom:10px;
    pointer-events:auto;
    cursor:pointer;
    box-shadow:
        0 5px 0 #000,
        inset 0 -5px 0 #003a3a,
        inset 0 0 0 1px #003131;
}

.blackKey.pressed{
    background:#00ffff;
    color:#000;
    transform:translateY(3px);
    box-shadow:
        0 0 13px #00ffff,
        0 2px 0 #008888;
}

.blackKey .note{
    font-size:9px;
    font-weight:bold;
}

.blackKey .computer{
    margin-top:4px;
    font-size:9px;
    opacity:.7;
}

.blackKey.pressed .computer{
    opacity:1;
}

.bottom{
    flex:0 0 auto;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:6px;
}

.recordState{
    height:34px;
    display:flex;
    align-items:center;
    padding:0 8px;
    border:1px solid #004d4d;
    font-size:10px;
    min-width:170px;
}

.recordState.recording{
    background:#001919;
    border-color:#00ffff;
}

@media(max-width:700px){
    .whiteKey{
        flex-basis:54px;
    }

    .blackKey{
        width:33px;
    }
}

@media(max-width:450px){
    .whiteKey{
        flex-basis:46px;
    }

    .blackKey{
        width:28px;
    }

    .whiteKey .note{
        font-size:9px;
    }

    .whiteKey .computer{
        font-size:8px;
    }

    .blackKey .note,
    .blackKey .computer{
        font-size:8px;
    }
}
</style>
</head>

<body>

<div class="top">
    <button id="octDown">OCT −</button>
    <button id="octUp">OCT +</button>
    <button id="sustain">SUSTAIN</button>

    <select id="instrument">
        <option value="piano">PIANO</option>
        <option value="synth">SYNTH</option>
        <option value="organ">ORGAN</option>
        <option value="strings">STRINGS</option>
        <option value="brass">BRASS</option>
        <option value="choir">CHOIR</option>
        <option value="pluck">PLUCK</option>
        <option value="bell">BELL</option>
        <option value="harpsichord">HARPSICHORD</option>
        <option value="guitar">GUITAR</option>
        <option value="bass">BASS</option>
        <option value="pad">PAD</option>
        <option value="lead">LEAD</option>
    </select>

    <select id="wave">
        <option value="triangle">TRIANGLE</option>
        <option value="sine">SINE</option>
        <option value="sawtooth">SAW</option>
        <option value="square">SQUARE</option>
    </select>

    <label class="volume">
        VOL
        <input
            id="volume"
            type="range"
            min="0"
            max="1"
            step=".01"
            value=".75"
        >
    </label>
</div>

<div class="info" id="info">
    A S D F G H J K L Z X C V B N M = WHITE · Q W E R T Y U I O P = BLACK · [ ] = OCTAVE · SPACE = SUSTAIN
</div>

<div class="pianoArea" id="pianoArea">
    <div class="piano" id="piano">
        <div class="whiteKeys" id="whiteKeys"></div>
        <div class="blackKeys" id="blackKeys"></div>
    </div>
</div>

<div class="bottom">
    <select id="recordType">
        <option value="audio">AUDIO</option>
        <option value="pkp">PKP</option>
    </select>

    <button id="record">● RECORD</button>
    <button id="play">▶ PLAY</button>
    <button id="clear">CLEAR</button>
    <button id="importPKP">IMPORT PKP</button>

    <div class="recordState" id="recordState">
        No recording
    </div>
</div>

<script>
(function(){
    "use strict";

    let audioContext=null;
    let masterGain=null;
    let recordingDestination=null;
    let mediaRecorder=null;
    let audioChunks=[];
    let audioRecordingData=null;
    let audioRecordingMime="";

    let octave=4;
    let waveform="triangle";
    let volume=.75;
    let sustain=false;
    let instrument="piano";

    const activeVoices=new Map();
    const sustained=new Set();
    const pressedPhysical=new Set();
    const playbackVoices=new Set();

    let recording=false;
    let recordingType="audio";
    let recordingStart=0;

    let recordingEvents=[];
    let pkpRecordedNotes=[];
    let pkpActiveNotes=new Map();
    let pkpRecordingSettings=[];
    let pkpInitialSettings=null;
    let pkpRecording="";

    let playbackTimers=[];

    const piano=document.getElementById("piano");
    const whiteKeys=document.getElementById("whiteKeys");
    const blackKeys=document.getElementById("blackKeys");
    const info=document.getElementById("info");
    const recordState=document.getElementById("recordState");

    const octDown=document.getElementById("octDown");
    const octUp=document.getElementById("octUp");
    const sustainButton=document.getElementById("sustain");
    const instrumentControl=document.getElementById("instrument");
    const wave=document.getElementById("wave");
    const volumeControl=document.getElementById("volume");
    const recordTypeControl=document.getElementById("recordType");
    const recordButton=document.getElementById("record");
    const playButton=document.getElementById("play");
    const clearButton=document.getElementById("clear");
    const importPKPButton=document.getElementById("importPKP");

    const whiteMapping=[
        ["a",0],
        ["s",2],
        ["d",4],
        ["f",5],
        ["g",7],
        ["h",9],
        ["j",11],
        ["k",12],
        ["l",14],
        ["z",16],
        ["x",17],
        ["c",19],
        ["v",21],
        ["b",23],
        ["n",24],
        ["m",26]
    ];

    const blackMapping=[
        ["q",1],
        ["w",3],
        ["e",6],
        ["r",8],
        ["t",10],
        ["y",13],
        ["u",15],
        ["i",18],
        ["o",20],
        ["p",22]
    ];

    const whiteByBlack=[
        0,
        1,
        3,
        4,
        5,
        7,
        8,
        10,
        11,
        12
    ];

    const BASE_MIDI=60;

    const computerNotes=new Map();

    for(const [key,semitone] of whiteMapping)
        computerNotes.set(key,semitone);

    for(const [key,semitone] of blackMapping)
        computerNotes.set(key,semitone);

    const instrumentDefinitions={
        piano:{
            parts:[
                {type:"triangle",mult:1,gain:.8,detune:0},
                {type:"sine",mult:2,gain:.18,detune:0},
                {type:"sine",mult:3,gain:.08,detune:0}
            ],
            attack:.006,
            peak:.8,
            release:.22,
            decay:.7
        },

        synth:{
            parts:[
                {type:"sawtooth",mult:1,gain:.55,detune:-4},
                {type:"square",mult:1,gain:.22,detune:4},
                {type:"triangle",mult:2,gain:.12,detune:0}
            ],
            attack:.01,
            peak:.7,
            release:.12,
            decay:.45
        },

        organ:{
            parts:[
                {type:"sine",mult:1,gain:.65,detune:0},
                {type:"sine",mult:2,gain:.35,detune:0},
                {type:"sine",mult:3,gain:.19,detune:0},
                {type:"sine",mult:4,gain:.1,detune:0}
            ],
            attack:.015,
            peak:.7,
            release:.2,
            decay:1
        },

        strings:{
            parts:[
                {type:"sawtooth",mult:1,gain:.48,detune:-7},
                {type:"sawtooth",mult:1,gain:.48,detune:7},
                {type:"triangle",mult:2,gain:.2,detune:0}
            ],
            attack:.08,
            peak:.62,
            release:.35,
            decay:1
        },

        brass:{
            parts:[
                {type:"sawtooth",mult:1,gain:.65,detune:0},
                {type:"square",mult:1,gain:.2,detune:5},
                {type:"sawtooth",mult:2,gain:.13,detune:0}
            ],
            attack:.045,
            peak:.68,
            release:.22,
            decay:1
        },

        choir:{
            parts:[
                {type:"sine",mult:1,gain:.7,detune:-4},
                {type:"sine",mult:1.01,gain:.45,detune:4},
                {type:"triangle",mult:2,gain:.12,detune:0}
            ],
            attack:.18,
            peak:.52,
            release:.5,
            decay:1
        },

        pluck:{
            parts:[
                {type:"triangle",mult:1,gain:.7,detune:0},
                {type:"square",mult:2,gain:.18,detune:0},
                {type:"sine",mult:3,gain:.08,detune:0}
            ],
            attack:.002,
            peak:.78,
            release:.12,
            decay:.18
        },

        bell:{
            parts:[
                {type:"sine",mult:1,gain:.55,detune:0},
                {type:"sine",mult:2.01,gain:.38,detune:0},
                {type:"sine",mult:3.96,gain:.24,detune:0},
                {type:"sine",mult:5.02,gain:.12,detune:0}
            ],
            attack:.001,
            peak:.62,
            release:1.05,
            decay:1.8
        },

        harpsichord:{
            parts:[
                {type:"square",mult:1,gain:.45,detune:0},
                {type:"triangle",mult:2,gain:.3,detune:0},
                {type:"sine",mult:3,gain:.12,detune:0}
            ],
            attack:.003,
            peak:.65,
            release:.18,
            decay:.55
        },

        guitar:{
            parts:[
                {type:"triangle",mult:1,gain:.62,detune:0},
                {type:"square",mult:2,gain:.14,detune:0},
                {type:"sine",mult:3,gain:.08,detune:0}
            ],
            attack:.006,
            peak:.63,
            release:.25,
            decay:.55
        },

        bass:{
            parts:[
                {type:"triangle",mult:1,gain:.85,detune:0},
                {type:"sine",mult:.5,gain:.3,detune:0},
                {type:"sine",mult:2,gain:.1,detune:0}
            ],
            attack:.015,
            peak:.72,
            release:.25,
            decay:.75
        },

        pad:{
            parts:[
                {type:"sawtooth",mult:1,gain:.3,detune:-10},
                {type:"sawtooth",mult:1,gain:.3,detune:10},
                {type:"triangle",mult:2,gain:.18,detune:0},
                {type:"sine",mult:1,gain:.24,detune:0}
            ],
            attack:.3,
            peak:.5,
            release:.7,
            decay:1
        },

        lead:{
            parts:[
                {type:"sawtooth",mult:1,gain:.65,detune:0},
                {type:"square",mult:1,gain:.2,detune:4},
                {type:"triangle",mult:2,gain:.12,detune:0}
            ],
            attack:.008,
            peak:.7,
            release:.16,
            decay:.5
        }
    };

    const RECORDINGS_ROOT=
        "chxd:/local/PianoGame/Recordings";

    const AUDIO_RECORDINGS_PATH=
        RECORDINGS_ROOT+"/Audio/";

    const PKP_RECORDINGS_PATH=
        RECORDINGS_ROOT+"/PKP/";

    let fileManagerPickerOpen=false;

    function getHost(){
        return window.parent &&
            window.parent!==window
            ?window.parent
            :window;
    }

    function getFilesystem(){
        const host=getHost();

        if(
            host.FS &&
            typeof host.FS.read==="function" &&
            typeof host.FS.write==="function"
        ){
            return host.FS;
        }

        return null;
    }

    function getApps(){
        const host=getHost();

        if(
            host.Apps &&
            typeof host.Apps.openApp==="function"
        ){
            return host.Apps;
        }

        return null;
    }

    function makeTimestamp(extension){
        const d=new Date();

        const pad=n=>
            String(n).padStart(2,"0");

        return (
            d.getFullYear()+
            "-"+
            pad(d.getMonth()+1)+
            "-"+
            pad(d.getDate())+
            "_"+
            pad(d.getHours())+
            "-"+
            pad(d.getMinutes())+
            "-"+
            pad(d.getSeconds())+
            "-"+
            String(
                d.getMilliseconds()
            ).padStart(3,"0")+
            extension
        );
    }

    async function saveToCHXD(
        path,
        content,
        allowBinary=false
    ){
        const fs=getFilesystem();

        if(!fs){
            return {
                ok:false,
                error:"CHXD filesystem is unavailable."
            };
        }

        try{
            return await fs.write(
                path,
                content,
                true,
                allowBinary
            );
        }catch(error){
            return {
                ok:false,
                error:
                    error &&
                    error.message
                        ?error.message
                        :"Filesystem write failed."
            };
        }
    }

    function startAudioRecorder(){
        if(!initAudio())
            return false;

        if(!recordingDestination){
            recordingDestination=
                audioContext.createMediaStreamDestination();

            masterGain.connect(
                recordingDestination
            );
        }

        if(!window.MediaRecorder)
            return false;

        const supportedTypes=[
            "audio/webm;codecs=opus",
            "audio/webm",
            "audio/ogg;codecs=opus",
            "audio/ogg"
        ];

        let selectedType="";

        for(const type of supportedTypes){
            try{
                if(
                    MediaRecorder.isTypeSupported(type)
                ){
                    selectedType=type;
                    break;
                }
            }catch(_){}
        }

        try{
            mediaRecorder=
                selectedType
                    ?new MediaRecorder(
                        recordingDestination.stream,
                        {
                            mimeType:selectedType
                        }
                    )
                    :new MediaRecorder(
                        recordingDestination.stream
                    );
        }catch(_){
            mediaRecorder=null;
            return false;
        }

        audioChunks=[];
        audioRecordingMime=
            mediaRecorder.mimeType||
            selectedType||
            "audio/webm";

        mediaRecorder.ondataavailable=
            event=>{
                if(
                    event.data &&
                    event.data.size>0
                ){
                    audioChunks.push(
                        event.data
                    );
                }
            };

        mediaRecorder.start(100);

        return true;
    }

    function stopAudioRecorder(){
        return new Promise(
            resolve=>{
                if(!mediaRecorder){
                    resolve(
                        audioRecordingData
                    );
                    return;
                }

                const recorder=mediaRecorder;

                const finish=()=>{
                    try{
                        const blob=
                            new Blob(
                                audioChunks,
                                {
                                    type:
                                        audioRecordingMime||
                                        recorder.mimeType||
                                        "audio/webm"
                                }
                            );

                        const reader=
                            new FileReader();

                        reader.onload=()=>{
                            audioRecordingData=
                                String(
                                    reader.result||""
                                );

                            audioRecordingMime=
                                blob.type||
                                audioRecordingMime;

                            resolve(
                                audioRecordingData
                            );
                        };

                        reader.onerror=()=>{
                            resolve(null);
                        };

                        reader.readAsDataURL(blob);
                    }catch(_){
                        resolve(null);
                    }

                    audioChunks=[];
                    mediaRecorder=null;
                };

                recorder.onstop=finish;

                try{
                    if(
                        recorder.state!=="inactive"
                    ){
                        recorder.stop();
                    }else{
                        finish();
                    }
                }catch(_){
                    finish();
                }
            }
        );
    }

    async function savePKPRecordingToCHXD(){
        if(!pkpRecording){
            return {
                ok:false,
                error:"No PKP recording."
            };
        }

        const filename=
            makeTimestamp(".pkp");

        const path=
            PKP_RECORDINGS_PATH+
            filename;

        const result=
            await saveToCHXD(
                path,
                pkpRecording,
                false
            );

        if(
            result &&
            result.ok
        ){
            recordState.textContent=
                "PKP saved · "+
                filename;

            return {
                ok:true,
                path,
                filename
            };
        }

        recordState.textContent=
            result &&
            result.error
                ?result.error
                :"Could not save PKP.";

        return result;
    }

    async function saveAudioRecordingToCHXD(){
        if(!audioRecordingData){
            return {
                ok:false,
                error:"No audio recording."
            };
        }

        const extension=
            audioRecordingMime.includes("ogg")
                ?".ogg"
                :".webm";

        const filename=
            makeTimestamp(extension);

        const path=
            AUDIO_RECORDINGS_PATH+
            filename;

        const result=
            await saveToCHXD(
                path,
                audioRecordingData,
                false
            );

        if(
            result &&
            result.ok
        ){
            recordState.textContent=
                "Audio saved · "+
                filename;

            return {
                ok:true,
                path,
                filename,
                mime:
                    audioRecordingMime
            };
        }

        recordState.textContent=
            result &&
            result.error
                ?result.error
                :"Could not save audio.";

        return result;
    }

    function initAudio(){
        if(audioContext)
            return true;

        const AC=
            window.AudioContext||
            window.webkitAudioContext;

        if(!AC){
            info.textContent=
                "Web Audio is unavailable.";
            return false;
        }

        try{
            audioContext=new AC();

            masterGain=
                audioContext.createGain();

            masterGain.gain.value=
                volume;

            masterGain.connect(
                audioContext.destination
            );

            return true;
        }catch(_){
            info.textContent=
                "Could not initialize audio.";
            return false;
        }
    }

    function midiToFrequency(midi){
        return 440*Math.pow(
            2,
            (midi-69)/12
        );
    }

    function midiToName(midi){
        const names=[
            "C","C#","D","D#","E","F",
            "F#","G","G#","A","A#","B"
        ];

        return (
            names[
                ((midi%12)+12)%12
            ]+
            (
                Math.floor(midi/12)-1
            )
        );
    }

    function currentMidi(semitone){
        return (
            BASE_MIDI+
            (octave-4)*12+
            semitone
        );
    }

    function getCurrentSettings(){
        return {
            instrument,
            waveform,
            volume,
            sustain,
            octave
        };
    }

    function normalizeSettings(
        settings,
        base=null
    ){
        const state={
            ...(base||getCurrentSettings())
        };

        if(
            settings &&
            typeof settings==="object"
        ){
            if(
                Number.isFinite(
                    Number(settings.octave)
                )
            ){
                state.octave=
                    Math.max(
                        1,
                        Math.min(
                            7,
                            Math.round(
                                Number(
                                    settings.octave
                                )
                            )
                        )
                    );
            }

            if(
                Object.prototype.hasOwnProperty.call(
                    instrumentDefinitions,
                    String(settings.instrument||"")
                )
            ){
                state.instrument=
                    String(settings.instrument);
            }

            if(
                [
                    "sine",
                    "triangle",
                    "square",
                    "sawtooth"
                ].includes(
                    String(settings.waveform||"")
                )
            ){
                state.waveform=
                    String(settings.waveform);
            }

            if(
                Number.isFinite(
                    Number(settings.volume)
                )
            ){
                state.volume=
                    Math.max(
                        0,
                        Math.min(
                            1,
                            Number(settings.volume)
                        )
                    );
            }

            if(
                Object.prototype.hasOwnProperty.call(
                    settings,
                    "sustain"
                )
            ){
                state.sustain=
                    !!settings.sustain;
            }
        }

        return state;
    }

    function applySettings(
        settings,
        recordChange=false,
        playbackMode=false
    ){
        if(
            !settings ||
            typeof settings!=="object"
        ){
            return;
        }

        let changed=false;

        if(
            Object.prototype.hasOwnProperty.call(
                settings,
                "octave"
            )
        ){
            const value=
                Number(settings.octave);

            if(Number.isFinite(value)){
                const next=
                    Math.max(
                        1,
                        Math.min(
                            7,
                            Math.round(value)
                        )
                    );

                if(next!==octave){
                    if(!playbackMode)
                        stopAllNotes();

                    octave=next;

                    if(
                        !playbackMode
                    ){
                        buildPiano();
                    }

                    changed=true;
                }
            }
        }

        if(
            Object.prototype.hasOwnProperty.call(
                settings,
                "instrument"
            )
        ){
            const value=
                String(settings.instrument);

            if(
                Object.prototype.hasOwnProperty.call(
                    instrumentDefinitions,
                    value
                ) &&
                value!==instrument
            ){
                instrument=value;
                instrumentControl.value=
                    value;
                changed=true;
            }
        }

        if(
            Object.prototype.hasOwnProperty.call(
                settings,
                "waveform"
            )
        ){
            const value=
                String(settings.waveform);

            if(
                [
                    "sine",
                    "triangle",
                    "square",
                    "sawtooth"
                ].includes(value) &&
                value!==waveform
            ){
                waveform=value;
                wave.value=value;
                changed=true;
            }
        }

        if(
            Object.prototype.hasOwnProperty.call(
                settings,
                "volume"
            )
        ){
            const value=
                Number(settings.volume);

            if(Number.isFinite(value)){
                const next=
                    Math.max(
                        0,
                        Math.min(1,value)
                    );

                if(next!==volume){
                    volume=next;
                    volumeControl.value=
                        String(volume);

                    if(masterGain)
                        masterGain.gain.value=
                            volume;

                    changed=true;
                }
            }
        }

        if(
            Object.prototype.hasOwnProperty.call(
                settings,
                "sustain"
            )
        ){
            const next=
                !!settings.sustain;

            if(next!==sustain){
                sustain=next;

                sustainButton.classList.toggle(
                    "active",
                    sustain
                );

                if(
                    !sustain &&
                    !playbackMode
                ){
                    releaseSustain();
                }

                changed=true;
            }
        }

        if(
            recordChange &&
            recording &&
            recordingType==="pkp" &&
            changed
        ){
            recordPKPSetting();
        }
    }

    function createVoice(
        midi,
        settingsOverride=null
    ){
        if(!initAudio())
            return null;

        if(
            audioContext.state==="suspended"
        ){
            audioContext.resume().catch(
                ()=>{}
            );
        }

        const selectedInstrument=
            settingsOverride &&
            settingsOverride.instrument
                ?settingsOverride.instrument
                :instrument;

        const selectedWaveform=
            settingsOverride &&
            settingsOverride.waveform
                ?settingsOverride.waveform
                :waveform;

        const definition=
            instrumentDefinitions[
                selectedInstrument
            ]||
            instrumentDefinitions.piano;

        const voiceGain=
            audioContext.createGain();

        const now=
            audioContext.currentTime;

        voiceGain.gain.setValueAtTime(
            .0001,
            now
        );

        const attack=
            Math.max(
                .001,
                definition.attack
            );

        voiceGain.gain.exponentialRampToValueAtTime(
            Math.max(
                .001,
                definition.peak
            ),
            now+attack
        );

        if(definition.decay<1){
            voiceGain.gain.setTargetAtTime(
                Math.max(
                    .001,
                    definition.peak*.55
                ),
                now+attack,
                Math.max(
                    .02,
                    definition.decay
                )
            );
        }

        voiceGain.connect(
            masterGain
        );

        const oscillators=[];

        for(
            const part of definition.parts
        ){
            const oscillator=
                audioContext.createOscillator();

            const partGain=
                audioContext.createGain();

            let type=part.type;

            if(
                (
                    selectedInstrument==="synth"||
                    selectedInstrument==="lead"
                ) &&
                oscillators.length===0
            ){
                type=selectedWaveform;
            }

            oscillator.type=type;

            oscillator.frequency.setValueAtTime(
                midiToFrequency(midi)*
                part.mult,
                now
            );

            oscillator.detune.setValueAtTime(
                part.detune||0,
                now
            );

            partGain.gain.value=
                Math.max(
                    .001,
                    part.gain
                );

            oscillator.connect(
                partGain
            );

            partGain.connect(
                voiceGain
            );

            oscillator.start();

            oscillators.push(
                oscillator
            );
        }

        let lfo=null;
        let lfoGain=null;

        if(
            selectedInstrument==="strings"||
            selectedInstrument==="choir"||
            selectedInstrument==="pad"||
            selectedInstrument==="lead"
        ){
            lfo=
                audioContext.createOscillator();

            lfoGain=
                audioContext.createGain();

            lfo.type="sine";

            lfo.frequency.value=
                selectedInstrument==="lead"
                    ?5.2
                    :selectedInstrument==="pad"
                        ?.7
                        :5;

            lfoGain.gain.value=
                selectedInstrument==="pad"
                    ?7
                    :4;

            lfo.connect(
                lfoGain
            );

            for(
                const oscillator of oscillators
            ){
                lfoGain.connect(
                    oscillator.detune
                );
            }

            lfo.start();
        }

        return {
            voiceGain,
            oscillators,
            lfo
        };
    }

    function stopVoice(voice){
        if(
            !voice||
            !audioContext
        ){
            return;
        }

        const now=
            audioContext.currentTime;

        try{
            voice.voiceGain.gain.cancelScheduledValues(
                now
            );

            voice.voiceGain.gain.setTargetAtTime(
                .0001,
                now,
                .06
            );

            for(
                const oscillator of voice.oscillators
            ){
                try{
                    oscillator.stop(
                        now+.35
                    );
                }catch(_){}
            }

            if(voice.lfo){
                try{
                    voice.lfo.stop(
                        now+.35
                    );
                }catch(_){}
            }
        }catch(_){}
    }

    function playbackMidiIsActive(midi){
        for(
            const item of playbackVoices
        ){
            if(item.midi===midi)
                return true;
        }

        return false;
    }

    function updatePressedState(midi){
        setPressed(
            midi,
            activeVoices.has(midi)||
            playbackMidiIsActive(midi)
        );
    }

    function startPlaybackNote(
        note,
        settings
    ){
        const voice=
            createVoice(
                note.midi,
                settings
            );

        if(!voice)
            return null;

        const item={
            midi:note.midi,
            voice
        };

        playbackVoices.add(
            item
        );

        setPressed(
            note.midi,
            true
        );

        const duration=
            Math.max(
                1,
                Number(note.duration)||250
            );

        const timer=
            setTimeout(
                ()=>{
                    stopVoice(
                        voice
                    );

                    playbackVoices.delete(
                        item
                    );

                    updatePressedState(
                        note.midi
                    );
                },
                duration
            );

        playbackTimers.push(
            timer
        );

        return item;
    }

    function getRecordingTime(){
        return (
            performance.now()-
            recordingStart
        );
    }

    function recordEvent(
        type,
        midi,
        key
    ){
        if(
            !recording||
            recordingType!=="audio"
        ){
            return;
        }

        recordingEvents.push({
            type,
            midi,
            key:key||null,
            time:getRecordingTime()
        });
    }

    function midiToComputerKey(midi){
        const local=
            midi-
            (
                BASE_MIDI+
                (octave-4)*12
            );

        for(
            const [key,semitone]
            of whiteMapping
        ){
            if(semitone===local)
                return key;
        }

        for(
            const [key,semitone]
            of blackMapping
        ){
            if(semitone===local)
                return key;
        }

        return null;
    }

    function recordPKPNoteStart(
        key,
        midi
    ){
        if(
            !recording||
            recordingType!=="pkp"
        ){
            return;
        }

        const resolvedKey=
            key||
            midiToComputerKey(midi);

        pkpActiveNotes.set(
            midi,
            {
                key:resolvedKey,
                midi,
                start:
                    getRecordingTime(),
                sustainAtStart:
                    sustain
            }
        );
    }

    function recordPKPNoteEnd(
        midi,
        time
    ){
        if(
            !recording||
            recordingType!=="pkp"
        ){
            return;
        }

        const note=
            pkpActiveNotes.get(midi);

        if(!note)
            return;

        pkpActiveNotes.delete(
            midi
        );

        if(!note.key)
            return;

        const end=
            Math.max(
                note.start,
                Number.isFinite(time)
                    ?time
                    :getRecordingTime()
            );

        pkpRecordedNotes.push({
            key:note.key,
            midi:note.midi,
            start:note.start,
            end,
            duration:
                Math.max(
                    1,
                    end-note.start
                ),
            octave:octave
        });
    }

    function recordPKPSetting(){
        if(
            !recording||
            recordingType!=="pkp"
        ){
            return;
        }

        const time=
            getRecordingTime();

        const settings=
            getCurrentSettings();

        if(
            pkpRecordingSettings.length
        ){
            const previous=
                pkpRecordingSettings[
                    pkpRecordingSettings.length-1
                ];

            if(
                JSON.stringify(
                    previous.settings
                )===JSON.stringify(
                    settings
                )
            ){
                return;
            }
        }

        pkpRecordingSettings.push({
            time,
            settings:{
                ...settings
            }
        });
    }

    async function startRecording(){
        stopPlayback();

        recordingType=
            recordTypeControl.value;

        recording=true;

        recordingStart=
            performance.now();

        recordingEvents=[];
        pkpRecordedNotes=[];
        pkpActiveNotes=new Map();
        pkpRecordingSettings=[];
        pkpRecording="";

        pkpInitialSettings=
            getCurrentSettings();

        if(
            recordingType==="audio"
        ){
            audioRecordingData=null;
            audioChunks=[];
            audioRecordingMime="";

            if(
                !startAudioRecorder()
            ){
                recording=false;

                recordState.classList.remove(
                    "recording"
                );

                recordButton.textContent=
                    "● RECORD";

                info.textContent=
                    "Audio recording is unavailable.";

                return;
            }
        }

        recordButton.textContent=
            "■ STOP";

        recordButton.classList.add(
            "active"
        );

        recordState.classList.add(
            "recording"
        );

        recordState.textContent=
            recordingType==="pkp"
                ?"Recording PKP..."
                :"Recording Audio...";
    }

    function isCloseTime(
        a,
        b,
        tolerance=15
    ){
        return Math.abs(a-b)<=tolerance;
    }

    function buildPKPLayers(){
        const notes=
            pkpRecordedNotes
            .filter(
                note=>
                    note &&
                    note.key &&
                    Number.isFinite(note.start) &&
                    Number.isFinite(note.end)
            )
            .map(
                note=>({
                    ...note,
                    start:
                        Math.max(
                            0,
                            note.start
                        ),
                    end:
                        Math.max(
                            note.start,
                            note.end
                        ),
                    duration:
                        Math.max(
                            1,
                            note.duration||
                            note.end-note.start
                        )
                })
            )
            .sort(
                (a,b)=>{
                    if(a.start!==b.start)
                        return a.start-b.start;

                    return b.end-a.end;
                }
            );

        const startGroups=[];

        for(
            const note of notes
        ){
            let group=
                startGroups[
                    startGroups.length-1
                ];

            if(
                !group ||
                !isCloseTime(
                    group.start,
                    note.start
                )
            ){
                group={
                    start:note.start,
                    notes:[]
                };

                startGroups.push(
                    group
                );
            }

            group.notes.push(
                note
            );
        }

        const layers=[];

        for(
            const group of startGroups
        ){
            let selected=null;

            for(
                const layer of layers
            ){
                if(
                    layer.lastEnd<=
                    group.start+15
                ){
                    selected=layer;
                    break;
                }
            }

            if(!selected){
                selected={
                    events:[],
                    lastEnd:0
                };

                layers.push(
                    selected
                );
            }

            selected.events.push(
                {
                    type:"group",
                    time:group.start,
                    notes:
                        group.notes.map(
                            note=>({
                                key:note.key,
                                midi:note.midi,
                                duration:
                                    Math.max(
                                        1,
                                        Math.round(
                                            note.duration
                                        )
                                    )
                            })
                        )
                }
            );

            selected.lastEnd=
                Math.max(
                    selected.lastEnd,
                    ...group.notes.map(
                        note=>note.end
                    )
                );
        }

        for(
            const layer of layers
        ){
            layer.events.sort(
                (a,b)=>
                    a.time-b.time
            );
        }

        return layers;
    }

    function serializePKPNote(
        note
    ){
        const key=
            String(note.key||"")
            .toLowerCase();

        const duration=
            Math.max(
                1,
                Math.round(
                    Number(note.duration)||250
                )
            );

        return (
            key+
            ":"+
            duration
        );
    }

    function serializePKPLayer(
        layer
    ){
        const events=
            layer.events
            .map(
                event=>({
                    ...event
                })
            );

        const settingsEvents=
            pkpRecordingSettings.map(
                event=>({
                    type:"settings",
                    time:
                        Math.max(
                            0,
                            Number(event.time)||0
                        ),
                    settings:
                        {
                            ...event.settings
                        }
                })
            );

        const combined=[
            ...events,
            ...settingsEvents
        ];

        combined.sort(
            (a,b)=>{
                if(a.time!==b.time)
                    return a.time-b.time;

                if(
                    a.type==="settings" &&
                    b.type!=="settings"
                ){
                    return -1;
                }

                if(
                    a.type!=="settings" &&
                    b.type==="settings"
                ){
                    return 1;
                }

                return 0;
            }
        );

        let result="";
        let currentTime=0;

        for(
            const event of combined
        ){
            const eventTime=
                Math.max(
                    currentTime,
                    Number(event.time)||0
                );

            const delta=
                Math.round(
                    eventTime-currentTime
                );

            if(delta>0){
                result+=
                    "("+delta+")";
            }

            if(
                event.type==="settings"
            ){
                result+=
                    JSON.stringify(
                        event.settings
                    );
            }else if(
                event.type==="group"
            ){
                const notes=
                    event.notes
                    .filter(
                        note=>note.key
                    );

                if(notes.length){
                    result+=
                        "["+
                        notes.map(
                            serializePKPNote
                        ).join(",")+
                        "]";
                }
            }

            currentTime=
                eventTime;
        }

        return result;
    }

    function buildPKPRecording(){
        const layers=
            buildPKPLayers();

        if(!layers.length){
            return JSON.stringify(
                pkpInitialSettings||
                getCurrentSettings()
            );
        }

        let result=
            JSON.stringify(
                pkpInitialSettings||
                getCurrentSettings()
            );

        for(
            const layer of layers
        ){
            const content=
                serializePKPLayer(
                    layer
                );

            if(!content)
                continue;

            result+=
                "<"+
                content+
                ">";
        }

        return result;
    }

    async function stopRecording(){
        if(!recording)
            return;

        const now=
            getRecordingTime();

        if(
            recordingType==="audio"
        ){
            for(
                const [midi] of activeVoices
            ){
                recordingEvents.push({
                    type:"off",
                    midi,
                    time:now
                });
            }

            const data=
                await stopAudioRecorder();

            audioRecordingData=
                data;

            recording=false;

            recordButton.textContent=
                "● RECORD";

            recordButton.classList.remove(
                "active"
            );

            recordState.classList.remove(
                "recording"
            );

            if(!audioRecordingData){
                recordState.textContent=
                    "Audio recording failed.";
                return;
            }

            const duration=
                Math.max(
                    0,
                    now
                );

            recordState.textContent=
                "Audio recorded · "+
                Math.round(duration)+
                " ms";

            await saveAudioRecordingToCHXD();

            return;
        }

        for(
            const [midi] of pkpActiveNotes
        ){
            recordPKPNoteEnd(
                midi,
                now
            );
        }

        pkpActiveNotes.clear();

        pkpRecording=
            buildPKPRecording();

        recording=false;

        recordButton.textContent=
            "● RECORD";

        recordButton.classList.remove(
            "active"
        );

        recordState.classList.remove(
            "recording"
        );

        if(!pkpRecording){
            recordState.textContent=
                "No PKP recording";
            return;
        }

        const layerCount=
            (
                pkpRecording.match(/</g)||[]
            ).length;

        recordState.textContent=
            "PKP recorded · "+
            pkpRecordedNotes.length+
            " notes · "+
            layerCount+
            " layers";

        await savePKPRecordingToCHXD();
    }

    function toggleRecording(){
        if(recording)
            stopRecording();
        else
            startRecording();
    }

    function clearRecording(){
        stopPlayback();

        recordingEvents=[];
        pkpRecordedNotes=[];
        pkpActiveNotes.clear();
        pkpRecordingSettings=[];
        pkpRecording="";
        pkpInitialSettings=null;

        audioRecordingData=null;
        audioChunks=[];
        audioRecordingMime="";

        recordState.classList.remove(
            "recording"
        );

        recordState.textContent=
            "No recording";

        info.textContent=
            "Recording cleared.";
    }

    function getKeyElement(midi){
        return document.querySelector(
            '[data-midi="'+midi+'"]'
        );
    }

    function setPressed(
        midi,
        value
    ){
        const element=
            getKeyElement(midi);

        if(element){
            element.classList.toggle(
                "pressed",
                value
            );
        }
    }

    function startNote(
        midi,
        shouldRecord=true,
        key=null
    ){
        if(activeVoices.has(midi))
            return;

        const voice=
            createVoice(midi);

        if(!voice)
            return;

        activeVoices.set(
            midi,
            voice
        );

        setPressed(
            midi,
            true
        );

        info.textContent=
            instrument.toUpperCase()+
            " · "+
            midiToName(midi)+
            " · MIDI "+
            midi+
            " · "+
            midiToFrequency(midi).toFixed(2)+
            " Hz";

        if(shouldRecord){
            if(
                recordingType==="audio"
            ){
                recordEvent(
                    "on",
                    midi,
                    key
                );
            }else{
                recordPKPNoteStart(
                    key,
                    midi
                );
            }
        }
    }

    function stopNote(
        midi,
        shouldRecord=true,
        key=null
    ){
        const voice=
            activeVoices.get(midi);

        if(!voice)
            return;

        if(sustain){
            sustained.add(midi);

            if(
                recording &&
                recordingType==="pkp"
            ){
                const note=
                    pkpActiveNotes.get(
                        midi
                    );

                if(note){
                    note.released=true;
                }
            }

            return;
        }

        stopVoice(
            voice
        );

        activeVoices.delete(
            midi
        );

        updatePressedState(
            midi
        );

        if(shouldRecord){
            if(
                recordingType==="audio"
            ){
                recordEvent(
                    "off",
                    midi,
                    key
                );
            }else{
                recordPKPNoteEnd(
                    midi,
                    getRecordingTime()
                );
            }
        }
    }

    function releaseSustain(){
        for(
            const midi of sustained
        ){
            const voice=
                activeVoices.get(
                    midi
                );

            if(voice){
                stopVoice(
                    voice
                );

                activeVoices.delete(
                    midi
                );

                updatePressedState(
                    midi
                );
            }

            if(
                recording &&
                recordingType==="audio"
            ){
                recordingEvents.push({
                    type:"off",
                    midi,
                    time:getRecordingTime()
                });
            }

            if(
                recording &&
                recordingType==="pkp"
            ){
                recordPKPNoteEnd(
                    midi,
                    getRecordingTime()
                );
            }
        }

        sustained.clear();
    }

    function toggleSustain(
        fromUser=true
    ){
        sustain=!sustain;

        sustainButton.classList.toggle(
            "active",
            sustain
        );

        if(!sustain)
            releaseSustain();

        if(fromUser)
            recordPKPSetting();

        info.textContent=
            sustain
                ?"SUSTAIN ON"
                :"SUSTAIN OFF";
    }

    function stopAllNotes(){
        for(
            const voice of activeVoices.values()
        ){
            stopVoice(
                voice
            );
        }

        activeVoices.clear();
        sustained.clear();

        document
            .querySelectorAll(".pressed")
            .forEach(
                element=>{
                    const midi=
                        Number(
                            element.dataset.midi
                        );

                    if(
                        !Number.isFinite(midi)||
                        !playbackMidiIsActive(midi)
                    ){
                        element.classList.remove(
                            "pressed"
                        );
                    }
                }
            );
    }

    function buildPiano(){
        whiteKeys.innerHTML="";
        blackKeys.innerHTML="";

        for(
            const [
                computerKey,
                semitone
            ] of whiteMapping
        ){
            const midi=
                currentMidi(
                    semitone
                );

            const key=
                document.createElement(
                    "div"
                );

            key.className=
                "whiteKey";

            key.dataset.midi=
                String(midi);

            key.dataset.key=
                computerKey;

            key.innerHTML=
                '<div class="note">'+
                midiToName(midi)+
                '</div>'+
                '<div class="computer">'+
                computerKey.toUpperCase()+
                '</div>';

            attachPointer(
                key
            );

            whiteKeys.appendChild(
                key
            );
        }

        requestAnimationFrame(
            positionBlackKeys
        );
    }

    function positionBlackKeys(){
        blackKeys.innerHTML="";

        const whiteElements=[
            ...whiteKeys.querySelectorAll(
                ".whiteKey"
            )
        ];

        if(!whiteElements.length)
            return;

        const first=
            whiteElements[0];

        const pianoRect=
            piano.getBoundingClientRect();

        const firstRect=
            first.getBoundingClientRect();

        const whiteWidth=
            firstRect.width;

        for(
            let i=0;
            i<blackMapping.length;
            i++
        ){
            const [
                computerKey,
                semitone
            ]=
                blackMapping[i];

            const leftWhiteIndex=
                whiteByBlack[i];

            if(
                leftWhiteIndex>=
                whiteElements.length-1
            ){
                continue;
            }

            const leftRect=
                whiteElements[
                    leftWhiteIndex
                ].getBoundingClientRect();

            const midi=
                currentMidi(
                    semitone
                );

            const key=
                document.createElement(
                    "div"
                );

            key.className=
                "blackKey";

            key.dataset.midi=
                String(midi);

            key.dataset.key=
                computerKey;

            key.innerHTML=
                '<div class="note">'+
                midiToName(midi)+
                '</div>'+
                '<div class="computer">'+
                computerKey.toUpperCase()+
                '</div>';

            const centerX=
                leftRect.right-
                pianoRect.left;

            key.style.left=
                (
                    centerX-
                    whiteWidth*.305
                )+
                "px";

            attachPointer(
                key
            );

            blackKeys.appendChild(
                key
            );
        }
    }

    function attachPointer(element){
        let pointerDown=false;

        element.addEventListener(
            "pointerdown",
            event=>{
                event.preventDefault();

                pointerDown=true;

                try{
                    element.setPointerCapture(
                        event.pointerId
                    );
                }catch(_){}

                startNote(
                    Number(
                        element.dataset.midi
                    ),
                    true,
                    element.dataset.key
                );
            }
        );

        element.addEventListener(
            "pointerup",
            event=>{
                event.preventDefault();

                if(!pointerDown)
                    return;

                pointerDown=false;

                stopNote(
                    Number(
                        element.dataset.midi
                    ),
                    true,
                    element.dataset.key
                );
            }
        );

        element.addEventListener(
            "pointercancel",
            ()=>{
                if(!pointerDown)
                    return;

                pointerDown=false;

                stopNote(
                    Number(
                        element.dataset.midi
                    ),
                    true,
                    element.dataset.key
                );
            }
        );

        element.addEventListener(
            "pointerleave",
            event=>{
                if(
                    pointerDown &&
                    event.buttons===0
                ){
                    pointerDown=false;

                    stopNote(
                        Number(
                            element.dataset.midi
                        ),
                        true,
                        element.dataset.key
                    );
                }
            }
        );
    }

    function changeOctave(
        amount,
        recordChange=true
    ){
        const next=
            Math.max(
                1,
                Math.min(
                    7,
                    octave+amount
                )
            );

        if(next===octave)
            return;

        stopAllNotes();

        octave=next;

        buildPiano();

        if(
            recordChange &&
            recording &&
            recordingType==="pkp"
        ){
            recordPKPSetting();
        }

        info.textContent=
            "OCTAVE "+
            octave;
    }

    window.addEventListener(
        "keydown",
        event=>{
            const key=
                String(
                    event.key||""
                ).toLowerCase();

            if(
                event.repeat||
                pressedPhysical.has(key)
            ){
                return;
            }

            if(key==="["){
                event.preventDefault();
                changeOctave(-1);
                return;
            }

            if(key==="]"){
                event.preventDefault();
                changeOctave(1);
                return;
            }

            if(key===" "){
                event.preventDefault();
                toggleSustain(true);
                return;
            }

            if(!computerNotes.has(key))
                return;

            event.preventDefault();

            pressedPhysical.add(
                key
            );

            startNote(
                currentMidi(
                    computerNotes.get(key)
                ),
                true,
                key
            );
        }
    );

    window.addEventListener(
        "keyup",
        event=>{
            const key=
                String(
                    event.key||""
                ).toLowerCase();

            if(
                !computerNotes.has(key)
            ){
                return;
            }

            pressedPhysical.delete(
                key
            );

            stopNote(
                currentMidi(
                    computerNotes.get(key)
                ),
                true,
                key
            );
        }
    );

    function stopPlayback(){
        for(
            const timer of playbackTimers
        ){
            clearTimeout(
                timer
            );
        }

        playbackTimers=[];

        for(
            const item of playbackVoices
        ){
            stopVoice(
                item.voice
            );
        }

        playbackVoices.clear();

        for(
            const element of
            document.querySelectorAll(".pressed")
        ){
            const midi=
                Number(
                    element.dataset.midi
                );

            if(
                !Number.isFinite(midi)||

        }

        stopAllNotes();

    function playAudioRecording(){

                "Nothing recorded.";

        }

        stopPlayback();

        try{

                new Audio(
                    audioRecordingData
                );

            audio.onplay=
