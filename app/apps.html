    function parsePKPSettings(
        block
    ){
        try{
            const value=
                JSON.parse(block);

            if(
                value &&
                typeof value==="object" &&
                !Array.isArray(value)
            ){
                return value;
            }
        }catch(_){}

        return null;
    }

    function findMatching(
        text,
        start,
        open,
        close
    ){
        let depth=0;
        let inString=false;
        let escaped=false;

        for(
            let i=start;
            i<text.length;
            i++
        ){
            const char=text[i];

            if(inString){
                if(escaped){
                    escaped=false;
                }else if(char==="\\"){
                    escaped=true;
                }else if(char==='"'){
                    inString=false;
                }

                continue;
            }

            if(char==='"'){
                inString=true;
                continue;
            }

            if(char===open){
                depth++;
            }else if(char===close){
                depth--;

                if(depth===0)
                    return i;
            }
        }

        return -1;
    }

    function parseDurationText(
        value
    ){
        const n=
            Number(
                String(value||"").trim()
            );

        if(!Number.isFinite(n))
            return null;

        return Math.max(
            1,
            n
        );
    }

    function parseNoteGroup(
        content,
        delay,
        state
    ){
        const defaultDuration=
            delay>0
                ?Math.max(
                    1,
                    delay
                )
                :250;

        const legacyGroupSustain=
            /^([a-z]+)\s*\|\s*(1|true|sustain)$/i
            .exec(
                content.trim()
            );

        let rawNotes=[];

        if(legacyGroupSustain){
            const keys=
                legacyGroupSustain[1]
                .toLowerCase()
                .split("");

            rawNotes=
                keys.map(
                    key=>({
                        text:key,
                        duration:
                            defaultDuration,
                        sustain:true
                    })
                );
        }else{
            rawNotes=
                content
                .split(",")
                .map(
                    piece=>piece.trim()
                )
                .filter(Boolean)
                .map(
                    piece=>{
                        let text=piece;
                        let noteSustain=false;

                        const pipeIndex=
                            text.indexOf("|");

                        if(pipeIndex!==-1){
                            const suffix=
                                text
                                .slice(
                                    pipeIndex+1
                                )
                                .trim()
                                .toLowerCase();

                            noteSustain=
                                suffix==="1"||
                                suffix==="true"||
                                suffix==="sustain";

                            text=
                                text.slice(
                                    0,
                                    pipeIndex
                                ).trim();
                        }

                        const pieces=
                            text.split(":");

                        const keyPart=
                            String(
                                pieces[0]||""
                            )
                            .toLowerCase()
                            .replace(
                                /[^a-z]/g,
                                ""
                            );

                        let noteDuration=
                            defaultDuration;

                        if(
                            pieces.length>1
                        ){
                            const parsed=
                                parseDurationText(
                                    pieces[1]
                                );

                            if(parsed!==null){
                                noteDuration=
                                    parsed;
                            }
                        }

                        if(
                            pieces.length>2
                        ){
                            const suffix=
                                pieces
                                .slice(2)
                                .join(":")
                                .trim()
                                .toLowerCase();

                            noteSustain=
                                noteSustain||
                                suffix==="1"||
                                suffix==="true"||
                                suffix==="sustain";
                        }

                        if(!keyPart)
                            return null;

                        return {
                            text:keyPart,
                            duration:noteDuration,
                            sustain:noteSustain
                        };
                    }
                )
                .filter(Boolean);
        }

        const notes=[];

        for(
            const item of rawNotes
        ){
            const text=
                item.text;

            if(
                !text ||
                typeof text!=="string"
            ){
                continue;
            }

            for(
                const key of text
            ){
                if(
                    !computerNotes.has(key)
                ){
                    continue;
                }

                const midi=
                    BASE_MIDI+
                    (
                        Number(state.octave)-4
                    )*12+
                    computerNotes.get(key);

                if(
                    midi<0||
                    midi>127
                ){
                    continue;
                }

                notes.push({
                    key,
                    midi,
                    duration:
                        Math.max(
                            1,
                            Number(item.duration)||
                            defaultDuration
                        ),
                    sustain:
                        !!item.sustain||
                        !!state.sustain
                });
            }
        }

        return {
            type:"group",
            notes
        };
    }

    function parsePKPSequence(
        text,
        initialSettings
    ){
        const events=[];
        let i=0;
        let time=0;
        let state=
            normalizeSettings(
                initialSettings
            );

        while(
            i<text.length
        ){
            const char=text[i];

            if(/\s/.test(char)){
                i++;
                continue;
            }

            if(char==="{"){
                const end=
                    findMatching(
                        text,
                        i,
                        "{",
                        "}"
                    );

                if(end===-1)
                    break;

                const block=
                    text.slice(
                        i,
                        end+1
                    );

                const settings=
                    parsePKPSettings(
                        block
                    );

                if(settings){
                    state=
                        normalizeSettings(
                            settings,
                            state
                        );

                    events.push({
                        type:"settings",
                        time,
                        settings:{
                            ...state
                        }
                    });
                }

                i=end+1;
                continue;
            }

            if(char==="["){
                const end=
                    findMatching(
                        text,
                        i,
                        "[",
                        "]"
                    );

                if(end===-1)
                    break;

                const content=
                    text.slice(
                        i+1,
                        end
                    );

                let delay=0;
                let next=end+1;

                if(text[next]==="("){
                    const close=
                        findMatching(
                            text,
                            next,
                            "(",
                            ")"
                        );

                    if(close!==-1){
                        const value=
                            Number(
                                text.slice(
                                    next+1,
                                    close
                                )
                            );

                        if(
                            Number.isFinite(value)
                        ){
                            delay=
                                Math.max(
                                    0,
                                    value
                                );
                        }

                        next=
                            close+1;
                    }
                }

                const group=
                    parseNoteGroup(
                        content,
                        delay,
                        state
                    );

                group.time=time;

                group.settings={
                    ...state
                };

                events.push(
                    group
                );

                time+=delay;
                i=next;
                continue;
            }

            if(char==="("){
                const end=
                    findMatching(
                        text,
                        i,
                        "(",
                        ")"
                    );

                if(end===-1)
                    break;

                const value=
                    Number(
                        text.slice(
                            i+1,
                            end
                        )
                    );

                if(
                    Number.isFinite(value)
                ){
                    time+=
                        Math.max(
                            0,
                            value
                        );
                }

                i=end+1;
                continue;
            }

            if(char==="<"){
                const end=
                    text.indexOf(
                        ">",
                        i+1
                    );

                if(end===-1)
                    break;

                i=end+1;
                continue;
            }

            i++;
        }

        return {
            events,
            settings:{
                ...state
            }
        };
    }

    function parsePKPDocument(
        text
    ){
        let i=0;
        let root="";
        const layers=[];

        while(
            i<text.length
        ){
            const char=text[i];

            if(char==="<"){
                const end=
                    text.indexOf(
                        ">",
                        i+1
                    );

                if(end===-1)
                    break;

                layers.push(
                    text.slice(
                        i+1,
                        end
                    )
                );

                i=end+1;
                continue;
            }

            if(char==="{"){
                const end=
                    findMatching(
                        text,
                        i,
                        "{",
                        "}"
                    );

                if(end===-1)
                    break;

                root+=
                    text.slice(
                        i,
                        end+1
                    );

                i=end+1;
                continue;
            }

            if(char==="["){
                const end=
                    findMatching(
                        text,
                        i,
                        "[",
                        "]"
                    );

                if(end===-1)
                    break;

                root+=
                    text.slice(
                        i,
                        end+1
                    );

                i=end+1;

                if(text[i]==="("){
                    const close=
                        findMatching(
                            text,
                            i,
                            "(",
                            ")"
                        );

                    if(close!==-1){
                        root+=
                            text.slice(
                                i,
                                close+1
                            );

                        i=close+1;
                    }
                }

                continue;
            }

            if(char==="("){
                const end=
                    findMatching(
                        text,
                        i,
                        "(",
                        ")"
                    );

                if(end===-1)
                    break;

                root+=
                    text.slice(
                        i,
                        end+1
                    );

                i=end+1;
                continue;
            }

            root+=char;
            i++;
        }

        let baseSettings={
            instrument:"piano",
            waveform:"triangle",
            volume:.75,
            sustain:false,
            octave:4
        };

        let scan=0;
        let foundNonSetting=false;

        while(
            scan<root.length
        ){
            while(
                scan<root.length &&
                /\s/.test(root[scan])
            ){
                scan++;
            }

            if(
                root[scan]!=="{"
            ){
                foundNonSetting=true;
                break;
            }

            const end=
                findMatching(
                    root,
                    scan,
                    "{",
                    "}"
                );

            if(end===-1)
                break;

            const settings=
                parsePKPSettings(
                    root.slice(
                        scan,
                        end+1
                    )
                );

            if(settings){
                baseSettings=
                    normalizeSettings(
                        settings,
                        baseSettings
                    );
            }

            scan=end+1;
        }

        const parsedLayers=[];

        for(
            const layerText of layers
        ){
            const parsed=
                parsePKPSequence(
                    layerText,
                    baseSettings
                );

            if(
                parsed.events.length
            ){
                parsedLayers.push(
                    parsed.events
                );
            }
        }

        const implicit=
            parsePKPSequence(
                root,
                {
                    ...{
                        instrument:"piano",
                        waveform:"triangle",
                        volume:.75,
                        sustain:false,
                        octave:4
                    }
                }
            );

        if(
            implicit.events.length
        ){
            parsedLayers.unshift(
                implicit.events
            );
        }

        if(!parsedLayers.length){
            parsedLayers.push([]);
        }

        return {
            layers:parsedLayers,
            baseSettings
        };
    }

    function playPKP(
        text
    ){
        if(
            typeof text!=="string"
        ){
            return;
        }

        text=text.trim();

        if(!text)
            return;

        stopPlayback();

        const parsed=
            parsePKPDocument(
                text
            );

        let longestTime=0;

        for(
            const events of parsed.layers
        ){
            for(
                const event of events
            ){
                if(
                    Number.isFinite(
                        event.time
                    )
                ){
                    let end=
                        event.time;

                    if(
                        event.type==="group"
                    ){
                        for(
                            const note of
                            event.notes
                        ){
                            end=
                                Math.max(
                                    end,
                                    event.time+
                                    note.duration
                                );
                        }
                    }

                    longestTime=
                        Math.max(
                            longestTime,
                            end
                        );
                }
            }
        }

        for(
            const events of parsed.layers
        ){
            for(
                const event of events
            ){
                const scheduledTime=
                    Math.max(
                        0,
                        Number(event.time)||0
                    );

                if(
                    event.type==="settings"
                ){
                    playbackTimers.push(
                        setTimeout(
                            ()=>{
                                applySettings(
                                    event.settings,
                                    false,
                                    true
                                );
                            },
                            scheduledTime
                        )
                    );

                    continue;
                }

                if(
                    event.type==="group"
                ){
                    playbackTimers.push(
                        setTimeout(
                            ()=>{
                                for(
                                    const note of
                                    event.notes
                                ){
                                    startPlaybackNote(
                                        note,
                                        event.settings||
                                        parsed.baseSettings
                                    );
                                }
                            },
                            scheduledTime
                        )
                    );
                }
            }
        }

        playbackTimers.push(
            setTimeout(
                ()=>{
                    for(
                        const item of playbackVoices
                    ){
                        stopVoice(
                            item.voice
                        );
                    }

                    playbackVoices.clear();

                    for(
                        const element of
                        document.querySelectorAll(
                            ".pressed"
                        )
                    ){
                        const midi=
                            Number(
                                element.dataset.midi
                            );

                        if(
                            !activeVoices.has(midi)
                        ){
                            element.classList.remove(
                                "pressed"
                            );
                        }
                    }

                    recordState.textContent=
                        "PKP playback complete.";
                },
                Math.max(
                    100,
                    longestTime+500
                )
            )
        );

        recordState.textContent=
            "Playing PKP · "+
            parsed.layers.length+
            " layers";
    }

    function playRecording(){
        if(recording){
            stopRecording();
            return;
        }

        if(
            recordingType==="pkp"
        ){
            if(!pkpRecording){
                info.textContent=
                    "Nothing recorded.";
                return;
            }

            playPKP(
                pkpRecording
            );

            return;
        }

        playAudioRecording();
    }

    async function save(){
        if(recording){
            await stopRecording();
        }

        if(
            recordingType==="pkp"
        ){
            return await savePKPRecordingToCHXD();
        }

        return await saveAudioRecordingToCHXD();
    }

    async function load(){
        const fs=getFilesystem();

        if(!fs){
            info.textContent=
                "CHXD filesystem is unavailable.";
            return null;
        }

        try{
            const files=
                await fs.list(
                    PKP_RECORDINGS_PATH
                );

            if(
                !Array.isArray(files)
            ){
                info.textContent=
                    "No saved PKP recordings.";
                return null;
            }

            const pkps=
                files
                .map(
                    p=>String(p)
                )
                .filter(
                    p=>
                        /\.pkp$/i.test(p)
                )
                .sort();

            if(!pkps.length){
                info.textContent=
                    "No saved PKP recordings.";
                return null;
            }

            const path=
                pkps[pkps.length-1];

            const result=
                await fs.read(path);

            if(
                !result||
                !result.ok
            ){
                info.textContent=
                    "Could not load saved PKP.";
                return result;
            }

            const value=
                String(
                    result.content||""
                ).trim();

            if(!value){
                info.textContent=
                    "Saved PKP file is empty.";
                return null;
            }

            pkpRecording=value;
            recordingType="pkp";
            recordTypeControl.value="pkp";

            recordState.textContent=
                "Loaded PKP · "+
                path.split("/").pop();

            info.textContent=
                "PKP loaded from CHXD.";

            return {
                ok:true,
                path,
                value
            };
        }catch(error){
            info.textContent=
                "Could not load PKP.";

            return {
                ok:false,
                error:
                    error &&
                    error.message
                        ?error.message
                        :"Load failed."
            };
        }
    }

    async function openPKPFileManager(){
        const apps=getApps();

        if(!apps){
            info.textContent=
                "Little Hollow App system is unavailable.";
            return null;
        }

        fileManagerPickerOpen=true;

        try{
            return await apps.openApp(
                "filemanager",
                {
                    selectMode:true,
                    allowMultiple:false,
                    path:PKP_RECORDINGS_PATH,
                    title:"IMPORT PKP",
                    width:520,
                    height:600
                }
            );
        }catch(error){
            fileManagerPickerOpen=false;

            info.textContent=
                "Could not open File Manager.";

            return {
                ok:false,
                error:
                    error &&
                    error.message
                        ?error.message
                        :"Could not open File Manager."
            };
        }
    }

    async function importPKPFromCHXD(
        path
    ){
        path=String(
            path||""
        ).trim();

        if(
            !path ||
            !/\.pkp$/i.test(path)
        ){
            info.textContent=
                "Select a .pkp file.";
            return;
        }

        const fs=getFilesystem();

        if(!fs){
            info.textContent=
                "CHXD filesystem is unavailable.";
            return;
        }

        try{
            const result=
                await fs.read(path);

            if(
                !result||
                !result.ok
            ){
                info.textContent=
                    result&&result.error
                        ?result.error
                        :"Could not read PKP file.";
                return;
            }

            const value=
                String(
                    result.content||""
                ).trim();

            if(!value){
                info.textContent=
                    "PKP file is empty.";
                return;
            }

            pkpRecording=value;
            recordingType="pkp";
            recordTypeControl.value="pkp";

            pkpRecordedNotes=[];
            pkpActiveNotes.clear();
            pkpRecordingSettings=[];
            pkpInitialSettings=null;
            recordingEvents=[];

            const filename=
                path.split("/").pop();

            recordState.textContent=
                "PKP imported · "+
                filename;

            info.textContent=
                "Imported "+
                filename;
        }catch(_){
            info.textContent=
                "Could not import PKP.";
        }
    }

        toggleSustain(true);
    };

    instrumentControl.onchange=()=>{
        instrument=
            instrumentControl.value;

        if(
            recording &&
            recordingType==="pkp"
        ){
            recordPKPSetting();
        }

        info.textContent=
            "INSTRUMENT · "+
            instrument.toUpperCase();
    };

    wave.onchange=()=>{
        waveform=
            wave.value;

        if(
            recording &&
            recordingType==="pkp"
        ){
            recordPKPSetting();
        }

        info.textContent=
            "WAVE · "+
            waveform.toUpperCase();
    };

    volumeControl.oninput=()=>{
        volume=
            Number(
                volumeControl.value
            );

        if(masterGain){
            masterGain.gain.value=
                volume;
        }

        if(
            recording &&
            recordingType==="pkp"
        ){
            recordPKPSetting();
        }
    };

    recordTypeControl.onchange=()=>{
        if(recording)
            stopRecording();

        recordingType=
            recordTypeControl.value;

        recordState.textContent=
            "Ready · "+
            recordingType.toUpperCase();
    };

    recordButton.onclick=()=>{
        toggleRecording();
    };

    playButton.onclick=()=>{
        playRecording();
    };

    clearButton.onclick=()=>{
        clearRecording();
    };

    importPKPButton.onclick=()=>{
        openPKPFileManager();
    };

    window.addEventListener(
        "message",
        event=>{
            const data=
                event.data;

            if(
                data &&
                typeof data==="object"
            ){
                if(
                    data.type==="LH_FILE_SELECTED" &&
                    fileManagerPickerOpen
                ){
                    fileManagerPickerOpen=false;

                    const path=
                        data.path||
                        (
                            Array.isArray(
                                data.paths
                            )
                                ?data.paths[0]
                                :""
                        );

                    importPKPFromCHXD(
                        path
                    );

                    return;
                }

                if(
                    data.type==="pkp" &&
                    typeof data.value==="string"
                ){
                    playPKP(
                        data.value
                    );

                    return;
                }
            }

            if(
                typeof data==="string"
            ){
                playPKP(data);
            }
        }
    );

    window.addEventListener(
        "resize",
        ()=>{
            requestAnimationFrame(
                positionBlackKeys
            );
        }
    );

    window.PianoAPI={

        playMidi:function(midi){
            midi=Number(midi);

            if(
                Number.isFinite(midi)
            ){
                startNote(
                    midi,
                    false
                );
            }
        },

        stopMidi:function(midi){
            midi=Number(midi);

            if(
                Number.isFinite(midi)
            ){
                stopNote(
                    midi,
                    false
                );
            }
        },

        setOctave:function(value){
            const next=
                Number(value);

            if(
                !Number.isFinite(next)
            ){
                return;
            }

            stopAllNotes();

            octave=
                Math.max(
                    1,
                    Math.min(
                        7,
                        Math.round(next)
                    )
                );

            buildPiano();
        },

        getOctave:function(){
            return octave;
        },

        setVolume:function(value){
            volume=
                Math.max(
                    0,
                    Math.min(
                        1,
                        Number(value)||0
                    )
                );

            volumeControl.value=
                String(volume);

            if(masterGain){
                masterGain.gain.value=
                    volume;
            }
        },

        setWaveform:function(value){
            if(
                ![
                    "sine",
                    "triangle",
                    "square",
                    "sawtooth"
                ].includes(value)
            ){
                return;
            }

            waveform=value;
            wave.value=value;
        },

        setInstrument:function(value){
            value=String(value);

            if(
                !Object.prototype.hasOwnProperty.call(
                    instrumentDefinitions,
                    value
                )
            ){
                return;
            }

            instrument=value;
            instrumentControl.value=
                value;
        },

        getInstrument:function(){
            return instrument;
        },

        setSustain:function(value){
            const next=!!value;

            if(next===sustain)
                return;

            sustain=next;

            sustainButton.classList.toggle(
                "active",
                sustain
            );

            if(!sustain)
                releaseSustain();
        },

        startRecording:function(){
            return startRecording();
        },

        stopRecording:function(){
            return stopRecording();
        },

        toggleRecording:function(){
            return toggleRecording();
        },

        playRecording:function(){
            playRecording();
        },

        clearRecording:function(){
            clearRecording();
        },

        getRecordingType:function(){
            return recordingType;
        },

        getRecording:function(){
            if(
                recordingType==="pkp"
            ){
                return pkpRecording;
            }

            return {
                events:
                    recordingEvents.map(
                        event=>({
                            ...event
                        })
                    ),
                audio:
                    audioRecordingData
            };
        },

        getPKP:function(){
            return pkpRecording;
        },

        getAudio:function(){
            return audioRecordingData;
        },

        getPKPData:function(){
            return {
                initialSettings:
                    pkpInitialSettings
                        ?{
                            ...pkpInitialSettings
                        }
                        :null,
                settings:
                    pkpRecordingSettings.map(
                        event=>({
                            time:event.time,
                            settings:{
                                ...event.settings
                            }
                        })
                    ),
                notes:
                    pkpRecordedNotes.map(
                        note=>({
                            ...note
                        })
                    ),
                pkp:
                    pkpRecording
            };
        },

        playPKP:function(value){
            playPKP(value);
        },

        importPKP:function(value){
            if(
                typeof value!=="string"
            ){
                return false;
            }

            const text=
                value.trim();

            if(!text)
                return false;

            pkpRecording=text;
            recordingType="pkp";
            recordTypeControl.value=
                "pkp";

            recordState.textContent=
                "PKP imported.";

            return true;
        },

        openPKPFileManager:function(){
            return openPKPFileManager();
        },

        save:function(){
            return save();
        },

        load:function(){
            return load();
        },

        savePKP:function(){
            return savePKPRecordingToCHXD();
        },

        saveAudio:function(){
            return saveAudioRecordingToCHXD();
        }
    };

    window.playPKP=
        playPKP;

    buildPiano();

})();
</script>

</body>
</html>
