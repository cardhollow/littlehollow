<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Document Viewer</title>
<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:monospace
}
html,body{
width:100%;
height:100%;
background:#000;
color:#00FFFF
}
body{
overflow:hidden
}
button,input{
font-family:monospace
}
.wrap{
display:flex;
flex-direction:column;
width:100%;
height:100%
}
.bar{
flex:0 0 auto;
display:flex;
gap:6px;
padding:8px;
border-bottom:1px solid #00FFFF;
flex-wrap:wrap
}
.bar input{
flex:1;
min-width:0;
background:#001010;
border:1px solid #00FFFF;
color:#00FFFF;
padding:7px 8px;
outline:none;
font:11px monospace
}
.bar button,.tools button{
border:1px solid #00FFFF;
background:transparent;
color:#00FFFF;
padding:6px 9px;
cursor:pointer;
font:10px monospace
}
.bar button:active,.tools button:active{
background:#00FFFF;
color:#000
}
.bar button:disabled,.tools button:disabled{
opacity:.35;
cursor:not-allowed
}
.tools{
display:flex;
gap:5px;
align-items:center;
padding:6px 8px;
border-bottom:1px solid rgba(0,255,255,.25);
overflow:auto;
flex:0 0 auto
}
.tools input{
width:100px;
flex:0 0 100px;
background:#001010;
border:1px solid #00FFFF;
color:#00FFFF;
padding:5px 6px;
outline:none;
font:10px monospace
}
.tools .info{
font-size:10px;
opacity:.7;
white-space:nowrap
}
.stage{
position:relative;
flex:1;
min-height:0;
overflow:auto;
background:#000;
touch-action:none;
overscroll-behavior:contain;
-webkit-overflow-scrolling:touch
}
.viewer{
min-width:100%;
min-height:100%;
display:flex;
justify-content:center;
align-items:flex-start;
padding:14px;
transform-origin:top center
}
.empty{
min-height:100%;
width:100%;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
opacity:.55;
font-size:12px;
white-space:pre-wrap
}
.error{
width:min(950px,100%);
margin:auto;
padding:20px;
color:#ff6666;
font-size:11px;
line-height:1.55;
white-space:pre-wrap;
overflow-wrap:anywhere
}
.status{
position:fixed;
left:10px;
right:10px;
bottom:10px;
padding:8px 10px;
border:1px solid #064A4C;
background:#001113;
color:#00FFFF;
font-size:10px;
line-height:1.4;
display:none;
z-index:999999;
white-space:pre-wrap;
pointer-events:none
}
.status.show{
display:block
}
.doc{
width:min(900px,100%);
background:#fff;
color:#111;
padding:44px;
line-height:1.55;
box-shadow:0 0 0 1px #333;
transform-origin:top center
}
.doc img{
max-width:100%;
height:auto
}
.doc table{
border-collapse:collapse;
width:100%;
margin:12px 0
}
.doc th,.doc td{
border:1px solid #777;
padding:5px 7px;
vertical-align:top
}
.doc pre{
white-space:pre-wrap;
word-break:break-word;
background:#eee;
padding:10px;
overflow:auto
}
.md{
width:min(900px,100%);
background:#fff;
color:#111;
padding:44px;
line-height:1.6;
box-shadow:0 0 0 1px #333
}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{
margin:1em 0 .5em
}
.md p,.md ul,.md ol,.md blockquote,.md pre{
margin:.7em 0
}
.md blockquote{
border-left:4px solid #888;
padding-left:12px;
color:#444
}
.md code{
background:#eee;
padding:2px 4px
}
.md pre{
padding:10px;
background:#eee;
overflow:auto
}
.md img{
max-width:100%
}
.text{
width:min(1000px,100%);
padding:25px;
white-space:pre-wrap;
word-break:break-word;
line-height:1.5;
font:13px monospace;
color:#00FFFF
}
.sheet-wrap{
width:100%;
overflow:auto;
background:#fff
}
.sheet{
border-collapse:collapse;
background:#fff;
color:#000;
width:max-content;
min-width:100%
}
.sheet th,.sheet td{
border:1px solid #888;
padding:5px 8px;
vertical-align:top;
white-space:pre-wrap;

}
.sheet th{
font-weight:bold;
background:#e8e8e8;
position:sticky;
top:0;
z-index:2
}
.pdf{
width:min(100%,1100px);
display:flex;
flex-direction:column;
align-items:center;
gap:12px;
transform-origin:top center
}
.pdf canvas{
display:block;
background:#fff;
box-shadow:0 0 0 1px #444;
height:auto
}
.pdf-native{
width:100%;
height:calc(100vh - 120px);
border:0;
background:#fff
}
.page-label{
font-size:10px;
opacity:.7
}
.pptx{
width:min(1200px,100%);
display:flex;
justify-content:center
}
.ppt-slide{
position:relative;
width:100%;
aspect-ratio:16/9;
background:#fff;
color:#000;
box-shadow:0 0 0 1px #333;
overflow:hidden;
transform-origin:top center
}
.ppt-text{
position:absolute;
white-space:pre-wrap;
overflow:hidden;
font-family:Arial,sans-serif;
color:#000
}
.image-view{
width:100%;
display:flex;
justify-content:center
}
.image-view img{
max-width:100%;
height:auto;
background:#fff;
box-shadow:0 0 0 1px #444
}
.compat{
width:min(900px,100%);
border:1px solid #064A4C;
padding:16px;
font-size:11px;
line-height:1.6
}
.compat strong{
color:#FFFF00
}
.html-frame{
width:min(1100px,100%);
height:calc(100vh - 120px);
border:0;
background:#fff
}
.search-mark{
background:#FFFF00;
color:#000;
outline:1px solid #FFFF00;
border-radius:2px
}
.search-mark.current{
background:#00FFFF;
color:#000;
outline:2px solid #00FFFF

.loader{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:10px;
width:100%;

font-size:11px
}
.loader-ring{
width:28px;
height:28px;
border:2px solid #064A4C;
border-top-color:#00FFFF;
border-radius:50%;
animation:spin .8s linear infinite
}
@keyframes spin{
to{
transform:rotate(360deg)
}
}
</style>
</head>

<body>

<div class="wrap">

<div class="bar">
<input id="src" placeholder="Document URL or chxd:/ path..." autocomplete="off" spellcheck="false">
<button id="load">LOAD</button>
</div>

<div class="tools">
<button id="prev">◀ PREV</button>
<button id="next">NEXT ▶</button>

<input id="page" type="number" min="1" step="1" placeholder="PAGE" hidden>
<button id="goto" hidden>GO</button>

<button id="zoomOut">−</button>
<span class="info" id="zoom">100%</span>
<button id="zoomIn">+</button>
<button id="fit">FIT</button>

<input id="find" type="text" placeholder="find text" autocomplete="off" spellcheck="false">
<button id="findBtn">FIND</button>

<span class="info" id="pageInfo"></span>
</div>

<div class="stage" id="stage">
<div class="viewer" id="viewer">
<div class="empty">No document loaded.</div>
</div>
</div>

</div>

<div class="status" id="status"></div>

<script type="module">

"use strict";

const $=id=>document.getElementById(id);

const viewer=$("viewer");
const stage=$("stage");
const statusBox=$("status");
const srcBox=$("src");
const pageBox=$("page");
const goBtn=$("goto");
const pageInfo=$("pageInfo");
const zoomInfo=$("zoom");

const initial=
new URLSearchParams(location.search).get("src");

const LIB={
pdf:"https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.mjs",
pdfWorker:"https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.worker.mjs",
mammoth:"https://cdn.jsdelivr.net/npm/mammoth@1.11.0/mammoth.browser.min.js",
marked:"https://cdn.jsdelivr.net/npm/marked@16.3.0/lib/marked.esm.js",
xlsx:"https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs",
jszip:"https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm"
};

let pdfjs=null;
let mammoth=null;
let marked=null;
let XLSX=null;
let JSZip=null;

let loaded=null;
let kind="";
let path="";
let zoom=1;
let page=1;
let total=0;
let textContent="";
let urls=[];
let nativePDF=false;

let currentSheets=[];
let currentSheetIndex=0;

let searchQuery="";
let searchMatches=[];
let searchIndex=-1;

let pointerState=null;
let pinchState=null;

function errorText(e){
return e&&typeof e==="object"
?String(e.message||e.name||e)
:String(e??"Unknown error");
}

function setStatus(message,show=true){
statusBox.textContent=String(message||"");
statusBox.classList.toggle("show",!!show);
}

function clearStatus(){
setStatus("",false);
}

function clearUrls(){
for(const u of urls){
try{
URL.revokeObjectURL(u);
}catch(_){}
}
urls=[];
}

function clearViewer(){
viewer.innerHTML="";
viewer.style.zoom="1";
}

function empty(message="No document loaded."){
clearViewer();

const d=document.createElement("div");
d.className="empty";
d.textContent=message;

viewer.appendChild(d);
}

function showError(message){
clearViewer();

const d=document.createElement("div");
d.className="error";
d.textContent=String(message);

viewer.appendChild(d);
}

function ext(value){
const s=String(value||"")
.split("?")[0]
.split("#")[0];

const i=s.lastIndexOf(".");

return i<0
?""
:s.slice(i+1).toLowerCase();
}

function mime(value){
switch(ext(value)){

case"pdf":
return"application/pdf";

case"docx":
return"application/vnd.openxmlformats-officedocument.wordprocessingml.document";

case"doc":
return"application/msword";

case"pptx":
return"application/vnd.openxmlformats-officedocument.presentationml.presentation";

case"ppt":
return"application/vnd.ms-powerpoint";

case"xlsx":
return"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";

case"xls":
return"application/vnd.ms-excel";

case"ods":
return"application/vnd.oasis.opendocument.spreadsheet";

case"odp":
return"application/vnd.oasis.opendocument.presentation";

case"odt":
return"application/vnd.oasis.opendocument.text";

case"epub":
return"application/epub+zip";

case"md":
case"markdown":
return"text/markdown";

case"csv":
return"text/csv";

case"rtf":
return"application/rtf";

case"html":
case"htm":
return"text/html";

case"txt":
case"log":
return"text/plain";

case"xml":
return"application/xml";

case"json":
return"application/json";

case"yaml":
case"yml":
return"text/yaml";

case"png":
return"image/png";

case"jpg":
case"jpeg":
return"image/jpeg";

case"gif":
return"image/gif";

case"webp":
return"image/webp";

case"svg":
return"image/svg+xml";

default:
return"application/octet-stream";
}
}

function virtual(value){
return /^(chxd|local|session|indexdb|puter):\//i.test(
String(value||"")
);
}

function normalizeRemoteURL(value){
let current=String(value||"").trim();

for(let i=0;i<5;i++){

try{

const u=new URL(current);

if(
u.hostname.toLowerCase()==="www.google.com"&&
u.pathname==="/url"
){
const target=u.searchParams.get("url");

if(target){
current=decodeURIComponent(target);
continue;
}
}

if(
u.hostname.toLowerCase()==="google.com"&&
u.pathname==="/url"
){
const target=u.searchParams.get("url");

if(target){
current=decodeURIComponent(target);
continue;
}
}

}catch(_){}

break;
}

return current;
}

function arrayBufferFromView(value){

if(value instanceof ArrayBuffer){
return value;
}

if(ArrayBuffer.isView(value)){
return value.buffer.slice(
value.byteOffset,
value.byteOffset+value.byteLength
);
}

return null;
}

function base64ToArrayBuffer(value){

let clean=String(value||"")
.trim()
.replace(/^data:[^,]+,/i,"")
.replace(/\s+/g,"");

const binary=atob(clean);
const bytes=new Uint8Array(binary.length);

for(let i=0;i<binary.length;i++){
bytes[i]=binary.charCodeAt(i);
}

return bytes.buffer;
}

function binaryStringToArrayBuffer(value){

const s=String(value||"");

const bytes=new Uint8Array(
s.length
);

for(let i=0;i<s.length;i++){
bytes[i]=s.charCodeAt(i)&255;
}

return bytes.buffer;
}

function binaryStringScore(value){

const s=String(value||"");

if(!s)return 0;

let binary=0;
const limit=Math.min(
s.length,
8192
);

for(let i=0;i<limit;i++){

const c=s.charCodeAt(i);

if(
c===0||
c===1||
c===2||
c===3||
c===4||
c===5||
c===6||
c===7||
c===8||
c===11||
c===12||
c===14||
c===15||
(c>=16&&c<=31)||
c===127
){
binary++;
}
}

return binary;
}

function looksBinaryString(value,source){

const s=String(value||"");

if(!s)return false;

if(
binaryStringScore(s)>0
){
return true;
}

const e=ext(source);

if(
[
"pdf",
"docx",
"doc",
"pptx",
"ppt",
"xlsx",
"xls",
"ods",
"odt",
"odp",
"epub",
"zip",
"cbz"
].includes(e)
){
return true;
}

return false;
}

async function normalizeSourceValue(value,source){

if(value==null){
throw Error(
"Filesystem returned no data for:\n"+source
);
}

if(value instanceof Blob){

return{
buffer:await value.arrayBuffer(),
mime:value.type||mime(source),
path:source
};
}

const ab=arrayBufferFromView(value);

if(ab){

return{
buffer:ab,
mime:mime(source),
path:source
};
}

if(typeof value==="string"){

if(/^data:/i.test(value)){

return{
buffer:await (
await fetch(value)
).arrayBuffer(),
mime:
(
value.match(
/^data:([^;,]+)/i
)||[]
)[1]||
mime(source),
path:source
};
}

if(/^base64:/i.test(value)){

return{
buffer:
base64ToArrayBuffer(
value.slice(7)
),
mime:mime(source),
path:source
};
}

if(
looksBinaryString(
value,
source
)
){

return{
buffer:
binaryStringToArrayBuffer(
value
),
mime:mime(source),
path:source
};
}

return{
text:value,
mime:mime(source),
path:source
};
}

if(typeof value==="object"){

if(value.buffer!=null){
return normalizeSourceValue(
value.buffer,
source
);
}

if(value.bytes!=null){
return normalizeSourceValue(
value.bytes,
source
);
}

if(value.data!=null){
return normalizeSourceValue(
value.data,
source
);
}

if(value.content!=null){
return normalizeSourceValue(
value.content,
source
);
}

if(value.file!=null){
return normalizeSourceValue(
value.file,
source
);
}

if(value.blob!=null){
return normalizeSourceValue(
value.blob,
source
);
}

if(value.base64!=null){

return{
buffer:
base64ToArrayBuffer(
value.base64
),
mime:value.mime||mime(source),
path:source
};
}

if(value.fileHandle){

const f=
await value.fileHandle.getFile();

return{
buffer:
await f.arrayBuffer(),
mime:
f.type||
mime(source),
path:source
};
}

if(value.handle){

if(
typeof value.handle.getFile==="function"
){

const f=
await value.handle.getFile();

return{
buffer:
await f.arrayBuffer(),
mime:
f.type||
mime(source),
path:source
};
}
}

}

throw Error(
"Unsupported filesystem data type."
);
}

async function readDeviceDirect(source){

const fs=
window.parent!==window
?window.parent.FS
:window.FS;

if(
!fs||
typeof fs.getDeviceMounts!=="function"
){
return null;
}

let p=source;

try{
if(typeof fs.normalize==="function"){
p=await fs.normalize(p);
}
}catch(_){}

const prefix="chxd:/device/";

if(
!p.toLowerCase().startsWith(
prefix
)
){
return null;
}

const relative=p.slice(
prefix.length
);

const parts=relative
.split("/")
.filter(Boolean);

if(parts.length<2){
throw Error(
"Invalid device path:\n"+p
);
}

const mountName=parts.shift();

const mounts=
await fs.getDeviceMounts();

if(!Array.isArray(mounts)){
return null;
}

const mount=
mounts.find(
x=>
x&&
String(x.name).toLowerCase()===
String(mountName).toLowerCase()
);

if(!mount){
throw Error(
"Device mount not found: "+mountName
);
}

let current=
mount.handle||
mount.directoryHandle||
mount.rootHandle;

if(!current){
return null;
}

if(
typeof current.queryPermission==="function"
){

let permission=
await current.queryPermission({
mode:"read"
});

if(
permission!=="granted"&&
typeof current.requestPermission==="function"
){

permission=
await current.requestPermission({
mode:"read"
});
}

if(permission!=="granted"){
throw Error(
"File permission denied for "+mountName
);
}
}

for(
let i=0;
i<parts.length-1;
i++
){

if(
typeof current.getDirectoryHandle!=="function"
){
return null;
}

current=
await current.getDirectoryHandle(
parts[i]
);
}

if(
typeof current.getFileHandle!=="function"
){
return null;
}

const fileHandle=
await current.getFileHandle(
parts[parts.length-1]
);

const file=
await fileHandle.getFile();

return{
buffer:
await file.arrayBuffer(),
mime:
file.type||
mime(p),
path:p
};
}

async function readSource(source){

source=String(source||"").trim();

if(!source){
throw Error(
"No document source specified."
);
}

if(
/^chxd:\/device\//i.test(source)
){

const direct=
await readDeviceDirect(source);

if(direct){
return direct;
}
}

if(virtual(source)){

const fs=
window.parent!==window
?window.parent.FS
:window.FS;

if(
!fs||
typeof fs.read!=="function"
){
throw Error(
"Little Hollow filesystem bridge is unavailable."
);
}

let p=source;

try{
if(typeof fs.normalize==="function"){
p=await fs.normalize(p);
}
}catch(_){}

const result=
await fs.read(p);

if(
result&&
typeof result==="object"&&
"ok"in result&&
!result.ok
){
throw Error(
result.error||
"Could not read document."
);
}

const content=
result&&
typeof result==="object"&&
"content"in result
?result.content
:result;

return normalizeSourceValue(
content,
p
);
}

const remote=
normalizeRemoteURL(source);

if(
/^https?:\/\//i.test(remote)||
/^blob:/i.test(remote)||
/^data:/i.test(remote)
){

const response=
await fetch(
remote,
{
redirect:"follow"
}
);

if(!response.ok){
throw Error(
"HTTP "+
response.status+
" while loading document."
);
}

const buffer=
await response.arrayBuffer();

return{
buffer,
mime:
response.headers.get(
"content-type"
)||
mime(remote),
path:remote
};
}

throw Error(
"Unsupported document source:\n"+
source
);
}

function textFromBuffer(buffer){

try{

return new TextDecoder(
"utf-8",
{
fatal:false
}
).decode(buffer);

}catch(_){

return"";
}
}

function detectSignature(buffer){

if(!buffer)return"";

const b=
new Uint8Array(buffer);

if(
b.length>=4&&
b[0]===0x25&&
b[1]===0x50&&
b[2]===0x44&&
b[3]===0x46
){
return"pdf";
}

if(
b.length>=4&&
b[0]===0x50&&
b[1]===0x4b&&
b[2]===0x03&&
b[3]===0x04
){
return"zip";
}

if(
b.length>=8&&
b[0]===0x89&&
b[1]===0x50&&
b[2]===0x4e&&
b[3]===0x47
){
return"png";
}

if(
b.length>=3&&
b[0]===0xff&&
b[1]===0xd8&&
b[2]===0xff
){
return"jpg";
}

if(
b.length>=6
){

const s=
String.fromCharCode(
...b.slice(0,6)
);

if(
s==="GIF87a"||
s==="GIF89a"
){
return"gif";
}
}

return"";
}

async function loadScript(src){

return new Promise(
(resolve,reject)=>{

const existing=
document.querySelector(
`script[data-dv-src="${src}"]`
);

if(existing){

if(
existing.dataset.ready==="1"
){
resolve();
return;
}

existing.addEventListener(
"load",
resolve,
{once:true}
);

existing.addEventListener(
"error",
()=>reject(
Error(
"Could not load "+
src
)
),
{once:true}
);

return;
}

const s=
document.createElement(
"script"
);

s.src=src;
s.dataset.dvSrc=src;

s.onload=()=>{
s.dataset.ready="1";
resolve();
};

s.onerror=()=>{
reject(
Error(
"Could not load "+
src
)
);
};

document.head.appendChild(s);

}
);
}

async function lib(name){

if(name==="pdf"){

if(pdfjs){
return pdfjs;
}

pdfjs=
await import(
LIB.pdf
);

pdfjs
.GlobalWorkerOptions
.workerSrc=
LIB.pdfWorker;

return pdfjs;
}

if(name==="mammoth"){

if(mammoth){
return mammoth;
}

if(window.mammoth){
mammoth=
window.mammoth;
return mammoth;
}

await loadScript(
LIB.mammoth
);

window.Mammoth;

);
}

return mammoth;
}

if(name==="marked"){

}

}

if(name==="xlsx"){

if(XLSX){

function parseCSV(input){

const rows=[];
let row=[];
let cell="";
let quoted=false;

for(
let i=0;
i<input.length;
i++
){

const c=input[i];

if(c==='"'){

if(
quoted&&
input[i+1]==='"'
){

cell+='"';
i++;

}else{

quoted=!quoted;
}

continue;
}

if(
c===","&&
!quoted
){

row.push(cell);
cell="";
continue;
}

if(
(c==="\n"||c==="\r")&&
!quoted
){

if(
c==="\r"&&
input[i+1]==="\n"
){
i++;
}

row.push(cell);
rows.push(row);

row=[];
cell="";

continue;
}

cell+=c;
}

row.push(cell);

if(
row.length>1||
row[0]!==""
){
rows.push(row);
}

return rows;
}

function stripRTF(value){

return String(value||"")
.replace(
/\\'[0-9a-fA-F]{2}/g,
m=>
String.fromCharCode(
parseInt(
m.slice(2),
16
)
)
)
.replace(
/\\par[d]?/g,
"\n"
)
.replace(
/\\line/g,
"\n"
)
.replace(
/\\tab/g,
"\t"
)
.replace(
/\\[a-zA-Z]+-?\d* ?/g,
""
)
.replace(
/[{}]/g,
""
);
}

async function openEPUB(buffer){

const Z=
await lib("jszip");

const zip=
await Z.loadAsync(
new Uint8Array(buffer)
);

const container=
zip.file(
"META-INF/container.xml"
);

if(!container){
throw Error(
"Invalid EPUB."
);
}

const xml=
await container.async(
"string"
);

const root=
xml.match(
/<rootfile[^>]+full-path=["']([^"']+)["']/i
);

if(!root){
throw Error(
"EPUB package path not found."
);
}

const opfPath=
root[1];

const opfFile=
zip.file(opfPath);

if(!opfFile){
throw Error(
"EPUB package file not found."
);
}

const opf=
new DOMParser().parseFromString(
await opfFile.async("string"),
"application/xml"
);

const base=
opfPath.includes("/")
?opfPath.slice(
0,
opfPath.lastIndexOf("/")+
1
)
:"";

const manifest=
new Map();

for(
const item of
opf.querySelectorAll(
"item"
)
){

const id=
item.getAttribute("id");

const href=
item.getAttribute("href");

if(id&&href){
manifest.set(
id,
href
);
}
}

const spine=[];

for(
const item of
opf.querySelectorAll(
"itemref"
)
){

const idref=
item.getAttribute(
"idref"
);

if(
idref&&
manifest.has(idref)
){
spine.push(
manifest.get(idref)
);
}
}

let output="";

for(
const href of
spine
){

const full=
base+
decodeURIComponent(
href
)
.replace(
/^\.\//,
""
);

const file=
zip.file(
full
);

if(!file){
continue;
}

let html=
await file.async(
"string"
);

html=
html.replace(
/<script[\s\S]*?<\/script>/gi,
""
);

output+=
html+
"<hr>";
}

clearViewer();

const d=
document.createElement(
"div"
);

d.className="doc";

d.innerHTML=
output||
"<p>No readable EPUB content.</p>";

viewer.appendChild(d);

kind="epub";
nativePDF=false;

textContent=
d.innerText||"";

updateTools();
}

async function openODS(buffer){

await Z.loadAsync(
new Uint8Array(buffer)
);

zip.file(
"content.xml"
);

"Invalid ODS."
);
}

const xml=
await file.async("string");

new DOMParser().parseFromString(

);

for(
const rowNode of
doc.querySelectorAll(

)
){

rowNode.children
){

if(
cell.localName!=="table-cell"&&
!cell.nodeName.endsWith(

)
){
continue;
}

const repeat=
Number(
cell.getAttribute(

);

(cell.textContent||"").trim();

i<Math.max(
1,
repeat
);
i++
){
row.push(value);
}
}

if(row.length){
rows.push(row);
}
}

renderTable(rows);

kind="ods";
nativePDF=false;

updateTools();
}

async function openPPTX(buffer){

const Z=
await lib("jszip");

const zip=
await Z.loadAsync(
new Uint8Array(buffer)
);

const parser=
new DOMParser();

const presentationFile=
zip.file(
"ppt/presentation.xml"
);

if(!presentationFile){
throw Error(
"Invalid PPTX."
);
}

const presentation=
parser.parseFromString(
await presentationFile.async(
"string"
),
"application/xml"
);

const relFile=
zip.file(
"ppt/_rels/presentation.xml.rels"
);

if(!relFile){
throw Error(
"PPTX relationships not found."
);
}

const relDoc=
parser.parseFromString(
await relFile.async("string"),
"application/xml"
);

const relationships=
new Map();

for(
const rel of
relDoc.querySelectorAll(
"Relationship"
)
){

relationships.set(
rel.getAttribute("Id"),
rel.getAttribute("Target")
);
}

const ids=[
...presentation.querySelectorAll(
"p\\:sldId,p\\:sldIdLst sldId"
)
];

const slides=[];

for(
const id of
ids
){

const rid=
id.getAttribute("r:id")||
id.getAttribute("id");

let target=
relationships.get(rid);

if(!target){
continue;
}

target=
String(target)
.replace(
/^\.\//,
""
);

const slidePath=
target.startsWith(
"ppt/"
)
?target
:"ppt/"+target;

const file=
zip.file(slidePath);

if(file){

slides.push(
await file.async(
"string"
)
);
}
}

if(!slides.length){

for(
const name of
Object.keys(zip.files)
){

if(
/^ppt\/slides\/slide\d+\.xml$/i.test(
name
)
){

slides.push(
await zip
.file(name)
.async("string")
);
}
}
}

if(!slides.length){
throw Error(
"No readable PPTX slides found."
);
}

loaded={
slides,
zip
};

kind="pptx";
nativePDF=false;

total=slides.length;
page=1;

textContent=
slides.join("\n");

await renderPPTX();

setStatus(
"PPTX loaded."
);
}

async function renderPPTX(){

if(
!loaded||
!loaded.slides
){
return;
}

clearViewer();

const xml=
loaded.slides[
page-1
];

const doc=
new DOMParser().parseFromString(
xml,
"application/xml"
);

const wrap=
document.createElement(
"div"
);

wrap.className="pptx";

const slide=
document.createElement(
"div"
);

slide.className=
"ppt-slide";

const shapes=[
...doc.querySelectorAll(
"p\\:sp,p\\:graphicFrame,p\\:pic,sp,graphicFrame,pic"
)
];

let index=0;

for(
const shape of
shapes
){

const tx=
shape.querySelector(
"p\\:txBody,txBody"
);

if(!tx){
continue;
}

const value=[
...tx.querySelectorAll(
"a\\:t,t"
)
]
.map(
x=>x.textContent||""
)
.join("");

if(!value){
continue;
}

const p=
document.createElement(
"div"
);

p.className=
"ppt-text";

p.style.left="6%";
p.style.right="6%";
p.style.top=
(7+index*11)+"%";

p.style.fontSize=
Math.max(
14,
30-index*2
)+"px";

p.textContent=
value;

slide.appendChild(p);

index++;
}

if(!index){

const p=
document.createElement(
"div"
);

p.className=
"ppt-text";

p.style.left="6%";
p.style.right="6%";
p.style.top="6%";
p.style.fontSize="18px";

p.textContent=
doc.documentElement.textContent||"";

slide.appendChild(p);
}

wrap.appendChild(slide);
viewer.appendChild(wrap);

updateTools();
}

async function openDocument(source){

cleanup();

source=
String(source||"").trim();

srcBox.value=source;

empty(
"Loading document..."
);

setStatus(
"Reading document..."
);

try{

const data=
await readSource(
source
);

path=
data.path||
normalizeRemoteURL(
source
);

let extension=
ext(path);

if(!extension){

extension=
detectSignature(
data.buffer
);
}

const buffer=
data.buffer;

const content=
data.text!=null
?String(data.text)
:buffer
?textFromBuffer(buffer)
:"";

switch(extension){

case"pdf":

if(!buffer){
throw Error(
"PDF binary data was not returned."
);
}

await openPDF(
buffer,
path
);

break;

case"docx":

if(!buffer){
throw Error(
"DOCX binary data was not returned."
);
}

await openDOCX(
buffer
);

break;

case"pptx":

if(!buffer){
throw Error(
"PPTX binary data was not returned."
);
}

await openPPTX(
buffer
);

break;

case"xlsx":
case"xls":

if(!buffer){
throw Error(
"Spreadsheet binary data was not returned."
);
}

await openXLSX(
buffer
);

break;

case"ods":

if(!buffer){
throw Error(
"ODS binary data was not returned."
);
}

await openODS(
buffer
);

break;

case"odp":

if(!buffer){
throw Error(
"ODP binary data was not returned."
);
}

await openODP(
buffer
);

break;

case"odt":

if(!buffer){
throw Error(
"ODT binary data was not returned."
);
}

await openODT(
buffer
);

break;

case"epub":

if(!buffer){
throw Error(
"EPUB binary data was not returned."
);
}

await openEPUB(
buffer
);

break;

case"md":
case"markdown":

await openMarkdown(
content
);

break;

case"csv":

renderTable(
parseCSV(content)
);

kind="csv";
nativePDF=false;

updateTools();

break;

case"html":
case"htm":

openHTML(
content
);

break;

case"rtf":

openText(
stripRTF(content),
"rtf"
);

break;

case"txt":
case"log":
case"json":
case"xml":
case"yaml":
case"yml":
case"ini":
case"cfg":
case"conf":

openText(
content,
"text"
);

break;

case"png":
case"jpg":
case"jpeg":
case"gif":
case"webp":

if(!buffer){
throw Error(
"Image binary data was not returned."
);
}

await openImage(
buffer,
path
);

break;

case"svg":

openHTML(
content
);

break;

case"doc":
case"ppt":

legacyOffice(
extension
);

break;

default:

if(data.text!=null){

openText(
content,
"text"
);

}else if(buffer){

binaryFallback(
path,
buffer
);

}else{

throw Error(
"No readable document data was returned."
);
}

break;
}

clearStatus();
updateTools();

}catch(e){

const message=
errorText(e);

showError(
"Failed to load document.\n\n"+
message
);

setStatus(
"ERROR: "+
message
);
}
}

function cleanup(){

clearUrls();

loaded=null;
kind="";
path="";
zoom=1;
page=1;
total=0;
textContent="";
nativePDF=false;

currentSheets=[];
currentSheetIndex=0;

clearSearchMarks();

searchQuery="";
searchMatches=[];
searchIndex=-1;

zoomInfo.textContent=
"100%";

pageInfo.textContent=
"";
}

function applyZoom(){

zoom=
Math.max(
.25,
Math.min(
4,
zoom
)
);

zoomInfo.textContent=
Math.round(
zoom*100
)+"%";

if(
kind==="pdf"&&
!nativePDF
){

renderPDF();

return;
}

viewer.style.zoom=
String(zoom);
}

function setZoom(value){

let z=
Number(value);

if(
typeof value==="string"&&
value.endsWith("%")
){

z=
Number(
value.slice(0,-1)
)/
100;
}

if(!Number.isFinite(z)){
z=1;
}

zoom=z;

applyZoom();
}

function next(){

if(
kind==="pdf"&&
nativePDF
){
return;
}

if(
page>=total
){
return;
}

page++;

if(kind==="pdf"){
renderPDF();
}else if(kind==="pptx"){
renderPPTX();
}

if(searchQuery){
setTimeout(
()=>searchText(
searchQuery,
true
),
150
);
}
}

function prev(){

if(
kind==="pdf"&&
nativePDF
){
return;
}

if(
page<=1
){
return;
}

page--;

if(kind==="pdf"){
renderPDF();
}else if(kind==="pptx"){
renderPPTX();
}

if(searchQuery){
setTimeout(
()=>searchText(
searchQuery,
true
),
150
);
}
}

function gotoPage(value){

const n=
Math.floor(
Number(value)
);

if(
!Number.isFinite(n)||
n<1||
n>total
){
return false;
}

page=n;

if(kind==="pdf"){
renderPDF();
}else if(kind==="pptx"){
renderPPTX();
}

if(searchQuery){
setTimeout(
()=>searchText(
searchQuery,
true
),
150
);
}

return true;
}

function clearSearchMarks(){

for(
const mark of
document.querySelectorAll(
".search-mark"
)
){

const parent=
mark.parentNode;

if(!parent){
continue;
}

parent.replaceChild(
document.createTextNode(
mark.textContent
),
mark
);

parent.normalize();
}
}

function findTextNodes(root){

const walker=
document.createTreeWalker(
root,
NodeFilter.SHOW_TEXT,
{
acceptNode(node){

if(
!node.nodeValue||
!node.nodeValue.trim()
){
return NodeFilter.FILTER_REJECT;
}

if(
node.parentElement?.closest(
"script,style,input,textarea,button"
)
){
return NodeFilter.FILTER_REJECT;
}

return NodeFilter.FILTER_ACCEPT;
}
}
);

const nodes=[];

while(
walker.nextNode()
){
nodes.push(
walker.currentNode
);
}

return nodes;
}

function highlightQuery(root,query){

if(!query){
return [];
}

const regex=
new RegExp(
query.replace(
/[.*+?^${}()|[\]\\]/g,
"\\$&"
),
"gi"
);

const matches=[];

const nodes=
findTextNodes(root);

for(
const node of
nodes
){

const text=
node.nodeValue;

let last=0;
let match;

regex.lastIndex=0;

const fragment=
document.createDocumentFragment();

let changed=false;

while(
(match=regex.exec(text))
){

changed=true;

if(
match.index>last
){

fragment.appendChild(
document.createTextNode(
text.slice(
last,
match.index
)
)
);
}

const mark=
document.createElement(
"mark"
);

mark.className=
"search-mark";

mark.textContent=
match[0];

fragment.appendChild(
mark
);

matches.push(
mark
);

last=
match.index+
match[0].length;
}

if(!changed){
continue;
}

if(last<text.length){

fragment.appendChild(
document.createTextNode(
text.slice(last)
)
);
}

node.parentNode.replaceChild(
fragment,
node
);
}

return matches;
}

function searchText(
query,
keepIndex=false
){

query=
String(
query||""
).trim();

if(!query){

clearSearchMarks();

searchQuery="";
searchMatches=[];
searchIndex=-1;

setStatus(
"Search cleared."
);

return;
}

searchQuery=
query;

clearSearchMarks();

searchMatches=
highlightQuery(
viewer,
query
);

if(!searchMatches.length){

setStatus(
"Not found: "+
query
);

return;
}

if(!keepIndex){

searchIndex=0;

}else{

searchIndex=
Math.min(
Math.max(
searchIndex,
0
),
searchMatches.length-1
);
}

for(
const mark of
searchMatches
){
mark.classList.remove(
"current"
);
}

const current=
searchMatches[
searchIndex
];

current.classList.add(
"current"
);

current.scrollIntoView({
behavior:"smooth",
block:"center",
inline:"nearest"
});

setStatus(
"Found "+
(searchIndex+1)+
"/"+
searchMatches.length+
": "+
query
);
}

function nextSearch(){

if(!searchQuery){
return;
}

if(!searchMatches.length){
searchText(
searchQuery
);
return;
}

searchMatches.forEach(
x=>
x.classList.remove(
"current"
)
);

searchIndex=
(
searchIndex+1
)%
searchMatches.length;

const current=
searchMatches[
searchIndex
];

current.classList.add(
"current"
);

current.scrollIntoView({
behavior:"smooth",
block:"center",
inline:"nearest"
});

setStatus(
"Found "+
(searchIndex+1)+
"/"+
searchMatches.length+
": "+
searchQuery
);
}

stage.addEventListener(
"wheel",
e=>{

if(
e.ctrlKey||
e.metaKey
){

e.preventDefault();

const amount=
e.deltaY>0
?-0.1
:0.1;

zoom+=
amount;

applyZoom();

return;
}

},
{
passive:false
}
);

function distance(a,b){

const dx=
a.clientX-b.clientX;

const dy=
a.clientY-b.clientY;

return Math.hypot(
dx,
dy
);
}

stage.addEventListener(
"pointerdown",
e=>{

if(
e.pointerType==="touch"
){

const touches=
stage
.setPointerCapture
?null
:null;
}

if(e.pointerType==="mouse"){

pointerState={
x:e.clientX,
y:e.clientY,
scrollLeft:stage.scrollLeft,
scrollTop:stage.scrollTop,
moved:false
};

stage.setPointerCapture?.(
e.pointerId
);
}

if(e.pointerType==="touch"){

if(
!stage._pointers
){
stage._pointers=
new Map();
}

stage._pointers.set(
e.pointerId,
{
x:e.clientX,
y:e.clientY
}
);

if(
stage._pointers.size===2
){

const values=
[
...stage._pointers.values()
];

pinchState={
startDistance:
distance(
values[0],
values[1]
),
startZoom:
zoom
};

}
}

},
{
passive:false
}
);

stage.addEventListener(
"pointermove",
e=>{

if(
e.pointerType==="mouse"&&
pointerState
){

const dx=
e.clientX-
pointerState.x;

const dy=
e.clientY-
pointerState.y;

if(
Math.abs(dx)>3||
Math.abs(dy)>3
){
pointerState.moved=true;
}

stage.scrollLeft=
pointerState.scrollLeft-
dx;

stage.scrollTop=
pointerState.scrollTop-
dy;
}

if(e.pointerType==="touch"){

if(
!stage._pointers
){
return;
}

if(
stage._pointers.has(
e.pointerId
)
){

stage._pointers.set(
e.pointerId,
{
x:e.clientX,
y:e.clientY
}
);
}

if(
stage._pointers.size===2&&
pinchState
){

const values=
[
...stage._pointers.values()
];

const currentDistance=
distance(
values[0],
values[1]
);

if(
pinchState.startDistance>0
){

const ratio=
currentDistance/
pinchState.startDistance;

zoom=
pinchState.startZoom*
ratio;

applyZoom();

}

}
}

},
{
passive:false
}
);

function clearPointer(
e
){

if(
e.pointerType==="mouse"
){

pointerState=null;

try{
stage.releasePointerCapture?.(
e.pointerId
);
}catch(_){}

}

if(
e.pointerType==="touch"&&
stage._pointers
){

stage._pointers.delete(
e.pointerId
);

if(
stage._pointers.size<2
){

pinchState=null;
}
}
}

stage.addEventListener(
"pointerup",
clearPointer
);

stage.addEventListener(
"pointercancel",
clearPointer
);

stage.addEventListener(
"pointerleave",
e=>{
if(
e.pointerType==="mouse"
){
pointerState=null;
}
}
);

const DocumentAPI={
action:async actions=>{

if(
!actions||
typeof actions!=="object"||
Array.isArray(actions)
){

return{
ok:false,
error:
"Document action must be an object."
};
}

const results={};

try{

for(
const key of
Object.keys(actions)
){

const value=
actions[key];

switch(
key.toLowerCase()
){

case"open":

await openDocument(
value
);

results.open={
ok:true,
path:String(value)
};

break;

case"close":

cleanup();
empty();

results.close={
ok:true
};

break;

case"next":
case"nextpage":

next();

results[key]={
ok:true,
page,
total
};

break;

case"previous":
case"prev":
case"previouspage":

prev();

results[key]={
ok:true,
page,
total
};

break;

case"page":
case"goto":

results[key]={
ok:
gotoPage(value),
page,
total
};

break;

case"zoom":

setZoom(value);

results.zoom={
ok:true,
value:zoom
};

break;

case"find":
case"search":

searchText(
value
);

results[key]={
ok:
searchMatches.length>0,
matches:
searchMatches.length,
query:
String(value||"")
};

break;

case"state":

results.state={
ok:true,
path,
type:kind,
page,
totalPages:total,
zoom,
mime:mime(path),
loaded:!!kind,
nativePDF
};

break;

default:

results[key]={
ok:false,
error:
"Unknown document action: "+
key
};
}
}

return{
ok:true,
results
};

}catch(e){

return{
ok:false,
error:errorText(e),
results
};
}
}
};

try{

if(
window.parent&&
window.parent!==window
){

window.parent.DocumentAPI=
DocumentAPI;

}

}catch(_){}

window.DocumentAPI=
DocumentAPI;
