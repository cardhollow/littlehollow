<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Document Viewer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:monospace}
html,body{width:100%;height:100%;background:#000;color:#00FFFF}
body{overflow:hidden}
button,input{font-family:monospace}
.wrap{display:flex;flex-direction:column;width:100%;height:100%}
.bar{display:flex;gap:6px;padding:8px;border-bottom:1px solid #00FFFF;flex-wrap:wrap}
.bar input{flex:1;min-width:0;background:#001010;border:1px solid #00FFFF;color:#00FFFF;padding:7px 8px;outline:none;font:11px monospace}
.bar button,.tools button{border:1px solid #00FFFF;background:transparent;color:#00FFFF;padding:6px 9px;cursor:pointer;font:10px monospace}
.bar button:active,.tools button:active{background:#00FFFF;color:#000}
.bar button:disabled,.tools button:disabled{opacity:.35;cursor:not-allowed}
.tools{display:flex;gap:5px;align-items:center;padding:6px 8px;border-bottom:1px solid rgba(0,255,255,.25);overflow:auto;flex:0 0 auto}
.tools input{width:100px;flex:0 0 100px;background:#001010;border:1px solid #00FFFF;color:#00FFFF;padding:5px 6px;outline:none;font:10px monospace}
.tools .info{font-size:10px;opacity:.7;white-space:nowrap}
.stage{position:relative;flex:1;min-height:0;overflow:auto;background:#000}
.viewer{min-width:100%;min-height:100%;display:flex;justify-content:center;align-items:flex-start;padding:14px}
.empty{min-height:100%;width:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;opacity:.55;font-size:12px;white-space:pre-wrap}
.error{width:min(950px,100%);margin:auto;padding:20px;color:#ff6666;font-size:11px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.status{position:fixed;left:10px;right:10px;bottom:10px;padding:8px 10px;border:1px solid #064A4C;background:#001113;color:#00FFFF;font-size:10px;line-height:1.4;display:none;z-index:999999;white-space:pre-wrap;pointer-events:none}
.status.show{display:block}
.doc{width:min(900px,100%);background:#fff;color:#111;padding:44px;line-height:1.55;box-shadow:0 0 0 1px #333}
.doc img{max-width:100%;height:auto}
.doc table{border-collapse:collapse;width:100%;margin:12px 0}
.doc th,.doc td{border:1px solid #777;padding:5px 7px;vertical-align:top}
.doc pre{white-space:pre-wrap;word-break:break-word;background:#eee;padding:10px;overflow:auto}
.md{width:min(900px,100%);background:#fff;color:#111;padding:44px;line-height:1.6;box-shadow:0 0 0 1px #333}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:1em 0 .5em}
.md p,.md ul,.md ol,.md blockquote,.md pre{margin:.7em 0}
.md blockquote{border-left:4px solid #888;padding-left:12px;color:#444}
.md code{background:#eee;padding:2px 4px}
.md pre{padding:10px;background:#eee;overflow:auto}
.md img{max-width:100%}
.text{width:min(1000px,100%);padding:25px;white-space:pre-wrap;word-break:break-word;line-height:1.5;font:13px monospace;color:#00FFFF}
.sheet-wrap{width:100%;overflow:auto;background:#fff}
.sheet{border-collapse:collapse;background:#fff;color:#000;width:max-content;min-width:100%}
.sheet th,.sheet td{border:1px solid #888;padding:5px 8px;vertical-align:top;white-space:pre-wrap;min-width:70px}
.sheet th{font-weight:bold;background:#e8e8e8;position:sticky;top:0;z-index:2}
.pdf{width:min(100%,1100px);display:flex;flex-direction:column;align-items:center;gap:12px}
.pdf canvas{display:block;background:#fff;box-shadow:0 0 0 1px #444;height:auto}
.pdf-native{width:100%;height:calc(100vh - 120px);border:0;background:#fff}
.page-label{font-size:10px;opacity:.7}
.pptx{width:min(1200px,100%);display:flex;justify-content:center}
.ppt-slide{position:relative;width:100%;aspect-ratio:16/9;background:#fff;color:#000;box-shadow:0 0 0 1px #333;overflow:hidden}
.ppt-text{position:absolute;white-space:pre-wrap;overflow:hidden;font-family:Arial,sans-serif;color:#000}
.image-view{width:100%;display:flex;justify-content:center}
.image-view img{max-width:100%;height:auto;background:#fff;box-shadow:0 0 0 1px #444}
.compat{width:min(900px,100%);border:1px solid #064A4C;padding:16px;font-size:11px;line-height:1.6}
.compat strong{color:#FFFF00}
.html-frame{width:min(1100px,100%);height:calc(100vh - 120px);border:0;background:#fff}
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;min-height:50vh;font-size:11px}
.loader-ring{width:28px;height:28px;border:2px solid #064A4C;border-top-color:#00FFFF;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
<div class="bar">
<input id="src" placeholder="Document URL or chxd:/ path..." autocomplete="off" spellcheck="false">
<button id="load">LOAD</button>
</div>
<div class="tools">
<button id="prev">◀ PREV</button>
<button id="next">NEXT ▶</button>
<input id="page" type="number" min="1" step="1" placeholder="PAGE" hidden>
<button id="goto" hidden>GO</button>
<button id="zoomOut">−</button>
<span class="info" id="zoom">100%</span>
<button id="zoomIn">+</button>
<button id="fit">FIT</button>
<input id="find" type="text" placeholder="find text" autocomplete="off" spellcheck="false">
<button id="findBtn">FIND</button>
<span class="info" id="pageInfo"></span>
</div>
<div class="stage" id="stage">
<div class="viewer" id="viewer">
<div class="empty">No document loaded.</div>
</div>
</div>
</div>
<div class="status" id="status"></div>

<script type="module">
"use strict";

const $=id=>document.getElementById(id);
const viewer=$("viewer");
const stage=$("stage");
const statusBox=$("status");
const srcBox=$("src");
const pageBox=$("page");
const goBtn=$("goto");
const pageInfo=$("pageInfo");
const zoomInfo=$("zoom");
const initial=new URLSearchParams(location.search).get("src");

const LIB={
pdf:"https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.mjs",
pdfWorker:"https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.worker.mjs",
mammoth:"https://cdn.jsdelivr.net/npm/mammoth@1.11.0/mammoth.browser.min.js",
marked:"https://cdn.jsdelivr.net/npm/marked@16.3.0/lib/marked.esm.js",
xlsx:"https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs",
jszip:"https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm"
};

let pdfjs=null;
let mammoth=null;
let marked=null;
let XLSX=null;
let JSZip=null;

let loaded=null;
let kind="";
let path="";
let zoom=1;
let page=1;
let total=0;
let textContent="";
let searchHits=[];
let searchIndex=-1;
let urls=[];
let currentSheets=[];
let currentSheetIndex=0;
let nativePDF=false;

function errorText(e){
return e&&typeof e==="object"
?(e.message||e.name||String(e))
:String(e??"Unknown error");
}

function setStatus(message,show=true){
statusBox.textContent=String(message||"");
statusBox.classList.toggle("show",!!show);
}

function clearStatus(){
setStatus("",false);
}

function clearUrls(){
for(const u of urls){
try{URL.revokeObjectURL(u)}catch(_){}
}
urls=[];
}

function clearViewer(){
viewer.innerHTML="";
viewer.style.zoom="1";
}

function empty(message="No document loaded."){
clearViewer();
const d=document.createElement("div");
d.className="empty";
d.textContent=message;
viewer.appendChild(d);
}

function showError(message){
clearViewer();
const d=document.createElement("div");
d.className="error";
d.textContent=String(message);
viewer.appendChild(d);
}

function ext(value){
const s=String(value||"").split("?")[0].split("#")[0];
const i=s.lastIndexOf(".");
return i<0?"":s.slice(i+1).toLowerCase();
}

function mime(value){
switch(ext(value)){
case"pdf":return"application/pdf";
case"docx":return"application/vnd.openxmlformats-officedocument.wordprocessingml.document";
case"doc":return"application/msword";
case"pptx":return"application/vnd.openxmlformats-officedocument.presentationml.presentation";
case"ppt":return"application/vnd.ms-powerpoint";
case"xlsx":return"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
case"xls":return"application/vnd.ms-excel";
case"ods":return"application/vnd.oasis.opendocument.spreadsheet";
case"odp":return"application/vnd.oasis.opendocument.presentation";
case"odt":return"application/vnd.oasis.opendocument.text";
case"epub":return"application/epub+zip";
case"md":
case"markdown":return"text/markdown";
case"csv":return"text/csv";
case"rtf":return"application/rtf";
case"html":
case"htm":return"text/html";
case"txt":
case"log":return"text/plain";
case"xml":return"application/xml";
case"json":return"application/json";
case"yaml":
case"yml":return"text/yaml";
case"png":return"image/png";
case"jpg":
case"jpeg":return"image/jpeg";
case"gif":return"image/gif";
case"webp":return"image/webp";
case"svg":return"image/svg+xml";
default:return"application/octet-stream";
}
}

function virtual(source){
return /^(chxd|local|session|indexdb|puter):\//i.test(String(source||""));
}

function typedArrayToArrayBuffer(value){
if(value instanceof ArrayBuffer){
return value;
}
if(ArrayBuffer.isView(value)){
return value.buffer.slice(
value.byteOffset,
value.byteOffset+value.byteLength
);
}
return null;
}

function base64ToArrayBuffer(value){
let s=String(value||"").trim();
s=s.replace(/^data:[^,]+,/i,"").replace(/\s+/g,"");
const binary=atob(s);
const bytes=new Uint8Array(binary.length);
for(let i=0;i<binary.length;i++){
bytes[i]=binary.charCodeAt(i);
}
return bytes.buffer;
}

async function decodeDataURL(value){
const response=await fetch(value);
if(!response.ok){
throw Error("Could not decode data URL.");
}
return await response.arrayBuffer();
}

async function normalizeBinary(value,source){
if(value==null){
throw Error("Filesystem returned no data for:\n"+source);
}

if(value instanceof Blob){
return{
buffer:await value.arrayBuffer(),
mime:value.type||mime(source),
path:source
};
}

const typed=typedArrayToArrayBuffer(value);
if(typed){
return{
buffer:typed,
mime:mime(source),
path:source
};
}

if(typeof value==="string"){
if(/^data:/i.test(value)){
return{
buffer:await decodeDataURL(value),
mime:(value.match(/^data:([^;,]+)/i)||[])[1]||mime(source),
path:source
};
}
if(/^base64:/i.test(value)){
return{
buffer:base64ToArrayBuffer(value.slice(7)),
mime:mime(source),
path:source
};
}
return{
text:value,
mime:mime(source),
path:source
};
}

if(typeof value==="object"){
if(value.buffer!=null)return normalizeBinary(value.buffer,source);
if(value.bytes!=null)return normalizeBinary(value.bytes,source);
if(value.data!=null)return normalizeBinary(value.data,source);
if(value.content!=null)return normalizeBinary(value.content,source);
if(value.base64!=null){
return{
buffer:base64ToArrayBuffer(value.base64),
mime:value.mime||mime(source),
path:source
};
}
}

throw Error("Unsupported filesystem data type for:\n"+source);
}

function getFS(){
const fs=window.parent!==window?window.parent.FS:window.FS;
if(!fs){
throw Error("Little Hollow filesystem bridge is unavailable.");
}
return fs;
}

function googleUnwrap(source){
try{
const u=new URL(source);
if(
u.hostname.toLowerCase()==="www.google.com" &&
u.pathname==="/url"
){
const target=u.searchParams.get("url");
if(target){
return target;
}
}
}catch(_){}
return source;
}

function normalizeRemoteSource(source){
source=String(source||"").trim();
let previous="";
let current=source;
for(let i=0;i<3&&current!==previous;i++){
previous=current;
current=googleUnwrap(current);
}
return current;
}

async function readSource(source){
source=String(source||"").trim();
if(!source){
throw Error("No document source specified.");
}

if(virtual(source)){
const fs=getFS();
let normalized=source;
if(typeof fs.normalize==="function"){
try{
normalized=await fs.normalize(source);
}catch(_){}
}

if(typeof fs.read!=="function"){
throw Error("Little Hollow FS.read() is unavailable.");
}

const result=await fs.read(normalized);

if(result&&typeof result==="object"&&"ok"in result&&!result.ok){
throw Error(result.error||"Could not read document.");
}

const content=
result&&typeof result==="object"&&"content"in result
?result.content
:result;

return await normalizeBinary(content,normalized);
}

source=normalizeRemoteSource(source);

if(
/^https?:\/\//i.test(source) ||
/^blob:/i.test(source) ||
/^data:/i.test(source)
){
const response=await fetch(source,{
redirect:"follow"
});
if(!response.ok){
throw Error("HTTP "+response.status+" while loading document.");
}
const buffer=await response.arrayBuffer();
return{
buffer,
mime:response.headers.get("content-type")||mime(source),
path:source
};
}

throw Error("Unsupported document source:\n"+source);
}

function textFromBuffer(buffer){
try{
return new TextDecoder("utf-8",{fatal:false}).decode(buffer);
}catch(_){
return"";
}
}

function detectSignature(buffer){
if(!buffer)return"";
const b=new Uint8Array(buffer);

if(
b.length>=4 &&
b[0]===0x25 &&
b[1]===0x50 &&
b[2]===0x44 &&
b[3]===0x46
){
return"pdf";
}

if(
b.length>=4 &&
b[0]===0x50 &&
b[1]===0x4b &&
b[2]===0x03 &&
b[3]===0x04
){
return"zip";
}

if(
b.length>=8 &&
b[0]===0x89 &&
b[1]===0x50 &&
b[2]===0x4e &&
b[3]===0x47
){
return"png";
}

if(
b.length>=3 &&
b[0]===0xff &&
b[1]===0xd8 &&
b[2]===0xff
){
return"jpg";
}

if(b.length>=6){
const s=String.fromCharCode(...b.slice(0,6));
if(s==="GIF87a"||s==="GIF89a"){
return"gif";
}
}

return"";
}

async function loadScript(src){
return new Promise((resolve,reject)=>{
const existing=document.querySelector(
`script[data-dv-src="${src}"]`
);

if(existing){
if(existing.dataset.ready==="1"){
resolve();
return;
}
existing.addEventListener("load",resolve,{once:true});
existing.addEventListener(
"error",
()=>reject(Error("Could not load "+src)),
{once:true}
);
return;
}

const s=document.createElement("script");
s.src=src;
s.dataset.dvSrc=src;

s.onload=()=>{
s.dataset.ready="1";
resolve();
};

s.onerror=()=>{
reject(Error("Could not load "+src));
};

document.head.appendChild(s);
});
}

async function lib(name){
if(name==="pdf"){
if(pdfjs)return pdfjs;
pdfjs=await import(LIB.pdf);
pdfjs.GlobalWorkerOptions.workerSrc=LIB.pdfWorker;
return pdfjs;
}

if(name==="mammoth"){
if(mammoth)return mammoth;
if(window.mammoth){
mammoth=window.mammoth;
return mammoth;
}
await loadScript(LIB.mammoth);
mammoth=window.mammoth||window.Mammoth;
if(!mammoth){
throw Error("Mammoth.js was not exposed.");
}
return mammoth;
}

if(name==="marked"){
if(marked)return marked;
marked=await import(LIB.marked);
return marked;
}

if(name==="xlsx"){
if(XLSX)return XLSX;
XLSX=await import(LIB.xlsx);
return XLSX;
}

if(name==="jszip"){
if(JSZip)return JSZip;
const m=await import(LIB.jszip);
JSZip=m.default||m;
return JSZip;
}

throw Error("Unknown library: "+name);
}

function updateTools(){
const paged=kind==="pdf"&&!nativePDF||kind==="pptx";
$("prev").disabled=!paged;
$("next").disabled=!paged;
pageBox.hidden=!paged;
goBtn.hidden=!paged;
pageInfo.textContent=paged?`${page} / ${total}`:"";
zoomInfo.textContent=Math.round(zoom*100)+"%";
}

async function openPDF(buffer,source){
try{
const p=await lib("pdf");
const task=p.getDocument({
data:new Uint8Array(buffer)
});
loaded=await task.promise;
kind="pdf";
nativePDF=false;
total=loaded.numPages;
page=1;
textContent="";
await renderPDF();
setStatus("PDF loaded.");
}catch(error){
if(/^https?:\/\//i.test(source)){
openNativePDF(source);
return;
}
throw error;
}
}

function openNativePDF(source){
clearViewer();
const frame=document.createElement("iframe");
frame.className="pdf-native";
frame.src=source;
frame.title="PDF";
viewer.appendChild(frame);
kind="pdf";
nativePDF=true;
loaded=null;
total=0;
page=1;
setStatus("PDF opened with the browser PDF viewer.");
updateTools();
}

async function renderPDF(){
if(!loaded)return;

clearViewer();

const pdfPage=await loaded.getPage(page);
const base=pdfPage.getViewport({scale:1});
const available=Math.max(280,stage.clientWidth-44);
const scale=(available/base.width)*zoom;
const viewport=pdfPage.getViewport({scale});

const wrap=document.createElement("div");
wrap.className="pdf";

const label=document.createElement("div");
label.className="page-label";
label.textContent=`PAGE ${page}`;

const canvas=document.createElement("canvas");
const dpr=window.devicePixelRatio||1;

canvas.width=Math.floor(viewport.width*dpr);
canvas.height=Math.floor(viewport.height*dpr);
canvas.style.width=viewport.width+"px";
canvas.style.height=viewport.height+"px";

wrap.append(label,canvas);
viewer.appendChild(wrap);

await pdfPage.render({
canvasContext:canvas.getContext("2d"),
viewport,
transform:dpr!==1?[dpr,0,0,dpr,0,0]:null
}).promise;

try{
const tc=await pdfPage.getTextContent();
const pageText=tc.items.map(x=>x.str||"").join(" ");
textContent=[textContent,pageText].filter(Boolean).join("\n");
}catch(_){}

updateTools();
}

async function openDOCX(buffer){
const m=await lib("mammoth");
const result=await m.convertToHtml({
arrayBuffer:buffer
});

clearViewer();

const d=document.createElement("div");
d.className="doc";
d.innerHTML=result.value||"<p>No document content.</p>";

viewer.appendChild(d);

loaded=d;
kind="docx";
nativePDF=false;
textContent=d.innerText||"";

setStatus(
result.messages?.length
?`DOCX loaded with ${result.messages.length} conversion note(s).`
:"DOCX loaded."
);

updateTools();
}

async function openXLSX(buffer){
const x=await lib("xlsx");
const wb=x.read(buffer,{type:"array"});

loaded=wb;
kind="xlsx";
nativePDF=false;
currentSheets=wb.SheetNames||[];
currentSheetIndex=0;

renderCurrentSheet();
setStatus("Spreadsheet loaded: "+(currentSheets[0]||""));
updateTools();
}

function renderCurrentSheet(){
if(!loaded||!currentSheets.length)return;

const sheetName=currentSheets[currentSheetIndex];
const ws=loaded.Sheets[sheetName];

const rows=XLSX.utils.sheet_to_json(ws,{
header:1,
raw:false,
defval:""
});

clearViewer();

const wrap=document.createElement("div");
wrap.className="sheet-wrap";

const title=document.createElement("div");
title.style.color="#000";
title.style.background="#ddd";
title.style.borderBottom="1px solid #888";
title.style.padding="8px";
title.textContent=sheetName;

const table=document.createElement("table");
table.className="sheet";

for(let r=0;r<rows.length;r++){
const tr=document.createElement("tr");

for(const value of rows[r]){
const cell=document.createElement(r===0?"th":"td");
cell.textContent=value==null?"":String(value);
tr.appendChild(cell);
}

table.appendChild(tr);
}

wrap.append(title,table);
viewer.appendChild(wrap);

pageInfo.textContent=currentSheets.join(" | ");
textContent=table.innerText||"";
}

function parseCSV(input){
const rows=[];
let row=[];
let cell="";
let quoted=false;

for(let i=0;i<input.length;i++){
const c=input[i];

if(c==='"'){
if(quoted&&input[i+1]==='"'){
cell+='"';
i++;
}else{
quoted=!quoted;
}
continue;
}

if(c===","&&!quoted){
row.push(cell);
cell="";
continue;
}

if((c==="\n"||c==="\r")&&!quoted){
if(c==="\r"&&input[i+1]==="\n")i++;
row.push(cell);
rows.push(row);
row=[];
cell="";
continue;
}

cell+=c;
}

row.push(cell);

if(row.length>1||row[0]!==""){
rows.push(row);
}

return rows;
}

function renderTable(rows){
clearViewer();

const wrap=document.createElement("div");
wrap.className="sheet-wrap";

const table=document.createElement("table");
table.className="sheet";

for(let i=0;i<rows.length;i++){
const tr=document.createElement("tr");

for(const value of rows[i]){
const cell=document.createElement(i===0?"th":"td");
cell.textContent=value==null?"":String(value);
tr.appendChild(cell);
}

table.appendChild(tr);
}

wrap.appendChild(table);
viewer.appendChild(wrap);
textContent=table.innerText||"";
}

async function openMarkdown(value){
const m=await lib("marked");

clearViewer();

const d=document.createElement("div");
d.className="md";
d.innerHTML=m.parse(String(value||""));

viewer.appendChild(d);

kind="markdown";
nativePDF=false;
textContent=d.innerText||"";

updateTools();
}

function openHTML(value){
clearViewer();

const frame=document.createElement("iframe");
frame.className="html-frame";
frame.sandbox="";
frame.srcdoc=String(value||"");

viewer.appendChild(frame);

kind="html";
nativePDF=false;
textContent=String(value||"");

updateTools();
}

function openText(value,type="text"){
clearViewer();

const d=document.createElement("div");
d.className="text";
d.textContent=String(value||"");

viewer.appendChild(d);

kind=type;
nativePDF=false;
textContent=String(value||"");

updateTools();
}

function stripRTF(value){
return String(value||"")
.replace(/\\'[0-9a-fA-F]{2}/g,m=>String.fromCharCode(parseInt(m.slice(2),16)))
.replace(/\\par[d]?/g,"\n")
.replace(/\\line/g,"\n")
.replace(/\\tab/g,"\t")
.replace(/\\[a-zA-Z]+-?\d* ?/g,"")
.replace(/[{}]/g,"");
}

async function openEPUB(buffer){
const Z=await lib("jszip");
const zip=await Z.loadAsync(new Uint8Array(buffer));

const container=zip.file("META-INF/container.xml");
if(!container){
throw Error("Invalid EPUB.");
}

const cx=await container.async("string");
const root=cx.match(
/<rootfile[^>]+full-path=["']([^"']+)["']/i
);

if(!root){
throw Error("EPUB package path not found.");
}

const opfPath=root[1];
const opfFile=zip.file(opfPath);

if(!opfFile){
throw Error("EPUB package file not found.");
}

const opfXml=await opfFile.async("string");
const parser=new DOMParser();
const opf=parser.parseFromString(opfXml,"application/xml");

const base=opfPath.includes("/")
?opfPath.slice(0,opfPath.lastIndexOf("/")+1)
:"";

const manifest=new Map();

for(const item of opf.querySelectorAll("item")){
const id=item.getAttribute("id");
const href=item.getAttribute("href");
if(id&&href){
manifest.set(id,href);
}
}

const spine=[];

for(const itemref of opf.querySelectorAll("itemref")){
const idref=itemref.getAttribute("idref");
if(idref&&manifest.has(idref)){
spine.push(manifest.get(idref));
}
}

let html="";

for(const href of spine){
const full=base+decodeURIComponent(href).replace(/^\.\//,"");
const file=zip.file(full);
if(!file)continue;

let part=await file.async("string");
part=part.replace(/<script[\s\S]*?<\/script>/gi,"");
html+=part+"<hr>";
}

clearViewer();

const d=document.createElement("div");
d.className="doc";
d.innerHTML=html||"<p>No readable EPUB content.</p>";

viewer.appendChild(d);

kind="epub";
nativePDF=false;
textContent=d.innerText||"";

updateTools();
}

async function openODT(buffer){
const Z=await lib("jszip");
const zip=await Z.loadAsync(new Uint8Array(buffer));
const file=zip.file("content.xml");

if(!file){
throw Error("Invalid ODT.");
}

const xml=await file.async("string");
const doc=new DOMParser().parseFromString(xml,"application/xml");

const html=[];

for(const node of doc.querySelectorAll("text\\:h,text\\:p,h,p")){
const value=escapeHTML(node.textContent||"");
const tag=node.localName==="h"||node.nodeName.endsWith(":h")?"h2":"p";
html.push(`<${tag}>${value}</${tag}>`);
}

clearViewer();

const d=document.createElement("div");
d.className="doc";
d.innerHTML=html.join("")||"<p>No readable ODT content.</p>";

viewer.appendChild(d);

kind="odt";
nativePDF=false;
textContent=d.innerText||"";

updateTools();
}

async function openODS(buffer){
const Z=await lib("jszip");
const zip=await Z.loadAsync(new Uint8Array(buffer));
const file=zip.file("content.xml");

if(!file){
throw Error("Invalid ODS.");
}

const xml=await file.async("string");
const doc=new DOMParser().parseFromString(xml,"application/xml");
const rows=[];

for(const rowNode of doc.querySelectorAll("table\\:table-row,table-row")){
const row=[];

for(const cell of rowNode.children){
if(
cell.localName!=="table-cell" &&
!cell.nodeName.endsWith(":table-cell")
){
continue;
}

const repeat=Number(
cell.getAttribute("table:number-columns-repeated")||1
);

const value=(cell.textContent||"").trim();

for(let i=0;i<Math.max(1,repeat);i++){
row.push(value);
}
}

if(row.length){
rows.push(row);
}
}

renderTable(rows);
kind="ods";
nativePDF=false;
updateTools();
}

async function openODP(buffer){
const Z=await lib("jszip");
const zip=await Z.loadAsync(new Uint8Array(buffer));
const file=zip.file("content.xml");

if(!file){
throw Error("Invalid ODP.");
}

const xml=await file.async("string");
const doc=new DOMParser().parseFromString(xml,"application/xml");
const pages=[...doc.querySelectorAll("draw\\:page,draw-page")];

clearViewer();

const container=document.createElement("div");
container.className="pptx";

for(const pageNode of pages){
const slide=document.createElement("div");
slide.className="ppt-slide";

const p=document.createElement("div");
p.className="ppt-text";
p.style.left="6%";
p.style.right="6%";
p.style.top="6%";
p.style.fontSize="18px";
p.textContent=(pageNode.textContent||"").trim();

slide.appendChild(p);
container.appendChild(slide);
}

viewer.appendChild(container);

kind="odp";
nativePDF=false;
textContent=viewer.innerText||"";

updateTools();
}

async function openPPTX(buffer){
const Z=await lib("jszip");
const zip=await Z.loadAsync(new Uint8Array(buffer));
const parser=new DOMParser();

const presentationFile=zip.file("ppt/presentation.xml");

if(!presentationFile){
throw Error("Invalid PPTX.");
}

const presentation=parser.parseFromString(
await presentationFile.async("string"),
"application/xml"
);

const relFile=zip.file("ppt/_rels/presentation.xml.rels");

if(!relFile){
throw Error("PPTX relationships not found.");
}

const relDoc=parser.parseFromString(
await relFile.async("string"),
"application/xml"
);

const relations=new Map();

for(const rel of relDoc.querySelectorAll("Relationship")){
relations.set(
rel.getAttribute("Id"),
rel.getAttribute("Target")
);
}

const ids=[...presentation.querySelectorAll("sldIdLst sldId,p\\:sldIdLst p\\:sldId")];
const slides=[];

for(const id of ids){
const rid=id.getAttribute("r:id")||id.getAttribute("id");
const target=relations.get(rid);

if(!target)continue;

let slidePath=String(target).replace(/^\.\//,"");

if(!slidePath.startsWith("ppt/")){
slidePath="ppt/"+slidePath;
}

const file=zip.file(slidePath);

if(file){
slides.push(
await file.async("string")
);
}
}

if(!slides.length){
for(const name of Object.keys(zip.files)){
if(/^ppt\/slides\/slide\d+\.xml$/i.test(name)){
slides.push(
await zip.file(name).async("string")
);
}
}
}

if(!slides.length){
throw Error("No readable PPTX slides found.");
}

loaded={
slides,
zip
};

kind="pptx";
nativePDF=false;
total=slides.length;
page=1;

textContent=slides.join("\n");

await renderPPTX();

setStatus("PPTX loaded.");
}

async function renderPPTX(){
if(!loaded||!loaded.slides)return;

clearViewer();

const xml=loaded.slides[page-1];
const doc=new DOMParser().parseFromString(xml,"application/xml");

const wrap=document.createElement("div");
wrap.className="pptx";

const slide=document.createElement("div");
slide.className="ppt-slide";

const shapes=[
...doc.querySelectorAll(
"p\\:sp,p\\:graphicFrame,p\\:pic,sp,graphicFrame,pic"
)
];

let index=0;

for(const shape of shapes){
const tx=shape.querySelector("p\\:txBody,txBody");

if(!tx)continue;

const value=[
...tx.querySelectorAll("a\\:t,t")
]
.map(x=>x.textContent||"")
.join("");

if(!value)continue;

const p=document.createElement("div");
p.className="ppt-text";
p.style.left="6%";
p.style.right="6%";
p.style.top=(7+index*11)+"%";
p.style.fontSize=Math.max(14,30-index*2)+"px";
p.textContent=value;

slide.appendChild(p);
index++;
}

if(!index){
const p=document.createElement("div");
p.className="ppt-text";
p.style.left="6%";
p.style.right="6%";
p.style.top="6%";
p.style.fontSize="18px";
p.textContent=doc.documentElement.textContent||"";
slide.appendChild(p);
}

wrap.appendChild(slide);
viewer.appendChild(wrap);

updateTools();
}

async function openImage(buffer,source){
const blob=new Blob([buffer],{type:mime(source)});
const url=URL.createObjectURL(blob);

urls.push(url);

clearViewer();

const wrap=document.createElement("div");
wrap.className="image-view";

const img=document.createElement("img");
img.src=url;
img.alt=source;

wrap.appendChild(img);
viewer.appendChild(wrap);

kind="image";
nativePDF=false;

updateTools();
}

function escapeHTML(value){
return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function legacyOffice(extension){
clearViewer();

const d=document.createElement("div");
d.className="compat";

d.innerHTML=
"<strong>LEGACY OFFICE FORMAT: ."+
escapeHTML(extension)+
"</strong><br><br>"+
"This is the old binary Microsoft Office format. "+
"Modern browser-side JavaScript parsers do not reliably render "+
"all legacy .doc/.ppt files.";

viewer.appendChild(d);

kind="legacy";
nativePDF=false;

updateTools();
}

function binaryFallback(source,buffer){
clearViewer();

const d=document.createElement("div");
d.className="compat";

d.innerHTML=
"<strong>UNSUPPORTED DOCUMENT FORMAT</strong><br><br>"+
escapeHTML(ext(source).toUpperCase()||"UNKNOWN")+
"<br><br>"+
"File was successfully read, but this viewer has no browser renderer for this format."+
"<br><br>"+
"Size: "+
(buffer?.byteLength||0).toLocaleString()+
" bytes";

viewer.appendChild(d);

kind="binary";
nativePDF=false;

updateTools();
}

function cleanup(){
clearUrls();
loaded=null;
kind="";
path="";
zoom=1;
page=1;
total=0;
textContent="";
searchHits=[];
searchIndex=-1;
currentSheets=[];
currentSheetIndex=0;
nativePDF=false;
zoomInfo.textContent="100%";
pageInfo.textContent="";
}

async function openDocument(source){
cleanup();

path=String(source||"");
srcBox.value=path;

empty("Loading document...");
setStatus("Reading document...");

try{
const resolved=normalizeRemoteSource(path);
const data=await readSource(resolved);

path=data.path||resolved;

let extension=ext(path);

if(!extension){
extension=detectSignature(data.buffer);
}

const buffer=data.buffer;
const content=
data.text!=null
?String(data.text)
:buffer
?textFromBuffer(buffer)
:"";

switch(extension){

case"pdf":
if(!buffer)throw Error("PDF requires binary data.");
await openPDF(buffer,path);
break;

case"docx":
if(!buffer)throw Error("DOCX requires binary data.");
await openDOCX(buffer);
break;

case"pptx":
if(!buffer)throw Error("PPTX requires binary data.");
await openPPTX(buffer);
break;

case"xlsx":
case"xls":
if(!buffer)throw Error("Spreadsheet requires binary data.");
await openXLSX(buffer);
break;

case"ods":
if(!buffer)throw Error("ODS requires binary data.");
await openODS(buffer);
break;

case"odp":
if(!buffer)throw Error("ODP requires binary data.");
await openODP(buffer);
break;

case"odt":
if(!buffer)throw Error("ODT requires binary data.");
await openODT(buffer);
break;

case"epub":
if(!buffer)throw Error("EPUB requires binary data.");
await openEPUB(buffer);
break;

case"md":
case"markdown":
await openMarkdown(content);
break;

case"csv":
renderTable(parseCSV(content));
kind="csv";
nativePDF=false;
updateTools();
break;

case"html":
case"htm":
openHTML(content);
break;

case"rtf":
openText(stripRTF(content),"rtf");
break;

case"txt":
case"log":
case"json":
case"xml":
case"yaml":
case"yml":
case"ini":
case"cfg":
case"conf":
openText(content,"text");
break;

case"png":
case"jpg":
case"jpeg":
case"gif":
case"webp":
await openImage(buffer,path);
break;

case"svg":
openHTML(content);
break;

case"doc":
case"ppt":
legacyOffice(extension);
break;

default:
if(data.text!=null){
openText(content,"text");
}else if(buffer){
binaryFallback(path,buffer);
}else{
throw Error("Could not determine document type.");
}
}

clearStatus();
updateTools();

}catch(e){
const message=errorText(e);
showError("Failed to load document.\n\n"+message);
setStatus("ERROR: "+message);
}
}

function setZoom(value){
let z=Number(value);

if(
typeof value==="string" &&
value.endsWith("%")
){
z=Number(value.slice(0,-1))/100;
}

if(!Number.isFinite(z))z=1;

zoom=Math.max(.25,Math.min(3,z));

zoomInfo.textContent=Math.round(zoom*100)+"%";

if(kind==="pdf"&&!nativePDF){
renderPDF();
}else{
viewer.style.zoom=String(zoom);
}
}

function next(){
if(page>=total)return;
page++;

if(kind==="pdf"&&!nativePDF){
renderPDF();
}else if(kind==="pptx"){
renderPPTX();
}
}

function prev(){
if(page<=1)return;
page--;

if(kind==="pdf"&&!nativePDF){
renderPDF();
}else if(kind==="pptx"){
renderPPTX();
}
}

function gotoPage(value){
const n=Math.floor(Number(value));

if(
!Number.isFinite(n)||
n<1||
n>total
){
return false;
}

page=n;

if(kind==="pdf"&&!nativePDF){
renderPDF();
}else if(kind==="pptx"){
renderPPTX();
}

return true;
}

function findText(value){
const query=String(value||"").trim().toLowerCase();

if(!query){
searchHits=[];
searchIndex=-1;
setStatus("Search cleared.");
return;
}

const allText=(
textContent||
viewer.innerText||
""
).toLowerCase();

searchHits=[];
let position=0;

while(
(position=allText.indexOf(query,position))>=0
){
searchHits.push(position);
position+=Math.max(1,query.length);
}

if(!searchHits.length){
setStatus("Not found: "+query);
return;
}

searchIndex=
(searchIndex+1)%searchHits.length;

const walker=document.createTreeWalker(
viewer,
NodeFilter.SHOW_TEXT
);

while(walker.nextNode()){
const node=walker.currentNode;
const value=(node.textContent||"").toLowerCase();

if(value.includes(query)){
node.parentElement?.scrollIntoView({
behavior:"smooth",
block:"center"
});
break;
}
}

setStatus(
"Found "+
(searchIndex+1)+
"/"+
searchHits.length+
": "+
query
);
}

const DocumentAPI={
action:async actions=>{
if(
!actions||
typeof actions!=="object"||
Array.isArray(actions)
){
return{
ok:false,
error:"Document action must be an object."
};
}

const results={};

try{
for(const key of Object.keys(actions)){
const value=actions[key];

switch(key.toLowerCase()){

case"open":
await openDocument(value);
results.open={
ok:true,
path:String(value)
};
break;

case"close":
cleanup();
empty();
results.close={ok:true};
break;

case"next":
case"nextpage":
next();
results[key]={
ok:true,
page,
total
};
break;

case"previous":
case"prev":
case"previouspage":
prev();
results[key]={
ok:true,
page,
total
};
break;

case"page":
case"goto":
results[key]={
ok:gotoPage(value),
page,
total
};
break;

case"zoom":
setZoom(value);
results.zoom={
ok:true,
value:zoom
};
break;

case"find":
case"search":
findText(value);
results[key]={
ok:searchHits.length>0,
matches:searchHits.length,
query:String(value||"")
};
break;

case"state":
results.state={
ok:true,
path,
type:kind,
page,
totalPages:total,
zoom,
mime:mime(path),
loaded:!!kind,
nativePDF
};
break;

default:
results[key]={
ok:false,
error:"Unknown document action: "+key
};
}
}

return{
ok:true,
results
};

}catch(e){

return{
ok:false,
error:errorText(e),
results
};
}
}
};

try{
if(window.parent&&window.parent!==window){
window.parent.DocumentAPI=DocumentAPI;
}
}catch(_){}

window.DocumentAPI=DocumentAPI;

$("load").onclick=()=>{
const source=srcBox.value.trim();
if(source)openDocument(source);
};

srcBox.onkeydown=e=>{
if(e.key==="Enter"){
const source=srcBox.value.trim();
if(source)openDocument(source);
}
};

$("prev").onclick=prev;
$("next").onclick=next;

$("goto").onclick=()=>{
gotoPage(pageBox.value);
};

pageBox.onkeydown=e=>{
if(e.key==="Enter"){
gotoPage(pageBox.value);
}
};

$("zoomOut").onclick=()=>{
setZoom(zoom-.1);
};

$("zoomIn").onclick=()=>{
setZoom(zoom+.1);
};

$("fit").onclick=()=>{
setZoom(1);
};

$("findBtn").onclick=()=>{
findText($("find").value);
};

$("find").onkeydown=e=>{
if(e.key==="Enter"){
findText($("find").value);
}
};

window.addEventListener(
"resize",
()=>{
if(kind==="pdf"&&!nativePDF){
renderPDF();
}
}
);

window.addEventListener(
"beforeunload",
cleanup
);

updateTools();

if(initial){
srcBox.value=initial;
openDocument(initial);
}

</script>
