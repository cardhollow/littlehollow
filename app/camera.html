<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:monospace;background:#001113;color:#00ffff}
body{display:flex;flex-direction:column;gap:9px;padding:10px;overflow:auto}
.bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.btn,select{font:inherit;background:#001113;color:#00ffff;border:1px solid #00ffff;padding:7px 9px}
.btn{cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}
.preview{position:relative;border:1px solid #064a4c;background:#000;min-height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.preview video{display:block;width:100%;max-height:390px;object-fit:contain;background:#000}
.preview.front video{transform:scaleX(-1)}
.preview .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#4f8587;font-size:12px;text-align:center;padding:20px;z-index:2}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
.section{border:1px solid #064a4c;padding:9px}.title{font-weight:bold;margin-bottom:7px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.card{border:1px solid #064a4c;padding:6px}.thumb{width:100%;aspect-ratio:4/3;background:#000;object-fit:contain;display:block}
.name{font-size:11px;margin-top:5px;word-break:break-all}.small{font-size:10px;opacity:.72}
.actions{display:flex;gap:5px;margin-top:5px}.msg{border:1px solid #064a4c;padding:7px;min-height:34px;line-height:1.35}
.badge{font-size:10px;padding:2px 5px;border:1px solid #064a4c}
</style>
</head>
<body>
<div class="bar">
  <button class="btn" id="photo">📷 PHOTO</button>
  <button class="btn" id="record">● START VIDEO</button>
  <button class="btn" id="stop" disabled>■ STOP VIDEO</button>
  <button class="btn" id="switch">↔ SWITCH</button>
  <select id="facing" aria-label="Camera">
    <option value="environment">Back camera</option>
    <option value="user">Front camera</option>
  </select>
  <span class="badge" id="format">video: checking</span>
</div>

<div class="preview" id="previewWrap">
  <div class="placeholder" id="placeholder">Starting camera…</div>
  <video id="preview" autoplay muted playsinline></video>
  <div id="flash" class="flash"></div>
</div>

<div class="msg" id="msg">Starting camera…</div>

<div class="section">
  <div class="title">Saved media — chxd:/indexdb/Camera/</div>
  <div id="list" class="list"><div class="small">Loading…</div></div>
</div>

<canvas id="canvas" hidden></canvas>

<script>
(() => {
  "use strict";

  const PREFIX = "chxd:/indexdb/Camera/";
  const $ = id => document.getElementById(id);
  const state = {
    cameraStream: null,
    recorder: null,
    chunks: [],
    recording: false,
    facing: "environment",
    mime: ""
  };

  function status(text){ $("msg").textContent = text; }
  function showPlaceholder(text){
    $("placeholder").textContent = text || "";
    $("placeholder").style.display = text ? "flex" : "none";
  }
  function stopTracks(stream){
    if(!stream) return;
    stream.getTracks().forEach(track => { try{ track.stop(); }catch(_){} });
  }
  function stamp(){ return new Date().toISOString().replace(/[:.]/g,"-"); }
  function errText(error){ return error && (error.message || error.name) ? (error.message || error.name) : String(error || "Unknown error"); }

  function supportedMime(){
    if(typeof MediaRecorder === "undefined") return "";
    const candidates = [
      "video/webm;codecs=vp8",
      "video/webm;codecs=vp9",
      "video/webm",
      "video/mp4;codecs=avc1",
      "video/mp4"
    ];
    for(const type of candidates){
      try{
        if(MediaRecorder.isTypeSupported(type)) return type;
      }catch(_){}
    }
    return "";
  }

  async function openCamera(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      showPlaceholder("Camera API is unavailable here.");
      status("Camera API is unavailable.");
      return false;
    }

    if(state.recording) await stopRecording();
    stopTracks(state.cameraStream);
    state.cameraStream = null;
    $("preview").srcObject = null;
    showPlaceholder("Opening camera…");

    try{
      const stream = await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:{ideal:state.facing},
          width:{ideal:1280},
          height:{ideal:720},
          frameRate:{ideal:30}
        },
        audio:true
      });
      state.cameraStream = stream;
      $("preview").srcObject = stream;
      updateMirror();
      await $("preview").play().catch(()=>{});
      showPlaceholder("");
      const track = stream.getVideoTracks()[0];
      const settings = track && track.getSettings ? track.getSettings() : {};
      const label = settings.facingMode || state.facing;
      status("Camera ready — " + label + ".");
      return true;
    }catch(error){
      showPlaceholder("Camera unavailable. Allow camera permission, then reopen the app.");
      status("Camera error — " + errText(error));
      return false;
    }
  }

  function updateMirror(){
    $("previewWrap").classList.toggle("front", state.facing === "user");
  }

  async function takePhoto(){
    if(state.recording){ status("Stop video recording before taking a photo."); return; }
    if(!state.cameraStream && !(await openCamera())) return;

    const video = $("preview");
    if(video.readyState < 2 || !video.videoWidth){
      status("Camera is not ready yet.");
      return;
    }

    const canvas = $("canvas");
    const w = video.videoWidth;
    const h = video.videoHeight;
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext("2d", {alpha:false});

    // Front-camera photos are intentionally mirrored in the saved file too.
    if(state.facing === "user"){
      ctx.save();
      ctx.translate(w,0);
      ctx.scale(-1,1);
      ctx.drawImage(video,0,0,w,h);
      ctx.restore();
    }else{
      ctx.drawImage(video,0,0,w,h);
    }

    $("flash").style.opacity = "1";
    setTimeout(() => $("flash").style.opacity = "0", 90);

    try{
      const data = canvas.toDataURL("image/jpeg",0.92);
      const path = PREFIX + "photo-" + stamp() + ".jpg";
      await saveString(path,data,{kind:"photo",mimeType:"image/jpeg"});
      status("Photo saved — " + path);
      await loadLibrary();
    }catch(error){
      status("Photo save failed — " + errText(error));
    }
  }

  function blobToDataURL(blob){
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result));
      reader.onerror = () => reject(reader.error || new Error("Could not encode video"));
      reader.readAsDataURL(blob);
    });
  }

  async function saveString(path,data,meta){
    if(typeof parent === "undefined" || !parent.FS || typeof parent.FS.write !== "function"){
      throw new Error("Little Hollow filesystem is unavailable.");
    }
    const result = await parent.FS.write(path,String(data),true);
    if(!result || result.ok !== true) throw new Error(result && result.error ? result.error : "Filesystem write failed");
    const metaResult = await parent.FS.write(path + ".json",JSON.stringify({app:"Camera",createdAt:new Date().toISOString(),storage:"data-url",...meta}),true);
    if(!metaResult || metaResult.ok !== true) throw new Error(metaResult && metaResult.error ? metaResult.error : "Metadata write failed");
  }

  async function startRecording(){
    if(state.recording) return;
    if(typeof MediaRecorder === "undefined"){
      status("Video recording is not supported in this browser.");
      return;
    }
    if(!state.cameraStream && !(await openCamera())) return;

    const videoTrack = state.cameraStream.getVideoTracks()[0];
    if(!videoTrack){ status("No camera video track is available."); return; }

    const stream = new MediaStream([videoTrack]);
    state.chunks = [];
    state.mime = supportedMime();

    let recorder = null;
    try{
      // Do not depend on a MIME string being accepted or parse it ourselves.
      // The browser is allowed to choose its own valid recording container.
      recorder = state.mime ? new MediaRecorder(stream,{mimeType:state.mime}) : new MediaRecorder(stream);
    }catch(_){
      try{ recorder = new MediaRecorder(stream); }
      catch(error){ status("Video start failed — " + errText(error)); return; }
    }

    state.recorder = recorder;
    state.recording = true;
    $("record").disabled = true;
    $("stop").disabled = false;
    $("photo").disabled = true;
    $("switch").disabled = true;
    $("facing").disabled = true;
    $("format").textContent = "video: " + (recorder.mimeType || "browser default");
    status("Recording video…");

    recorder.ondataavailable = e => {
      if(e.data && e.data.size) state.chunks.push(e.data);
    };
    recorder.onerror = e => status("Video recorder error — " + errText(e && e.error ? e.error : e));
    recorder.onstop = () => finishRecording(recorder);

    try{
      recorder.start();
    }catch(error){
      state.recorder = null;
      state.recording = false;
      restoreButtons();
      status("Video start failed — " + errText(error));
    }
  }

  async function stopRecording(){
    const recorder = state.recorder;
    if(!recorder) return;
    if(recorder.state === "inactive") return;
    status("Finishing video…");
    try{ recorder.requestData(); }catch(_){}
    try{ recorder.stop(); }catch(error){ status("Video stop failed — " + errText(error)); }
  }

  async function finishRecording(recorder){
    if(state.recorder === recorder) state.recorder = null;
    state.recording = false;
    restoreButtons();

    const chunks = state.chunks.slice();
    state.chunks = [];
    if(!chunks.length){ status("Video recording produced no data. Try again."); return; }

    // Keep the recorder's actual MIME/container. No custom MIME validation is
    // performed because the browser may include codec parameters in this value.
    const type = recorder.mimeType || (chunks[0] && chunks[0].type) || "video/webm";
    const blob = new Blob(chunks,{type});
    if(!blob.size){ status("Video recording is empty. Try again."); return; }

    try{
      const data = await blobToDataURL(blob);
      // IMPORTANT: the string is written exactly as FileReader returned it.
      // No MIME parsing, regex, or atob() check can reject a valid recording.
      const baseType = String(type).split(";",1)[0].toLowerCase();
      const ext = baseType === "video/mp4" ? "mp4" : "webm";
      const path = PREFIX + "video-" + stamp() + "." + ext;
      await saveString(path,data,{kind:"video",mimeType:type,size:blob.size});
      // Read back the exact string from Little Hollow to ensure the database write succeeded.
      const verify = await parent.FS.read(path);
      if(!verify || verify.ok !== true || typeof verify.content !== "string" || !verify.content.startsWith("data:")){
        throw new Error("saved video could not be read back");
      }
      status("Video saved — " + path + " (" + Math.round(blob.size/1024) + " KB)");
      await loadLibrary();
    }catch(error){
      status("Video save failed — " + errText(error));
    }
  }

  function restoreButtons(){
    $("record").disabled = false;
    $("stop").disabled = true;
    $("photo").disabled = false;
    $("switch").disabled = false;
    $("facing").disabled = false;
  }

  async function loadLibrary(){
    const box = $("list");
    box.innerHTML = "";
    try{
      const files = await parent.FS.list(PREFIX);
      const paths = (Array.isArray(files) ? files : [])
        .filter(p => typeof p === "string" && /\.(jpg|jpeg|png|webm|mp4)$/i.test(p))
        .sort().reverse();

      if(!paths.length){ box.innerHTML = '<div class="small">No media yet.</div>'; return; }

      for(const path of paths){
        const read = await parent.FS.read(path);
        if(!read || read.ok !== true || typeof read.content !== "string") continue;
        const card = document.createElement("div");
        card.className = "card";
        const isPhoto = /\.(jpg|jpeg|png)$/i.test(path);
        let media;
        if(isPhoto){
          media = document.createElement("img");
          media.alt = path.split("/").pop();
        }else{
          media = document.createElement("video");
          media.controls = true;
          media.playsInline = true;
          media.preload = "metadata";
          media.setAttribute("controlsList","nodownload");
          media.onloadedmetadata = () => { media.style.objectFit = "contain"; };
          media.onerror = () => {
            const note = document.createElement("div");
            note.className = "small";
            note.textContent = "Saved recording cannot be decoded by this browser.";
            if(!card.querySelector(".decode-note")){
              note.className += " decode-note";
              card.appendChild(note);
            }
          };
        }
        media.className = "thumb";
        media.src = read.content;

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = path.split("/").pop();

        const actions = document.createElement("div");
        actions.className = "actions";
        const save = document.createElement("button");
        save.className = "btn";
        save.textContent = "SAVE";
        save.onclick = () => downloadData(read.content,path.split("/").pop());
        const del = document.createElement("button");
        del.className = "btn";
        del.textContent = "DEL";
        del.onclick = async () => {
          const r = await parent.FS.remove(path);
          await parent.FS.remove(path + ".json");
          if(r && r.ok === false) status("Delete failed — " + (r.error || "unknown error"));
          await loadLibrary();
        };
        actions.append(save,del);
        card.append(media,name,actions);
        box.appendChild(card);
      }
    }catch(error){
      box.innerHTML = '<div class="small">Library error: ' + escapeHTML(errText(error)) + '</div>';
    }
  }

  function downloadData(data,name){
    const a = document.createElement("a");
    a.href = data;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  }

  $("photo").onclick = takePhoto;
  $("record").onclick = startRecording;
  $("stop").onclick = stopRecording;
  $("switch").onclick = async () => {
    state.facing = state.facing === "user" ? "environment" : "user";
    $("facing").value = state.facing;
    await openCamera();
  };
  $("facing").onchange = async e => {
    state.facing = e.target.value;
    await openCamera();
  };

  window.addEventListener("beforeunload",()=>{
    try{
      if(state.recorder && state.recorder.state !== "inactive") state.recorder.stop();
    }catch(_){}
    stopTracks(state.cameraStream);
  });

  (async()=>{
    $("format").textContent = "video: " + (supportedMime() || "browser default");
    await openCamera();
    await loadLibrary();
  })();

  window.parent.CameraAPI = {
    async action(actions){

        if(
            !actions ||
            typeof actions !== "object" ||
            Array.isArray(actions)
        ){
            return {
                ok:false,
                error:
                    "Camera action must be an object."
            };
        }

        const results = {};

        try{

            for(
                const key of Object.keys(actions)
            ){

                const value =
                    actions[key];

                switch(
                    key.toLowerCase()
                ){

                    case "open":

                        results.open =
                            await openCamera();

                        break;


                    case "close":

                        if(state.recording){
                            await stopRecording();
                        }

                        stopTracks(
                            state.cameraStream
                        );

                        state.cameraStream =
                            null;

                        $("preview").srcObject =
                            null;

                        showPlaceholder(
                            "Camera closed."
                        );

                        status(
                            "Camera closed."
                        );

                        results.close =
                            true;

                        break;


                    case "photo":
                    case "picture":
                    case "capture":

                        if(
                            value === false ||
                            value === null
                        ){
                            results[key] =
                                false;
                            break;
                        }

                        results[key] =
                            !!(
                                await takePhoto()
                            );

                        break;


                    case "recording":

                        if(
                            String(value)
                                .toLowerCase() ===
                            "start"
                        ){

                            results.recording =
                                await startRecording();

                        }else if(
                            String(value)
                                .toLowerCase() ===
                            "stop"
                        ){

                            results.recording =
                                await stopRecording();

                        }else{

                            results.recording = {
                                ok:false,
                                error:
                                    "recording must be 'start' or 'stop'."
                            };

                        }

                        break;


                    case "record":

                        const milliseconds =
                            Number(value);

                        if(
                            !Number.isFinite(
                                milliseconds
                            ) ||
                            milliseconds <= 0
                        ){
                            results.record = {
                                ok:false,
                                error:
                                    "record must be a duration in milliseconds."
                            };

                            break;
                        }

                        let startedHere =
                            false;

                        if(
                            !state.recording
                        ){
                            const started =
                                await startRecording();

                            if(!started){
                                results.record = {
                                    ok:false,
                                    error:
                                        "Could not start recording."
                                };

                                break;
                            }

                            startedHere =
                                true;
                        }

                        await new Promise(
                            resolve =>
                                setTimeout(
                                    resolve,
                                    milliseconds
                                )
                        );

                        const path =
                            await stopRecording();

                        results.record = {
                            ok:true,
                            milliseconds,
                            path,
                            startedHere
                        };

                        break;


                    case "camera":
                    case "orientation":
                    case "facing":

                        if(state.recording){
                            results[key] = {
                                ok:false,
                                error:
                                    "Stop recording before changing camera."
                            };

                            break;
                        }

                        const camera =
                            String(
                                value || ""
                            ).toLowerCase();

                        if(
                            camera === "front" ||
                            camera === "user"
                        ){

                            state.facing =
                                "user";

                        }else if(
                            camera === "back" ||
                            camera === "rear" ||
                            camera === "environment"
                        ){

                            state.facing =
                                "environment";

                        }else if(
                            camera === "switch"
                        ){

                            state.facing =
                                state.facing ===
                                "user"
                                    ? "environment"
                                    : "user";

                        }else{

                            results[key] = {
                                ok:false,
                                error:
                                    "camera must be front, back, or switch."
                            };

                            break;
                        }

                        $("facing").value =
                            state.facing;

                        results[key] = {
                            ok:
                                await openCamera(),
                            facing:
                                state.facing
                        };

                        break;


                    case "switch":

                        if(state.recording){
                            results.switch = {
                                ok:false,
                                error:
                                    "Stop recording before switching camera."
                            };

                            break;
                        }

                        state.facing =
                            state.facing ===
                            "user"
                                ? "environment"
                                : "user";

                        $("facing").value =
                            state.facing;

                        results.switch = {
                            ok:
                                await openCamera(),
                            facing:
                                state.facing
                        };

                        break;


                    case "state":
                    case "status":

                        const videoTrack =
                            state.cameraStream &&
                            state.cameraStream
                                .getVideoTracks()[0];

                        const audioTrack =
                            state.cameraStream &&
                            state.cameraStream
                                .getAudioTracks()[0];

                        results[key] = {
                            ok:true,
                            open:
                                !!state.cameraStream,
                            recording:
                                state.recording,
                            facing:
                                state.facing,
                            video:
                                !!videoTrack,
                            audio:
                                !!audioTrack,
                            mime:
                                state.mime || ""
                        };

                        break;


                    default:

                        results[key] = {
                            ok:false,
                            error:
                                "Unknown camera action: " +
                                key
                        };

                        break;
                }
            }

            return {
                ok:true,
                results
            };

        }catch(error){

            return {
                ok:false,
                error:
                    errText(error),
                results
            };
        }
    }
};
  
})();
</script>
</body>
</html>
