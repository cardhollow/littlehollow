<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:monospace;background:#001113;color:#00ffff}
body{display:flex;flex-direction:column;gap:9px;padding:10px;overflow:auto}
.bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.btn,select{font:inherit;background:#001113;color:#00ffff;border:1px solid #00ffff;padding:7px 9px}
.btn{cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}
.preview{position:relative;border:1px solid #064a4c;background:#000;min-height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.preview video{display:block;width:100%;max-height:390px;object-fit:contain;background:#000}
.preview.front video{transform:scaleX(-1)}
.preview .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#4f8587;font-size:12px;text-align:center;padding:20px;z-index:2}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
.section{border:1px solid #064a4c;padding:9px}.title{font-weight:bold;margin-bottom:7px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.card{border:1px solid #064a4c;padding:6px}.thumb{width:100%;aspect-ratio:4/3;background:#000;object-fit:contain;display:block}
.name{font-size:11px;margin-top:5px;word-break:break-all}.small{font-size:10px;opacity:.72}
.actions{display:flex;gap:5px;margin-top:5px}.msg{border:1px solid #064a4c;padding:7px;min-height:34px;line-height:1.35}
.badge{font-size:10px;padding:2px 5px;border:1px solid #064a4c}
</style>
</head>
<body>

<div class="bar">
  <button class="btn" id="photo">📷 PHOTO</button>
  <button class="btn" id="record">● START VIDEO</button>
  <button class="btn" id="stop" disabled>■ STOP VIDEO</button>
  <button class="btn" id="switch">↔ SWITCH</button>

  <select id="facing">
    <option value="environment">Back camera</option>
    <option value="user">Front camera</option>
  </select>

  <span class="badge" id="format">video: checking</span>
  <span class="badge" id="mic">mic: checking</span>
</div>

<div class="preview" id="previewWrap">
  <div class="placeholder" id="placeholder">Starting…</div>
  <video id="preview" autoplay muted playsinline></video>
  <div id="flash" class="flash"></div>
</div>

<div class="msg" id="msg">Starting…</div>

<div class="section">
  <div class="title">Saved media — chxd:/indexdb/Camera/</div>
  <div id="list" class="list">
    <div class="small">Loading…</div>
  </div>
</div>

<canvas id="canvas" hidden></canvas>

<script>
(() => {
"use strict";

const PREFIX="chxd:/indexdb/Camera/";
const $=id=>document.getElementById(id);

const state={
  videoStream:null,
  audioStream:null,
  recordingStream:null,
  recorder:null,
  chunks:[],
  recording:false,
  facing:"environment",
  mime:""
};

function status(t){
  $("msg").textContent=t;
}

function placeholder(t){
  $("placeholder").textContent=t||"";
  $("placeholder").style.display=t?"flex":"none";
}

function stopTracks(stream){
  if(!stream)return;
  stream.getTracks().forEach(t=>{
    try{t.stop()}catch(_){}
  });
}

function stamp(){
  return new Date().toISOString().replace(/[:.]/g,"-");
}

function errText(e){
  return e && (e.message||e.name)
    ? (e.message||e.name)
    : String(e||"Unknown error");
}

function getMime(){
  if(typeof MediaRecorder==="undefined")return"";

  const list=[
    "video/webm;codecs=vp8,opus",
    "video/webm;codecs=vp9,opus",
    "video/webm",
    "video/mp4;codecs=avc1,mp4a",
    "video/mp4"
  ];

  for(const t of list){
    try{
      if(MediaRecorder.isTypeSupported(t))return t;
    }catch(_){}
  }

  return"";
}

async function requestCamera(){

  stopTracks(state.videoStream);
  state.videoStream=null;

  placeholder("Requesting camera permission…");

  try{

    const stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:state.facing},
        width:{ideal:1280},
        height:{ideal:720},
        frameRate:{ideal:30}
      },
      audio:false
    });

    state.videoStream=stream;

    $("preview").srcObject=stream;

    $("previewWrap").classList.toggle(
      "front",
      state.facing==="user"
    );

    await $("preview").play().catch(()=>{});

    return true;

  }catch(e){

    status("Camera permission/error — "+errText(e));
    placeholder("Camera permission was not granted.");
    return false;
  }
}

async function requestMicrophone(){

  stopTracks(state.audioStream);
  state.audioStream=null;

  $("mic").textContent="mic: requesting";

  status("Requesting microphone permission…");

  try{

    const stream=await navigator.mediaDevices.getUserMedia({
      audio:{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      },
      video:false
    });

    const tracks=stream.getAudioTracks();

    if(!tracks.length){

      stopTracks(stream);

      $("mic").textContent="mic: missing";

      status("Microphone permission succeeded but no microphone track was returned.");

      return false;
    }

    state.audioStream=stream;

    $("mic").textContent="mic: ready";

    status("Microphone ready.");

    return true;

  }catch(e){

    $("mic").textContent="mic: denied";

    status(
      "Microphone permission/error — "+
      errText(e)
    );

    return false;
  }
}

async function openCamera(){

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    placeholder("getUserMedia is unavailable.");
    status("Camera/microphone API is unavailable.");
    return false;
  }

  if(state.recording){
    await stopRecording();
  }

  const cameraOK=await requestCamera();

  if(!cameraOK)return false;

  const micOK=await requestMicrophone();

  if(!micOK){

    stopTracks(state.videoStream);
    state.videoStream=null;
    $("preview").srcObject=null;

    placeholder("Microphone permission is required for video recording.");
    status("Camera opened, but microphone permission was not granted.");
    return false;
  }

  placeholder("");

  status("Camera and microphone ready.");

  return true;
}

async function takePhoto(){

  if(state.recording){
    status("Stop video recording first.");
    return;
  }

  if(
    !state.videoStream ||
    !state.videoStream.getVideoTracks().length
  ){

    if(!(await openCamera()))return;
  }

  const video=$("preview");

  if(
    video.readyState<2 ||
    !video.videoWidth
  ){

    status("Camera is not ready.");
    return;
  }

  const canvas=$("canvas");
  const w=video.videoWidth;
  const h=video.videoHeight;

  canvas.width=w;
  canvas.height=h;

  const ctx=canvas.getContext("2d",{alpha:false});

  if(state.facing==="user"){
    ctx.save();
    ctx.translate(w,0);
    ctx.scale(-1,1);
    ctx.drawImage(video,0,0,w,h);
    ctx.restore();
  }else{
    ctx.drawImage(video,0,0,w,h);
  }

  $("flash").style.opacity="1";

  setTimeout(()=>{
    $("flash").style.opacity="0";
  },90);

  try{

    const data=canvas.toDataURL(
      "image/jpeg",
      .92
    );

    const path=
      PREFIX+
      "photo-"+
      stamp()+
      ".jpg";

    await saveString(
      path,
      data,
      {
        kind:"photo",
        mimeType:"image/jpeg"
      }
    );

    status("Photo saved — "+path);

    await loadLibrary();

  }catch(e){

    status(
      "Photo save failed — "+
      errText(e)
    );
  }
}

function blobToDataURL(blob){

  return new Promise((resolve,reject)=>{

    const reader=new FileReader();

    reader.onload=()=>{
      resolve(String(reader.result));
    };

    reader.onerror=()=>{
      reject(
        reader.error ||
        new Error("Could not encode video")
      );
    };

    reader.readAsDataURL(blob);
  });
}

async function saveString(path,data,meta){

  if(
    typeof parent==="undefined" ||
    !parent.FS ||
    typeof parent.FS.write!=="function"
  ){

    throw new Error(
      "Little Hollow filesystem is unavailable."
    );
  }

  const r=
    await parent.FS.write(
      path,
      String(data),
      true
    );

  if(!r||r.ok!==true){

    throw new Error(
      r&&r.error
        ? r.error
        : "Filesystem write failed"
    );
  }

  const mr=
    await parent.FS.write(
      path+".json",
      JSON.stringify({
        app:"Camera",
        createdAt:new Date().toISOString(),
        storage:"data-url",
        ...meta
      }),
      true
    );

  if(!mr||mr.ok!==true){

    throw new Error(
      mr&&mr.error
        ? mr.error
        : "Metadata write failed"
    );
  }
}

async function startRecording(){

  if(state.recording)return;

  if(typeof MediaRecorder==="undefined"){

    status(
      "MediaRecorder is unavailable."
    );

    return;
  }

  if(
    !state.videoStream ||
    !state.audioStream
  ){

    const ok=await openCamera();

    if(!ok)return;
  }

  const videoTracks=
    state.videoStream.getVideoTracks();

  const audioTracks=
    state.audioStream.getAudioTracks();

  if(!videoTracks.length){

    status("No camera video track exists.");
    return;
  }

  if(!audioTracks.length){

    status(
      "No microphone track exists. Recording cancelled."
    );

    return;
  }

  state.recordingStream=
    new MediaStream([
      videoTracks[0],
      audioTracks[0]
    ]);

  state.chunks=[];
  state.mime=getMime();

  let recorder;

  try{

    if(state.mime){

      recorder=
        new MediaRecorder(
          state.recordingStream,
          {mimeType:state.mime}
        );

    }else{

      recorder=
        new MediaRecorder(
          state.recordingStream
        );
    }

  }catch(e){

    stopTracks(state.recordingStream);
    state.recordingStream=null;

    status(
      "Recorder creation failed — "+
      errText(e)
    );

    return;
  }

  if(
    !recorder ||
    !recorder.mimeType &&
    !state.mime
  ){

    stopTracks(state.recordingStream);
    state.recordingStream=null;

    status("Browser could not create a valid video recorder.");

    return;
  }

  state.recorder=recorder;
  state.recording=true;

  $("record").disabled=true;
  $("stop").disabled=false;
  $("photo").disabled=true;
  $("switch").disabled=true;
  $("facing").disabled=true;

  $("format").textContent=
    "video: "+
    (recorder.mimeType||"default");

  $("mic").textContent="mic: RECORDING";

  recorder.ondataavailable=e=>{

    if(e.data&&e.data.size>0){

      state.chunks.push(e.data);
    }
  };

  recorder.onerror=e=>{

    status(
      "Recorder error — "+
      errText(
        e&&e.error
          ? e.error
          : e
      )
    );
  };

  recorder.onstop=()=>{
    finishRecording(recorder);
  };

  try{

    recorder.start(1000);

    status(
      "Recording video + microphone audio…"
    );

  }catch(e){

    state.recorder=null;
    state.recording=false;

    stopTracks(
      state.recordingStream
    );

    state.recordingStream=null;

    restoreButtons();

    $("mic").textContent="mic: ready";

    status(
      "Recording failed — "+
      errText(e)
    );
  }
}

async function stopRecording(){

  const recorder=state.recorder;

  if(!recorder)return;

  if(recorder.state==="inactive")return;

  status("Finishing recording…");

  try{
    recorder.stop();
  }catch(e){

    status(
      "Stop failed — "+
      errText(e)
    );
  }
}

async function finishRecording(recorder){

  if(state.recorder===recorder){
    state.recorder=null;
  }

  state.recording=false;

  const recordingStream=
    state.recordingStream;

  state.recordingStream=null;

  stopTracks(recordingStream);

  restoreButtons();

  $("mic").textContent=
    state.audioStream &&
    state.audioStream.getAudioTracks().length
      ? "mic: ready"
      : "mic: unavailable";

  const chunks=state.chunks.slice();

  state.chunks=[];

  if(!chunks.length){

    status(
      "Recorder returned no video data."
    );

    return;
  }

  const type=
    recorder.mimeType||
    chunks[0].type||
    "video/webm";

  const blob=
    new Blob(
      chunks,
      {type:type}
    );

  if(!blob.size){

    status(
      "Created recording is empty."
    );

    return;
  }

  try{

    const data=
      await blobToDataURL(blob);

    const container=
      type.split(";")[0].toLowerCase();

    const ext=
      container==="video/mp4"
        ? "mp4"
        : "webm";

    const path=
      PREFIX+
      "video-"+
      stamp()+
      "."+
      ext;

    await saveString(
      path,
      data,
      {
        kind:"video",
        mimeType:type,
        size:blob.size,
        hasAudio:true
      }
    );

    const verify=
      await parent.FS.read(path);

    if(
      !verify||
      verify.ok!==true||
      typeof verify.content!=="string"||
      !verify.content.startsWith("data:")
    ){

      throw new Error(
        "Saved recording could not be verified."
      );
    }

    status(
      "Video + audio saved — "+
      path+
      " ("+
      Math.round(blob.size/1024)+
      " KB)"
    );

    await loadLibrary();

  }catch(e){

    status(
      "Video save failed — "+
      errText(e)
    );
  }
}

function restoreButtons(){

  $("record").disabled=false;
  $("stop").disabled=true;
  $("photo").disabled=false;
  $("switch").disabled=false;
  $("facing").disabled=false;
}

async function loadLibrary(){

  const box=$("list");

  box.innerHTML="";

  try{

    const files=
      await parent.FS.list(PREFIX);

    const paths=
      (Array.isArray(files)?files:[])
      .filter(
        p=>
          typeof p==="string" &&
          /\.(jpg|jpeg|png|webm|mp4)$/i.test(p)
      )
      .sort()
      .reverse();

    if(!paths.length){

      box.innerHTML=
        '<div class="small">No media yet.</div>';

      return;
    }

    for(const path of paths){

      const read=
        await parent.FS.read(path);

      if(
        !read||
        read.ok!==true||
        typeof read.content!=="string"
      ){

        continue;
      }

      const card=
        document.createElement("div");

      card.className="card";

      const photo=
        /\.(jpg|jpeg|png)$/i.test(path);

      let media;

      if(photo){

        media=
          document.createElement("img");

        media.alt=
          path.split("/").pop();

      }else{

        media=
          document.createElement("video");

        media.controls=true;
        media.playsInline=true;
        media.preload="metadata";

        media.setAttribute(
          "controlsList",
          "nodownload"
        );

        media.onerror=()=>{

          if(
            card.querySelector(".decode-note")
          )return;

          const note=
            document.createElement("div");

          note.className=
            "small decode-note";

          note.textContent=
            "Saved video cannot be decoded by this browser.";

          card.appendChild(note);
        };
      }

      media.className="thumb";
      media.src=read.content;

      const name=
        document.createElement("div");

      name.className="name";

      name.textContent=
        path.split("/").pop();

      const actions=
        document.createElement("div");

      actions.className="actions";

      const save=
        document.createElement("button");

      save.className="btn";
      save.textContent="SAVE";

      save.onclick=()=>{

        downloadData(
          read.content,
          path.split("/").pop()
        );
      };

      const del=
        document.createElement("button");

      del.className="btn";
      del.textContent="DEL";

      del.onclick=async()=>{

        try{

          await parent.FS.remove(path);

          await parent.FS.remove(
            path+".json"
          );

        }catch(e){

          status(
            "Delete failed — "+
            errText(e)
          );
        }

        await loadLibrary();
      };

      actions.append(save,del);

      card.append(
        media,
        name,
        actions
      );

      box.appendChild(card);
    }

  }catch(e){

    box.innerHTML=
      '<div class="small">Library error: '+
      escapeHTML(errText(e))+
      '</div>';
  }
}

function downloadData(data,name){

  const a=
    document.createElement("a");

  a.href=data;
  a.download=name;

  document.body.appendChild(a);

  a.click();

  a.remove();
}

function escapeHTML(s){

  return String(s).replace(
    /[&<>"']/g,
    c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    })[c]
  );
}

$("photo").onclick=
  takePhoto;

$("record").onclick=
  startRecording;

$("stop").onclick=
  stopRecording;

$("switch").onclick=
  async()=>{

    state.facing=
      state.facing==="user"
        ? "environment"
        : "user";

    $("facing").value=
      state.facing;

    await openCamera();
  };

$("facing").onchange=
  async e=>{

    state.facing=e.target.value;

    await openCamera();
  };

window.addEventListener(
  "beforeunload",
  ()=>{

    try{

      if(
        state.recorder &&
        state.recorder.state!=="inactive"
      ){

        state.recorder.stop();
      }

    }catch(_){}

    stopTracks(state.recordingStream);
    stopTracks(state.videoStream);
    stopTracks(state.audioStream);
  }
);

(async()=>{

  $("format").textContent=
    "video: "+
    (getMime()||"browser default");

  $("mic").textContent=
    "mic: requesting";

  await openCamera();

  await loadLibrary();

})();

})();
</script>
</body>
</html>
