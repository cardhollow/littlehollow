<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:monospace;background:#001113;color:#00ffff}body{display:flex;flex-direction:column;gap:9px;padding:10px;overflow:auto}.bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.btn,select,input{font:inherit;background:#001113;color:#00ffff;border:1px solid #00ffff;padding:7px 9px}.btn{cursor:pointer}.btn:disabled{opacity:.45}.preview{position:relative;border:1px solid #064a4c;background:#000;min-height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden}.preview video{width:100%;max-height:330px;object-fit:contain}.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.section{border:1px solid #064a4c;padding:9px}.title{font-weight:bold;margin-bottom:7px}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}.card{border:1px solid #064a4c;padding:6px}.thumb{width:100%;aspect-ratio:4/3;background:#000;object-fit:cover;display:block}.name{font-size:11px;margin-top:5px;word-break:break-all}.small{font-size:10px;opacity:.72}.actions{display:flex;gap:5px;margin-top:5px}.msg{border:1px solid #064a4c;padding:6px;min-height:30px}
</style>
</head><body>
<div class="bar"><button class="btn" id="photo">📷 PHOTO</button><button class="btn" id="video">● START VIDEO</button><button class="btn" id="stop" disabled>■ STOP VIDEO</button><button class="btn" id="switch">↔ SWITCH</button><select id="facing"><option value="environment">Back camera</option><option value="user">Front camera</option></select></div>
<div class="preview"><video id="preview" autoplay muted playsinline></video><div id="flash" class="flash"></div></div>
<div class="msg" id="msg">Starting camera…</div>
<div class="section"><div class="title">Saved media — chxd:/indexdb/Camera/</div><div id="list" class="list"><div class="small">Loading…</div></div></div>
<canvas id="canvas" hidden></canvas>
<script>
(()=>{
 const PREFIX='chxd:/indexdb/Camera/';const $=id=>document.getElementById(id);let stream=null,rec=null,chunks=[],mode='photo';
 const status=s=>$('msg').textContent=s;
 function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null} $('preview').srcObject=null}
 async function start(){stop();try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:$('facing').value},width:{ideal:1280},height:{ideal:720}},audio:true});$('preview').srcObject=stream;status('Camera ready.')}catch(e){status('Camera error: '+e.message)}}
 async function save(dataUrl,ext,mime,kind){const stamp=new Date(),name=`${kind}-${stamp.toISOString().replace(/[:.]/g,'-')}.${ext}`,p=PREFIX+name;const r=await parent.FS.write(p,dataUrl,true);if(!r.ok)throw new Error(r.error||'Could not save');await parent.FS.write(p+'.json',JSON.stringify({app:'Camera',kind,createdAt:stamp.toISOString(),mimeType:mime}),true);return p}
 async function photo(){if(!stream)return;const v=$('preview'),c=$('canvas');c.width=v.videoWidth||1280;c.height=v.videoHeight||720;c.getContext('2d').drawImage(v,0,0,c.width,c.height);$('flash').style.opacity='1';setTimeout(()=>$('flash').style.opacity='0',90);try{const data=c.toDataURL('image/jpeg',.92);const p=await save(data,'jpg','image/jpeg','photo');status('Saved '+p);await load()}catch(e){status('Photo save failed: '+e.message)}}
 async function startVideo(){if(!stream)return;chunks=[];const candidates=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];const type=candidates.find(x=>MediaRecorder.isTypeSupported(x))||'';rec=new MediaRecorder(stream,type?{mimeType:type}:{});rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=async()=>{try{const blob=new Blob(chunks,{type:rec.mimeType||chunks[0]?.type||'video/webm'});const fr=new FileReader();const data=await new Promise((res,rej)=>{fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(blob)});const ext=blob.type.includes('mp4')?'mp4':'webm';const p=await save(data,ext,blob.type,'video');status('Saved '+p);await load()}catch(e){status('Video save failed: '+e.message)}finally{$('video').disabled=false;$('stop').disabled=true}};rec.start(250);$('video').disabled=true;$('stop').disabled=false;status('Video recording…')}
 $('stop').onclick=()=>{if(rec&&rec.state!=='inactive')rec.stop()};$('photo').onclick=photo;$('video').onclick=startVideo;$('switch').onclick=async()=>{$('facing').value=$('facing').value==='user'?'environment':'user';await start()};$('facing').onchange=start;
 async function load(){const box=$('list');box.innerHTML='';const files=await parent.FS.list(PREFIX);const items=(Array.isArray(files)?files:[]).filter(p=>/\.(jpg|jpeg|png|webm|mp4)$/i.test(p)).sort().reverse();if(!items.length){box.innerHTML='<div class="small">No media yet.</div>';return}for(const p of items){const r=await parent.FS.read(p);if(!r.ok)continue;const card=document.createElement('div');card.className='card';const media=/\.(jpg|jpeg|png)$/i.test(p)?document.createElement('img'):document.createElement('video');media.className='thumb';media.controls=media.tagName==='VIDEO';media.src=r.content;if(media.tagName==='VIDEO'){media.muted=true;media.playsInline=true}const n=document.createElement('div');n.className='name';n.textContent=p.split('/').pop();const a=document.createElement('div');a.className='actions';const dl=document.createElement('button');dl.className='btn';dl.textContent='SAVE';dl.onclick=()=>{const x=document.createElement('a');x.href=r.content;x.download=p.split('/').pop();x.click()};const del=document.createElement('button');del.className='btn';del.textContent='DEL';del.onclick=async()=>{await parent.FS.remove(p);await parent.FS.remove(p+'.json');load()};a.append(dl,del);card.append(media,n,a);box.append(card)}}
 start().then(load).catch(e=>status(e.message));
})();
</script>
</body></html>
