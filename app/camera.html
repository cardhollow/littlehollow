<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:monospace;background:#001113;color:#00ffff}
body{display:flex;flex-direction:column;gap:9px;padding:10px;overflow:auto}
.bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.btn,select{font:inherit;background:#001113;color:#00ffff;border:1px solid #00ffff;padding:7px 9px}
.btn{cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}
.preview{position:relative;border:1px solid #064a4c;background:#000;min-height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.preview video{display:block;width:100%;max-height:390px;object-fit:contain;background:#000}
.preview.front video{transform:scaleX(-1)}
.preview .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#4f8587;font-size:12px;text-align:center;padding:20px;z-index:2}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
.section{border:1px solid #064a4c;padding:9px}.title{font-weight:bold;margin-bottom:7px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.card{border:1px solid #064a4c;padding:6px}.thumb{width:100%;aspect-ratio:4/3;background:#000;object-fit:contain;display:block}
.name{font-size:11px;margin-top:5px;word-break:break-all}.small{font-size:10px;opacity:.72}
.actions{display:flex;gap:5px;margin-top:5px}.msg{border:1px solid #064a4c;padding:7px;min-height:34px;line-height:1.35}
.badge{font-size:10px;padding:2px 5px;border:1px solid #064a4c}
</style>
</head>
<body>
<div class="bar">
  <button class="btn" id="photo">📷 PHOTO</button>
  <button class="btn" id="record">● START VIDEO</button>
  <button class="btn" id="switch">↔ SWITCH</button>
  <select id="facing" aria-label="Camera">
    <option value="environment">Back camera</option>
    <option value="user">Front camera</option>
  </select>
  <span class="badge" id="format">video: checking</span>
</div><div class="preview" id="previewWrap">
  <div class="placeholder" id="placeholder">Starting camera…</div>
  <video id="preview" autoplay muted playsinline></video>
  <div id="flash" class="flash"></div>
</div><div class="msg" id="msg">Starting camera…</div><div class="section">
  <div class="title">Saved media — chxd:/indexdb/Camera/</div>
  <div id="list" class="list"><div class="small">Loading…</div></div>
</div><canvas id="canvas" hidden></canvas>

<script>
(() => {
  "use strict";

  const PREFIX = "chxd:/indexdb/Camera/";
  const $ = id => document.getElementById(id);

  const state = {
    cameraStream: null,
    recorder: null,
    chunks: [],
    recording: false,
    facing: "environment",
    mime: "",
    libraryUrls: []
  };

  function status(text){
    $("msg").textContent = text;
  }

  function showPlaceholder(text){
    $("placeholder").textContent =
      text || "";

    $("placeholder").style.display =
      text ? "flex" : "none";
  }

  function stopTracks(stream){
    if(!stream){
      return;
    }

    stream.getTracks().forEach(
      track => {
        try{
          track.stop();
        }catch(_){}
      }
    );
  }

  function stamp(){
    return new Date()
      .toISOString()
      .replace(/[:.]/g,"-");
  }

  function errText(error){
    return error &&
      (error.message || error.name)
      ? (
          error.message ||
          error.name
        )
      : String(
          error ||
          "Unknown error"
        );
  }

  function supportedMime(){
    if(
      typeof MediaRecorder ===
      "undefined"
    ){
      return "";
    }

    const candidates = [
      "video/webm;codecs=vp9,opus",
      "video/webm;codecs=vp8,opus",
      "video/webm;codecs=vp9",
      "video/webm;codecs=vp8",
      "video/webm",
      "video/mp4;codecs=avc1.42E01E,mp4a.40.2",
      "video/mp4;codecs=avc1,mp4a.40.2",
      "video/mp4"
    ];

    for(
      const type of candidates
    ){
      try{
        if(
          MediaRecorder.isTypeSupported(
            type
          )
        ){
          return type;
        }
      }catch(_){}
    }

    return "";
  }

  async function openCamera(){
    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){
      showPlaceholder(
        "Camera API is unavailable here."
      );

      status(
        "Camera API is unavailable."
      );

      return false;
    }

    if(state.recording){
      status(
        "Stop video recording before changing the camera."
      );

      return false;
    }

    stopTracks(
      state.cameraStream
    );

    state.cameraStream = null;

    $("preview").srcObject =
      null;

    showPlaceholder(
      "Opening camera…"
    );

    try{
      const stream =
        await navigator.mediaDevices.getUserMedia(
          {
            video:{
              facingMode:{
                ideal:
                  state.facing
              },
              width:{
                ideal:1280
              },
              height:{
                ideal:720
              },
              frameRate:{
                ideal:30
              }
            },
            audio:{
              echoCancellation:true,
              noiseSuppression:true,
              autoGainControl:true
            }
          }
        );

      state.cameraStream =
        stream;

      $("preview").srcObject =
        stream;

      updateMirror();

      await $("preview")
        .play()
        .catch(
          () => {}
        );

      showPlaceholder("");

      const videoTrack =
        stream.getVideoTracks()[0];

      const audioTrack =
        stream.getAudioTracks()[0];

      const settings =
        videoTrack &&
        videoTrack.getSettings
          ? videoTrack.getSettings()
          : {};

      const label =
        settings.facingMode ||
        state.facing;

      $("format").textContent =
        audioTrack
          ? "camera: video + audio"
          : "camera: video only";

      status(
        audioTrack
          ? "Camera ready — " +
            label +
            " — microphone enabled."
          : "Camera ready — " +
            label +
            " — microphone unavailable."
      );

      return true;
    }catch(error){
      showPlaceholder(
        "Camera unavailable. Allow camera and microphone permission, then reopen the app."
      );

      $("format").textContent =
        "camera: unavailable";

      status(
        "Camera error — " +
        errText(error)
      );

      return false;
    }
  }

  function updateMirror(){
    $("previewWrap")
      .classList
      .toggle(
        "front",
        state.facing ===
          "user"
      );
  }

  function canvasToBlob(
    canvas,
    type,
    quality
  ){
    return new Promise(
      (resolve,reject) => {
        if(
          typeof canvas.toBlob !==
          "function"
        ){
          reject(
            new Error(
              "Canvas binary export is unavailable."
            )
          );

          return;
        }

        canvas.toBlob(
          blob => {
            if(!blob){
              reject(
                new Error(
                  "Could not encode image."
                )
              );

              return;
            }

            resolve(blob);
          },
          type,
          quality
        );
      }
    );
  }

  async function takePhoto(){
    if(state.recording){
      status(
        "Stop video recording before taking a photo."
      );

      return;
    }

    if(
      !state.cameraStream &&
      !(await openCamera())
    ){
      return;
    }

    const video =
      $("preview");

    if(
      video.readyState < 2 ||
      !video.videoWidth
    ){
      status(
        "Camera is not ready yet."
      );

      return;
    }

    const canvas =
      $("canvas");

    const w =
      video.videoWidth;

    const h =
      video.videoHeight;

    canvas.width =
      w;

    canvas.height =
      h;

    const ctx =
      canvas.getContext(
        "2d",
        {
          alpha:false
        }
      );

    if(
      state.facing ===
      "user"
    ){
      ctx.save();

      ctx.translate(
        w,
        0
      );

      ctx.scale(
        -1,
        1
      );

      ctx.drawImage(
        video,
        0,
        0,
        w,
        h
      );

      ctx.restore();
    }else{
      ctx.drawImage(
        video,
        0,
        0,
        w,
        h
      );
    }

    $("flash").style.opacity =
      "1";

    setTimeout(
      () => {
        $("flash").style.opacity =
          "0";
      },
      90
    );

    try{
      const blob =
        await canvasToBlob(
          canvas,
          "image/jpeg",
          0.92
        );

      const path =
        PREFIX +
        "photo-" +
        stamp() +
        ".jpg";

      await saveBinary(
        path,
        blob,
        {
          kind:"photo",
          mimeType:
            blob.type ||
            "image/jpeg",
          size:
            blob.size
        }
      );

      status(
        "Photo saved — " +
        path
      );

      await loadLibrary();
    }catch(error){
      status(
        "Photo save failed — " +
        errText(error)
      );
    }
  }

  async function saveBinary(
    path,
    blob,
    meta
  ){
    if(
      typeof parent ===
      "undefined" ||
      !parent.FS ||
      typeof parent.FS.write !==
        "function"
    ){
      throw new Error(
        "Little Hollow filesystem is unavailable."
      );
    }

    if(
      !(blob instanceof Blob)
    ){
      throw new Error(
        "Media data is not a Blob."
      );
    }

    const result =
      await parent.FS.write(
        path,
        blob,
        true,
        true
      );

    if(
      !result ||
      result.ok !== true
    ){
      throw new Error(
        result &&
        result.error
          ? result.error
          : "Filesystem binary write failed"
      );
    }

    const metaResult =
      await parent.FS.write(
        path + ".json",
        JSON.stringify(
          {
            app:"Camera",
            createdAt:
              new Date()
                .toISOString(),
            storage:"blob",
            binary:true,
            ...meta
          }
        ),
        true,
        false
      );

    if(
      !metaResult ||
      metaResult.ok !== true
    ){
      throw new Error(
        metaResult &&
        metaResult.error
          ? metaResult.error
          : "Metadata write failed"
      );
    }
  }

  function updateRecordButton(){
    $("record").textContent =
      state.recording
        ? "■ STOP VIDEO"
        : "● START VIDEO";
  }

  async function startRecording(){
    if(state.recording){
      return;
    }

    if(
      typeof MediaRecorder ===
      "undefined"
    ){
      status(
        "Video recording is not supported in this browser."
      );

      return;
    }

    if(
      !state.cameraStream &&
      !(await openCamera())
    ){
      return;
    }

    const tracks =
      state.cameraStream
        .getTracks()
        .filter(
          track =>
            track.readyState !==
            "ended"
        );

    const videoTrack =
      tracks.find(
        track =>
          track.kind ===
          "video"
      );

    const audioTrack =
      tracks.find(
        track =>
          track.kind ===
          "audio"
      );

    if(!videoTrack){
      status(
        "No camera video track is available."
      );

      return;
    }

    const stream =
      new MediaStream(
        tracks
      );

    state.chunks = [];

    state.mime =
      supportedMime();

    let recorder = null;

    try{
      recorder =
        state.mime
          ? new MediaRecorder(
              stream,
              {
                mimeType:
                  state.mime
              }
            )
          : new MediaRecorder(
              stream
            );
    }catch(_){
      try{
        recorder =
          new MediaRecorder(
            stream
          );
      }catch(error){
        status(
          "Video start failed — " +
          errText(error)
        );

        return;
      }
    }

    state.recorder =
      recorder;

    state.recording =
      true;

    $("photo").disabled =
      true;

    $("switch").disabled =
      true;

    $("facing").disabled =
      true;

    $("format").textContent =
      "recording: " +
      (
        recorder.mimeType ||
        "browser default"
      ) +
      (
        audioTrack
          ? " + audio"
          : " + no audio"
      );

    updateRecordButton();

    status(
      audioTrack
        ? "Recording video + audio…"
        : "Recording video — microphone unavailable."
    );

    recorder.ondataavailable =
      event => {
        if(
          event.data &&
          event.data.size > 0
        ){
          state.chunks.push(
            event.data
          );
        }
      };

    recorder.onerror =
      event => {
        status(
          "Video recorder error — " +
          errText(
            event &&
            event.error
              ? event.error
              : event
          )
        );
      };

    recorder.onstop =
      () => {
        finishRecording(
          recorder
        );
      };

    try{
      recorder.start(
        1000
      );
    }catch(error){
      state.recorder =
        null;

      state.recording =
        false;

      restoreButtons();

      stopTracks(
        stream
      );

      status(
        "Video start failed — " +
        errText(error)
      );
    }
  }

  async function stopRecording(){
    const recorder =
      state.recorder;

    if(!recorder){
      return;
    }

    if(
      recorder.state ===
      "inactive"
    ){
      return;
    }

    status(
      "Finishing video…"
    );

    try{
      recorder.requestData();
    }catch(_){}

    try{
      recorder.stop();
    }catch(error){
      status(
        "Video stop failed — " +
        errText(error)
      );
    }
  }

  async function finishRecording(
    recorder
  ){
    if(
      state.recorder ===
      recorder
    ){
      state.recorder =
        null;
    }

    state.recording =
      false;

    restoreButtons();

    const chunks =
      state.chunks.slice();

    state.chunks = [];

    if(!chunks.length){
      status(
        "Video recording produced no data. Try again."
      );

      return;
    }

    const type =
      recorder.mimeType ||
      (
        chunks[0] &&
        chunks[0].type
      ) ||
      "video/webm";

    const blob =
      new Blob(
        chunks,
        {
          type
        }
      );

    if(!blob.size){
      status(
        "Video recording is empty. Try again."
      );

      return;
    }

    try{
      const baseType =
        (
          blob.type ||
          "video/webm"
        )
          .split(
            ";",
            1
          )[0]
          .toLowerCase();

      const ext =
        baseType ===
        "video/mp4"
          ? "mp4"
          : "webm";

      const path =
        PREFIX +
        "video-" +
        stamp() +
        "." +
        ext;

      const audio =
        state.cameraStream
          ? state.cameraStream
              .getAudioTracks()
          : [];

      await saveBinary(
        path,
        blob,
        {
          kind:"video",
          mimeType:
            blob.type ||
            baseType,
          size:
            blob.size,
          hasAudio:
            audio.length > 0
        }
      );

      const verify =
        await parent.FS.read(
          path
        );

      if(
        !verify ||
        verify.ok !== true ||
        !(verify.content instanceof Blob)
      ){
        throw new Error(
          "Saved video was not returned as a Blob."
        );
      }

      if(
        verify.content.size !==
        blob.size
      ){
        throw new Error(
          "Saved video size does not match the original."
        );
      }

      status(
        "Video saved — " +
        path +
        " (" +
        Math.round(
          blob.size /
          1024
        ) +
        " KB)"
      );

      await loadLibrary();
    }catch(error){
      status(
        "Video save failed — " +
        errText(error)
      );
    }
  }

  function restoreButtons(){
    $("photo").disabled =
      false;

    $("switch").disabled =
      false;

    $("facing").disabled =
      false;

    updateRecordButton();

    $("format").textContent =
      "video: " +
      (
        supportedMime() ||
        "browser default"
      );
  }

  function clearLibraryUrls(){
    for(
      const url of
      state.libraryUrls
    ){
      try{
        URL.revokeObjectURL(
          url
        );
      }catch(_){}
    }

    state.libraryUrls =
      [];
  }

  async function mediaBlobFromContent(
    content,
    mime
  ){
    if(
      content instanceof Blob
    ){
      return content;
    }

    if(
      typeof content ===
      "string" &&
      content.indexOf(
        "data:"
      ) === 0
    ){
      const response =
        await fetch(
          content
        );

      return response.blob();
    }

    if(
      content instanceof ArrayBuffer
    ){
      return new Blob(
        [
          content
        ],
        {
          type:mime
        }
      );
    }

    if(
      typeof ArrayBuffer !==
        "undefined" &&
      ArrayBuffer.isView &&
      ArrayBuffer.isView(
        content
      )
    ){
      return new Blob(
        [
          content
        ],
        {
          type:mime
        }
      );
    }

    throw new Error(
      "Saved media is not a supported binary value."
    );
  }

  async function loadLibrary(){
    const box =
      $("list");

    clearLibraryUrls();

    box.innerHTML =
      "";

    try{
      const files =
        await parent.FS.list(
          PREFIX
        );

      const paths =
        (
          Array.isArray(files)
            ? files
            : []
        )
          .filter(
            path =>
              typeof path ===
                "string" &&
              /\.(jpg|jpeg|png|webm|mp4)$/i.test(
                path
              )
          )
          .sort()
          .reverse();

      if(!paths.length){
        box.innerHTML =
          '<div class="small">No media yet.</div>';

        return;
      }

      for(
        const path of paths
      ){
        const read =
          await parent.FS.read(
            path
          );

        if(
          !read ||
          read.ok !== true
        ){
          continue;
        }

        const isPhoto =
          /\.(jpg|jpeg|png)$/i.test(
            path
          );

        const fallbackMime =
          isPhoto
            ? (
                /\.png$/i.test(path)
                  ? "image/png"
                  : "image/jpeg"
              )
            : (
                /\.mp4$/i.test(path)
                  ? "video/mp4"
                  : "video/webm"
              );

        let blob;

        try{
          blob =
            await mediaBlobFromContent(
              read.content,
              fallbackMime
            );
        }catch(_){
          continue;
        }

        const mime =
          blob.type ||
          fallbackMime;

        const url =
          URL.createObjectURL(
            blob
          );

        state.libraryUrls.push(
          url
        );

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "card";

        let media;

        if(isPhoto){
          media =
            document.createElement(
              "img"
            );

          media.alt =
            path.split("/").pop();
        }else{
          media =
            document.createElement(
              "video"
            );

          media.controls =
            true;

          media.playsInline =
            true;

          media.preload =
            "metadata";

          media.onerror =
            () => {
              const existing =
                card.querySelector(
                  ".decode-note"
                );

              if(existing){
                return;
              }

              const note =
                document.createElement(
                  "div"
                );

              note.className =
                "small decode-note";

              note.textContent =
                "Saved recording cannot be decoded by this browser.";

              card.appendChild(
                note
              );
            };
        }

        media.className =
          "thumb";

        media.src =
          url;

        const name =
          document.createElement(
            "div"
          );

        name.className =
          "name";

        name.textContent =
          path.split("/").pop();

        const actions =
          document.createElement(
            "div"
          );

        actions.className =
          "actions";

        const save =
          document.createElement(
            "button"
          );

        save.className =
          "btn";

        save.textContent =
          "SAVE";

        save.onclick =
          () => {
            downloadBlob(
              blob,
              path.split("/").pop()
            );
          };

        const del =
          document.createElement(
            "button"
          );

        del.className =
          "btn";

        del.textContent =
          "DEL";

        del.onclick =
          async () => {
            try{
              const result =
                await parent.FS.remove(
                  path
                );

              await parent.FS.remove(
                path + ".json"
              );

              if(
                result &&
                result.ok === false
              ){
                status(
                  "Delete failed — " +
                  (
                    result.error ||
                    "unknown error"
                  )
                );
              }

              await loadLibrary();
            }catch(error){
              status(
                "Delete failed — " +
                errText(error)
              );
            }
          };

        actions.append(
          save,
          del
        );

        card.append(
          media,
          name,
          actions
        );

        box.appendChild(
          card
        );
      }
    }catch(error){
      box.innerHTML =
        '<div class="small">Library error: ' +
        escapeHTML(
          errText(error)
        ) +
        "</div>";
    }
  }

  function downloadBlob(
    blob,
    name
  ){
    const url =
      URL.createObjectURL(
        blob
      );

    try{
      const a =
        document.createElement(
          "a"
        );

      a.href =
        url;

      a.download =
        name;

      document.body.appendChild(
        a
      );

      a.click();

      a.remove();
    }finally{
      setTimeout(
        () => {
          try{
            URL.revokeObjectURL(
              url
            );
          }catch(_){}
        },
        5000
      );
    }
  }

  function escapeHTML(s){
    return String(s).replace(
      /[&<>"']/g,
      c =>
        (
          {
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            "\"":"&quot;",
            "'":"&#39;"
          }
        )[c]
    );
  }

  $("photo").onclick =
    takePhoto;

  $("record").onclick =
    async () => {
      if(state.recording){
        await stopRecording();
      }else{
        await startRecording();
      }
    };

  $("switch").onclick =
    async () => {
      if(state.recording){
        status(
          "Stop the recording before switching cameras."
        );

        return;
      }

      state.facing =
        state.facing ===
        "user"
          ? "environment"
          : "user";

      $("facing").value =
        state.facing;

      await openCamera();
    };

  $("facing").onchange =
    async event => {
      if(state.recording){
        event.target.value =
          state.facing;

        return;
      }

      state.facing =
        event.target.value;

      await openCamera();
    };

  window.addEventListener(
    "beforeunload",
    () => {
      try{
        if(
          state.recorder &&
          state.recorder.state !==
            "inactive"
        ){
          state.recorder.stop();
        }
      }catch(_){}

      stopTracks(
        state.cameraStream
      );

      clearLibraryUrls();
    }
  );

  (async() => {
    $("format").textContent =
      "video: " +
      (
        supportedMime() ||
        "browser default"
      );

    updateRecordButton();

    await openCamera();
    await loadLibrary();
  })();
})();
</script></body>
</html>
