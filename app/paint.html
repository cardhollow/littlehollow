<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Paint</title>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:monospace}html,body{width:100%;height:100%;background:#000d0d;color:#00FFFF}.wrap{display:flex;flex-direction:column;height:100%}.toolbar{display:flex;gap:6px;align-items:center;padding:7px;border-bottom:1px solid #00FFFF;flex-wrap:wrap}.toolbar button,.toolbar input{border:1px solid #00FFFF;background:transparent;color:#00FFFF;padding:5px 7px;cursor:pointer;font:11px monospace}.swatch{width:24px;height:24px;padding:0}.swatch[data-c="#00FFFF"]{background:#00FFFF}.swatch[data-c="#FF00FF"]{background:#FF00FF}.swatch[data-c="#FFFF00"]{background:#FFFF00}.swatch[data-c="#FFFFFF"]{background:#FFFFFF}.swatch[data-c="#FF3333"]{background:#FF3333}.swatch[data-c="#00FF66"]{background:#00FF66}canvas{flex:1;background:#000;display:block;touch-action:none}.status{padding:4px 8px;border-top:1px solid #00FFFF;font-size:10px;opacity:.65}</style>
</head><body><div class="wrap"><div class="toolbar"><button class="swatch" data-c="#00FFFF"></button><button class="swatch" data-c="#FF00FF"></button><button class="swatch" data-c="#FFFF00"></button><button class="swatch" data-c="#FFFFFF"></button><button class="swatch" data-c="#FF3333"></button><button class="swatch" data-c="#00FF66"></button><input type="range" id="size" min="1" max="40" value="4"><input id="savePath" value="chxd:/local/painting.png"><button id="save">SAVE PNG</button><button id="clear">CLEAR</button></div><canvas id="board"></canvas><div class="status" id="status">Ready.</div></div>
<script>
const canvas=document.getElementById("board"),ctx=canvas.getContext("2d"),status=document.getElementById("status"),params=new URLSearchParams(location.search);let color="#00FFFF",size=4,drawing=false,last=null;
function setStatus(s){status.textContent=s}function resize(){const r=canvas.getBoundingClientRect(),old=canvas.width?ctx.getImageData(0,0,canvas.width,canvas.height):null;canvas.width=Math.max(1,Math.floor(r.width));canvas.height=Math.max(1,Math.floor(r.height));ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height);if(old)ctx.putImageData(old,0,0)}window.addEventListener("resize",resize);setTimeout(resize,0);
function pos(e){const r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)/r.width,y:(p.clientY-r.top)/r.height}}
function drawStroke(stroke){const pts=Array.isArray(stroke.points)?stroke.points:[];if(!pts.length)return;ctx.strokeStyle=stroke.color||"#00FFFF";ctx.lineWidth=Number(stroke.size)||4;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();ctx.moveTo(pts[0].x*canvas.width,pts[0].y*canvas.height);for(const p of pts.slice(1))ctx.lineTo(p.x*canvas.width,p.y*canvas.height);ctx.stroke()}
function applyPainting(data){try{for(const s of Array.isArray(data)?data:[])drawStroke(s);setStatus("AI painting loaded.")}catch(e){}}
let initial=params.get("painting");if(initial){try{setTimeout(()=>applyPainting(JSON.parse(initial)),50)}catch(e){}}
if(params.get("paintPath")){setTimeout(async()=>{const r=await parent.FS.read(params.get("paintPath"));if(r.ok)try{applyPainting(JSON.parse(r.content))}catch(e){}},50)}
document.querySelectorAll(".swatch").forEach(b=>b.onclick=()=>color=b.dataset.c);document.getElementById("size").oninput=e=>size=Number(e.target.value);document.getElementById("clear").onclick=()=>{ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height)};
function start(e){drawing=true;last=pos(e);e.preventDefault()}function move(e){if(!drawing)return;const p=pos(e);ctx.strokeStyle=color;ctx.lineWidth=size;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(last.x*canvas.width,last.y*canvas.height);ctx.lineTo(p.x*canvas.width,p.y*canvas.height);ctx.stroke();last=p;e.preventDefault()}function end(){drawing=false;last=null}canvas.onmousedown=start;canvas.onmousemove=move;window.onmouseup=end;canvas.ontouchstart=start;canvas.ontouchmove=move;canvas.ontouchend=end;
document.getElementById("save").onclick=async()=>{const data=canvas.toDataURL("image/png");const p=document.getElementById("savePath").value.trim();const r=await parent.FS.write(p,data,true);setStatus(r.ok?"Saved "+p+".":r.error)};
</script></body></html>
