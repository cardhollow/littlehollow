<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #071014;
            color: #c4fbff;
            font-family: monospace;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .header {
            padding: 12px 16px;
            border-bottom: 1px solid #16434a;
            background: #09171b;
            flex-shrink: 0;
        }

        .title {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #d5ffff;
        }

        .subtitle {
            font-size: 9px;
            color: #648e95;
            margin-top: 3px;
        }

        .content {
            display: flex;
            flex: 1;
            min-height: 0;
            gap: 1px;
            background: #16434a;
        }

        .sidebar {
            width: 220px;
            background: #09191d;
            border-right: 1px solid #16434a;
            padding: 12px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .map-container {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        #map {
            flex: 1;
            background: #0d1f24;
        }

        .search-box {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #1a4f57;
            background: #061115;
            color: #c8fcff;
            font-family: monospace;
            font-size: 10px;
            outline: none;
        }

        .search-box:focus {
            border-color: #2ba3af;
        }

        .button {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            border: 1px solid #20757e;
            background: #0a3339;
            color: #c5fcff;
            font-family: monospace;
            font-size: 9px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .button:hover {
            background: #10454d;
        }

        .button:active {
            background: #0d3a43;
        }

        .section-title {
            font-size: 10px;
            font-weight: bold;
            color: #7fb6bd;
            margin: 12px 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #16434a;
            padding-bottom: 6px;
        }

        .control-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 9px;
            color: #7fb6bd;
            margin-bottom: 4px;
        }

        select {
            width: 100%;
            padding: 6px;
            border: 1px solid #1a4f57;
            background: #061115;
            color: #c8fcff;
            font-family: monospace;
            font-size: 9px;
            cursor: pointer;
        }

        select:focus {
            border-color: #2ba3af;
            outline: none;
        }

        .slider-group {
            margin-bottom: 8px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            margin-bottom: 4px;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: #0d2a2f;
            border: 1px solid #1a4f57;
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: #2ba3af;
            cursor: pointer;
            border-radius: 2px;
        }

        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: #2ba3af;
            cursor: pointer;
            border-radius: 2px;
            border: none;
        }

        .info-box {
            padding: 10px;
            border: 1px solid #16434a;
            background: #061114;
            border-radius: 2px;
            margin-bottom: 8px;
        }

        .info-label {
            font-size: 8px;
            color: #648b91;
        }

        .info-value {
            font-size: 10px;
            color: #c8fcff;
            margin-top: 2px;
            word-break: break-word;
        }

        .button.danger {
            border-color: #713d45;
            background: #28151a;
            color: #ffb9c2;
        }

        .button.danger:hover {
            background: #331a1f;
        }

        .location-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #16434a;
            background: #071419;
        }

        .location-item {
            padding: 8px;
            border-bottom: 1px solid #16434a;
            cursor: pointer;
            font-size: 9px;
            transition: background 0.2s;
        }

        .location-item:hover {
            background: #0c282e;
        }

        .location-name {
            color: #c9fbff;
            font-weight: bold;
        }

        .location-desc {
            color: #648b91;
            font-size: 8px;
            margin-top: 2px;
        }

        .status {
            padding: 8px;
            border: 1px solid #123f46;
            background: #061114;
            font-size: 8px;
            color: #648a91;
            margin-top: 12px;
        }

        .scrollbar-compat {
            scrollbar-width: thin;
            scrollbar-color: #2ba3af #0d2a2f;
        }

        .scrollbar-compat::-webkit-scrollbar {
            width: 8px;
        }

        .scrollbar-compat::-webkit-scrollbar-track {
            background: #0d2a2f;
        }

        .scrollbar-compat::-webkit-scrollbar-thumb {
            background: #2ba3af;
            border-radius: 4px;
        }

        .leaflet-popup-content {
            color: #071014 !important;
            font-family: monospace !important;
        }

        .leaflet-control {
            border: 1px solid #16434a !important;
            background: #09191d !important;
            color: #c8fcff !important;
        }

        .leaflet-control a, .leaflet-control button {
            color: #c8fcff !important;
            background: #0a3339 !important;
            border: 1px solid #20757e !important;
        }

        .leaflet-control a:hover, .leaflet-control button:hover {
            background: #10454d !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">MAPS</div>
            <div class="subtitle">Interactive location viewer and search</div>
        </div>

        <div class="content">
            <aside class="sidebar scrollbar-compat">
                <!-- Search Section -->
                <div class="section-title">Search Location</div>
                <input type="text" id="searchInput" class="search-box" placeholder="Address, city, place...">
                <button class="button" id="searchBtn">Search</button>

                <!-- Zoom Section -->
                <div class="section-title">Zoom Level</div>
                <div class="slider-group">
                    <div class="slider-label">
                        <span>ZOOM</span>
                        <span id="zoomValue">13</span>
                    </div>
                    <input type="range" id="zoomSlider" min="1" max="20" value="13">
                </div>

                <!-- Quick Locations -->
                <div class="section-title">Quick Locations</div>
                <button class="button" data-location="New York">New York</button>
                <button class="button" data-location="London">London</button>
                <button class="button" data-location="Tokyo">Tokyo</button>
                <button class="button" data-location="Paris">Paris</button>
                <button class="button" data-location="Sydney">Sydney</button>

                <!-- Current Location -->
                <div class="section-title">Current Location</div>
                <div class="info-box">
                    <div class="info-label">Latitude</div>
                    <div class="info-value" id="latValue">--</div>
                </div>
                <div class="info-box">
                    <div class="info-label">Longitude</div>
                    <div class="info-value" id="lngValue">--</div>
                </div>

                <!-- Geocoding Info -->
                <div class="section-title">Coordinates</div>
                <div class="info-box">
                    <div class="info-value" id="addressValue">Click on the map</div>
                </div>

                <!-- Export Section -->
                <div class="section-title">Actions</div>
                <button class="button" id="centerBtn">Center Map</button>
                <button class="button" id="copyCoordBtn">Copy Coordinates</button>
                <button class="button danger" id="resetBtn">Reset</button>

                <!-- Status -->
                <div class="status" id="statusMsg">Ready</div>
            </aside>

            <main class="map-container">
                <div id="map"></div>
            </main>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        let map;
        let currentMarker = null;
        let searchController = null;

        const defaultLocation = { lat: 40.7128, lng: -74.0060 }; // New York
        const locations = {
            'New York': { lat: 40.7128, lng: -74.0060, name: 'New York, NY, USA' },
            'London': { lat: 51.5074, lng: -0.1278, name: 'London, England' },
            'Tokyo': { lat: 35.6762, lng: 139.6503, name: 'Tokyo, Japan' },
            'Paris': { lat: 48.8566, lng: 2.3522, name: 'Paris, France' },
            'Sydney': { lat: -33.8688, lng: 151.2093, name: 'Sydney, Australia' }
        };

        function initMap() {
            map = L.map('map', {
                center: [defaultLocation.lat, defaultLocation.lng],
                zoom: 13
            });

            // OpenStreetMap tile layer (free, no API key needed)
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);

            // Click listener for map
            map.on('click', (e) => {
                setMarkerAtLocation(e.latlng.lat, e.latlng.lng, 'Clicked Location');
            });

            // Zoom listener
            map.on('zoomend', () => {
                document.getElementById('zoomValue').textContent = map.getZoom();
            });

            setupEventListeners();
            setMarkerAtLocation(defaultLocation.lat, defaultLocation.lng, defaultLocation.name);
        }

        function setupEventListeners() {
            document.getElementById('searchBtn').addEventListener('click', handleSearch);
            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleSearch();
            });

            document.getElementById('zoomSlider').addEventListener('input', (e) => {
                map.setZoom(parseInt(e.target.value));
            });

            document.getElementById('centerBtn').addEventListener('click', () => {
                const center = map.getCenter();
                map.setView(center, map.getZoom());
            });

            document.getElementById('copyCoordBtn').addEventListener('click', copyCoordinates);
            document.getElementById('resetBtn').addEventListener('click', resetMap);

            // Quick location buttons
            document.querySelectorAll('button[data-location]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const locName = e.target.getAttribute('data-location');
                    const loc = locations[locName];
                    if (loc) {
                        setMarkerAtLocation(loc.lat, loc.lng, loc.name);
                        map.setView([loc.lat, loc.lng], 13);
                    }
                });
            });
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                updateStatus('Please enter a location');
                return;
            }

            updateStatus('Searching...');

            // Cancel previous request
            if (searchController) {
                searchController.abort();
            }
            searchController = new AbortController();

            // Use Nominatim (OpenStreetMap) geocoding - free, no API key needed
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`, {
                signal: searchController.signal
            })
            .then(response => response.json())
            .then(results => {
                if (results.length > 0) {
                    const result = results[0];
                    const lat = parseFloat(result.lat);
                    const lng = parseFloat(result.lon);
                    const displayName = result.display_name;
                    
                    setMarkerAtLocation(lat, lng, displayName);
                    map.setView([lat, lng], 13);
                    updateStatus('Location found');
                } else {
                    updateStatus('Location not found');
                }
            })
            .catch(err => {
                if (err.name !== 'AbortError') {
                    updateStatus('Search error: ' + err.message);
                }
            });
        }

        function setMarkerAtLocation(lat, lng, address) {
            if (currentMarker) {
                map.removeLayer(currentMarker);
            }

            currentMarker = L.marker([lat, lng])
                .addTo(map)
                .bindPopup(`
                    <div style="text-align: center;">
                        <strong>${address}</strong><br>
                        ${lat.toFixed(6)}, ${lng.toFixed(6)}
                    </div>
                `)
                .openPopup();

            updateCoordinates(lat, lng, address);
        }

        function updateCoordinates(lat, lng, address) {
            document.getElementById('latValue').textContent = lat.toFixed(6);
            document.getElementById('lngValue').textContent = lng.toFixed(6);
            document.getElementById('addressValue').textContent = address || 'Coordinates set';
        }

        function copyCoordinates() {
            const lat = document.getElementById('latValue').textContent;
            const lng = document.getElementById('lngValue').textContent;
            const text = `${lat}, ${lng}`;
            navigator.clipboard.writeText(text).then(() => {
                updateStatus('Coordinates copied!');
            }).catch(() => {
                updateStatus('Copy failed');
            });
        }

        function resetMap() {
            document.getElementById('searchInput').value = '';
            map.setView([defaultLocation.lat, defaultLocation.lng], 13);
            document.getElementById('zoomSlider').value = 13;
            setMarkerAtLocation(defaultLocation.lat, defaultLocation.lng, defaultLocation.name);
            updateStatus('Map reset');
        }

        function updateStatus(msg) {
            document.getElementById('statusMsg').textContent = msg;
        }

        // Initialize map when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            try {
                initMap();
                updateStatus('Map loaded');
            } catch (err) {
                updateStatus('Error: ' + err.message);
            }
        });

        // Export for AI integration
        window.Maps = {
            search: (query) => {
                document.getElementById('searchInput').value = query;
                handleSearch();
                return {
                    ok: true,
                    summary: `Searching for ${query}`
                };
            },
            getCoordinates: () => {
                const lat = document.getElementById('latValue').textContent;
                const lng = document.getElementById('lngValue').textContent;
                return {
                    ok: true,
                    lat: parseFloat(lat),
                    lng: parseFloat(lng),
                    address: document.getElementById('addressValue').textContent
                };
            },
            setZoom: (level) => {
                const newZoom = Math.max(1, Math.min(20, level));
                map.setZoom(newZoom);
                return { ok: true, zoom: map.getZoom() };
            },
            setLocation: (lat, lng, name) => {
                setMarkerAtLocation(lat, lng, name || 'Location');
                map.setView([lat, lng], 13);
                return { ok: true, location: { lat, lng } };
            }
        };
    </script>
</body>
</html>
