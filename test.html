<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Offline AI - ONNX</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #0b0f14;
      color: #f1f5f9;

      overflow: hidden;
    }

    .app {
      width: 100%;
      height: 100vh;

      display: flex;
      flex-direction: column;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    header {
      height: 70px;
      min-height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 24px;

      background: #10151c;
      border-bottom: 1px solid #202833;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 38px;
      height: 38px;

      display: grid;
      place-items: center;

      border-radius: 10px;

      background: #2563eb;

      font-size: 20px;
      font-weight: 800;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 2px;

      font-size: 12px;
      color: #8b98a8;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;

      font-size: 12px;
      color: #9ca3af;
    }

    .status-dot {
      width: 9px;
      height: 9px;

      flex-shrink: 0;

      border-radius: 50%;

      background: #64748b;
    }

    .status-dot.ready {
      background: #22c55e;
    }

    .status-dot.loading {
      background: #eab308;
      animation: pulse 1s infinite;
    }

    .status-dot.error {
      background: #ef4444;
    }

    @keyframes pulse {
      50% {
        opacity: 0.35;
      }
    }

    /* =========================================================
       MAIN
       ========================================================= */

    main {
      flex: 1;
      min-height: 0;

      display: flex;
      flex-direction: column;
    }

    /* =========================================================
       MESSAGES
       ========================================================= */

    #messages {
      flex: 1;
      min-height: 0;

      overflow-y: auto;

      padding: 30px 20px;

      scroll-behavior: smooth;

      /*
       * Helps keep rendering isolated from the rest of
       * the page when the message list becomes large.
       */
      contain: layout paint;
    }

    .message-wrapper {
      max-width: 900px;

      margin: 0 auto 22px;

      display: flex;
    }

    .message-wrapper.user {
      justify-content: flex-end;
    }

    .message {
      max-width: 78%;

      padding: 13px 16px;

      border-radius: 16px;

      white-space: pre-wrap;
      word-break: break-word;

      line-height: 1.55;
      font-size: 14px;

      /*
       * Prevent layout weirdness while streamed text grows.
       */
      contain: content;
    }

    .assistant .message {
      background: #151b23;
      border: 1px solid #242d38;
    }

    .user .message {
      background: #2563eb;
      color: white;
    }

    /* =========================================================
       LOADING
       ========================================================= */

    .loading-screen {
      max-width: 700px;

      margin: auto;

      padding: 30px;

      text-align: center;
    }

    .loading-screen h2 {
      margin-top: 0;
    }

    .loading-screen p {
      color: #94a3b8;

      line-height: 1.6;
    }

    .progress-container {
      width: 100%;
      height: 8px;

      margin: 20px 0;

      overflow: hidden;

      border-radius: 999px;

      background: #1e293b;
    }

    #progress {
      width: 0%;
      height: 100%;

      background: #2563eb;

      transition: width 0.2s ease;
    }

    #progressText {
      color: #94a3b8;

      font-size: 13px;
    }

    /* =========================================================
       INPUT
       ========================================================= */

    .input-area {
      flex-shrink: 0;

      padding: 16px 20px;

      background: #10151c;
      border-top: 1px solid #202833;
    }

    .input-container {
      max-width: 900px;

      margin: auto;

      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;

      min-height: 50px;
      max-height: 180px;

      resize: none;

      padding: 14px 16px;

      border: 1px solid #293442;
      border-radius: 14px;

      background: #151b23;
      color: #f8fafc;

      outline: none;

      font-family: inherit;
      font-size: 14px;

      line-height: 1.4;
    }

    textarea:focus {
      border-color: #3b82f6;
    }

    textarea:disabled {
      opacity: 0.6;
    }

    button {
      border: 0;
      border-radius: 12px;

      padding: 0 20px;

      background: #2563eb;
      color: white;

      font-weight: 600;

      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #1d4ed8;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .controls {
      max-width: 900px;

      margin: 10px auto 0;

      display: flex;
      justify-content: space-between;
      align-items: center;

      color: #64748b;

      font-size: 11px;
    }

    .clear-btn {
      padding: 6px 10px;

      background: transparent;
      color: #94a3b8;

      border: 1px solid #293442;

      font-size: 11px;
    }

    .clear-btn:hover:not(:disabled) {
      background: #18202a;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 700px) {

      header {
        padding: 0 14px;
      }

      #messages {
        padding: 20px 12px;
      }

      .message {
        max-width: 90%;
      }

      .input-area {
        padding: 12px;
      }

      button {
        padding: 0 15px;
      }

      .subtitle {
        display: none;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- =======================================================
       HEADER
       ======================================================= -->

  <header>

    <div class="brand">

      <div class="logo">
        AI
      </div>

      <div>

        <div class="title">
          Offline AI
        </div>

        <div class="subtitle">
          ONNX • Runs on your device
        </div>

      </div>

    </div>


    <div class="status">

      <div
        id="statusDot"
        class="status-dot"
      ></div>

      <span id="statusText">
        Starting worker...
      </span>

    </div>

  </header>


  <!-- =======================================================
       MAIN
       ======================================================= -->

  <main>

    <div id="messages">

      <div
        id="loadingScreen"
        class="loading-screen"
      >

        <h2>
          Loading local AI
        </h2>

        <p>
          The AI is running inside a background Web Worker
          so model processing does not block the interface.
        </p>

        <p>
          The model is downloaded and cached by the browser.
        </p>

        <div class="progress-container">

          <div id="progress"></div>

        </div>

        <div id="progressText">
          Starting...
        </div>

      </div>

    </div>


    <!-- =====================================================
         INPUT
         ===================================================== -->

    <div class="input-area">

      <div class="input-container">

        <textarea
          id="input"
          placeholder="Ask the local AI..."
          disabled
        ></textarea>

        <button
          id="send"
          disabled
        >
          Send
        </button>

      </div>


      <div class="controls">

        <span>
          Model processing happens in a Web Worker.
        </span>

        <button
          id="clear"
          class="clear-btn"
          disabled
        >
          Clear
        </button>

      </div>

    </div>

  </main>

</div>


<script>
/* ============================================================
   MAIN THREAD
   ============================================================

   The important architectural change is:

       MAIN THREAD
            |
            |  messages
            v
       WEB WORKER
            |
            v
       Transformers.js
            |
            v
       ONNX Runtime
            |
            +--> WebGPU
            |
            +--> WASM / CPU

   The model never runs directly on the UI thread.

   ============================================================ */


/* ============================================================
   DOM
   ============================================================ */

const messages =
  document.getElementById(
    "messages"
  );

const loadingScreen =
  document.getElementById(
    "loadingScreen"
  );

const progress =
  document.getElementById(
    "progress"
  );

const progressText =
  document.getElementById(
    "progressText"
  );

const input =
  document.getElementById(
    "input"
  );

const send =
  document.getElementById(
    "send"
  );

const clear =
  document.getElementById(
    "clear"
  );

const statusText =
  document.getElementById(
    "statusText"
  );

const statusDot =
  document.getElementById(
    "statusDot"
  );


/* ============================================================
   STATE
   ============================================================ */

let worker = null;

let workerReady =
  false;

let busy =
  false;

let assistantBubble =
  null;

let currentResponse =
  "";


/*
 * Keep the frontend history too.
 *
 * The worker maintains the authoritative model history,
 * but the frontend only needs this for clear/reset state.
 */

let conversationStarted =
  false;


/* ============================================================
   STATUS
   ============================================================ */

function setStatus(
  text,
  type = ""
) {

  statusText.textContent =
    text;

  statusDot.className =
    "status-dot " +
    type;
}


/* ============================================================
   PROGRESS
   ============================================================ */

function setProgress(
  percent,
  text
) {

  const safe =
    Math.max(
      0,
      Math.min(
        100,
        Number(percent) || 0
      )
    );

  progress.style.width =
    safe + "%";

  progressText.textContent =
    text;
}


/* ============================================================
   ADD MESSAGE
   ============================================================ */

function addMessage(
  role,
  text
) {

  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.className =
    "message-wrapper " +
    role;


  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "message";

  bubble.textContent =
    text;


  wrapper.appendChild(
    bubble
  );

  messages.appendChild(
    wrapper
  );


  /*
   * Scroll only after the DOM operation.
   */

  requestAnimationFrame(
    () => {

      messages.scrollTop =
        messages.scrollHeight;

    }
  );


  return bubble;
}


/* ============================================================
   UPDATE ASSISTANT MESSAGE
   ============================================================ */

let scrollScheduled =
  false;


function updateAssistantBubble(
  text
) {

  if (
    !assistantBubble
  ) {

    return;

  }


  assistantBubble.textContent =
    text;


  /*
   * DO NOT force layout on every token.
   *
   * Schedule one scroll per animation frame.
   */

  if (
    !scrollScheduled
  ) {

    scrollScheduled =
      true;


    requestAnimationFrame(
      () => {

        messages.scrollTop =
          messages.scrollHeight;

        scrollScheduled =
          false;

      }
    );

  }

}


/* ============================================================
   WEB WORKER CODE
   ============================================================

   This is embedded directly inside this HTML file.

   No separate worker.js file is needed.

   ============================================================ */

const workerSource = `

/* ===========================================================
   WORKER IMPORT
   =========================================================== */

import {
  pipeline,
  TextStreamer,
  env
} from
  "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0";


/* ===========================================================
   CONFIG
   =========================================================== */

const MODEL_ID =
  "onnx-community/Qwen2.5-0.5B-Instruct";


const MAX_NEW_TOKENS =
  64;


const MAX_HISTORY_MESSAGES =
  8;


/*
 * Only send UI stream updates every ~50 ms.
 *
 * The model can generate many token callbacks per second.
 * Sending every token to the main thread is unnecessary.
 */

const STREAM_INTERVAL =
  50;


/* ===========================================================
   TRANSFORMERS ENVIRONMENT
   =========================================================== */

env.allowLocalModels =
  false;

env.useBrowserCache =
  true;

env.useWasmCache =
  true;


/* ===========================================================
   STATE
   =========================================================== */

let generator =
  null;

let device =
  "wasm";


let conversation = [
  {
    role: "system",

    content:
      "You are a helpful AI assistant. " +
      "You are running completely locally " +
      "in the user's browser. " +
      "Be concise, useful, and direct."
  }
];


/*
 * Streaming state.
 */

let streamedText =
  "";

let lastStreamSend =
  0;

let streamTimer =
  null;


/* ===========================================================
   SEND TO MAIN THREAD
   =========================================================== */

function send(
  message
) {

  self.postMessage(
    message
  );

}


/* ===========================================================
   PROGRESS
   =========================================================== */

function handleProgress(
  data
) {

  if (
    !data
  ) {

    return;

  }


  if (
    typeof data.progress ===
    "number"
  ) {

    const percent =
      Math.round(
        data.progress
      );


    const fileName =
      data.file ||
      data.name ||
      "model";


    send({

      type:
        "progress",

      percent:
        percent,

      text:
        \`Downloading \${fileName}: \${percent}%\`

    });


    return;

  }


  if (
    data.status ===
    "initiate"
  ) {

    send({

      type:
        "status",

      text:
        "Downloading model..."

    });

  }

}


/* ===========================================================
   WEBGPU TEST
   =========================================================== */

async function canUseWebGPU() {

  /*
   * Workers normally have navigator.
   */

  if (
    typeof navigator ===
    "undefined"
  ) {

    return false;

  }


  if (
    !navigator.gpu
  ) {

    return false;

  }


  try {

    /*
     * This is the REAL test.
     *
     * Merely checking navigator.gpu is not enough.
     */

    const adapter =
      await navigator.gpu.requestAdapter();


    if (
      !adapter
    ) {

      send({

        type:
          "log",

        message:
          "WebGPU exists, but no GPU adapter is available."

      });

      return false;

    }


    send({

      type:
        "log",

      message:
        "WebGPU adapter successfully detected."

    });


    return true;

  } catch (
    error
  ) {

    send({

      type:
        "log",

      message:
        "WebGPU adapter test failed: " +
        (
          error?.message ||
          String(error)
        )

    });


    return false;

  }

}


/* ===========================================================
   CREATE PIPELINE
   =========================================================== */

async function createModel(
  selectedDevice
) {

  const dtype =
    selectedDevice ===
      "webgpu"
      ? "q4"
      : "q8";


  send({

    type:
      "status",

    text:
      selectedDevice ===
        "webgpu"
        ? "Loading ONNX with WebGPU..."
        : "Loading ONNX with CPU/WASM..."

  });


  send({

    type:
      "progress",

    percent:
      2,

    text:
      selectedDevice ===
        "webgpu"
        ? "Starting WebGPU model..."
        : "Starting CPU/WASM model..."

  });


  return await pipeline(

    "text-generation",

    MODEL_ID,

    {

      device:
        selectedDevice,

      dtype:
        dtype,

      progress_callback:
        handleProgress

    }

  );

}


/* ===========================================================
   TRIM HISTORY
   =========================================================== */

function trimHistory() {

  const system =
    conversation[0];


  const recent =
    conversation.slice(
      -MAX_HISTORY_MESSAGES
    );


  conversation = [
    system,
    ...recent
  ];

}


/* ===========================================================
   STREAM SEND
   =========================================================== */

function sendStreamUpdate(
  force = false
) {

  const now =
    performance.now();


  if (
    !force &&
    now - lastStreamSend <
    STREAM_INTERVAL
  ) {

    return;

  }


  lastStreamSend =
    now;


  send({

    type:
      "token",

    text:
      streamedText

  });

}


/* ===========================================================
   FLUSH STREAM TIMER
   =========================================================== */

function clearStreamTimer() {

  if (
    streamTimer
  ) {

    clearTimeout(
      streamTimer
    );

    streamTimer =
      null;

  }

}


/* ===========================================================
   GENERATE
   =========================================================== */

async function generate(
  userText
) {

  /*
   * Add user message.
   */

  conversation.push({

    role:
      "user",

    content:
      userText

  });


  trimHistory();


  streamedText =
    "";

  lastStreamSend =
    0;


  clearStreamTimer();


  /*
   * Create streamer.
   *
   * The computation remains inside this worker.
   */

  const streamer =
    new TextStreamer(
      generator.tokenizer,

      {

        skip_prompt:
          true,

        skip_special_tokens:
          true,


        callback_function:
          (chunk) => {

            streamedText +=
              chunk;


            const now =
              performance.now();


            /*
             * Send at a controlled rate.
             */

            if (
              now - lastStreamSend >=
              STREAM_INTERVAL
            ) {

              sendStreamUpdate(
                true
              );

            } else if (
              !streamTimer
            ) {

              streamTimer =
                setTimeout(
                  () => {

                    streamTimer =
                      null;

                    sendStreamUpdate(
                      true
                    );

                  },

                  STREAM_INTERVAL

                );

            }

          }

      }
    );


  try {

    send({

      type:
        "status",

      text:
        device ===
          "webgpu"
          ? "Generating • WebGPU"
          : "Generating • CPU",

      mode:
        "generating"

    });


    /*
     * Generate.
     *
     * IMPORTANT:
     * This function is executing in the worker,
     * not in the UI thread.
     */

    const output =
      await generator(

        conversation,

        {

          max_new_tokens:
            MAX_NEW_TOKENS,

          do_sample:
            true,

          temperature:
            0.7,

          top_p:
            0.9,

          repetition_penalty:
            1.05,

          streamer:
            streamer,

          return_full_text:
            false

        }

      );


    clearStreamTimer();


    /*
     * Final token update.
     */

    sendStreamUpdate(
      true
    );


    /*
     * If streamer did not produce text,
     * retrieve it from the output.
     */

    let finalText =
      streamedText;


    if (
      !finalText.trim() &&
      Array.isArray(output) &&
      output.length > 0
    ) {

      const result =
        output[0];


      if (
        typeof result.generated_text ===
        "string"
      ) {

        finalText =
          result.generated_text;

      } else if (
        Array.isArray(
          result.generated_text
        )
      ) {

        const chat =
          result.generated_text;


        const last =
          chat[
            chat.length - 1
          ];


        if (
          last &&
          typeof last.content ===
          "string"
        ) {

          finalText =
            last.content;

        }

      }

    }


    /*
     * Remove special tokens.
     */

    finalText =
      finalText

        .replace(
          /<\\\\|im_end\\\\|>/g,
          ""
        )

        .replace(
          /<\\\\|im_start\\\\|>/g,
          ""
        )

        .trim();


    if (
      !finalText
    ) {

      finalText =
        "I couldn't generate a response.";

    }


    /*
     * Store assistant response.
     */

    conversation.push({

      role:
        "assistant",

      content:
        finalText

    });


    trimHistory();


    /*
     * Final response.
     */

    send({

      type:
        "complete",

      text:
        finalText,

      device:
        device

    });


  } catch (
    error
  ) {

    clearStreamTimer();


    send({

      type:
        "error",

      message:
        error?.message ||
        String(error)

    });

  }

}


/* ===========================================================
   INITIALIZE
   =========================================================== */

async function initialize() {

  try {

    send({

      type:
        "status",

      text:
        "Checking hardware..."

    });


    send({

      type:
        "progress",

      percent:
        1,

      text:
        "Checking WebGPU..."

    });


    /*
     * Default to WASM.
     */

    device =
      "wasm";


    /*
     * Test REAL WebGPU.
     */

    if (
      await canUseWebGPU()
    ) {

      device =
        "webgpu";

    }


    /*
     * Try preferred backend.
     */

    try {

      generator =
        await createModel(
          device
        );

    } catch (
      error
    ) {

      send({

        type:
          "log",

        message:
          device +
          " initialization failed: " +
          (
            error?.message ||
            String(error)
          )

      });


      /*
       * WebGPU failed.
       *
       * Fall back to WASM.
       */

      if (
        device ===
        "webgpu"
      ) {

        send({

          type:
            "status",

          text:
            "WebGPU failed • Switching to CPU..."

        });


        send({

          type:
            "progress",

          percent:
            0,

          text:
            "Starting CPU/WASM fallback..."

        });


        generator =
          null;


        device =
          "wasm";


        generator =
          await createModel(
            "wasm"
          );

      } else {

        throw error;

      }

    }


    /*
     * READY
     */

    send({

      type:
        "ready",

      device:
        device

    });


  } catch (
    error
  ) {

    send({

      type:
        "fatal",

      message:
        error?.message ||
        String(error)

    });

  }

}


/* ===========================================================
   MESSAGE HANDLER
   =========================================================== */

self.addEventListener(
  "message",

  async (
    event
  ) => {

    const data =
      event.data;


    if (
      !data
    ) {

      return;

    }


    if (
      data.type ===
      "generate"
    ) {

      if (
        !generator
      ) {

        send({

          type:
            "error",

          message:
            "Model is not ready."

        });

        return;

      }


      await generate(
        data.text
      );


      return;

    }


    if (
      data.type ===
      "clear"
    ) {

      conversation = [

        {

          role:
            "system",

          content:
            "You are a helpful AI assistant. " +
            "You are running completely locally " +
            "in the user's browser. " +
            "Be concise, useful, and direct."

        }

      ];


      send({

        type:
          "cleared"

      });


      return;

    }

  }

);


/* ===========================================================
   START WORKER
   =========================================================== */

initialize();

`;


/* ============================================================
   CREATE WORKER FROM BLOB
   ============================================================ */

/*
 * This is what lets everything stay in ONE HTML file.
 */

const workerBlob =
  new Blob(
    [workerSource],
    {
      type:
        "text/javascript"
    }
  );


const workerURL =
  URL.createObjectURL(
    workerBlob
  );


worker =
  new Worker(
    workerURL,
    {
      type:
        "module"
    }
  );


/*
 * The Blob URL is no longer needed after Worker creation.
 */

URL.revokeObjectURL(
  workerURL
);


/* ============================================================
   WORKER MESSAGE HANDLER
   ============================================================ */

worker.addEventListener(
  "message",

  (event) => {

    const data =
      event.data;


    if (
      !data
    ) {

      return;

    }


    /* --------------------------------------------------------
       STATUS
       -------------------------------------------------------- */

    if (
      data.type ===
      "status"
    ) {

      setStatus(
        data.text,
        "loading"
      );


      return;

    }


    /* --------------------------------------------------------
       PROGRESS
       -------------------------------------------------------- */

    if (
      data.type ===
      "progress"
    ) {

      setProgress(
        data.percent,
        data.text
      );


      setStatus(
        data.text,
        "loading"
      );


      return;

    }


    /* --------------------------------------------------------
       LOG
       -------------------------------------------------------- */

    if (
      data.type ===
      "log"
    ) {

      console.log(
        "[AI Worker]",
        data.message
      );


      return;

    }


    /* --------------------------------------------------------
       READY
       -------------------------------------------------------- */

    if (
      data.type ===
      "ready"
    ) {

      workerReady =
        true;


      busy =
        false;


      setProgress(
        100,
        "AI model ready."
      );


      setStatus(

        data.device ===
          "webgpu"
          ? "Ready • WebGPU"
          : "Ready • CPU/WASM",

        "ready"

      );


      loadingScreen.remove();


      input.disabled =
        false;

      send.disabled =
        false;

      clear.disabled =
        false;


      addMessage(

        "assistant",

        data.device ===
          "webgpu"

          ? "Local AI is ready. WebGPU is running the model."

          : "Local AI is ready. CPU/WASM is running the model."

      );


      input.focus();


      return;

    }


    /* --------------------------------------------------------
       STREAMING TOKEN UPDATE
       -------------------------------------------------------- */

    if (
      data.type ===
      "token"
    ) {

      updateAssistantBubble(
        data.text
      );


      return;

    }


    /* --------------------------------------------------------
       GENERATION COMPLETE
       -------------------------------------------------------- */

    if (
      data.type ===
      "complete"
    ) {

      currentResponse =
        data.text;


      updateAssistantBubble(
        currentResponse
      );


      busy =
        false;


      send.disabled =
        false;

      input.disabled =
        false;

      clear.disabled =
        false;


      setStatus(

        data.device ===
          "webgpu"
          ? "Ready • WebGPU"
          : "Ready • CPU/WASM",

        "ready"

      );


      assistantBubble =
        null;


      input.focus();


      return;

    }


    /* --------------------------------------------------------
       GENERATION ERROR
       -------------------------------------------------------- */

    if (
      data.type ===
      "error"
    ) {

      if (
        assistantBubble
      ) {

        assistantBubble.textContent =
          "Generation error: " +
          data.message;

      } else {

        addMessage(
          "assistant",
          "Generation error: " +
          data.message
        );

      }


      busy =
        false;


      send.disabled =
        false;

      input.disabled =
        false;

      clear.disabled =
        false;


      setStatus(
        "Generation error",
        "error"
      );


      assistantBubble =
        null;


      input.focus();


      return;

    }


    /* --------------------------------------------------------
       FATAL MODEL ERROR
       -------------------------------------------------------- */

    if (
      data.type ===
      "fatal"
    ) {

      workerReady =
        false;


      busy =
        false;


      setStatus(
        "Model failed to load",
        "error"
      );


      setProgress(
        0,
        data.message ||
          "Could not load model."
      );


      input.disabled =
        true;

      send.disabled =
        true;


      addMessage(

        "assistant",

        "Could not load the ONNX model. " +
        (
          data.message ||
          "Check the browser console."
        )

      );


      return;

    }


    /* --------------------------------------------------------
       CLEARED
       -------------------------------------------------------- */

    if (
      data.type ===
      "cleared"
    ) {

      conversationStarted =
        false;


      return;

    }

  }

);


/* ============================================================
   WORKER ERROR
   ============================================================ */

worker.addEventListener(
  "error",

  (event) => {

    console.error(
      "AI Worker error:",
      event
    );


    setStatus(
      "Worker error",
      "error"
    );


    progressText.textContent =
      event.message ||
      "The background AI worker crashed.";

  }

);


/* ============================================================
   GENERATE
   ============================================================ */

function generate() {

  if (
    !workerReady
  ) {

    return;

  }


  if (
    busy
  ) {

    return;

  }


  const text =
    input.value.trim();


  if (
    !text
  ) {

    return;

  }


  /*
   * Clear input immediately.
   */

  input.value =
    "";

  input.style.height =
    "auto";


  /*
   * Show user message.
   */

  addMessage(
    "user",
    text
  );


  /*
   * Create empty assistant message.
   *
   * Worker streaming updates will fill this.
   */

  currentResponse =
    "";

  assistantBubble =
    addMessage(
      "assistant",
      ""
    );


  busy =
    true;


  send.disabled =
    true;

  input.disabled =
    true;

  clear.disabled =
    true;


  /*
   * Tell worker to generate.
   */

  worker.postMessage({

    type:
      "generate",

    text:
      text

  });

}


/* ============================================================
   SEND BUTTON
   ============================================================ */

send.addEventListener(
  "click",
  generate
);


/* ============================================================
   ENTER TO SEND
   ============================================================ */

input.addEventListener(
  "keydown",

  (event) => {

    if (
      event.key ===
        "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      generate();

    }

  }

);


/* ============================================================
   AUTO RESIZE
   ============================================================ */

input.addEventListener(
  "input",

  () => {

    input.style.height =
      "auto";


    input.style.height =
      Math.min(
        input.scrollHeight,
        180
      ) + "px";

  }

);


/* ============================================================
   CLEAR
   ============================================================ */

clear.addEventListener(
  "click",

  () => {

    if (
      busy
    ) {

      return;

    }


    messages.innerHTML =
      "";


    addMessage(
      "assistant",
      "Conversation cleared."
    );


    worker.postMessage({

      type:
        "clear"

    });


    input.focus();

  }

);

</script>

</body>
